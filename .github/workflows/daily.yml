name: Daily NPB Data Collection

on:
  schedule:
    # JST 23:47 = UTC 14:47（試合終了後・毎時0分を避けて混雑回避）
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "収集する日付（YYYY-MM-DD）。空欄なら今日"
        required: false
        default: ""
      game:
        description: "特定の試合IDだけ収集（任意）"
        required: false
        default: ""
      from_date:
        description: "【期間収集】開始日（YYYY-MM-DD）。to_dateとセットで使用。最大7日まで"
        required: false
        default: ""
      to_date:
        description: "【期間収集】終了日（YYYY-MM-DD）。from_dateとセットで使用"
        required: false
        default: ""

concurrency:
  # データを書き込むワークフロー同士が同時に走らないようにする。
  # 同時実行は index.json などの競合を引き起こすため、順番待ちにする。
  group: npb-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            ARGS="--from-date ${{ github.event.inputs.from_date }} --to-date ${{ github.event.inputs.to_date }}"
          else
            if [ -n "${{ github.event.inputs.date }}" ]; then
              ARGS="$ARGS --date ${{ github.event.inputs.date }}"
            fi
            if [ -n "${{ github.event.inputs.game }}" ]; then
              ARGS="$ARGS --game ${{ github.event.inputs.game }}"
            fi
          fi
          python scraper/main.py $ARGS

      - name: Rebuild season stats (idempotent)
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/rebuild_stats.py --season "$SEASON"

      - name: Build analysis dataset
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_dataset.py --season "$SEASON" --format both

      - name: Build story insights
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_story_insights.py --season "$SEASON"

      - name: Build article ideas
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_article_ideas.py --season "$SEASON"

      - name: Build analytics lab
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_analysis_lab.py --season "$SEASON"

      - name: Build decision lab
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_decision_lab.py --season "$SEASON"

      - name: Build analyst lab
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_analyst_lab.py --season "$SEASON"

      - name: Build player matchup data
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_matchups.py --season "$SEASON"
          python scraper/build_pitch_heatmaps.py --season "$SEASON"

      - name: Build awards
        run: |
          SEASON=$(date +%Y)
          python scraper/build_awards.py --season "$SEASON"

      - name: Build weekly and monthly awards
        run: |
          SEASON=$(date +%Y)
          python scraper/build_period_awards.py --season "$SEASON"

      - name: Build simplified WAR
        run: |
          SEASON=$(date +%Y)
          python scraper/build_war.py --season "$SEASON"

      - name: Build W-Impact rating
        run: |
          SEASON=$(date +%Y)
          python scraper/build_w_impact.py --season "$SEASON"

      - name: Build NotebookLM CSV
        run: |
          SEASON="${{ github.event.inputs.from_date }}"
          if [ -z "$SEASON" ]; then SEASON="${{ github.event.inputs.date }}"; fi
          SEASON="${SEASON%%-*}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_notebooklm.py --season "$SEASON"
          python scraper/build_notebooklm.py --output data/notebooklm --validate-only

      - name: Validate data
        run: |
          python scraper/validate_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -name "__pycache__" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし。pushをスキップします。"
            exit 0
          fi
          git commit -m "data: auto collect $(date +'%Y-%m-%d %H:%M')"

          for i in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              python scraper/fix_index.py || true
              if ! git diff --quiet; then
                git add -A
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                echo "push成功"
                exit 0
              fi
              echo "pushが弾かれました。取り込み直します。"
            else
              echo "自動で解決できない競合です。中断して再試行します。"
              git rebase --abort || true
            fi
            echo "リトライ $i 回目"
            sleep $((5 * i))
          done

          echo "pushに3回失敗しました。"
          exit 1
