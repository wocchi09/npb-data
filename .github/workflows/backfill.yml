name: Backfill Missing Data

# 収集済みの試合データに、あとから追加した項目（球場・打順など）だけを埋める。
# 打席の全巡回はやり直さないので、1試合あたり1〜2リクエストで完了する。

on:
  workflow_dispatch:
    inputs:
      season:
        description: "対象シーズン（例: 2026）。dateを指定する場合は空欄でOK"
        required: false
        default: ""
      date:
        description: "特定の日だけ補完する場合（YYYY-MM-DD）"
        required: false
        default: ""
      what:
        description: "補完する項目（stadium,boxscore）"
        required: false
        default: "stadium,boxscore"
      limit:
        description: "1回で処理する試合数の上限（0で無制限）"
        required: false
        default: "0"

concurrency:
  # データを書き込むワークフロー同士が同時に走らないようにする。
  # 同時実行は index.json などの競合を引き起こすため、順番待ちにする。
  group: npb-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Backfill
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON="${{ github.event.inputs.date }}"
            SEASON="${SEASON%%-*}"
          fi
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi

          ARGS="--season $SEASON --what ${{ github.event.inputs.what }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          python scraper/backfill.py $ARGS

      - name: Rebuild season stats
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON="${{ github.event.inputs.date }}"
            SEASON="${SEASON%%-*}"
          fi
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/rebuild_stats.py --season "$SEASON" || echo "再集計をスキップ"

      - name: Build analysis dataset
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON="${{ github.event.inputs.date }}"
            SEASON="${SEASON%%-*}"
          fi
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          python scraper/build_dataset.py --season "$SEASON" --format both || echo "データセット生成をスキップ"

      - name: Build awards
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          SEASON="${SEASON%%-*}"
          python scraper/build_awards.py --season "$SEASON" || echo "表彰の算出をスキップ"

      - name: Build weekly and monthly awards
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          SEASON="${SEASON%%-*}"
          python scraper/build_period_awards.py --season "$SEASON" || echo "週間・月間表彰の算出をスキップ"

      - name: Build simplified WAR
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then SEASON=$(date +%Y); fi
          SEASON="${SEASON%%-*}"
          python scraper/build_war.py --season "$SEASON" || echo "WARの算出をスキップ"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -name "__pycache__" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし。pushをスキップします。"
            exit 0
          fi
          git commit -m "backfill: 球場・出場成績を補完 $(date +'%Y-%m-%d %H:%M')"

          for i in 1 2 3; do
            git fetch origin main
            # index.json のような生成ファイルは中身が競合しやすい。
            # 競合したらこちらの変更を採用し、そのあと実ファイルから作り直す。
            if git rebase -X theirs origin/main; then
              python scraper/fix_index.py || true
              if ! git diff --quiet; then
                git add -A
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                echo "push成功"
                exit 0
              fi
              echo "pushが弾かれました。取り込み直します。"
            else
              echo "自動で解決できない競合です。中断して再試行します。"
              git rebase --abort || true
            fi
            echo "リトライ $i 回目"
            sleep $((5 * i))
          done

          echo "pushに3回失敗しました。"
          exit 1
