name: Collect Contract News

on:
  schedule:
    # September–December, every two hours. JST 00:23, 02:23, ...
    - cron: '23 1-23/2 * 9-12 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: npb-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Collect headline metadata
        run: python scraper/contract_news.py
      - name: Save successful collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/contract_news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update contract news'
          git pull --rebase origin main
          git push origin HEAD:main
      # GITHUB_TOKEN pushes alone do not trigger the legacy Pages build.
      # Request even if collection was unchanged, so a failed build can be retried.
      - name: Publish latest collected data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
