name: Probe Dakyu Code

# 打席詳細ページにある「dakyu」クラスの正体を調べる。
# 1試合の全打席について、dakyuの値と実際の結果（遊ゴロ・中安打など）・
# 打球方向（先頭文字）を突き合わせ、座標なのか強さなのか装飾なのかを判定する。

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "調査する試合ID"
        required: false
        default: "2021039164"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Probe dakyu code
        run: |
          python - <<'PYEOF'
          import re, time
          import requests
          from bs4 import BeautifulSoup

          GID = "${{ github.event.inputs.game_id }}" or "2021039164"
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                             "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          SLEEP = 1.5

          def get(url):
              r = requests.get(url, headers=H, timeout=30)
              r.raise_for_status()
              time.sleep(SLEEP)
              return r.text

          L = ["# dakyuコードの正体調査", "", f"- 対象試合: {GID}", ""]

          # 1) 打席インデックス一覧を取得（main.pyのextract_atbat_indexesと同じ方式）
          top_url = f"https://baseball.yahoo.co.jp/npb/game/{GID}/score?index=0101"
          html = get(top_url)
          indexes = sorted(set(re.findall(r"score\?index=(\d+)", html)))

          L.append(f"検出した打席インデックス数: {len(indexes)}")
          L.append("")

          # 多すぎる場合は先頭40打席だけに絞る（取得元への配慮）
          indexes = sorted(indexes)[:40]

          rows = []
          for idx in indexes:
              url = f"https://baseball.yahoo.co.jp/npb/game/{GID}/score?index={idx}"
              try:
                  h = get(url)
              except Exception as e:
                  rows.append((idx, None, None, None, f"取得失敗:{e}"))
                  continue

              rs = re.search(r'id="result">\s*<span[^>]*>([^<]*)</span>', h)
              result = rs.group(1).strip() if rs else None

              dm = re.search(r'id="dakyu"\s+class="(dakyu\d*)"', h)
              dakyu = dm.group(1) if dm else None

              # 走者状況（satisfy curiosity: 併殺やゴロの傾向と紐付けられるか）
              bm = re.search(r'id="base"\s+class="(b\d+)"', h)
              base = bm.group(1) if bm else None

              rows.append((idx, dakyu, base, result, None))

          L.append("## 打席ごとの dakyu と結果")
          L.append("")
          L.append("| index | dakyu | base | 結果 |")
          L.append("|---|---|---|---|")
          for idx, dakyu, base, result, err in rows:
              if err:
                  L.append(f"| {idx} | - | - | {err} |")
              else:
                  L.append(f"| {idx} | {dakyu or '(なし)'} | {base or '-'} | {result or '(なし)'} |")

          # dakyu値 -> 結果 の対応をまとめる（傾向を見やすくする）
          L.append("")
          L.append("## dakyu値ごとの結果一覧（同じ値が何の結果と結びつくか）")
          L.append("")
          by_val = {}
          for idx, dakyu, base, result, err in rows:
              if err or not dakyu:
                  continue
              by_val.setdefault(dakyu, []).append(result)
          for val, results in sorted(by_val.items()):
              L.append(f"- **{val}**: {results}")

          open("probe_dakyu.md", "w", encoding="utf-8").write("\n".join(L))
          print("\n".join(L[:150]))
          PYEOF

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe_dakyu.md
          git diff --cached --quiet || git commit -m "probe: dakyuコードの正体調査"
          git pull --rebase origin main || true
          git push
