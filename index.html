  /* ===== 公式名鑑（NPB公式・支配下選手のみ） ===== */
  var npbRoster=null;      // {updated_at, players:[...]}

  /* 氏名の正規化：スペースを除き、よくある異体字を寄せる。
     公式サイトとスポナビで表記が違うため、突合の前に必ず通す。 */
  var NAME_VARIANTS = {
    "髙":"高", "﨑":"崎", "濵":"浜", "濱":"浜", "邉":"辺", "邊":"辺",
    "齋":"斎", "齊":"斉", "澤":"沢", "栁":"柳", "曻":"昇", "祐":"祐",
    "德":"徳", "眞":"真", "淸":"清", "﨤":"返"
  };
  function normName(s){
    if(!s) return "";
    var t=String(s).replace(/[\s\u3000]/g,"");
    var out="";
    for(var i=0;i<t.length;i++){
      var c=t.charAt(i);
      out += (NAME_VARIANTS[c] || c);
    }
    return out;
  }

  async function loadRoster(){
    if(npbRoster!==null) return npbRoster;
    try{
      var r=await fetch("data/masters/npb_roster.json?t="+Date.now());
      npbRoster = r.ok ? await r.json() : false;
    }catch(e){ npbRoster=false; }
    return npbRoster;
  }

  /* 成績（seasonData）を氏名＋球団で引けるようにする */
  function statsIndex(){
    var m={};
    (seasonData||[]).forEach(function(p){
      if(!p.name) return;
      var k=normName(p.name);
      if(!m[k]) m[k]=[];
      m[k].push(p);
    });
    return m;
  }
  function findStats(idx, name, team){
    var cand=idx[normName(name)];
    if(!cand || !cand.length) return null;
    if(cand.length===1) return cand[0];
    // 同姓同名は球団で絞る
    for(var i=0;i<cand.length;i++){
      if(cand[i].team===team) return cand[i];
    }
    return cand[0];
  }

  /* ===== 選手一覧 ===== */
  var plName="", plTeam="all", plKind="batter", plPos="all", plHand="all",
      plNum="", plQual="all", plPlayed="all", plSort="team", plSortDir="desc";

  /* 選手比較で選んでいる2人（key配列） */
  var cmpSelected=[];
  function toggleCompare(key, ev){
    if(ev) ev.stopPropagation();
    var i=cmpSelected.indexOf(key);
    if(i>=0){
      cmpSelected.splice(i,1);
    }else{
      if(cmpSelected.length>=2) cmpSelected.shift();   // 3人目を選んだら最初の人を外す
      cmpSelected.push(key);
    }
    renderPlayers();
  }
  function goCompare(){
    if(cmpSelected.length!==2) return;
    setView("compare");
  }

  /* 選手一覧の列定義（打者・投手で別々） */
  var PL_COLS_BAT = [
    ["number","背番号"],["name","選手"],["team","球団"],["position","位置"],["hand","投打"],
    ["games","試合"],["pa","打席"],["ab","打数"],["hits","安打"],["hr","本"],["rbi","点"],
    ["sb","盗"],["avg","打率"],["obp","出塁"],["slg","長打"],["ops","OPS"],
    ["iso","ISO"],["babip","BABIP"]
  ];
  var PL_COLS_PIT = [
    ["number","背番号"],["name","選手"],["team","球団"],["hand","投打"],
    ["games","登板"],["outs","回"],["era","防御率"],["fip","FIP"],["whip","WHIP"],["k9","K/9"],
    ["so","奪三"],["bb","四球"],["wins","勝"],["losses","敗"],["win_pct","勝率"],
    ["saves","S"],["holds","H"],["hp","HP"]
  ];
  /* 小さいほど良い項目は、最初のクリックで昇順にする */
  var PL_ASC_FIRST = {era:1, fip:1, whip:1, losses:1, name:1, team:1, position:1, hand:1, number:1};

  function setPlSort(k){
    if(plSort===k){
      plSortDir = (plSortDir==="desc") ? "asc" : "desc";
    }else{
      plSort=k;
      plSortDir = PL_ASC_FIRST[k] ? "asc" : "desc";
    }
    renderPlayers();
  }
  function setPlKind(k){
    if(plKind===k) return;
    plKind=k;
    plSort="team"; plSortDir="asc";
    renderPlayers();
  }
  /* 並び替えに使う値を取り出す */
  function plValue(p, key){
    var b=p.batting||{}, q=p.pitching||{};
    switch(key){
      case "number": var n=parseInt(p.number,10); return isNaN(n)?99999:n;
      case "name": return p.name||"";
      case "team": return p.team||"";
      case "position": return p.position||"";
      case "hand": return p.hand||"";
      case "games": return plKind==="pitcher" ? (q.games||0) : (b.games||0);
      case "pa": return b.pa||0;
      case "ab": return b.ab||0;
      case "hits": return b.hits||0;
      case "hr": return b.hr||0;
      case "rbi": return b.rbi||0;
      case "sb": return b.sb||0;
      case "avg": return b.avg;
      case "obp": return b.obp;
      case "slg": return b.slg;
      case "ops": return b.ops;
      case "iso": return b.iso;
      case "babip": return b.babip;
      case "outs": return q.outs||0;
      case "era": return q.era;
      case "fip": return q.fip;
      case "whip": return q.whip;
      case "k9": return q.k9;
      case "so": return q.so||0;
      case "bb": return q.bb||0;
      case "wins": return q.wins||0;
      case "losses": return q.losses||0;
      case "win_pct": return ((q.wins||0)+(q.losses||0))>=1 ? q.win_pct : null;
      case "saves": return q.saves||0;
      case "holds": return holdsOf(q);
      case "hp": return q.hp||0;
    }
    return null;
  }

  async function loadPlayers(){
    var pv=document.getElementById("playersView");
    if(seasonData && npbRoster!==null){ renderPlayers(); return; }
    pv.innerHTML='<div class="msg">読み込み中…</div>';
    // 公式名鑑（一覧の基準）と、成績（表示用）の両方を読む
    await loadRoster();
    if(!seasonData) await loadSeason();
    if(!npbRoster && !seasonData){
      pv.innerHTML='<div class="msg">選手データがまだありません<br>'+
        '<span style="font-size:12px">Actions の「Update NPB Roster」を実行すると名鑑が作られます</span></div>';
      return;
    }
    renderPlayers();
  }

  function onPlayersChange(){
    var g=function(id){var e=document.getElementById(id);return e?e.value:"";};
    plName=g("plName");
    plPos=g("plPos"); plHand=g("plHand"); plNum=g("plNum");
    plQual=g("plQual"); plPlayed=g("plPlayed");
    renderPlayers();
  }
  function resetPlayers(){
    plName=""; plTeam="all"; plPos="all"; plHand="all";
    plNum=""; plQual="all"; plPlayed="all"; plSort="team"; plSortDir="asc";
    renderPlayers();
  }

  /* ホールド：公式記録があればそれを、無ければルールベースの推定値を使う */
  function holdsOf(q){
    if(!q) return 0;
    if((q.holds||0)>0) return q.holds;
    return q.holds_est||0;
  }
  function holdsIsEst(q){ return q && (q.holds||0)===0 && (q.holds_est||0)>0; }

  function isPitcherP(p){ return !!(p.pitching && (p.pitching.outs||0)>0); }
  function isBatterP(p){ return !!(p.batting && (p.batting.pa||0)>0); }

  /* 球団タブ1個ぶん（チームカラーで塗る） */
  function teamTabBtn(t){
    var on=(plTeam===t);
    var col=tColor(t)||"var(--accent)";
    var style=on ? 'background:'+col+';color:'+tTextColor(t)+';border-color:'+col
                 : 'border-color:'+col;
    return '<button class="ttab'+(on?" on":"")+'" style="'+style+'" '+
           'onclick="setPlTeam(\''+esc(t)+'\')" title="'+esc(t)+'">'+
           '<span class="tm">'+esc(tMini(t))+'</span>'+
           '<span class="tn">'+esc(t)+'</span></button>';
  }
  function setPlTeam(t){
    if(plTeam===t) return;
    plTeam=t;
    renderPlayers();
  }

  /* 一覧に並べる選手を作る。
     公式名鑑があればそれを基準にし（支配下のみ・背番号や投打も公式値）、
     無ければ従来どおり成績データから組み立てる。 */
  function buildPlayerList(){
    var idx=statsIndex();
    if(npbRoster && npbRoster.players && npbRoster.players.length){
      return npbRoster.players.map(function(r){
        var st=findStats(idx, r.name, r.team) || {};
        var b=st.batting, q=st.pitching;
        return {
          key: st.key || ("npb:"+(r.npb_id||r.name)),
          npb_id: r.npb_id,
          player_id: st.player_id || null,
          name: r.name,
          team: r.team,
          number: r.number,                       // 公式の背番号
          position: r.position_group,              // 公式の守備区分（投/捕/内/外）
          hand: (r.throws?r.throws+"投":"") + (r.bats?r.bats+"打":""),
          throws: r.throws, bats: r.bats,
          birthdate: r.birthdate, height: r.height, weight: r.weight,
          is_pitcher: !!r.is_pitcher,
          played: !!(b || q),                     // 一軍出場（収集済み試合に登場したか）
          batting: b, pitching: q,
          positions: st.positions || null,
          fromRoster: true
        };
      });
    }
    // 名鑑が無い場合のフォールバック
    return (seasonData||[]).filter(function(p){
      return p.name && String(p.name).trim();
    }).map(function(p){
      var o={};
      for(var k in p) o[k]=p[k];
      o.played = true;
      o.fromRoster = false;
      return o;
    });
  }

  function renderPlayers(){
    var pv=document.getElementById("playersView");
    var all=buildPlayerList();
    if(!all.length){
      pv.innerHTML='<div class="msg">選手データがありません</div>';
      return;
    }

    // 選択肢はデータから作る
    var teams={}, poss={}, hands={};
    all.forEach(function(p){
      if(p.team) teams[p.team]=1;
      if(p.position) poss[p.position]=1;
      (p.positions||[]).forEach(function(x){ if(x.pos) poss[x.pos]=1; });
      if(p.hand) hands[p.hand]=1;
    });
    var teamList=Object.keys(teams).sort(function(a,b){
      var la=tLeague(a)||"ワ", lb=tLeague(b)||"ワ";
      if(la!==lb) return la==="セ"?-1:1;
      return String(tMini(a)).localeCompare(String(tMini(b)));
    });
    var posList=Object.keys(poss).sort();
    var handList=Object.keys(hands).sort();

    function sel(id,label,cur,opts,allLabel){
      var h='<label class="ef"><span>'+label+'</span><select id="'+id+'" onchange="onPlayersChange()">'+
             '<option value="all">'+allLabel+'</option>';
      opts.forEach(function(o){
        var v=(typeof o==="string")?o:o[0], t=(typeof o==="string")?o:o[1];
        h+='<option value="'+esc(v)+'"'+(cur===v?" selected":"")+'>'+esc(t)+'</option>';
      });
      return h+'</select></label>';
    }

    var h='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>選手一覧'+
      '<span class="dash-date">'+all.length+'人'+
      (npbRoster&&npbRoster.players?'（支配下）':'')+'</span></div>';

    // 球団タブ（パ→区切り→セ の順）
    h+='<div class="teamtabs">'+
       '<button class="ttab'+(plTeam==="all"?" on":"")+'" onclick="setPlTeam(\'all\')">全球団</button>'+
       '<span class="tsep"></span>';
    TEAM_ORDER_PA.forEach(function(t){
      if(!teams[t]) return;
      h+=teamTabBtn(t);
    });
    h+='<span class="tsep"></span>';
    TEAM_ORDER_SE.forEach(function(t){
      if(!teams[t]) return;
      h+=teamTabBtn(t);
    });
    h+='</div>';

    // 野手／投手の切替
    h+='<div class="stabs gtabs">';
    [["batter","野手"],["pitcher","投手"]].forEach(function(x){
      h+='<button class="stab'+(plKind===x[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setPlKind(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    h+='<div class="expform">'+
      '<label class="ef"><span>選手名</span><input type="text" id="plName" placeholder="部分一致" value="'+esc(plName)+'" oninput="onPlayersChange()"></label>'+

      sel("plPos","守備位置",plPos,posList,"すべて")+
      sel("plHand","投打",plHand,handList,"すべて")+
      '<label class="ef"><span>背番号</span><input type="text" id="plNum" placeholder="例: 7" value="'+esc(plNum)+'" oninput="onPlayersChange()"></label>'+
      sel("plQual","規定",plQual,[["qualified","規定到達のみ"]],"すべて")+
      sel("plPlayed","一軍出場",plPlayed,[["played","出場ありのみ"]],"すべて")+
      '</div><div class="expbtns" style="margin-top:10px">'+
      '<button class="btn" onclick="resetPlayers()">条件をクリア</button></div>';

    // 絞り込み（名前が取れていないデータは表示しない）
    var list=all.filter(function(p){
      if(!p.name || !String(p.name).trim()) return false;
      if(plName && (p.name||"").indexOf(plName)<0) return false;
      if(plTeam!=="all" && p.team!==plTeam) return false;
      // 公式名鑑がある場合は守備区分で分ける（試合に出ていない選手も並ぶ）
      if(p.fromRoster){
        if(plKind==="pitcher" && !p.is_pitcher) return false;
        if(plKind==="batter" && p.is_pitcher) return false;
      }else{
        if(plKind==="pitcher" && !isPitcherP(p)) return false;
        if(plKind==="batter" && !isBatterP(p)) return false;
      }
      if(plPlayed==="played" && !p.played) return false;
      if(plPos!=="all"){
        var hit=(p.position===plPos);
        (p.positions||[]).forEach(function(x){ if(x.pos===plPos) hit=true; });
        if(!hit) return false;
      }
      if(plHand!=="all" && p.hand!==plHand) return false;
      if(plNum && String(p.number||"")!==String(plNum).trim()) return false;
      if(plQual==="qualified"){
        if(!p.batting && !p.pitching) return false;
        var q = isPitcherP(p) ? isQualifiedPitcher(p) : isQualifiedBatter(p);
        if(!q) return false;
      }
      return true;
    });

    // 並び替え（ヘッダークリックで切り替え。値が無いものは常に最後）
    var dir = (plSortDir==="asc") ? 1 : -1;
    list.sort(function(a,b){
      if(plSort==="team"){
        var ta=a.team||"", tb=b.team||"";
        if(ta!==tb){
          var la=tLeague(ta)||"ワ", lb=tLeague(tb)||"ワ";
          if(la!==lb) return (la==="パ"?-1:1)*dir;
          return ta.localeCompare(tb)*dir;
        }
        var na=parseInt(a.number,10), nb=parseInt(b.number,10);
        if(isNaN(na)) na=99999;
        if(isNaN(nb)) nb=99999;
        return (na-nb)*dir;
      }
      var va=plValue(a, plSort), vb=plValue(b, plSort);
      if(va==null && vb==null) return 0;

      if(typeof va==="string" || typeof vb==="string"){
        return String(va).localeCompare(String(vb))*dir;
      }
      return (va-vb)*dir;
    });

  function cmpBetter(a,b,lowerIsBetter){
    if(a==null||b==null) return 0;
    if(a===b) return 0;
    if(lowerIsBetter) return a<b?1:-1;
    return a>b?1:-1;
  }

  function cmpRow(label, a, b, fmtFn, lowerIsBetter){
    var av=a, bv=b;
    var winner=cmpBetter(av,bv,lowerIsBetter);
    var at=fmtFn?fmtFn(av):(av==null?"-":av);
    var bt=fmtFn?fmtFn(bv):(bv==null?"-":bv);
    return '<tr><td class="num cmpval'+(winner===1?' win':'')+'">'+at+'</td>'+
      '<td class="nm cmplabel">'+esc(label)+'</td>'+
      '<td class="num cmpval'+(winner===-1?' win':'')+'">'+bt+'</td></tr>';
  }

  var splitCache={};        // 'batting_lines' -> {header, rows}
  var curSplitPlayer=null;  // 表示中の選手
  var splitTab="log";

  async function loadSplitFile(name){
    if(splitCache[name]) return splitCache[name];
    var year=(dp.value||todayJST()).split("-")[0];
    var r=await fetch("data/"+year+"/dataset/"+name+".csv?t="+Date.now());
    if(!r.ok) throw new Error("notfound");
    var all=parseCSV(await r.text()).filter(function(x){return x.length>1;});
    if(!all.length) throw new Error("empty");
    var header=all[0], idx={};
    header.forEach(function(h,i){ idx[h]=i; });
    // 行を扱いやすいオブジェクトにする
    var rows=all.slice(1).map(function(r2){
      var o={};
      header.forEach(function(h,i){ o[h]=r2[i]; });
      return o;
    });
    splitCache[name]={header:header, rows:rows, idx:idx};
    return splitCache[name];
  }

  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  function outsToIp(o){ return (o%3) ? (Math.floor(o/3)+"."+(o%3)) : String(Math.floor(o/3)); }

  function aggBat(rows){
    var a={games:rows.length, ab:0, hits:0, hr:0, rbi:0, bb:0, so:0, sb:0, runs:0};
    rows.forEach(function(r){
      a.ab+=num(r.ab); a.hits+=num(r.hits); a.hr+=num(r.hr); a.rbi+=num(r.rbi);
      a.bb+=num(r.bb)+num(r.hbp); a.so+=num(r.so); a.sb+=num(r.sb); a.runs+=num(r.runs);
    });
    a.avg = a.ab ? a.hits/a.ab : null;
    return a;
  }
  function aggPit(rows){
    var a={games:rows.length, outs:0, er:0, ra:0, so:0, bb:0, ha:0, hra:0,
           pitches:0, w:0, l:0, s:0, qs:0};
    rows.forEach(function(r){
      a.outs+=num(r.outs); a.er+=num(r.earned_runs); a.ra+=num(r.runs_allowed);
      a.so+=num(r.so); a.bb+=num(r.bb); a.ha+=num(r.hits_allowed);
      a.hra+=num(r.hr_allowed); a.pitches+=num(r.pitches);
      var d=r.decision||"";
      if(d.indexOf("勝")>=0) a.w++;
      if(d.indexOf("敗")>=0) a.l++;
      if(d.indexOf("Ｓ")>=0||d.indexOf("S")>=0) a.s++;
      if(String(r.is_qs).toLowerCase()==="true") a.qs++;
    });
    var ip=a.outs/3;
    a.innings=outsToIp(a.outs);
    a.era = ip ? a.er*9/ip : null;
    a.whip = ip ? (a.ha+a.bb)/ip : null;
    return a;
  }

  function playerRows(data, p){
    return data.rows.filter(function(r){
      if(p.key && r.player_key) return r.player_key===p.key;
      if(p.player_id && r.player_id) return r.player_id===String(p.player_id);
      return r.player===p.name;
    });
  }

    curSplitPlayer=null;

    if(!curSplitPlayer) return;
    var el=document.getElementById("plSplits");

    el.innerHTML='<div class="msg">読み込み中…</div>';
    try{
      await loadSplitFile("batting_lines");
      await loadSplitFile("pitching_lines");
      renderSplits();
    }catch(e){
      el.innerHTML='<div class="msg">1試合ごとのデータがまだありません<br>'+
        '<span style="font-size:12px">Actionsで収集すると dataset/batting_lines.csv が生成されます</span></div>';
    }
  }
  function setSplitTab(t){ splitTab=t; renderSplits(); }

  function renderSplits(){
    var el=document.getElementById("plSplits");
    var p=curSplitPlayer;
    if(!el||!p) return;

    var bl=playerRows(splitCache["batting_lines"], p);
    var pl=playerRows(splitCache["pitching_lines"], p);
    if(!bl.length && !pl.length){
      el.innerHTML='<div class="msg">この選手の1試合ごとのデータが見つかりません</div>';
      return;
    }
    var isP=pl.length>0;

    var tabs=[["log","試合ログ"],["month","月別"],["opp","対戦球団別"],
              ["park","球場別"],["ha","ホーム/ビジター"],["recent","直近5・10試合"]];
    tabs.push(isP ? ["mix","配球分析"] : ["swing","スイング指標"]);

    var h='<div class="stabs" style="margin-top:12px">';
    tabs.forEach(function(t){
      h+='<button class="stab'+(splitTab===t[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setSplitTab(\''+t[0]+'\')">'+t[1]+'</button>';
    });
    h+='</div>';

    if(splitTab==="log") h+=splitLog(bl, pl, isP);
    else if(splitTab==="month") h+=splitBy(bl, pl, isP, function(r){return (r.date||"").slice(0,7);}, "月", true);
    else if(splitTab==="opp") h+=splitBy(bl, pl, isP, function(r){return r.opponent||"-";}, "対戦相手", false);
    else if(splitTab==="park") h+=splitBy(bl, pl, isP, function(r){return r.stadium||"不明";}, "球場", false);
    else if(splitTab==="ha") h+=splitBy(bl, pl, isP, function(r){
        return String(r.is_home).toLowerCase()==="true" ? "ホーム" : "ビジター";
      }, "区分", false);
    else if(splitTab==="mix" || splitTab==="swing"){
      h+='<div id="plPitches"><div class="msg">読み込み中…</div></div>';
      el.innerHTML=h;
      loadPitchSplit(isP);
      return;
    }
    else h+=splitRecent(bl, pl, isP);

    el.innerHTML=h;
  }

  /* 一球データを読み込んで配球／スイングを描画 */
  async function loadPitchSplit(isP){
    var box=document.getElementById("plPitches");
    if(!box) return;
    try{
      var d=await loadSplitFile("pitches");
      var p=curSplitPlayer;
      var rows=d.rows.filter(function(r){
        if(isP){
          if(p.key && r.pitcher_key) return r.pitcher_key===p.key;
          if(p.player_id && r.pitcher_id) return r.pitcher_id===String(p.player_id);
          return r.pitcher===p.name;
        }
        if(p.key && r.batter_key) return r.batter_key===p.key;
        if(p.player_id && r.batter_id) return r.batter_id===String(p.player_id);
        return r.batter===p.name;
      });
      box.innerHTML = isP ? splitPitchMix(rows) : splitSwing(rows);
    }catch(e){
      box.innerHTML='<div class="msg">一球データがまだありません<br>'+
        '<span style="font-size:12px">Actionsで収集すると dataset/pitches.csv が生成されます</span></div>';
    }
  }

  /* 試合ログ */
  function splitLog(bl, pl, isP){
    var rows=(isP?pl:bl).slice().sort(function(a,b){
      return (b.date||"").localeCompare(a.date||"");
    });
    var h='<div class="tblwrap"><table class="stbl"><thead><tr>'+
      '<th>日付</th><th>対戦</th><th>H/V</th>';
    h += isP
      ? '<th>結果</th><th>回</th><th>球数</th><th>被安</th><th>奪三</th><th>四球</th><th>失点</th><th>自責</th><th>QS</th>'
      : '<th>打順</th><th>位置</th><th>打数</th><th>安打</th><th>本</th><th>点</th><th>三振</th><th>四球</th><th>盗</th>';
    h+='</tr></thead><tbody>';
    rows.forEach(function(r){
      var home=String(r.is_home).toLowerCase()==="true";
      h+='<tr><td class="num">'+esc((r.date||"").slice(5).replace("-","/"))+'</td>'+
         '<td>'+teamBadge(r.opponent)+'</td>'+
         '<td class="pos">'+(home?"ホーム":"ビジター")+'</td>';
      if(isP){
        var d=r.decision||"";
        var dcls=/勝/.test(d)?"win":(/敗/.test(d)?"lose":(d?"save":""));
        h+='<td><span class="dec '+dcls+'">'+esc(d)+'</span></td>'+
           '<td class="num">'+esc(r.innings||"")+'</td>'+
           '<td class="num">'+esc(r.pitches||"")+'</td>'+
           '<td class="num">'+esc(r.hits_allowed||"0")+'</td>'+
           '<td class="num'+(num(r.so)>0?' hi':'')+'">'+esc(r.so||"0")+'</td>'+
           '<td class="num">'+esc(r.bb||"0")+'</td>'+
           '<td class="num">'+esc(r.runs_allowed||"0")+'</td>'+
           '<td class="num">'+esc(r.earned_runs||"0")+'</td>'+
           '<td class="num">'+(String(r.is_qs).toLowerCase()==="true"?'<span class="qmark">QS</span>':'')+'</td>';
      }else{
        h+='<td class="num">'+(r.order?esc(r.order)+"番":"-")+'</td>'+
           '<td class="pos">'+esc(r.position||"")+'</td>'+
           '<td class="num">'+esc(r.ab||"0")+'</td>'+
           '<td class="num'+(num(r.hits)>0?' hi':'')+'">'+esc(r.hits||"0")+'</td>'+
           '<td class="num'+(num(r.hr)>0?' hi':'')+'">'+esc(r.hr||"0")+'</td>'+
           '<td class="num">'+esc(r.rbi||"0")+'</td>'+
           '<td class="num">'+esc(r.so||"0")+'</td>'+
           '<td class="num">'+esc(r.bb||"0")+'</td>'+
           '<td class="num">'+esc(r.sb||"0")+'</td>';
      }
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="sub" style="font-size:11px;margin-top:6px">新しい試合が上に並びます（'+rows.length+'試合）</div>';
    return h;
  }

  /* 任意のキーでまとめる */
  function splitBy(bl, pl, isP, keyFn, label, sortKeyAsc){
    var rows=isP?pl:bl;
    var groups={}, order=[];
    rows.forEach(function(r){
      var k=keyFn(r);
      if(!groups[k]){ groups[k]=[]; order.push(k); }
      groups[k].push(r);
    });
    order.sort(function(a,b){
      return sortKeyAsc ? a.localeCompare(b) : groups[b].length-groups[a].length;
    });
    if(!order.length) return '<div class="msg">データがありません</div>';

    var h='<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">'+esc(label)+'</th>';
    h += isP
      ? '<th>登板</th><th>回</th><th>防御率</th><th>WHIP</th><th>奪三</th><th>四球</th><th>被安</th><th>勝</th><th>敗</th><th>S</th>'
      : '<th>試合</th><th>打数</th><th>安打</th><th>打率</th><th>本</th><th>点</th><th>三振</th><th>四球</th><th>盗</th>';
    h+='</tr></thead><tbody>';

    order.forEach(function(k){
      var g=groups[k];
      var disp = (label==="対戦相手") ? (teamBadge(k)+" "+esc(k)) : esc(k);
      h+='<tr><td class="nm">'+disp+'</td>';
      if(isP){
        var a=aggPit(g);
        h+='<td class="num">'+a.games+'</td><td class="num">'+esc(a.innings)+'</td>'+
           '<td class="num hi">'+(a.era==null?"-":a.era.toFixed(2))+'</td>'+
           '<td class="num">'+(a.whip==null?"-":a.whip.toFixed(2))+'</td>'+
           '<td class="num">'+a.so+'</td><td class="num">'+a.bb+'</td>'+
           '<td class="num">'+a.ha+'</td><td class="num">'+a.w+'</td>'+
           '<td class="num">'+a.l+'</td><td class="num">'+a.s+'</td>';
      }else{
        var b=aggBat(g);
        h+='<td class="num">'+b.games+'</td><td class="num">'+b.ab+'</td>'+
           '<td class="num">'+b.hits+'</td>'+
           '<td class="num hi">'+fmtAvg(b.avg)+'</td>'+
           '<td class="num'+(b.hr>0?' hi':'')+'">'+b.hr+'</td>'+
           '<td class="num">'+b.rbi+'</td><td class="num">'+b.so+'</td>'+
           '<td class="num">'+b.bb+'</td><td class="num">'+b.sb+'</td>';
      }
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    return h;
  }

  /* 直近5試合・10試合 */
  function splitRecent(bl, pl, isP){
    var rows=(isP?pl:bl).slice().sort(function(a,b){
      return (b.date||"").localeCompare(a.date||"");
    });
    var h='';
    [["直近5試合",5],["直近10試合",10],["全期間",rows.length]].forEach(function(x){
      var g=rows.slice(0,x[1]);
      if(!g.length) return;
      h+='<div class="subsec"><div class="subttl">'+x[0]+'（'+g.length+'試合）</div><div class="statrow">';
      if(isP){
        var a=aggPit(g);
        h+='<div class="stat"><div class="sv">'+(a.era==null?"-":a.era.toFixed(2))+'</div><div class="sl">防御率</div></div>'+
           '<div class="stat"><div class="sv">'+esc(a.innings)+'</div><div class="sl">投球回</div></div>'+
           '<div class="stat"><div class="sv">'+a.so+'</div><div class="sl">奪三振</div></div>'+
           '<div class="stat"><div class="sv">'+(a.whip==null?"-":a.whip.toFixed(2))+'</div><div class="sl">WHIP</div></div>'+
           '<div class="stat"><div class="sv">'+a.w+'-'+a.l+'</div><div class="sl">勝敗</div></div>';
      }else{
        var b=aggBat(g);
        h+='<div class="stat"><div class="sv">'+fmtAvg(b.avg)+'</div><div class="sl">打率</div></div>'+
           '<div class="stat"><div class="sv">'+b.ab+'</div><div class="sl">打数</div></div>'+
           '<div class="stat"><div class="sv">'+b.hits+'</div><div class="sl">安打</div></div>'+
           '<div class="stat"><div class="sv">'+b.hr+'</div><div class="sl">本塁打</div></div>'+
           '<div class="stat"><div class="sv">'+b.rbi+'</div><div class="sl">打点</div></div>';
      }
      h+='</div></div>';
    });
    return h;
  }

  /* ===== 配球分析・スイング指標（一球データから） ===== */
  function bool01(v){ return String(v).toLowerCase()==="true"; }
  function pct(n, d, digits){
    if(!d) return "-";
    return (n/d*100).toFixed(digits==null?1:digits)+"%";
  }
  function handSide(h){
    h=String(h||"");
    if(h.indexOf("左")>=0) return "左";
    if(h.indexOf("右")>=0) return "右";
    if(h.indexOf("両")>=0) return "両";
    return "不明";
  }

  /* 行の集合から投球の基本指標をまとめる */
  function pitchAgg(rows){
    var a={n:rows.length, swing:0, miss:0, called:0, foul:0, ball:0, inplay:0,
           spdSum:0, spdN:0, spdMax:null, hits:0, endAB:0, so:0};
    rows.forEach(function(r){
      if(bool01(r.is_swing)) a.swing++;
      if(bool01(r.is_miss)) a.miss++;
      if(bool01(r.is_called)) a.called++;
      if(bool01(r.is_foul)) a.foul++;
      if(bool01(r.is_ball)) a.ball++;
      if(bool01(r.is_inplay)) a.inplay++;
      var s=parseFloat(r.speed_kmh);
      if(!isNaN(s)&&s>0){ a.spdSum+=s; a.spdN++; if(a.spdMax==null||s>a.spdMax) a.spdMax=s; }
      if(bool01(r.is_last_pitch)){
        a.endAB++;
        if(num(r.ab_hit)>0) a.hits++;
        if((r.ab_result||"").indexOf("三振")>=0) a.so++;
      }
    });
    a.avgSpd = a.spdN ? Math.round(a.spdSum/a.spdN) : null;
    a.strike = a.n - a.ball;
    return a;
  }

  function groupRows(rows, keyFn){
    var g={}, order=[];
    rows.forEach(function(r){
      var k=keyFn(r);
      if(k==null||k==="") k="不明";
      if(!g[k]){ g[k]=[]; order.push(k); }
      g[k].push(r);
    });
    return {groups:g, keys:order};
  }

  /* --- 投手：配球分析 --- */
  function splitPitchMix(rows){
    if(!rows.length) return '<div class="msg">一球データがありません</div>';
    var h='';

    // 球種別サマリー
    var g=groupRows(rows, function(r){return r.pitch_type;});
    g.keys.sort(function(a,b){ return g.groups[b].length-g.groups[a].length; });
    h+='<div class="subsec"><div class="subttl">球種別（'+rows.length+'球）</div><div class="tblwrap">'+
       '<table class="stbl"><thead><tr><th class="nm">球種</th><th>球数</th><th>割合</th>'+
       '<th>平均</th><th>最速</th><th>ストライク率</th><th>空振り率</th><th>Whiff%</th>'+
       '<th>被安打</th></tr></thead><tbody>';
    g.keys.forEach(function(k){
      var a=pitchAgg(g.groups[k]);
      h+='<tr><td class="nm">'+esc(k)+'</td>'+
         '<td class="num">'+a.n+'</td>'+
         '<td class="num hi">'+pct(a.n, rows.length)+'</td>'+
         '<td class="num">'+(a.avgSpd||"-")+'</td>'+
         '<td class="num">'+(a.spdMax||"-")+'</td>'+
         '<td class="num">'+pct(a.strike, a.n)+'</td>'+
         '<td class="num">'+pct(a.miss, a.n)+'</td>'+
         '<td class="num">'+pct(a.miss, a.swing)+'</td>'+
         '<td class="num">'+a.hits+'</td></tr>';
    });
    h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
       '空振り率＝全投球に対する空振りの割合／Whiff%＝スイングされた球のうち空振りの割合</div></div>';

    // カウント別の球種割合
    h+=crossTab(rows, "カウント別の球種割合",
        function(r){return r.count_before||"-";},
        function(r){return r.pitch_type;},
        function(a,b){
          var pa=a.split("-"), pb=b.split("-");
          return (num(pa[0])-num(pb[0])) || (num(pa[1])-num(pb[1]));
        });

    // 左右打者別
    h+=crossTab(rows, "左右打者別の球種割合",
        function(r){return "対"+handSide(r.bat_hand)+"打者";},
        function(r){return r.pitch_type;}, null);

    // 決め球（2ストライク後）
    var two=rows.filter(function(r){return num(r.strikes_before)>=2;});
    if(two.length){
      var g2=groupRows(two, function(r){return r.pitch_type;});
      g2.keys.sort(function(a,b){return g2.groups[b].length-g2.groups[a].length;});
      h+='<div class="subsec"><div class="subttl">決め球（2ストライク後の'+two.length+'球）</div>'+
         '<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">球種</th>'+
         '<th>球数</th><th>割合</th><th>空振り率</th><th>奪三振</th></tr></thead><tbody>';
      g2.keys.forEach(function(k){
        var a=pitchAgg(g2.groups[k]);
        h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+a.n+'</td>'+
           '<td class="num hi">'+pct(a.n, two.length)+'</td>'+
           '<td class="num">'+pct(a.miss, a.n)+'</td>'+
           '<td class="num'+(a.so>0?' hi':'')+'">'+a.so+'</td></tr>';
      });
      h+='</tbody></table></div></div>';
    }

    // 被安打・被本塁打となった球
    var ends=rows.filter(function(r){return bool01(r.is_last_pitch);});
    var hitP=ends.filter(function(r){return num(r.ab_hit)>0;});
    if(hitP.length){
      var g3=groupRows(hitP, function(r){return r.pitch_type;});
      g3.keys.sort(function(a,b){return g3.groups[b].length-g3.groups[a].length;});
      h+='<div class="subsec"><div class="subttl">被安打となった球（'+hitP.length+'本）</div>'+
         '<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">球種</th>'+
         '<th>被安打</th><th>その球種の投球数</th><th>被安打率</th></tr></thead><tbody>';
      g3.keys.forEach(function(k){
        var all=rows.filter(function(r){return r.pitch_type===k;}).length;
        h+='<tr><td class="nm">'+esc(k)+'</td>'+
           '<td class="num hi">'+g3.groups[k].length+'</td>'+
           '<td class="num">'+all+'</td>'+
           '<td class="num">'+pct(g3.groups[k].length, all, 2)+'</td></tr>';
      });
      h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
         '被安打率＝その球種を投げたうち安打になった割合</div></div>';
    }

    // ゾーン別の投球分布・被安打
    h+=zoneSection(rows, "ゾーン別の投球",
        "安打率＝そのゾーンで打席が終わった球のうち安打になった割合");

    // 被打率のスプリット
    h+=resultSplit(rows, "対左右打者別の被成績", function(r){return "対"+handSide(r.bat_hand)+"打者";});
    h+=resultSplit(rows, "対戦チーム別の被成績", function(r){return r.batting_team||"不明";});
    h+=resultSplit(rows, "球場別の被成績", function(r){return r.stadium||"不明";});

    // ゾーン内外
    h+=zoneSummary(rows, "ゾーン内外の投球");
    return h;
  }

  /* --- 打者：スイング指標 --- */
  function splitSwing(rows){
    if(!rows.length) return '<div class="msg">一球データがありません</div>';
    var a=pitchAgg(rows);
    var inZ=rows.filter(function(r){return bool01(r.in_zone);});
    var outZ=rows.filter(function(r){return String(r.in_zone).toLowerCase()==="false";});
    var inZa=pitchAgg(inZ), outZa=pitchAgg(outZ);
    var first=rows.filter(function(r){return num(r.pitch_no)===1;});
    var firsta=pitchAgg(first);

    var h='<div class="subsec"><div class="subttl">スイング指標（'+rows.length+'球）</div>'+
      '<div class="statrow">'+
      '<div class="stat"><div class="sv">'+pct(a.swing,a.n)+'</div><div class="sl">スイング率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.miss,a.n)+'</div><div class="sl">空振り率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.swing-a.miss,a.swing)+'</div><div class="sl">コンタクト率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.miss,a.swing)+'</div><div class="sl">Whiff%</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.called,a.n)+'</div><div class="sl">見逃し率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.foul,a.n)+'</div><div class="sl">ファウル率</div></div>'+
      '</div><div class="statrow" style="margin-top:8px">'+
      '<div class="stat"><div class="sv">'+pct(inZa.swing,inZa.n)+'</div><div class="sl">ゾーン内スイング率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(outZa.swing,outZa.n)+'</div><div class="sl">ゾーン外スイング率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(inZa.swing-inZa.miss,inZa.swing)+'</div><div class="sl">ゾーン内コンタクト率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(firsta.swing,firsta.n)+'</div><div class="sl">初球スイング率</div></div>'+
      '</div><div class="sub" style="font-size:11px;margin-top:6px">'+
      'ゾーン外スイング率が低いほど選球眼がよく、コンタクト率が高いほどバットに当てる能力が高いとされます'+
      '（ゾーンは配球図の中央3×3を内側として判定）</div></div>';

    // 球種別
    var g=groupRows(rows, function(r){return r.pitch_type;});
    g.keys.sort(function(a2,b2){return g.groups[b2].length-g.groups[a2].length;});
    h+='<div class="subsec"><div class="subttl">球種別</div><div class="tblwrap">'+
       '<table class="stbl"><thead><tr><th class="nm">球種</th><th>球数</th><th>割合</th>'+
       '<th>平均球速</th><th>スイング率</th><th>空振り率</th><th>コンタクト率</th>'+
       '<th>安打</th></tr></thead><tbody>';
    g.keys.forEach(function(k){
      var x=pitchAgg(g.groups[k]);
      h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+x.n+'</td>'+
         '<td class="num">'+pct(x.n, rows.length)+'</td>'+
         '<td class="num">'+(x.avgSpd||"-")+'</td>'+
         '<td class="num">'+pct(x.swing,x.n)+'</td>'+
         '<td class="num">'+pct(x.miss,x.n)+'</td>'+
         '<td class="num">'+pct(x.swing-x.miss,x.swing)+'</td>'+
         '<td class="num'+(x.hits>0?' hi':'')+'">'+x.hits+'</td></tr>';
    });
    h+='</tbody></table></div></div>';

    // カウント別
    var gc=groupRows(rows, function(r){return r.count_before||"-";});
    gc.keys.sort(function(a2,b2){
      var pa=a2.split("-"), pb=b2.split("-");
      return (num(pa[0])-num(pb[0])) || (num(pa[1])-num(pb[1]));
    });
    h+='<div class="subsec"><div class="subttl">カウント別</div><div class="tblwrap">'+
       '<table class="stbl"><thead><tr><th class="nm">カウント</th><th>球数</th>'+
       '<th>スイング率</th><th>空振り率</th><th>見逃し率</th></tr></thead><tbody>';
    gc.keys.forEach(function(k){
      var x=pitchAgg(gc.groups[k]);
      h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+x.n+'</td>'+
         '<td class="num">'+pct(x.swing,x.n)+'</td>'+
         '<td class="num">'+pct(x.miss,x.n)+'</td>'+
         '<td class="num">'+pct(x.called,x.n)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';

    // 左右投手別
    h+=crossTab(rows, "左右投手別に見た球種",
        function(r){return "対"+handSide(r.pit_hand)+"投手";},
        function(r){return r.pitch_type;}, null);

    // ゾーン別の成績（得意・苦手）
    h+=zoneSection(rows, "ゾーン別成績（得意・苦手）",
        "安打率＝そのゾーンで打席が終わった球のうち安打になった割合");

    // 打撃成績のスプリット（対左右・球場別・対チーム別）
    h+=resultSplit(rows, "対左右投手別の成績", function(r){return "対"+handSide(r.pit_hand)+"投手";});
    h+=resultSplit(rows, "球場別の成績", function(r){return r.stadium||"不明";});
    h+=resultSplit(rows, "対戦チーム別の成績", function(r){return r.fielding_team||"不明";});

    h+=zoneSummary(rows, "ゾーン内外");
    return h;
  }

  /* 一球データから打撃成績を切り口別に集計する */
  function resultSplit(rows, title, keyFn){
    // 打席を終えた球だけを見る
    var ends=rows.filter(function(r){return bool01(r.is_last_pitch);});
    if(!ends.length) return "";
    var g=groupRows(ends, keyFn);
    g.keys.sort(function(a,b){return g.groups[b].length-g.groups[a].length;});

    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div><div class="tblwrap">'+
      '<table class="stbl"><thead><tr><th class="nm">区分</th><th>打席</th><th>打数</th>'+
      '<th>安打</th><th>安打率</th><th>三振</th><th>四死球</th></tr></thead><tbody>';
    g.keys.forEach(function(k){
      var rs=g.groups[k];
      var pa=rs.length, ab=0, hits=0, so=0, bb=0;
      rs.forEach(function(r){
        var ar=r.ab_result||"";
        if(ar.indexOf("四球")>=0 || ar.indexOf("死球")>=0){ bb++; return; }
        if(ar.indexOf("犠")>=0) return;
        ab++;
        if(num(r.ab_hit)>0) hits++;
        if(ar.indexOf("三振")>=0) so++;
      });
      var disp = /チーム/.test(title) ? (teamBadge(k)+" "+esc(k)) : esc(k);
      h+='<tr><td class="nm">'+disp+'</td>'+
         '<td class="num">'+pa+'</td><td class="num">'+ab+'</td>'+
         '<td class="num'+(hits>0?' hi':'')+'">'+hits+'</td>'+
         '<td class="num hi">'+(ab?fmtAvg(hits/ab):"-")+'</td>'+
         '<td class="num">'+so+'</td><td class="num">'+bb+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    return h;
  }

  /* 行キー×列キーの割合クロス表 */
  function crossTab(rows, title, rowKeyFn, colKeyFn, rowSort){
    var rg=groupRows(rows, rowKeyFn);
    var cols={}, colOrder=[];
    rows.forEach(function(r){
      var c=colKeyFn(r)||"不明";
      if(!cols[c]){ cols[c]=0; colOrder.push(c); }
      cols[c]++;
    });
    colOrder.sort(function(a,b){ return cols[b]-cols[a]; });
    if(!rg.keys.length || !colOrder.length) return "";
    if(rowSort) rg.keys.sort(rowSort);

    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div><div class="tblwrap">'+
      '<table class="stbl"><thead><tr><th class="nm">'+'</th><th>球数</th>'+
      colOrder.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+
      '</tr></thead><tbody>';
    rg.keys.forEach(function(k){
      var g=rg.groups[k];
      h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+g.length+'</td>';
      colOrder.forEach(function(c){
        var n=g.filter(function(r){return (colKeyFn(r)||"不明")===c;}).length;
        var p=g.length?n/g.length*100:0;
        var bg = p>0 ? 'style="background:rgba(232,89,12,'+(Math.min(p,60)/60*0.5).toFixed(2)+')"' : '';
        h+='<td class="num" '+bg+'>'+(n?p.toFixed(0)+"%":"-")+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
       '色が濃いほど割合が高い／各行の合計が100%</div></div>';
    return h;
  }

  /* ゾーン内外のまとめ */
  function zoneSummary(rows, title){
    var inZ=rows.filter(function(r){return bool01(r.in_zone);});
    var outZ=rows.filter(function(r){return String(r.in_zone).toLowerCase()==="false";});
    if(!inZ.length && !outZ.length) return "";
    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div><div class="tblwrap">'+
      '<table class="stbl"><thead><tr><th class="nm">区分</th><th>球数</th><th>割合</th>'+
      '<th>スイング率</th><th>空振り率</th><th>安打</th></tr></thead><tbody>';
    [["ゾーン内",inZ],["ゾーン外",outZ]].forEach(function(x){
      if(!x[1].length) return;
      var a=pitchAgg(x[1]);
      h+='<tr><td class="nm">'+x[0]+'</td><td class="num">'+a.n+'</td>'+
         '<td class="num">'+pct(a.n, inZ.length+outZ.length)+'</td>'+
         '<td class="num">'+pct(a.swing,a.n)+'</td>'+
         '<td class="num">'+pct(a.miss,a.n)+'</td>'+
         '<td class="num">'+a.hits+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    return h;
  }

  /* 5×5ゾーンの成績グリッド（打者から見た得意・苦手の可視化） */
  function zoneGrid(rows, mode){
    // ゾーンごとに集計
    var cell={};
    rows.forEach(function(r){
      var gr=r.zone_row, gc=r.zone_col;
      if(gr===""||gc===""||gr==null||gc==null) return;
      var k=gr+"-"+gc;
      if(!cell[k]) cell[k]={n:0, swing:0, miss:0, hits:0, endAB:0};
      var c=cell[k];
      c.n++;
      if(bool01(r.is_swing)) c.swing++;
      if(bool01(r.is_miss)) c.miss++;
      if(bool01(r.is_last_pitch)){
        var ar=r.ab_result||"";
        // 四死球・犠打は打数に数えない
        if(ar && ar.indexOf("四球")<0 && ar.indexOf("死球")<0 && ar.indexOf("犠")<0){
          c.endAB++;
          if(num(r.ab_hit)>0) c.hits++;
        }
      }
    });

    function val(c){
      if(!c) return null;
      if(mode==="avg")   return c.endAB>=1 ? c.hits/c.endAB : null;
      if(mode==="miss")  return c.n>=1 ? c.miss/c.n : null;
      if(mode==="swing") return c.n>=1 ? c.swing/c.n : null;
      return c.n;
    }
    // 色の基準（最大値）
    var mx=0;
    for(var k in cell){
      var v=val(cell[k]);
      if(v!=null && v>mx) mx=v;
    }
    if(!mx) return '<div class="sub">ゾーンデータがありません</div>';

    var h='<div class="heat zgrid">';
    for(var r0=0;r0<5;r0++){
      for(var c0=0;c0<5;c0++){
        var c=cell[r0+"-"+c0];
        var v=val(c);
        var inZone=(r0>=1&&r0<=3&&c0>=1&&c0<=3);
        var ratio=(v==null||!mx)?0:(v/mx);
        var txt="-", sub="";
        if(c){
          if(mode==="avg") txt = (c.endAB>=1) ? fmtAvg(v) : "-";
          else if(mode==="count") txt = String(c.n);
          else txt = (v==null) ? "-" : Math.round(v*100)+"%";
          sub = (mode==="avg") ? (c.endAB+"打数") : (c.n+"球");
        }
        h+='<div class="hcell zcell'+(inZone?' zone':'')+'" '+
           'style="background:rgba(232,89,12,'+(ratio*0.85).toFixed(2)+')" '+
           'title="'+(c?(c.n+"球 / "+c.endAB+"打数 "+c.hits+"安打"):"データなし")+'">'+
           '<span class="zv">'+txt+'</span>'+
           (sub?'<span class="zs">'+sub+'</span>':'')+'</div>';
      }
    }
    h+='</div>';
    return h;
  }

  var zoneMode="avg";
  function setZoneMode(m){
    zoneMode=m;
    var el=document.getElementById("zoneBox");
    if(el && curZoneRows) el.innerHTML=zoneGrid(curZoneRows, zoneMode);
    var bs=document.querySelectorAll(".zmode");
    for(var i=0;i<bs.length;i++){
      bs[i].classList.toggle("on", bs[i].getAttribute("data-m")===m);
    }
  }
  var curZoneRows=null;

  function zoneSection(rows, title, note){
    curZoneRows=rows;
    var modes=[["avg","安打率"],["miss","空振り率"],["swing","スイング率"],["count","投球数"]];
    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div>'+
      '<div class="stabs" style="margin-bottom:8px">';
    modes.forEach(function(m){
      h+='<button class="stab zmode'+(zoneMode===m[0]?" on":"")+'" data-m="'+m[0]+'" '+
         'style="--sc:var(--accent)" onclick="setZoneMode(\''+m[0]+'\')">'+m[1]+'</button>';
    });
    h+='</div><div id="zoneBox">'+zoneGrid(rows, zoneMode)+'</div>'+
       '<div class="sub" style="font-size:11px;margin-top:8px">'+esc(note)+
       '／枠内がストライクゾーン・投手から見た位置・色が濃いほど数値が高い</div></div>';
    return h;
  }

  /* ===== 日別分析 ===== */
  var dailyDate=null;

  async function loadDaily(){
    var dv=document.getElementById("dailyView");
    if(!dailyDate){
      // 既定はデータがある最新日
      var ks=Object.keys(dashDays||{}).sort();
      dailyDate = ks.length ? ks[ks.length-1] : (dp.value||todayJST());

    dv.innerHTML='<div class="msg">読み込み中…</div>';

  function shiftDaily(n){
    var t=new Date(dailyDate+"T00:00:00");
    t.setDate(t.getDate()+n);
    dailyDate=fmtDate(t);
    renderDaily();
  }
  function setDailyDate(v){
    if(v){ dailyDate=v; renderDaily(); }

  function renderDaily(){
    var dv=document.getElementById("dailyView");
    var d=dailyDate;
    var bl=(splitCache["batting_lines"].rows||[]).filter(function(r){return r.date===d;});
    var pl=(splitCache["pitching_lines"].rows||[]).filter(function(r){return r.date===d;});
    var gm=(splitCache["games"].rows||[]).filter(function(r){return r.date===d;});

    var h='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>日別分析'+
      '<span class="dash-date">'+esc(d.replace(/-/g,"/"))+'</span></div>'+
      '<div class="calnav">'+
        '<button class="btn" onclick="shiftDaily(-1)">◀ 前日</button>'+
        '<input type="date" id="dailyPick" value="'+esc(d)+'" onchange="setDailyDate(this.value)">'+
        '<button class="btn" onclick="shiftDaily(1)">翌日 ▶</button>'+
      '</div>';

    if(!gm.length && !bl.length && !pl.length){
      h+='<div class="msg">この日のデータはありません<br>'+
         '<span style="font-size:12px">カレンダーで収集済みの日を確認できます</span></div></div>';
      dv.innerHTML=h;
      return;
    }

    // ---- 試合結果（リーグ別）----
    if(gm.length){
      var byLg={"セ":[],"パ":[],"交":[],"?":[]};
      gm.forEach(function(g){
        var lh=tLeague(g.home), la=tLeague(g.away);
        var k = (!lh||!la) ? "?" : (lh===la ? lh : "交");
        byLg[k].push(g);
      });
      h+='<div class="subsec"><div class="subttl">試合結果（'+gm.length+'試合）</div>';
      [["セ","セ・リーグ"],["パ","パ・リーグ"],["交","交流戦"],["?","その他"]].forEach(function(x){
        var list=byLg[x[0]];
        if(!list.length) return;
        var col=LEAGUE_COLOR[x[0]]||"var(--accent)";
        h+='<div class="lgroup"><div class="lgroup-h" style="border-left-color:'+col+'">'+
           '<span class="lgbadge" style="background:'+col+'">'+esc(x[0]==="?"?"他":x[0])+'</span> '+
           esc(x[1])+'</div><div class="dash-games">';
        list.forEach(function(g){
          var hs=num(g.home_score), as_=num(g.away_score);
          var topics=[];
          if(hs===0||as_===0) topics.push("完封");
          if(Math.abs(hs-as_)>=5) topics.push("大差");
          if(hs===as_) topics.push("引分");
          h+='<div class="dgame">'+
            '<div class="dg-score">'+
              '<span class="'+(hs>as_?"w":"")+'">'+esc(tMini(g.home)||g.home)+' '+hs+'</span>'+
              '<span class="dash">-</span>'+
              '<span class="'+(as_>hs?"w":"")+'">'+as_+' '+esc(tMini(g.away)||g.away)+'</span>'+
            '</div>'+
            (g.win_pitcher?'<div class="dg-pit">勝 '+esc(g.win_pitcher)+
              (g.lose_pitcher?'／敗 '+esc(g.lose_pitcher):'')+'</div>':'')+
            (g.stadium?'<div class="dg-pit">'+esc(g.stadium)+'</div>':'')+
            (topics.length?'<div class="dg-pit">'+topics.map(function(t){
               return '<span class="subtag">'+t+'</span>';}).join(" ")+'</div>':'')+
            '</div>';
        });
        h+='</div></div>';
      });
      h+='</div>';

      // 出場しなかった球団
      var played={};
      gm.forEach(function(g){ played[g.home]=1; played[g.away]=1; });
      var rest=TEAM_ORDER_PA.concat(TEAM_ORDER_SE).filter(function(t){return !played[t];});
      if(rest.length){
        h+='<div class="subsec"><div class="subttl">試合なし</div><div class="expbtns">'+
           rest.map(function(t){return '<span class="explink">'+teamBadge(t)+' '+esc(t)+'</span>';}).join("")+
           '</div></div>';
      }
    }

    // ---- 打撃のトピック ----
    if(bl.length){
      var multi=bl.filter(function(r){return num(r.hits)>=2;})
                  .sort(function(a,b){return num(b.hits)-num(a.hits);});
      var big=multi.filter(function(r){return num(r.hits)>=3;});
      var hrs=bl.filter(function(r){return num(r.hr)>=1;})
                .sort(function(a,b){return num(b.hr)-num(a.hr);});
      var rbis=bl.filter(function(r){return num(r.rbi)>=1;})
                 .sort(function(a,b){return num(b.rbi)-num(a.rbi);});

      h+=dailyList("猛打賞（3安打以上）", big, function(r){
        return num(r.hits)+"安打"+(num(r.hr)?" "+num(r.hr)+"本":"");});
      h+=dailyList("マルチ安打（2安打以上）", multi, function(r){
        return num(r.hits)+"安打 "+num(r.ab)+"打数";});
      h+=dailyList("本塁打", hrs, function(r){
        return num(r.hr)+"本 "+num(r.rbi)+"打点";});
      h+=dailyList("打点", rbis, function(r){ return num(r.rbi)+"打点";});
    }

    // ---- 投手のトピック ----
    if(pl.length){
      var so=pl.filter(function(r){return num(r.so)>=1;})
               .sort(function(a,b){return num(b.so)-num(a.so);});
      var pitches=pl.slice().sort(function(a,b){return num(b.pitches)-num(a.pitches);});
      var sv=pl.filter(function(r){return (r.decision||"").indexOf("Ｓ")>=0 || (r.decision||"").indexOf("S")>=0;});
      var qs=pl.filter(function(r){return String(r.is_qs).toLowerCase()==="true";});

      h+=dailyList("奪三振", so, function(r){
        return num(r.so)+"個 "+esc(r.innings||"")+"回";});
      h+=dailyList("球数", pitches.slice(0,10), function(r){
        return num(r.pitches)+"球 "+esc(r.innings||"")+"回";});
      h+=dailyList("クオリティスタート", qs, function(r){
        return esc(r.innings||"")+"回 自責"+num(r.earned_runs);});
      h+=dailyList("セーブ", sv, function(r){
        return esc(r.innings||"")+"回 "+num(r.so)+"奪三振";});
    }

    h+='<div class="sub" style="font-size:11px;margin-top:8px">'+
       '出典：スポーツナビ（試合出場成績・一球速報）／'+
       '延長・サヨナラの判定は集計データにイニング情報が無いため出していません</div>';
    h+='</div>';
    dv.innerHTML=h;
  }

  /* ===== 表彰（日刊MVP・ベストメンバー） ===== */
  var awardsDate=null, awardsLg="パ", awardsData=null;
  var awardsKind="daily";     // daily | weekly | monthly
  var awardsMonday=null, awardsMonth=null;

  function mondayOf(dateStr){
    var t=new Date(dateStr+"T00:00:00");
    var wd=(t.getDay()+6)%7;              // 月曜=0
    t.setDate(t.getDate()-wd);
    return fmtDate(t);
  }

  async function loadAwards(){
    var av=document.getElementById("awardsView");
    if(!awardsDate){
      var ks=Object.keys(dashDays||{}).sort();
      awardsDate = ks.length ? ks[ks.length-1] : (dp.value||todayJST());
    }
    if(!awardsMonday) awardsMonday=mondayOf(awardsDate);
    if(!awardsMonth) awardsMonth=awardsDate.slice(0,7);
    await fetchAwards();
    renderAwards();
  }

  async function fetchAwards(){
    var year=(awardsKind==="daily"?awardsDate:awardsKind==="weekly"?awardsMonday:awardsMonth).split("-")[0];
    var url = awardsKind==="daily" ? "data/"+year+"/awards/daily/"+awardsDate+".json"
            : awardsKind==="weekly" ? "data/"+year+"/awards/weekly/"+awardsMonday+".json"
            : "data/"+year+"/awards/monthly/"+awardsMonth+".json";
    try{
      var r=await fetch(url+"?t="+Date.now());
      awardsData = r.ok ? await r.json() : null;
    }catch(e){ awardsData=null; }
  }

  function setAwardsKind(k){
    awardsKind=k;
    document.getElementById("awardsView").innerHTML='<div class="msg">読み込み中…</div>';
    fetchAwards().then(renderAwards);
  }
  function shiftAwards(n){
    if(awardsKind==="daily"){
      var t=new Date(awardsDate+"T00:00:00"); t.setDate(t.getDate()+n); awardsDate=fmtDate(t);
    }else if(awardsKind==="weekly"){
      var t2=new Date(awardsMonday+"T00:00:00"); t2.setDate(t2.getDate()+n*7); awardsMonday=fmtDate(t2);
    }else{
      var p=awardsMonth.split("-"); var y=parseInt(p[0],10), m=parseInt(p[1],10)+n;
      while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
      awardsMonth=y+"-"+("0"+m).slice(-2);
    }
    document.getElementById("awardsView").innerHTML='<div class="msg">読み込み中…</div>';
    fetchAwards().then(renderAwards);
  }
  function setAwardsDate(v){
    if(!v) return;
    if(awardsKind==="daily") awardsDate=v;
    else if(awardsKind==="weekly") awardsMonday=mondayOf(v);
    else awardsMonth=v.slice(0,7);
    document.getElementById("awardsView").innerHTML='<div class="msg">読み込み中…</div>';
    fetchAwards().then(renderAwards);
  }
  function setAwardsLg(l){ awardsLg=l; renderAwards(); }

  function renderAwards(){
    var av=document.getElementById("awardsView");
    var titles={daily:"日刊",weekly:"週間",monthly:"月間"};

    // --- MVP ---
    h+='<div class="mvpgrid">';

    h+=mvpCard("投手MVP", lg.pitcher_mvp, true);
    h+='</div>';

      order.forEach(function(pos){

        h+=bestRow(POS_LABEL[pos]||pos, x);

       '<a href="#" onclick="setView(\'awardsGuide\');return false;">選出基準の説明 ▶</a></div>';

  function gRow(label, pt, note){
    return '<tr><td class="nm">'+esc(label)+'</td><td class="num">'+esc(pt)+'</td>'+
      '<td class="nm" style="font-weight:400;font-size:12px">'+esc(note)+'</td></tr>';
  }
  function gRow2(label, note){
    return '<tr><td class="nm"><b>'+esc(label)+'</b></td>'+
      '<td class="nm" style="font-weight:400;font-size:12px">'+esc(note)+'</td></tr>';
  }

  var POS_LABEL={"捕":"捕手","一":"一塁手","二":"二塁手","三":"三塁手","遊":"遊撃手",
                 "左":"左翼手","中":"中堅手","右":"右翼手","指":"指名打者"};

  function mvpCard(title, x, isPit){
    if(!x) return '<div class="card2"><h3>'+title+'</h3><div class="msg">該当なし</div></div>';
    var col=tColor(x.team)||"var(--accent)";
    var h='<div class="card2 mvpcard" style="border-left:5px solid '+col+'">'+
      '<h3>'+title+(isPit&&x.role?' <span class="subtag">'+esc(x.role)+'</span>':'')+'</h3>'+
      '<div class="mvpname">'+teamBadge(x.team)+' '+esc(x.name)+'</div>'+
      '<div class="mvpscore">'+x.score+'<span class="mvpunit">点</span>'+
      (x.margin!=null?'<span class="mvpmargin">2位と +'+x.margin+'</span>':'')+'</div>'+
      '<div class="mvpstat">'+esc(x.stat_line||"")+'</div>';
    if((x.reasons||[]).length){
      h+='<div class="mvprow"><span class="k">加点</span>'+
         x.reasons.map(function(r){return '<span class="qmark">'+esc(r)+'</span>';}).join(" ")+'</div>';
    }
    if((x.minus_reasons||[]).length){
      h+='<div class="mvprow"><span class="k">減点</span>'+
         x.minus_reasons.map(function(r){
           return '<span class="subtag" style="background:var(--muted)">'+esc(r)+'</span>';}).join(" ")+'</div>';
    }
    if(x.comment) h+='<div class="mvpcomment">'+esc(x.comment)+'</div>';
    if(x.breakdown){
      h+='<div class="mvpbd">';
      var lb={basicBatting:"打撃",runProduction:"得点貢献",clutch:"勝負強さ",
              baserunning:"走塁",defense:"守備",teamWin:"勝利",penalty:"減点",
              innings:"投球回",prevention:"失点抑制",strikeout:"奪三振",
              whip:"WHIP",winContrib:"勝利貢献",base:"基礎",situation:"場面"};
      for(var k in x.breakdown){
        var v=x.breakdown[k];
        if(!v) continue;
        h+='<span class="bdchip'+(v<0?" minus":"")+'">'+(lb[k]||k)+' '+v+'</span>';
      }
      h+='</div>';
    }
    return h+'</div>';
  }

  function bestRow(label, x){
    return '<tr><td class="pos"><b>'+esc(label)+'</b></td>'+
      '<td class="nm">'+esc(x.name)+'</td>'+
      '<td>'+teamBadge(x.team)+'</td>'+
      '<td class="num hi">'+x.score+'</td>'+
      '<td class="nm" style="font-weight:400;font-size:12px">'+esc(x.stat_line||"")+'</td>'+
      '<td class="nm" style="font-weight:400;font-size:11.5px">'+
        esc((x.reasons||[]).join("／"))+'</td></tr>';
  }

  function rankTable(title, list, isPit){
    if(!list.length) return "";
    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div>'+
      '<div class="tblwrap"><table class="stbl"><thead><tr>'+
      '<th>#</th><th class="nm">選手</th><th>球団</th>'+
      (isPit?'':'<th>位置</th>')+'<th>スコア</th>'+
      '<th class="nm">成績</th><th class="nm">加点／減点</th></tr></thead><tbody>';
    list.forEach(function(x,i){
      var good=(x.reasons||[]).join("／");
      var bad=(x.minus_reasons||[]).join("／");
      h+='<tr><td class="num">'+(i+1)+'</td>'+
        '<td class="nm">'+esc(x.name)+'</td>'+
        '<td>'+teamBadge(x.team)+'</td>'+
        (isPit?'':'<td class="pos">'+esc(x.position||"-")+'</td>')+
        '<td class="num hi">'+x.score+'</td>'+
        '<td class="nm" style="font-weight:400;font-size:12px">'+esc(x.stat_line||"")+'</td>'+
        '<td class="nm" style="font-weight:400;font-size:11px">'+esc(good)+
          (bad?'<span class="dim">／'+esc(bad)+'</span>':'')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    return h;
  }

  function setImpactLg(l){ impactLg=l; renderImpact(); }

    impactKind=k;

       (k==="pitcher" && impactQual==="pa")) impactQual="all";

  function setImpactQual(k){ impactQual=k; renderImpact(); }

    impactSortDir=impactSortDir==="desc"?"asc":"desc";
    renderImpact();
  }
  function impactNum(v){ return v==null?"-":Number(v).toFixed(1); }
  function impactPosition(x){
    var players=npbRoster&&npbRoster.players;
    if(players){
      var nn=normName(x.name);
      for(var i=0;i<players.length;i++){
        if(players[i].team===x.team && normName(players[i].name)===nn){
          return players[i].position_group||"-";
        }
      }
    }
    return x.position||"-";
  }
  function impactSortValue(x,key){
    if(key==="name") return x.name||"";
    if(key==="team") return x.team||"";
    if(key==="position") return impactPosition(x);
    if(key.indexOf("components.")===0){
      return Number((x.components||{})[key.slice(11)]||0);
    }
    if(key.indexOf("stats.")===0){
      return Number((x.stats||{})[key.slice(6)]||0);
    }
    return Number(x[key]||0);
  }

  /* 簡易CSVパーサ（引用符・改行を含むフィールドに対応） */
  function parseCSV(text){
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);   // BOMを除去
    var rows=[], row=[], cur="", inQ=false, i=0;
    while(i<text.length){
      var c=text[i];
      if(inQ){
        if(c==='"'){
          if(text[i+1]==='"'){ cur+='"'; i+=2; continue; }
          inQ=false; i++; continue;
        }
        cur+=c; i++; continue;
      }
      if(c==='"'){ inQ=true; i++; continue; }
      if(c===','){ row.push(cur); cur=""; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; i++; continue; }
      cur+=c; i++;
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function toCSV(header, rows){
    function q(v){
      v=(v==null?"":String(v));
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }
    var out=[header.map(q).join(",")];
    rows.forEach(function(r){ out.push(r.map(q).join(",")); });
    return out.join("\r\n");
  }

  var TEAM_COLS=["team","batting_team","fielding_team","home","away","opponent"];
  var PLAYER_COLS=["player","batter","pitcher","win_pitcher","lose_pitcher","save_pitcher"];

  function filterRows(header, rows){
    var idx={};
    header.forEach(function(hname,i){ idx[hname]=i; });
    var dateI=idx["date"];
    var teamIs=TEAM_COLS.filter(function(c){return idx[c]!=null;}).map(function(c){return idx[c];});
    var plIs=PLAYER_COLS.filter(function(c){return idx[c]!=null;}).map(function(c){return idx[c];});
    var pl=(expPlayer||"").trim();

    return rows.filter(function(r){
      if(dateI!=null){
        var d=r[dateI];
        if(expFrom && d < expFrom) return false;
        if(expTo && d > expTo) return false;
      }
      if(expTeam!=="all"){
        var okT=false;
        for(var i=0;i<teamIs.length;i++){ if(r[teamIs[i]]===expTeam){ okT=true; break; } }
        if(!okT) return false;
      }
      if(pl){
        var okP=false;
        for(var j=0;j<plIs.length;j++){
          if((r[plIs[j]]||"").indexOf(pl)>=0){ okP=true; break; }
        }
        if(!okP) return false;
      }
      return true;
    });
  }

  async function runExport(mode){
    if(expLoading) return;
    readExportForm();
    var res=document.getElementById("exResult");
    var year=(dp.value||todayJST()).split("-")[0];
    var url="data/"+year+"/dataset/"+expSet+".csv";

    try{

        expLoading=true;
        res.innerHTML='<div class="msg">読み込み中…（初回はファイルサイズにより時間がかかります）</div>';
        var r=await fetch(url+"?t="+Date.now());
        if(!r.ok) throw new Error("notfound");
        var text=await r.text();
        var all=parseCSV(text).filter(function(x){return x.length>1;});
        if(!all.length) throw new Error("empty");
        expCache[expSet]={header:all[0], rows:all.slice(1)};
        expLoading=false;

      var d=expCache[expSet];

      if(mode==="download"){
        if(!rows.length){ res.innerHTML='<div class="msg">条件に合うデータがありません</div>'; return; }

  /* 打席データから背番号・初出場の回を拾う（選手IDで照合、無ければ名前で） */
  function playerMetaFromAtbats(g){
    var byId={}, byName={};
    function put(map, key, info){
      if(!key) return;
      if(!map[key]) map[key]={};
      var m=map[key];
      if(!m.number && info.number) m.number=info.number;
      if(!m.hand && info.hand) m.hand=info.hand;
      if(info.batHalf && !m.firstBat){ m.firstBat=info.batHalf; m.firstBatN=info.n; }
      if(info.pitHalf && !m.firstPitch){ m.firstPitch=info.pitHalf; m.firstPitchN=info.n; }
    }
    (g.atbats||[]).forEach(function(ab){
      var half=(ab.inning||"")+"回"+(ab.top_bottom||"");
      var n=(ab.inning||0)*2+(ab.top_bottom==="裏"?1:0);
      var b=ab.batter||{}, p=ab.pitcher||{};
      var bi={number:b.number, hand:b.hand, batHalf:half, n:n};
      put(byId, b.player_id, bi);
      put(byName, (b.name||"").replace(/\s|　/g,""), bi);
      var pi={number:p.number, hand:p.hand, pitHalf:half, n:n};
      put(byId, p.player_id, pi);
      put(byName, (p.name||"").replace(/\s|　/g,""), pi);
    });
    return {byId:byId, byName:byName};
  }
  function metaOf(meta, row){
    return (row.player_id && meta.byId[row.player_id])
        || meta.byName[(row.name||"").replace(/\s|　/g,"")]
        || {};
  }

      });
      h+='</tbody></table></div>';
      if(starter){

    h+='</div>';

    // ---- 途中出場・交代 ----

  }

           '<th>失点</th><th>自責</th><th></th></tr></thead><tbody>';
        relievers.forEach(function(p,i){

  /* ===== 配球分析タブ ===== */
  var pitchFilter = {team:"all", pitcher:"all", type:"all"};

  /* 投手ロール（先発・中継ぎ・抑え）を判定する。
     scraper/lib/awards.py の _role_of と同じ考え方をJS側でも使う。
       ・その試合の1人目 → 先発
       ・決着に「Ｓ」がつく → 抑え
       ・最後に登板し、その試合の最終回まで投げている → 抑え扱い
       ・それ以外 → 中継ぎ
     判定できない（出場成績が無い）場合はnullを返す。 */
  function getPitcherRoles(g){
    var box=g.boxscore;
    var roles={};   // 選手名 -> "先発"|"中継ぎ"|"抑え"
    if(!box||!box.pitching) return roles;
    var lastInning=0;
    (g.atbats||[]).forEach(function(a){ if(a.inning>lastInning) lastInning=a.inning; });

    ["away","home"].forEach(function(side){
      var rows=(box.pitching&&box.pitching[side])||[];
      rows.forEach(function(row,i){
        var name=row.name;
        if(!name) return;
        var role;
        if(i===0){
          role="先発";
        }else{
          var dec=row.decision||"";
          if(dec.indexOf("Ｓ")>=0 || /(^|[^A-Za-z])S([^A-Za-z]|$)/.test(dec)){
            role="抑え";
          }else if(i===rows.length-1){
            // 最後の登板投手が、その試合の最終回まで投げていれば抑え扱い
            var mine=(g.atbats||[]).filter(function(a){
              return (a.pitcher&&a.pitcher.player_id)===row.player_id ||
                     (a.pitcher&&a.pitcher.name)===name;
            });
            var reachedLast = mine.some(function(a){ return a.inning>=lastInning; });
            role = reachedLast ? "抑え" : "中継ぎ";
          }else{
            role="中継ぎ";
          }
        }
        roles[name]=role;
      });
    });
    return roles;
  }
  var ROLE_COLOR={"先発":"var(--accent)","中継ぎ":"#1C7ED6","抑え":"#E03131"};
  function roleBadge(role){
    if(!role) return "";
    return '<span class="rolebadge" style="background:'+(ROLE_COLOR[role]||"var(--muted)")+
           '">'+esc(role)+'</span>';
  }

  function collectPitches(g){
    // 全投球をフラットな配列にする（投手・打者・状況つき）
    var roles=getPitcherRoles(g);
    var out=[];
    (g.atbats||[]).forEach(function(ab){
      var p=ab.pitcher||{}, b=ab.batter||{};
      (ab.pitches||[]).forEach(function(pt){
        out.push({
          pitcher: p.name||"-", pitcher_id: p.player_id,
          pitcherRole: roles[p.name]||null,
          batter: b.name||"-", bhand: b.hand||"",
          // 投げている側＝守備側のチーム
          team: ab.fielding_team||"", batTeam: ab.batting_team||"",
          inning: ab.inning, tb: ab.top_bottom,
          type: pt.type||"不明", speed: pt.speed_kmh,
          result: pt.result||"", kind: pt.kind||"",
          course: pt.course||null,
          last: false
        });
      });
      // 打席の最終球に印
      if(out.length && (ab.pitches||[]).length) out[out.length-1].last=true;
    });
    return out;
  }

  function renderAnalysis(g){
    var all=collectPitches(g);
    if(!all.length) return notReady("配球データ");

    // 投球している側（守備側）のチーム一覧
    var byTeam={};
    all.forEach(function(p){ if(p.team) byTeam[p.team]=(byTeam[p.team]||0)+1; });
    var teamList=Object.keys(byTeam);
    // 選択中のチームが実際に存在しなければ全体に戻す
    if(pitchFilter.team!=="all" && !byTeam[pitchFilter.team]) pitchFilter.team="all";

    // チームで絞ったあとの母集合（投手・球種の選択肢もこれに合わせる）
    var pool=all.filter(function(p){
      return pitchFilter.team==="all" || p.team===pitchFilter.team;
    });

    // 投手の一覧（投球数順）。チームを選ぶとその球団の投手だけになる
    var byPitcher={};
    pool.forEach(function(p){byPitcher[p.pitcher]=(byPitcher[p.pitcher]||0)+1;});
    var pitchers=Object.keys(byPitcher).sort(function(a,b){return byPitcher[b]-byPitcher[a];});
    if(pitchFilter.pitcher!=="all" && !byPitcher[pitchFilter.pitcher]) pitchFilter.pitcher="all";

    // 球種一覧
    var types={};
    pool.forEach(function(p){types[p.type]=(types[p.type]||0)+1;});
    var typeList=Object.keys(types).sort(function(a,b){return types[b]-types[a];});
    if(pitchFilter.type!=="all" && !types[pitchFilter.type]) pitchFilter.type="all";

    // フィルタ適用
    var ps=pool.filter(function(p){
      if(pitchFilter.pitcher!=="all" && p.pitcher!==pitchFilter.pitcher) return false;
      if(pitchFilter.type!=="all" && p.type!==pitchFilter.type) return false;
      return true;
    });

    // チームはタブで切り替える（1試合に2球団なので選びやすい）
    var h='<div class="stabs">';
    h+='<button class="stab'+(pitchFilter.team==="all"?" on":"")+'" '+
       'style="--sc:var(--accent)" onclick="setAnalysisTeam(\'all\')">両チーム</button>';
    [g.home, g.away].forEach(function(t){
      if(!t || !byTeam[t]) return;
      var col=tColor(t)||"var(--accent)";
      h+='<button class="stab'+(pitchFilter.team===t?" on":"")+'" style="--sc:'+col+'" '+
         'onclick="setAnalysisTeam(\''+esc(t)+'\')">'+teamBadge(t)+' '+esc(t)+
         ' <span class="sub2">'+byTeam[t]+'球</span></button>';
    });
    h+='</div>';

    h+='<div class="toolbar">'+
      '<span class="lb">投手</span><select id="fp" onchange="onAnalysisFilter()">'+
      '<option value="all">全投手</option>'+
      pitchers.map(function(n){
        var r=pool.length ? (function(){
          for(var i=0;i<pool.length;i++){ if(pool[i].pitcher===n) return pool[i].pitcherRole; }
          return null;
        })() : null;
        return '<option value="'+esc(n)+'"'+(pitchFilter.pitcher===n?" selected":"")+'>'+
               esc(n)+(r?'（'+r+'）':'')+' ('+byPitcher[n]+')</option>';
      }).join("")+
      '</select>'+
      '<span class="lb">球種</span><select id="ft" onchange="onAnalysisFilter()">'+
      '<option value="all">全球種</option>'+
      typeList.map(function(t){
        return '<option value="'+esc(t)+'"'+(pitchFilter.type===t?" selected":"")+'>'+
               esc(t)+'</option>';
      }).join("")+
      '</select></div>';

    // 選択中の投手の役割バッジ（先発・中継ぎ・抑え）
    if(pitchFilter.pitcher!=="all"){
      var curRole=null;
      for(var ri=0;ri<pool.length;ri++){
        if(pool[ri].pitcher===pitchFilter.pitcher){ curRole=pool[ri].pitcherRole; break; }
      }
      if(curRole){
        h+='<div style="margin:-4px 0 10px">'+esc(pitchFilter.pitcher)+' '+roleBadge(curRole)+'</div>';
      }
    }

    if(!ps.length) return h+'<div class="msg">該当する投球がありません</div>';

    // --- 球種割合 ---
    var tcount={};
    ps.forEach(function(p){tcount[p.type]=(tcount[p.type]||0)+1;});
    var tkeys=Object.keys(tcount).sort(function(a,b){return tcount[b]-tcount[a];});
    h+='<div class="card2"><h3>球種割合（'+ps.length+'球）</h3>';
    tkeys.forEach(function(t){
      var n=tcount[t], pct=Math.round(n/ps.length*1000)/10;
      // その球種の平均球速
      var sp=ps.filter(function(x){return x.type===t&&x.speed;});
      var avg=sp.length?Math.round(sp.reduce(function(s,x){return s+x.speed;},0)/sp.length):null;
      h+='<div class="bar-row"><div class="bar-lb">'+esc(t)+'</div>'+
         '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
         '<div class="bar-val">'+pct+'% <span class="sub2">'+n+'球'+
         (avg?' / 平均'+avg+'km/h':'')+'</span></div></div>';
    });
    h+='</div>';

    // --- 球速 ---
    var speeds=ps.filter(function(p){return p.speed;}).map(function(p){return p.speed;});
    if(speeds.length){
      var mx=Math.max.apply(null,speeds), mn=Math.min.apply(null,speeds);
      var av=Math.round(speeds.reduce(function(a,b){return a+b;},0)/speeds.length);
      h+='<div class="card2"><h3>球速</h3><div class="statrow">'+
        '<div class="stat"><div class="sv">'+mx+'</div><div class="sl">最速 km/h</div></div>'+
        '<div class="stat"><div class="sv">'+av+'</div><div class="sl">平均 km/h</div></div>'+
        '<div class="stat"><div class="sv">'+mn+'</div><div class="sl">最遅 km/h</div></div>'+
        '</div></div>';
    }

    // --- コースヒートマップ（5×5） ---
    h+='<div class="card2"><h3>コース分布（投手から見た位置）</h3>'+buildHeatmap(ps)+'</div>';

    // --- 結果別の投球 ---
    var kinds={strike:"ストライク系",ball:"ボール",hit:"安打",out:"凡打",bunt:"犠打"};
    var kc={};
    ps.forEach(function(p){if(p.kind) kc[p.kind]=(kc[p.kind]||0)+1;});
    var kk=Object.keys(kc);
    if(kk.length){
      h+='<div class="card2"><h3>投球結果の内訳</h3><div class="statrow">';
      kk.forEach(function(k){
        h+='<div class="stat"><div class="sv">'+kc[k]+'</div><div class="sl">'+(kinds[k]||k)+'</div></div>';
      });
      h+='</div></div>';
    }

    return h;
  }

  function setAnalysisTeam(t){
    if(pitchFilter.team===t) return;
    pitchFilter.team=t;
    // チームを変えたら投手と球種の選択はリセットする
    pitchFilter.pitcher="all";
    pitchFilter.type="all";
    document.getElementById("tabbody").innerHTML=renderAnalysis(curGame);
  }

  function onAnalysisFilter(){
    var fp=document.getElementById("fp"), ft=document.getElementById("ft");
    if(fp) pitchFilter.pitcher=fp.value;
    if(ft) pitchFilter.type=ft.value;
    document.getElementById("tabbody").innerHTML=renderAnalysis(curGame);
  }

  /* 5×5ヒートマップ */
  function buildHeatmap(ps){
    var grid={}, max=0;
    ps.forEach(function(p){
      var c=p.course;
      if(!c||c.grid_row==null||c.grid_col==null) return;
      var k=c.grid_row+"-"+c.grid_col;
      grid[k]=(grid[k]||0)+1;
      if(grid[k]>max) max=grid[k];
    });
    if(!max) return '<div class="sub">コースデータがありません</div>';

    var h='<div class="heat">';
    for(var r=0;r<5;r++){
      for(var c=0;c<5;c++){
        var n=grid[r+"-"+c]||0;
        var ratio=max?n/max:0;
        // ストライクゾーン（中央3x3）に枠
        var inZone=(r>=1&&r<=3&&c>=1&&c<=3);
        h+='<div class="hcell'+(inZone?' zone':'')+'" '+
           'style="background:rgba(232,89,12,'+(ratio*0.85).toFixed(2)+')" '+
           'title="'+n+'球">'+(n||"")+'</div>';
      }
    }
    h+='</div><div class="heat-lg"><span>少</span>'+
       '<span class="hgrad"></span><span>多</span>'+
       '<span style="margin-left:auto">枠内＝ストライクゾーン</span></div>';
    return h;
  }

  function toggleAll(open){
    var l=document.querySelectorAll(".inn"),i;
    for(i=0;i<l.length;i++){
      if(open) l[i].classList.add("open"); else l[i].classList.remove("open");
    }
  }
  function fmtDate(t){
    var y=t.getFullYear();
    var m=("0"+(t.getMonth()+1)).slice(-2);
    var d=("0"+t.getDate()).slice(-2);
    return y+"-"+m+"-"+d;
  }
  function shift(n){
    var t=new Date(dp.value+"T00:00:00");
    t.setDate(t.getDate()+n);
    dp.value=fmtDate(t);
    loadDay();
  }
  function today(){dp.value=todayJST();loadDay();}
  dp.addEventListener("change",loadDay);
  // 初期表示はダッシュボード
  dp.value=todayJST();
  setView("dash");
</script>
</body>
</html>
