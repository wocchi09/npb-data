    color:var(--muted);font-size:14px;line-height:2;}
  .foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.9;
    border-top:2px solid var(--line);padding-top:12px;}

  /* ---- 共通モーション ---- */
  :root{--motion-ease:cubic-bezier(.22,1,.36,1);}
  .hero{position:relative;overflow:hidden;background-size:180% 180%;
    animation:heroGradient 14s ease-in-out infinite;}
  .hero::after{content:"";position:absolute;inset:-80% -20%;pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);
    transform:translateX(-55%) rotate(8deg);animation:heroSweep 8s ease-in-out infinite;}
  .hero-in{position:relative;z-index:1;}
  .btn,.tab,.stab,.vbtn,.ttab,.theme-btn,.navitem{
    transition:transform .18s var(--motion-ease),background-color .18s,color .18s,
      border-color .18s,box-shadow .18s;}
  .btn:hover,.tab:hover,.stab:hover,.vbtn:hover,.ttab:hover,.theme-btn:hover{
    transform:translateY(-1px);}
  .btn:active,.tab:active,.stab:active,.vbtn:active,.ttab:active,.theme-btn:active{
    transform:translateY(1px) scale(.98);}
  .game,.dgame,.rankcard,.card2,.corr-panel,.glossitem{
    transition:transform .22s var(--motion-ease),box-shadow .22s,border-color .22s;}
  @media(hover:hover){
    .dgame:hover,.rankcard:hover,.card2:hover,.corr-panel:hover,.glossitem:hover{
      transform:translateY(-2px);box-shadow:0 8px 22px rgba(120,70,20,.11);}
  }
  .motion-enter{animation:viewEnter .34s var(--motion-ease) both;}
  .motion-rise{animation:itemRise .44s var(--motion-ease) both;
    animation-delay:calc(var(--motion-order,0) * 38ms);}
  .motion-enter .gscore .w,.motion-enter .mvpscore{animation:scorePop .52s var(--motion-ease) both;}
  .motion-enter .bar-fill{transform-origin:left center;animation:barGrow .7s var(--motion-ease) both;}
  .motion-enter .saber-bar-svg .bar{transform-box:fill-box;transform-origin:left center;
    animation:barGrow .7s var(--motion-ease) both;}
  .motion-enter .saber-radar .shape{transform-box:fill-box;transform-origin:center;
    animation:radarBloom .75s var(--motion-ease) both;}
  .motion-enter .corr-svg .trend{stroke-dasharray:1600;stroke-dashoffset:1600;
    animation:lineDraw .95s var(--motion-ease) forwards;}
  .motion-enter .corr-svg .point{transform-box:fill-box;transform-origin:center;
    animation:pointPop .42s var(--motion-ease) both;}
  .mvpcard{position:relative;overflow:hidden;isolation:isolate;}
  .mvpcard>*{position:relative;z-index:1;}
  .mvpcard::after{content:"";position:absolute;z-index:0;inset:-45%;pointer-events:none;
    background:linear-gradient(110deg,transparent 43%,rgba(255,201,60,.22) 50%,transparent 57%);
    transform:translateX(-70%) rotate(8deg);animation:mvpShine 1.2s .28s var(--motion-ease) both;}
  @keyframes viewEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes itemRise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes scorePop{0%{opacity:.35;transform:scale(.9)}65%{transform:scale(1.035)}100%{opacity:1;transform:none}}
  @keyframes barGrow{from{transform:scaleX(0);opacity:.35}to{transform:scaleX(1);opacity:1}}
  @keyframes radarBloom{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:scale(1)}}
  @keyframes lineDraw{to{stroke-dashoffset:0}}
  @keyframes pointPop{from{opacity:0;transform:scale(.3)}to{opacity:.78;transform:scale(1)}}
  @keyframes mvpShine{from{transform:translateX(-70%) rotate(8deg)}to{transform:translateX(70%) rotate(8deg)}}
  @keyframes heroGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes heroSweep{0%,55%{transform:translateX(-55%) rotate(8deg)}80%,100%{transform:translateX(55%) rotate(8deg)}}
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto!important;}
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }
  @media(max-width:560px){
    .games{grid-template-columns:1fr;}
    .ab-h{grid-template-columns:1fr;}
    .situ{margin-top:6px;}
    .pt{grid-template-columns:24px 1fr;}
    .pt-r{grid-column:2;text-align:left;padding-top:2px;}
  }

  /* ---- 出場選手登録・抹消公示 ---- */
  .roster-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0;}
  .roster-kpi{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:11px;text-align:center;}
  .roster-kpi b{display:block;color:var(--accent);font-size:20px;line-height:1.15;}
  .roster-kpi span{display:block;color:var(--muted);font-size:10px;margin-top:4px;}
  .roster-datebar{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .roster-datebar label{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--muted);}
  .roster-datebar input,.roster-datebar select{min-height:34px;}
  .roster-datebar input[type=date]{flex:none;width:170px;min-width:0;}
  .roster-events{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .roster-event{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px;}
  .roster-event h3{font-size:12px;margin:0 0 7px;display:flex;align-items:center;gap:6px;}
  .roster-event-list{display:flex;flex-direction:column;gap:5px;}

    border-radius:999px;padding:2px 7px;font-size:9px;font-weight:700;}

  .roster-status.off{background:var(--panel2);color:var(--muted);border:1px solid var(--line);}

  .player-bio-item span{display:block;color:var(--muted);font-size:9px;margin-bottom:4px;}
  .player-bio-item b{display:block;font-size:12px;line-height:1.55;overflow-wrap:anywhere;}
  .career-stats{margin-top:10px;}
  .career-stats .stbl th,.career-stats .stbl td{white-space:nowrap;text-align:center;}
  .yearly-stats{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;}
  .yearly-stats summary{cursor:pointer;padding:10px 12px;background:var(--panel2);font-size:12px;font-weight:800;color:var(--ink);}
  .yearly-stats summary::marker{color:var(--accent);}
  .yearly-stats .tblwrap{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;margin:0;}
  .yearly-stats .stbl{margin:0;min-width:max-content;}
  .yearly-stats .stbl th,.yearly-stats .stbl td{white-space:nowrap;text-align:center;}
  .yearly-stats .stbl th:nth-child(1),.yearly-stats .stbl td:nth-child(1){font-weight:800;}
  .yearly-stats .stbl th:nth-child(2),.yearly-stats .stbl td:nth-child(2){text-align:left;}
  .yearly-total td{background:color-mix(in srgb,var(--accent) 9%,var(--panel));font-weight:800;border-top:2px solid var(--accent)!important;}
  .career-empty{padding:10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px;}
  .profile-source{margin-top:8px;font-size:10px;color:var(--muted);}
  @media(max-width:680px){
    .roster-kpis{grid-template-columns:1fr 1fr;}
    .roster-events{grid-template-columns:1fr;}
    .roster-datebar .btn{flex:1;}
    #rosterView .dash-h{flex-wrap:wrap;align-items:center;}
    #rosterView .dash-date{width:100%;margin-left:16px;text-align:left;}
    .player-bio-grid{grid-template-columns:1fr 1fr;}
  }

  /* ---- Typography: 日本語と小さい成績表の可読性を優先 ---- */
  body *,button,input,select,textarea,svg text{
    font-family:var(--font-ui)!important;
  }
  body,button,input,select,textarea{
    text-rendering:optimizeLegibility;
    font-kerning:normal;
  }
  table,.no,.cnt,.pt-s,.dg-score,.rankrow,.zcell,.mvpscore,.tile,.stat,
  .matchup-kpi,.pg-kpi,.saber-kpi-value{
    font-variant-numeric:tabular-nums lining-nums;
  }

    font-family:var(--font-brand)!important;

  table.stbl th{
    font-weight:600;
  }
  table.stbl td{
    font-weight:500;
  }

    font-weight:700;
  }
</style>

<script>
  var dp=document.getElementById("dp"),
      gamesEl=document.getElementById("games"),
      detailEl=document.getElementById("detail"),
      curGame=null;

  function applyTheme(t){
    if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    document.getElementById("tb").textContent=(t==="dark")?"☀":"☾";
    try{localStorage.setItem("npbTheme",t);}catch(e){}
  }
  function toggleTheme(){
    var c=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
    applyTheme(c==="dark"?"light":"dark");
  }
  (function(){var t="light";try{t=localStorage.getItem("npbTheme")||"light";}catch(e){}applyTheme(t);})();

  function todayJST(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
  function sumPath(d){var p=d.split("-");return "data/"+p[0]+"/"+p[1]+"/"+p[2]+"/_summary.json";}
  function gamePath(d,g){var p=d.split("-");return "data/"+p[0]+"/"+p[1]+"/"+p[2]+"/"+g+".json";}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

  /* ===== 12球団のメタ情報（略称・リーグ・チームカラー） ===== */
  var TEAM_META={
    "巨人":       {mini:"巨", league:"セ", color:"#FF6600"},
    "阪神":       {mini:"神", league:"セ", color:"#FFE100"},
    "ヤクルト":   {mini:"ヤ", league:"セ", color:"#021C3A"},
    "DeNA":       {mini:"De", league:"セ", color:"#0052CD"},
    "広島":       {mini:"広", league:"セ", color:"#FF0000"},
    "中日":       {mini:"中", league:"セ", color:"#003595"},
    "ソフトバンク":{mini:"ソ", league:"パ", color:"#FFCC00"},
    "日本ハム":   {mini:"日", league:"パ", color:"#002B5C"},
    "ロッテ":     {mini:"ロ", league:"パ", color:"#000000"},
    "楽天":       {mini:"楽", league:"パ", color:"#8B0000"},
    "オリックス": {mini:"オ", league:"パ", color:"#000020"},
    "西武":       {mini:"西", league:"パ", color:"#002D62"}
  };
  var LEAGUE_COLOR={"セ":"#009E52","パ":"#0095D9"};
  var LEAGUE_NAME={"セ":"セントラル・リーグ","パ":"パシフィック・リーグ"};

  /* 球団タブの並び順（指定順） */
  var TEAM_ORDER_PA=["ソフトバンク","日本ハム","オリックス","楽天","西武","ロッテ"];
  var TEAM_ORDER_SE=["阪神","DeNA","巨人","中日","広島","ヤクルト"];
  var TEAM_HASHTAGS={
    "ソフトバンク":"#sbhawks","日本ハム":"#lovefighters","オリックス":"#bs2026",
    "楽天":"#rakuteneagles","西武":"#seibulions","ロッテ":"#chibalotte",
    "阪神":"#tigers","DeNA":"#baystars","巨人":"#giants","中日":"#dragons",
    "広島":"#carp","ヤクルト":"#swallows"
  };
  var PERSONAL_POSTING_KEY="npbPersonalPosting";
  var SOCIAL_TEMPLATE_KEY="npbPostingTemplate";
  var SOCIAL_HISTORY_KEY="npbPostingHistory";

  function tMeta(t){return TEAM_META[t]||null;}
  function tMini(t){var m=tMeta(t);return m?m.mini:(t||"");}
  function tLeague(t){var m=tMeta(t);return m?m.league:null;}
  function tColor(t){var m=tMeta(t);return m?m.color:null;}

  /* ?share=1 を一度開いた端末だけ、個人用の投稿機能を表示する。 */
  function personalPostingEnabled(){
    try{return localStorage.getItem(PERSONAL_POSTING_KEY)==="1";}catch(e){return false;}
  }
  function initPersonalPostingMode(){
    try{
      var params=new URLSearchParams(location.search);
      if(params.get("share")==="1") localStorage.setItem(PERSONAL_POSTING_KEY,"1");
    }catch(e){}
    var enabled=personalPostingEnabled(),button=document.getElementById("vb-social");
    if(button) button.style.display=enabled?"":"none";
    return enabled;
  }
  function disablePersonalPosting(){
    try{localStorage.removeItem(PERSONAL_POSTING_KEY);}catch(e){}
    var button=document.getElementById("vb-social");if(button)button.style.display="none";
    setView("dash");
  }

  /* 背景色の明るさから文字色を決める（黄色系は黒字、濃色は白字） */
  function lumOf(hex){
    if(!hex||hex.charAt(0)!=="#") return 0.5;
    var h=hex.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return (0.299*r+0.587*g+0.114*b)/255;
  }
  function tTextColor(t){
    var c=tColor(t);
    return (c && lumOf(c)>0.62) ? "#1a1a1a" : "#fff";
  }

  /* チーム略称バッジ（チームカラー付き） */
  function teamBadge(team){
    var m=tMeta(team);
    if(!m) return "";
    return '<span class="tmini" style="background:'+m.color+';color:'+tTextColor(team)+'">'
      +esc(m.mini)+'</span>';
  }
  /* 選手名＋（略称） */
  function withTeam(name, team){
    if(!name) return "";
    var b=teamBadge(team);
    return esc(name)+(b?" "+b:"");
  }
  /* 得点差から責任投手の所属チームを判定する */
  function pitcherTeam(g, kind){
    var res=g.result||{};
    var hs=res.home_score, as_=res.away_score;
    if(hs==null||as_==null) return null;
    var winTeam = hs>as_ ? g.home : (as_>hs ? g.away : null);
    var loseTeam = hs>as_ ? g.away : (as_>hs ? g.home : null);
    if(kind==="lose") return loseTeam;
    return winTeam;   // 勝利・セーブは勝ったチーム
  }
  /* 本塁打の打者がどちらのチームかを出場成績から探す（姓の一致で判定） */
  function batterTeam(g, name){
    var box=g.boxscore;
    if(!box||!box.batting||!name) return null;
    var target=String(name).replace(/\s|　/g,"");
    var sides=[["away",g.away],["home",g.home]];
    for(var i=0;i<sides.length;i++){
      var rows=box.batting[sides[i][0]]||[];
      for(var j=0;j<rows.length;j++){
        var full=String(rows[j].name||"").replace(/\s|　/g,"");
        if(full===target || full.indexOf(target)===0) return sides[i][1];
      }
    }
    return null;
  }
  /* 本塁打を打った選手の所属を判定する。
     detail の「3回裏3ラン」から、表＝ビジター・裏＝ホームで確実に分かる。
     detail が取れない場合だけ、出場成績の名簿と照合する。 */
  function hrTeam(g, hr){
    var d=(hr && hr.detail) || "";
    if(d.indexOf("表")>=0) return g.away;
    if(d.indexOf("裏")>=0) return g.home;
    return batterTeam(g, hr && hr.batter);
  }

  function rcls(r){
    if(!r) return "";
    if(/本塁打|安打|塁打|適時|四球|死球|安$|本$|２$|2$/.test(r)) return "hit";
    if(/三振|ゴロ|フライ|併殺|邪飛|直|飛$|犠/.test(r)) return "out";
    return "";
  }

  /* スコアボード（H/E付き・イニングセルはタップでジャンプ） */
  function buildBoard(g){
    var maxInn=1,i,away={},home={};
    var hitA=0,hitH=0,errA=0,errH=0;
    (g.atbats||[]).forEach(function(ab){
      if(ab.inning>maxInn) maxInn=ab.inning;
      var rs=ab.result_summary||"";
      var m=/＋(\d+)点/.exec(rs);
      var pts=m?parseInt(m[1],10):0;
      var isTop=(ab.top_bottom==="表");
      var t=isTop?away:home;
      t[ab.inning]=(t[ab.inning]||0)+pts;
      // H: 攻撃側の安打（安打・2塁打・3塁打・本塁打）
      if(/安打|２塁打|２塁打|2塁打|二塁打|三塁打|3塁打|塁打|本塁打/.test(rs)&&!/併殺/.test(rs)){
        if(isTop) hitA++; else hitH++;
      }
      // E: 守備側のエラー
      if(/エラー/.test(rs)){
        if(isTop) errH++; else errA++;
      }
    });
    if(maxInn<9) maxInn=9;
    var ta=0,th=0;
    for(i=1;i<=maxInn;i++){ta+=(away[i]||0);th+=(home[i]||0);}
    // 公式スコアがあれば計欄はそちらを使う
    var offA=null,offH=null,official=false;
    if(g.final_score&&g.final_score.length){
      g.final_score.forEach(function(s){
        if(s.team===g.away) offA=s.score;
        if(s.team===g.home) offH=s.score;
      });
      if(offA!=null&&offH!=null){ta=offA;th=offH;official=true;}
    }
    var h='<div class="board"><table class="sb"><thead><tr><th class="team"></th>';
    for(i=1;i<=maxInn;i++) h+='<th>'+i+'</th>';
    h+='<th>計</th><th>安</th><th>失</th></tr></thead><tbody>';
    [[g.away,away,ta,hitA,errA,"表"],[g.home,home,th,hitH,errH,"裏"]].forEach(function(row){
      h+='<tr><td class="team">'+esc(row[0]||"-")+'</td>';
      for(i=1;i<=maxInn;i++){
        var v=row[1][i];
        h+='<td class="cell" onclick="jumpInn('+i+',\''+row[5]+'\')" '+
           'style="cursor:pointer">'+(v==null?"-":v)+'</td>';
      }
      var win=(row[2]===Math.max(ta,th)&&ta!==th);
      h+='<td class="total'+(win?" win":"")+'">'+row[2]+'</td>'+
         '<td>'+row[3]+'</td><td>'+row[4]+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div style="font-size:11px;color:var(--muted);margin-top:6px;">'+
       (official?'※ 合計は公式スコア／イニング別・安・失は打席結果からの推定値':'※ 得点・安打・失策は打席結果からの推定値')+
       '／数字をタップするとそのイニングに移動します</div>';
    return h;
  }

  /* イニングへジャンプ（閉じてたら開く） */
  function jumpInn(inning,tb){
    var el=document.getElementById("inn-"+inning+"-"+tb);
    if(!el) return;
    el.classList.add("open");
    el.scrollIntoView({behavior:"smooth",block:"start"});
  }

  /* ダイヤモンド＋カウント（B緑・S黄・O赤）本塁なし */
  function buildSitu(ab){
    var r=ab.runners||{},c=ab.count||{};
    var h='<div class="situ"><div class="dia">'+
      '<div class="bs b2'+(r.second?" on":"")+'"></div>'+
      '<div class="bs b3'+(r.third?" on":"")+'"></div>'+
      '<div class="bs b1'+(r.first?" on":"")+'"></div>'+
      '</div><div class="cnt">';
    var rows=[["B",c.ball||0,3,"b"],["S",c.strike||0,2,"s"],["O",c.out||0,2,"o"]];
    rows.forEach(function(x){
      h+='<div class="row"><span class="k">'+x[0]+'</span>';
      for(var i=0;i<x[2];i++){
        h+='<span class="dotc '+(i<x[1]?x[3]:"")+'"></span>';
      }
      h+='</div>';
    });
    h+='</div></div>';
    return h;
  }

  /* ---- 走者名の推定エンジン ----
     打席の流れをシミュレートして「誰が塁にいるか」を推定する。
     各打席の塁コード(b110等)は公式値なので、毎打席それと答え合わせし、
     矛盾したら名前を「?」に落とす（塁の有無自体は常に公式値が正）。 */
  function inferRunnerNames(atbats){
    var bases={1:null,2:null,3:null}; // 各塁の走者名
    var curKey=null;
    atbats.forEach(function(ab){
      var key=ab.inning+"-"+ab.top_bottom;
      if(key!==curKey){ // イニングが変わったらリセット
        bases={1:null,2:null,3:null};
        curKey=key;
      }
      var r=ab.runners||{};
      // 公式の塁コードと答え合わせ
      var occ={1:!!r.first,2:!!r.second,3:!!r.third};
      for(var b=1;b<=3;b++){
        if(occ[b]&&!bases[b]) bases[b]="?";      // いるはずなのに名前不明
        if(!occ[b]) bases[b]=null;               // いないなら消す
      }
      // この打席の表示用にコピー
      ab._runnerNames={1:bases[1],2:bases[2],3:bases[3]};

      // 打席結果を反映して次の状態を作る
      var rs=ab.result_summary||"";
      var name=(ab.batter&&ab.batter.name)?ab.batter.name.split(/\s+/)[0]:null;
      function advanceAll(n){
        for(var i=3;i>=1;i--){
          if(bases[i]){
            var to=i+n;
            if(to<=3) bases[to]=bases[i];
            bases[i]=null;
          }
        }
      }
      if(/本塁打/.test(rs)){
        bases={1:null,2:null,3:null};
      }else if(/三塁打|3塁打|３塁打/.test(rs)){
        advanceAll(3); bases[3]=name;
      }else if(/二塁打|2塁打|２塁打/.test(rs)){
        advanceAll(2); bases[2]=name;
      }else if(/安打/.test(rs)&&!/併殺/.test(rs)){
        advanceAll(1); bases[1]=name;
      }else if(/四球|死球/.test(rs)){
        // 押し出し進塁（詰まっている塁だけ進む）
        if(bases[1]){
          if(bases[2]){
            if(bases[3]){/* 満塁: 三塁走者は生還扱い */ bases[3]=null;}
            bases[3]=bases[2];
          }
          bases[2]=bases[1];
        }
        bases[1]=name;
      }else if(/エラー/.test(rs)){
        advanceAll(1); bases[1]=name;
      }else if(/犠打|犠飛/.test(rs)){
        advanceAll(1);
      }else if(/併殺/.test(rs)){
        bases[1]=null; // 一塁走者アウト（代表的パターン）
      }
      // ゴロ・フライ・三振は走者そのまま
    });
  }

  /* ---- 配球チャート（ストライクゾーンに投球位置をプロット） ----
     コース座標は 0〜63px の範囲に分布。実データの検証から、
     ストライクゾーンは概ね top:10-58 / left:5-50 の内側。 */
  var CH={size:63, zTop:10, zBottom:58, zLeft:5, zRight:50};

  function buildChart(ab){
    var ps=(ab.pitches||[]).filter(function(p){
      return p.course&&p.course.top_px!=null&&p.course.left_px!=null;
    });
    if(!ps.length) return "";

    var V=100; // viewBox基準
    function sx(px){return px/CH.size*V;}
    // ゾーン枠の位置
    var zx=sx(CH.zLeft), zy=sx(CH.zTop),
        zw=sx(CH.zRight)-sx(CH.zLeft), zh=sx(CH.zBottom)-sx(CH.zTop);

    var s='<div class="chartbox"><svg class="chartsvg" viewBox="-8 -8 116 116">';
    // 外枠（ボールゾーン）
    s+='<rect x="-6" y="-6" width="112" height="112" rx="4" fill="var(--panel2)" stroke="var(--line)" stroke-width="1"/>';
    // ストライクゾーン
    s+='<rect x="'+zx+'" y="'+zy+'" width="'+zw+'" height="'+zh+'" fill="var(--zone)" stroke="var(--accent)" stroke-width="1.6"/>';
    // 3x3の区切り線
    for(var i=1;i<3;i++){
      s+='<line x1="'+(zx+zw*i/3)+'" y1="'+zy+'" x2="'+(zx+zw*i/3)+'" y2="'+(zy+zh)+'" stroke="var(--accent)" stroke-width=".5" opacity=".45"/>';
      s+='<line x1="'+zx+'" y1="'+(zy+zh*i/3)+'" x2="'+(zx+zw)+'" y2="'+(zy+zh*i/3)+'" stroke="var(--accent)" stroke-width=".5" opacity=".45"/>';
    }
    // 投球をプロット
    ps.forEach(function(p){
      var cx=sx(p.course.left_px), cy=sx(p.course.top_px);
      var fill="var(--panel)",stroke="var(--muted)",tc="var(--ink)";
      if(p.kind==="ball"){fill="#40C057";stroke="#2B8A3E";tc="#fff";}
      else if(p.kind==="strike"){fill="#FAB005";stroke="#E67700";tc="#3D2510";}
      else if(p.kind==="hit"){fill="var(--accent)";stroke="var(--accent)";tc="#fff";}
      else if(p.kind==="out"){fill="#1C7ED6";stroke="#1864AB";tc="#fff";}
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="7.5" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.4"/>';
      s+='<text x="'+cx+'" y="'+(cy+2.9)+'" text-anchor="middle" font-size="8.5" '+
         'font-family="Roboto Mono,monospace" font-weight="700" fill="'+tc+'">'+(p.no||"")+'</text>';
    });
    s+='</svg>';
    // 凡例
    s+='<div class="charttxt"><div class="charttitle">配球チャート</div>'+
       '<div class="lg"><span class="lgd" style="background:#FAB005"></span>ストライク</div>'+
       '<div class="lg"><span class="lgd" style="background:#40C057"></span>ボール</div>'+
       '<div class="lg"><span class="lgd" style="background:var(--accent)"></span>安打</div>'+
       '<div class="lg"><span class="lgd" style="background:#1C7ED6"></span>凡打</div>'+
       '<div class="chartnote">投手から見た位置</div></div>';
    s+='</div>';
    return s;
  }

  /* 打球方向フィールド図 */
  function buildField(ab){
    var d=ab.hit_direction||{};
    if(!d.dir) return "";
    var x=d.x,y=d.y;
    // SVG座標に変換（viewBox 0 0 100 84、ホームは(50,76)）
    var hx=50,hy=76;
    var s='<div class="fieldbox"><svg class="fieldsvg" viewBox="0 0 100 84">'+
      '<path d="M50 78 L4 32 A62 62 0 0 1 96 32 Z" fill="var(--field)" opacity=".5"/>'+
      '<path d="M50 78 L26 54 A34 34 0 0 1 74 54 Z" fill="var(--dirt)" opacity=".55"/>'+
      '<polygon points="50,74 62,62 50,50 38,62" fill="none" stroke="var(--field2)" stroke-width="1.6"/>'+
      '<line x1="'+hx+'" y1="'+hy+'" x2="'+x+'" y2="'+y+'" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>'+
      '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="var(--accent)"/>'+
      '<circle cx="'+hx+'" cy="'+hy+'" r="2.6" fill="var(--ink)"/>'+
      '</svg><div class="fieldtxt">打球方向<br><b>'+esc(d.dir_name||"")+'</b>方向<br>'+
      '<span style="font-size:11px;color:var(--muted)">'+esc(ab.result_summary||"")+'</span></div></div>';
    return s;
  }

  async function loadDay(){
    var d=dp.value;
    gamesEl.innerHTML='<div class="msg">読み込み中…</div>';
    detailEl.innerHTML="";curGame=null;
    try{
      var r=await fetch(sumPath(d)+"?t="+Date.now());
      if(!r.ok) throw 0;
      var s=await r.json();
      if(!s.games||!s.games.length) throw 0;
      gamesEl.innerHTML="";
      s.games.forEach(function(g){
        var el=document.createElement("div");
        el.className="game";
        var res=g.result||{};
        var h='';
        // スコア行（略称＋得点）
        if(res.home_score!=null&&res.away_score!=null){
          var hw=res.home_score>res.away_score, aw=res.away_score>res.home_score;
          h+='<div class="gscore">'+
            '<span class="'+(hw?"w":"")+'">'+esc(res.home_mini||res.home||"")+' '+res.home_score+'</span>'+
            '<span class="dash">-</span>'+
            '<span class="'+(aw?"w":"")+'">'+res.away_score+' '+esc(res.away_mini||res.away||"")+'</span>'+
            (res.state?'<span class="gstate">'+esc(res.state)+'</span>':'')+
            '</div>';
        }else{
          h+='<div class="gcard">'+esc(g.card||("GAME "+g.game_id))+'</div>';
        }
        // 責任投手
        var pit=[];
        if(res.win_pitcher) pit.push('<b>勝</b> '+withTeam(res.win_pitcher,pitcherTeam(g,"win")));
        if(res.lose_pitcher) pit.push('<b>敗</b> '+withTeam(res.lose_pitcher,pitcherTeam(g,"lose")));
        if(res.save_pitcher) pit.push('<b>S</b> '+withTeam(res.save_pitcher,pitcherTeam(g,"save")));
        if(pit.length) h+='<div class="gpit">'+pit.join('　')+'</div>';
        // 本塁打（打った回の表・裏から所属を判定）
        if(res.homeruns&&res.homeruns.length){
          var hr=res.homeruns.map(function(x){
            return withTeam(x.batter, hrTeam(g,x))+(x.number?" "+x.number+"号":"");
          }).join('、');
          h+='<div class="ghr">本塁打 '+hr+'</div>';
        }
        h+='<div class="gmeta">'+g.atbat_count+' 打席 ／ '+g.pitch_count+' 球'+
             (g.stadium?' ／ '+esc(g.stadium):'')+
             (g.game_type && g.game_type!=="公式戦" && g.game_type!=="交流戦"
               ? ' <span class="subtag">'+esc(g.game_type)+'</span>' : '')+'</div>';
        el.innerHTML=h;
        el.onclick=function(){loadGame(d,g.game_id,el);};
        gamesEl.appendChild(el);
      });
    }catch(e){
      gamesEl.innerHTML='<div class="msg">この日のデータはまだありません<br>'+
        '<span style="font-size:12px;">Actions の Run workflow で収集できます</span></div>';
    }
  }

  async function loadGame(d,gid,el){
    var l=document.querySelectorAll(".game"),i;
    for(i=0;i<l.length;i++) l[i].classList.remove("on");
    if(el) el.classList.add("on");
    detailEl.innerHTML='<div class="msg">読み込み中…</div>';
    try{
      var r=await fetch(gamePath(d,gid)+"?t="+Date.now());
      curGame=await r.json();
      inferRunnerNames(curGame.atbats||[]);
      curTab="summary";
      pitchFilter={team:"all", pitcher:"all", type:"all"};
      render();
      detailEl.scrollIntoView({behavior:"smooth",block:"start"});
    }catch(e){
      detailEl.innerHTML='<div class="msg">読み込みに失敗しました</div>';
    }
  }

  /* ===== タブ制御 ===== */
  var curTab = "summary";

  function setTab(t){
    curTab = t;
    render();
  }

  function render(){
    var g=curGame;if(!g) return;
    var tabs=[["summary","概要"],["story","試合ストーリー"],["lineup","スタメン"],["batting","打撃"],["pitching","投手"],
              ["analysis","配球"],["pitches","全打席"]];
    var h='<div class="tabs">';
    tabs.forEach(function(t){
      h+='<button class="tab'+(curTab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
    });
    h+='</div><div id="tabbody"></div>';
    detailEl.innerHTML=h;

    var body=document.getElementById("tabbody");
    if(curTab==="summary") body.innerHTML=renderSummary(g);
    else if(curTab==="story") body.innerHTML=renderGameStory(g);
    else if(curTab==="lineup") body.innerHTML=renderLineup(g);
    else if(curTab==="batting") body.innerHTML=renderBatting(g);
    else if(curTab==="pitching") body.innerHTML=renderPitching(g);
    else if(curTab==="analysis") body.innerHTML=renderAnalysis(g);
    else renderPitches();
  }

  /* ===== 概要タブ ===== */
  function renderSummary(g){
    var h=buildBoard(g);
    var res=g.result||{};

    // 開催情報
    var info=[];
    if(g.stadium) info.push(["球場", g.stadium]);
    if(g.home) info.push(["主催", g.home]);
    if(res.state) info.push(["状態", res.state]);
    if(info.length){
      h+='<div class="card2"><h3>開催情報</h3>';
      info.forEach(function(x){
        h+='<div class="kv"><span class="k">'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';
      });
      h+='</div>';
    }
    // 責任投手（所属チームは得点差から判定）
    var pit=[];
    if(res.win_pitcher) pit.push('<div class="kv"><span class="k">勝利投手</span><b>'+withTeam(res.win_pitcher,pitcherTeam(g,"win"))+'</b></div>');
    if(res.lose_pitcher) pit.push('<div class="kv"><span class="k">敗戦投手</span><b>'+withTeam(res.lose_pitcher,pitcherTeam(g,"lose"))+'</b></div>');
    if(res.save_pitcher) pit.push('<div class="kv"><span class="k">セーブ</span><b>'+withTeam(res.save_pitcher,pitcherTeam(g,"save"))+'</b></div>');
    if(pit.length) h+='<div class="card2"><h3>責任投手</h3>'+pit.join("")+'</div>';

    // 本塁打（打者の所属は出場成績から照合）
    if(res.homeruns&&res.homeruns.length){
      var hr=res.homeruns.map(function(x){
        return '<div class="kv"><span class="k">'+withTeam(x.batter,hrTeam(g,x))+'</span><b>'+
          (x.number?x.number+"号":"")+'</b> <span class="sub">'+esc(x.detail||"")+'</span></div>';
      }).join("");
      h+='<div class="card2"><h3>本塁打</h3>'+hr+'</div>';
    }

    // バッテリー。新規データは両チーム分を保持し、旧データで欠ける側は
    // 投手成績と捕手の出場記録から補完する。
    function inferBattery(side){
      var box=g.boxscore||{}, pitching=(box.pitching&&box.pitching[side])||[];
      var batting=(box.batting&&box.batting[side])||[];
      var pitchers=[], catchers=[];
      pitching.forEach(function(x){
        if(x.name&&pitchers.indexOf(x.name)<0) pitchers.push(x.name);
      });
      batting.forEach(function(x){
        if(x.name&&String(x.position||"").indexOf("捕")>=0&&catchers.indexOf(x.name)<0){
          catchers.push(x.name);
        }
      });
      if(!pitchers.length&&!catchers.length) return "";
      return pitchers.join("、")+(pitchers.length&&catchers.length?" - ":"")+catchers.join("、");
    }
    var battery=res.battery||{};
    var batteryRows=[
      {side:"away",team:g.away,text:battery.away||inferBattery("away")},
      {side:"home",team:g.home,text:battery.home||battery.text||inferBattery("home")}
    ].filter(function(x){return x.text;});
    if(batteryRows.length){
      h+='<div class="card2"><h3>バッテリー</h3>'+
        batteryRows.map(function(x){
          return '<div class="kv"><span class="k">'+teamBadge(x.team)+' '+esc(x.team||x.side)+'</span>'+
            '<b>'+esc(x.text)+'</b></div>';
        }).join("")+'</div>';
    }
    return h;
  }

  function storyTypeClass(type){
    if(type==="逆転")return " comeback";
    if(type==="同点")return " tie";
    return "";
  }
  function renderGameStory(g){
    var story=buildGameStory(g),turn=story.turning_point;
    var h='<div class="story-hero"><div class="story-kicker">GAME STORY</div>'+
      '<h2 class="story-headline">'+esc(story.headline)+'</h2>'+ teamBadge(story.final.away)+' '+esc(story.final.away)+' '+story.final.away_score+
      ' － '+story.final.home_score+' '+teamBadge(story.final.home)+' '+esc(story.final.home)+
      '<p class="story-summary">'+esc(story.summary||"得点記録を時系列で振り返ります。")+'</p>'+
      '<div class="story-kpis"><div class="story-kpi"><span>得点イベント</span><b>'+story.events.length+'</b></div>'+

      '<div class="story-kpi"><span>逆転・勝ち越し</span><b>'+story.lead_changes+'</b></div></div></div>';
    if(turn){
      h+='<div class="story-turning"><small>TURNING POINT（得点状況による参考判定）</small><b>'+esc(turn.label)+' '+esc(turn.batter)+'　'+esc(turn.result)+'</b>'+
        '<div class="story-detail">'+esc(turn.score)+'</div></div>';
    }
    if(story.pitching_changes.length){
      h+='<div class="story-bullpen"><b class="story-detail">継投</b>'+story.pitching_changes.map(function(change){

        (event.detail?'<div class="story-detail">対 '+esc(event.pitcher)+' ／ '+esc(event.detail)+'</div>':'')+'</div>';
    });
    return h+'</div><div class="sub" style="font-size:10.5px">試合ストーリーは収集済み打席のスコア推移から自動生成しています。TURNING POINTは公式WPAではなく、回・点差・同点／逆転を用いた参考判定です。</div>';
  }

  /* ===== データ収集の起動（GitHub Actions） =====
     公開ページなので、アクセストークンはHTMLに一切書かない。
     トークンは利用者のブラウザ（localStorage）にだけ保存し、
     設定していない場合はGitHubの実行画面を開くだけにする。 */
  var GH_TOKEN_KEY = "npbGhToken";

  function ghRepo(){
    // 公開URLから owner/repo を推定する（例: wocchi09.github.io/npb-data/）
    // GitHub Pages 以外（ローカル確認など）では既定値を使う
    var owner=null, repo=null;
    var m=String(location.hostname||"").match(/^([^.]+)\.github\.io$/);
    if(m){
      owner=m[1];
      var seg=String(location.pathname||"").split("/").filter(Boolean);
      // 末尾がファイル名の場合があるので、拡張子付きの要素は除く
      seg=seg.filter(function(x){ return x.indexOf(".")<0; });
      if(seg.length) repo=seg[0];
    }
    return {owner: owner||"wocchi09", repo: repo||"npb-data"};
  }
  function ghToken(){
    try{ return localStorage.getItem(GH_TOKEN_KEY)||""; }catch(e){ return ""; }
  }
  function setGhToken(v){
    try{
      if(v) localStorage.setItem(GH_TOKEN_KEY, v);
      else localStorage.removeItem(GH_TOKEN_KEY);
    }catch(e){}
  }
  function actionsUrl(file){
    var r=ghRepo();
    return "https://github.com/"+r.owner+"/"+r.repo+"/actions/workflows/"+file;
  }

      '③ <b>Permissions</b> は <b>Actions: Read and write</b> だけを許可（他は触らない）<br>'+

      '</div>'+

  function saveToken(){
    var i=document.getElementById("ghTokenInput");
    var v=i?String(i.value||"").trim():"";
    if(!v){ alert("トークンを入力してください"); return; }
    setGhToken(v);
    dashLoaded=false;
    loadDash();
  }
  function clearToken(){
    setGhToken("");
    dashLoaded=false;
    loadDash();

  async function ghApi(path, opts){
    var r=ghRepo();
    var res=await fetch("https://api.github.com/repos/"+r.owner+"/"+r.repo+path, Object.assign({
      headers: {
        "Authorization": "Bearer "+ghToken(),
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      }
    }, opts||{}));
    return res;
  }

  async function runCollect(){
    var box=document.getElementById("collectResult");
    var d=document.getElementById("collectDate");
    var date=d?d.value:"";
    if(!date){ box.innerHTML='<div class="msg">日付を選んでください</div>'; return; }
    box.innerHTML='<div class="msg">送信中…</div>';
    try{
      var res=await ghApi("/actions/workflows/daily.yml/dispatches", {
        method:"POST",
        body: JSON.stringify({ref:"main", inputs:{date:date}})
      });
      if(res.status===204){
        box.innerHTML='<div class="exok">✓ '+esc(date)+' の収集を開始しました<br>'+
          '<span style="font-size:11px">30分ほどかかります。「実行状況を確認」で進捗が見られます</span></div>';
      }else{
        var t=await res.text();
        box.innerHTML='<div class="msg">実行できませんでした（HTTP '+res.status+'）<br>'+
          '<span style="font-size:11px">'+esc(t.slice(0,200))+'</span></div>';
      }
    }catch(e){
      box.innerHTML='<div class="msg">通信に失敗しました<br>'+
        '<span style="font-size:11px">トークンの権限（Actions: Read and write）を確認してください</span></div>';
    }
  }

  async function checkRuns(){
    var box=document.getElementById("collectResult");
    box.innerHTML='<div class="msg">確認中…</div>';
    try{
      var res=await ghApi("/actions/runs?per_page=5");
      if(!res.ok){
        box.innerHTML='<div class="msg">取得できませんでした（HTTP '+res.status+'）</div>';
        return;
      }
      var d=await res.json();
      var runs=d.workflow_runs||[];
      if(!runs.length){ box.innerHTML='<div class="msg">実行履歴がありません</div>'; return; }
      var h='<div class="tblwrap"><table class="stbl"><thead><tr>'+
        '<th class="nm">ワークフロー</th><th>状態</th><th>結果</th><th>開始</th></tr></thead><tbody>';
      runs.forEach(function(x){
        var st=x.status||"";
        var cc=x.conclusion||"";
        var mark = cc==="success" ? '<span class="qmark">成功</span>'
                 : cc==="failure" ? '<span class="subtag" style="background:var(--out)">失敗</span>'
                 : (st==="in_progress"||st==="queued") ? '<span class="subtag">実行中</span>' : esc(cc||st);
        h+='<tr><td class="nm">'+esc(x.name||"")+'</td>'+
           '<td>'+esc(st)+'</td><td>'+mark+'</td>'+
           '<td class="num">'+esc(String(x.created_at||"").replace("T"," ").slice(5,16))+'</td></tr>';
      });
      h+='</tbody></table></div>';
      box.innerHTML=h;
    }catch(e){
      box.innerHTML='<div class="msg">通信に失敗しました</div>';
    }
  }

  /* ===== データカレンダー ===== */
  var dashDays = {};      // "2026-07-24" -> その日の試合数
  var noGameDays = {};    // "2026-07-06" -> true（試合が無かった日）
  var exclDays = {};      // "2026-07-28" -> 除外理由（オールスターなど）
  var calMonth = null;    // 表示中の月 "2026-07"

  function shiftCalMonth(n){
    if(!calMonth) return;
    var y=parseInt(calMonth.slice(0,4),10), m=parseInt(calMonth.slice(5,7),10);
    m+=n;
    while(m<1){ m+=12; y--; }
    while(m>12){ m-=12; y++; }
    calMonth=y+"-"+("0"+m).slice(-2);
    var el=document.getElementById("calBody");
    if(el) el.innerHTML=renderCalBody();
    var lb=document.getElementById("calLabel");
    if(lb) lb.textContent=y+"年"+m+"月";
  }

  function renderCalendar(){
    if(!calMonth) return "";
    var y=parseInt(calMonth.slice(0,4),10), m=parseInt(calMonth.slice(5,7),10);
    var total=0, daysWith=0;
    for(var k in dashDays){ total+=dashDays[k]; if(dashDays[k]>0) daysWith++; }

    var ngCount=0;
    for(var k2 in noGameDays) ngCount++;
    return '<div class="dash-sec"><div class="dash-h"><span class="dot"></span>データカレンダー'+
      '<span class="dash-date">'+daysWith+'日分 / 計'+total+'試合'+
      (ngCount?'（試合なし'+ngCount+'日）':'')+'</span></div>'+
      '<div class="calnav">'+
        '<button class="btn" onclick="shiftCalMonth(-1)">◀</button>'+
        '<span id="calLabel" class="callabel">'+y+'年'+m+'月</span>'+
        '<button class="btn" onclick="shiftCalMonth(1)">▶</button>'+
      '</div>'+
      '<div id="calBody">'+renderCalBody()+'</div>'+
      '<div class="callegend"><span class="cbox has"></span>データあり'+
      '<span class="cbox nogame"></span>試合なし'+
      '<span class="cbox excl"></span>成績対象外'+
      '<span class="cbox none"></span>未収集　※日付をタップでその日の試合へ</div>'+
      '</div>';
  }

  function renderCalBody(){
    var y=parseInt(calMonth.slice(0,4),10), m=parseInt(calMonth.slice(5,7),10);
    // その月の1日の曜日と日数（ローカル日付で計算してズレを防ぐ）
    var first=new Date(y, m-1, 1);
    var startDow=first.getDay();
    var lastDay=new Date(y, m, 0).getDate();
    var today=todayJST();

    var h='<div class="cal">';
    ["日","月","火","水","木","金","土"].forEach(function(w,i){
      h+='<div class="cdow'+(i===0?" sun":(i===6?" sat":""))+'">'+w+'</div>';
    });
    // 月初めまでの空白
    for(var i=0;i<startDow;i++) h+='<div class="cday empty"></div>';

    for(var d=1;d<=lastDay;d++){
      var ds=y+"-"+("0"+m).slice(-2)+"-"+("0"+d).slice(-2);
      var n=dashDays[ds]||0;
      var isToday=(ds===today);
      if(n>0){
        var ex=exclDays[ds];
        h+='<div class="cday has'+(ex?" excl":"")+(isToday?" today":"")+'" '+
           'onclick="openGamesDay(\''+ds+'\')" '+
           'title="'+ds+'：'+n+'試合'+(ex?'（'+ex+'／成績には含めません）':'')+'">'+
           '<span class="cnum">'+d+'</span><span class="ccnt">'+
           (ex?esc(String(ex).slice(0,2)):n)+'</span></div>';
      }else if(noGameDays[ds]){
        h+='<div class="cday nogame'+(isToday?" today":"")+'" title="'+ds+'：試合なし">'+
           '<span class="cnum">'+d+'</span><span class="ccnt">−</span></div>';
      }else{
        h+='<div class="cday none'+(isToday?" today":"")+'" title="'+ds+'：未収集">'+
           '<span class="cnum">'+d+'</span></div>';
      }
    }
    h+='</div>';
    return h;
  }

  /* ===== マイNPB ===== */
  var MY_NPB_KEY="npbMyNpbV1";
  var myNpbRoster=null;
  var myNpbEditing=false;
  var myNpbDraft=null;

  function loadMyNpb(){
    var empty={team:"",playerKeys:[]};
    try{
      var value=JSON.parse(localStorage.getItem(MY_NPB_KEY)||"null");
      if(!value||typeof value!=="object") return empty;
      var team=TEAM_META[value.team]?value.team:"";
      var keys=Array.isArray(value.playerKeys)?value.playerKeys.filter(function(x){return typeof x==="string";}):[];
      return {team:team,playerKeys:Array.from(new Set(keys)).slice(0,5)};
    }catch(e){return empty;}
  }
  function storeMyNpb(value){
    try{localStorage.setItem(MY_NPB_KEY,JSON.stringify({team:value.team||"",playerKeys:(value.playerKeys||[]).slice(0,5)}));}catch(e){}
  }
  function refreshMyNpb(){
    if(dashData) renderDash(dashData.date,dashData.games,dashData.players,dashData.year);
  }
  function openMyNpbSettings(){
    var current=loadMyNpb();
    if(dashData&&dashData.players){
      current.playerKeys=current.playerKeys.filter(function(key){return !!findMyNpbPlayer(dashData.players,key);});
    }
    myNpbDraft={team:current.team,playerKeys:current.playerKeys.slice(),pickTeam:current.team||TEAM_ORDER_PA[0]};

  function setMyNpbTeam(value){
    if(!myNpbDraft)return;myNpbDraft.team=TEAM_META[value]?value:"";
    if(myNpbDraft.team)myNpbDraft.pickTeam=myNpbDraft.team;refreshMyNpb();

    if(!myNpbDraft)return;

  function removeMyNpbPlayer(key){
    if(!myNpbDraft)return;myNpbDraft.playerKeys=myNpbDraft.playerKeys.filter(function(x){return x!==key;});refreshMyNpb();

    if(!myNpbDraft)return;storeMyNpb(myNpbDraft);myNpbEditing=false;myNpbDraft=null;refreshMyNpb();

    if(!confirm("マイNPBの設定をすべて解除しますか？"))return;

  function findMyNpbPlayer(players,key){
    for(var i=0;i<(players||[]).length;i++)if(players[i].key===key)return players[i];
    return null;
  }
  function myNpbRegistration(player){
    var list=(myNpbRoster&&myNpbRoster.players)||[],wanted=normName(player.name);
    for(var i=0;i<list.length;i++){
      if(list[i].team===player.team&&normName(list[i].name)===wanted)return list[i];
    }
    // 成績側で外国人選手のイニシャルが省略される場合の補完（例：Ｊ．選手名）
    var shortName=function(value){return normName(value).replace(/^[A-Za-zＡ-Ｚａ-ｚ]+[\.．・]*/,"");};
    var shortWanted=shortName(player.name),matched=[];
    for(var j=0;j<list.length;j++){
      if(list[j].team===player.team&&shortName(list[j].name)===shortWanted)matched.push(list[j]);
    }
    if(matched.length===1)return matched[0];
    return null;
  }
  function myNpbPlayerCard(player){

    }else{
      var b=player.batting||{};
      stats=[[b.avg==null?"-":fmtAvg(b.avg),"打率"],[b.ops==null?"-":fmtAvg(b.ops),"OPS"],[b.hr||0,"本塁打"],[b.games||0,"試合"]];
    }

  function renderMyNpbEditor(players){

    teams.forEach(function(team){pickTeamOptions+='<option value="'+team+'"'+(pickTeam===team?' selected':'')+'>'+team+'</option>';});
    var candidates=(players||[]).filter(function(p){return p.team===pickTeam&&myNpbDraft.playerKeys.indexOf(p.key)<0;});
    candidates.sort(function(a,b){
      var an=parseInt(a.number,10),bn=parseInt(b.number,10);if(isNaN(an))an=999;if(isNaN(bn))bn=999;
      return an-bn||String(a.name).localeCompare(String(b.name));
    });
    var playerOptions='<option value="">選手を選択</option>'+candidates.map(function(p){return '<option value="'+esc(p.key)+'">'+(p.number!=null?'#'+esc(p.number)+' ':'')+esc(p.name)+'（'+esc(p.position||'')+'）</option>';}).join("");
    var chips=myNpbDraft.playerKeys.map(function(key){

      return '<span class="mynpb-chip">'+teamBadge(p.team)+esc(p.name)+'<button type="button" aria-label="'+esc(p.name)+'を解除" onclick="removeMyNpbPlayer(\''+esc(key)+'\')">×</button></span>';
    }).join("")||'<span class="sub2">推し選手は5人まで登録できます</span>';
    return '<div class="mynpb-editor" id="myNpbEditor"><div class="mynpb-editor-grid">'+
      '<div class="mynpb-field"><label>推し球団</label><select onchange="setMyNpbTeam(this.value)">'+teamOptions+'</select></div>'+
      '<div class="mynpb-field"><label>選手の球団</label><select onchange="setMyNpbPickTeam(this.value)">'+pickTeamOptions+'</select></div>'+
      '<div class="mynpb-field"><label>追加する推し選手</label><select id="myNpbPlayerPick">'+playerOptions+'</select></div>'+
      '<button class="btn" type="button" onclick="addMyNpbPlayer()"'+(myNpbDraft.playerKeys.length>=5?' disabled':'')+'>追加</button></div>'+
      '<div class="mynpb-chips">'+chips+'</div><div class="mynpb-actions">'+
      '<button class="btn" type="button" onclick="clearMyNpbSettings()">設定を解除</button>'+

      '<button class="btn primary" type="button" onclick="saveMyNpbSettings()">保存する</button></div></div>';

  var dashLoaded = false;

  /* 試合がどのリーグか判定（両リーグ対戦なら交流戦） */
  function gameLeague(g){
    var res=g.result||{};
    var lh=tLeague(res.home||g.home), la=tLeague(res.away||g.away);
    if(!lh||!la) return null;
    return lh===la ? lh : "交";
  }

  async function loadDash(){
    var dv=document.getElementById("dashView");
    if(dashLoaded){ return; }
    dv.innerHTML='<div class="msg">読み込み中…</div>';

    // 1) 最新のデータがある日を検出
    //    calendar.json（再集計で作られる正確な日別集計）があればそれを使い、
    //    無ければ index.json から推定する
    var latestDate=null;
    var year0=(dp.value||todayJST()).split("-")[0];
    var gotCal=false;
    try{
      var rc=await fetch("data/"+year0+"/calendar.json?t="+Date.now());
      if(rc.ok){
        var cal=await rc.json();
        dashDays=cal.days||{};
        noGameDays={};
        (cal.no_games||[]).forEach(function(d){ noGameDays[d]=true; });
        exclDays=cal.excluded_types||{};
        var ck=Object.keys(dashDays).sort();
        if(ck.length){ latestDate=ck[ck.length-1]; gotCal=true; }
      }
    }catch(e){}

    if(!gotCal){
      try{
        var ri=await fetch("data/index.json?t="+Date.now());
        if(ri.ok){
          var idx=await ri.json();
          var days={};
          (idx.files||[]).forEach(function(f){
            var m=f.match(/data\/(\d{4})\/(\d{2})\/(\d{2})\/([^\/]+)$/);
            if(!m) return;
            var d=m[1]+"-"+m[2]+"-"+m[3];
            var name=m[4];
            if(!days[d]) days[d]=0;
            if(name.charAt(0)!=="_" && name!=="index.json") days[d]++;
          });
          dashDays=days;
          var dl=Object.keys(days).sort();
          if(dl.length) latestDate=dl[dl.length-1];
        }
      }catch(e){}
    }

    // 2) シーズン成績を読む（ランキング用）
    var year=(latestDate||todayJST()).split("-")[0];
    var players=[];
    try{
      var rp=await fetch("data/"+year+"/players/stats.json?t="+Date.now());
      if(rp.ok) players=(await rp.json()).players||[];
    }catch(e){}

    // 2.5) 順位表を読む
    try{
      var rst=await fetch("data/"+year+"/standings.json?t="+Date.now());
      if(rst.ok){ standings=await rst.json(); }
    }catch(e){}

    // 2.6) チーム成績を読む（規定打席・規定投球回の判定に使う）
    try{
      var rtm=await fetch("data/"+year+"/teams/stats.json?t="+Date.now());
      if(rtm.ok){ seasonTeams=(await rtm.json()).teams||[]; _tgCache=null; }
    }catch(e){}

    // 2.7) マイNPBの一軍登録状況に使う
    try{
      var rmr=await fetch("data/"+year+"/roster/registration.json?t="+Date.now());
      if(rmr.ok) myNpbRoster=await rmr.json();
    }catch(e){myNpbRoster=null;}

    // 3) 最新日の試合結果を読む
    var latestGames=[];
    if(latestDate){
      try{
        var rs=await fetch(sumPath(latestDate)+"?t="+Date.now());
        if(rs.ok) latestGames=(await rs.json()).games||[];
      }catch(e){}
    }

    dashData = {date: latestDate, games: latestGames, players: players, year: year};
    if(!calMonth) calMonth=(latestDate||todayJST()).slice(0,7);
    renderDash(latestDate, latestGames, players, year);
    dashLoaded=true;  }

         year+' シーズンリーダー</div>';
      h+='<div class="stabs">';
      [["セ","セ・リーグ","セ"],["パ","パ・リーグ","パ"],["all","両リーグ",null]].forEach(function(x){
        var col = x[2] ? LEAGUE_COLOR[x[2]] : "var(--accent)";
        h+='<button class="stab'+(dashLeague===x[0]?" on":"")+'" style="--sc:'+col+'" '+
           'onclick="setDashLeague(\''+x[0]+'\')">'+x[1]+'</button>';
      });

      if(!lp.length){
        h+='<div class="msg">このリーグの選手データがありません</div>';
      }else{
        h+='<div class="rankgrid">';
        // 率の指標（打率・防御率）は規定到達者だけで比べる
        h+=rankBlock("打率", batList, bat(function(b){return b.pa>=1?b.avg:null;}), fmtA);
        h+=rankBlock("本塁打", lp, bat(function(b){return b.hr;}), fmtN);
        h+=rankBlock("打点", lp, bat(function(b){return b.rbi;}), fmtN);
        h+=rankBlock("安打", lp, bat(function(b){return b.hits;}), fmtN);
        h+=rankBlock("OPS", lp, bat(function(b){return b.pa>=1?b.ops:null;}), fmtO);
        h+=rankBlock("盗塁", lp, bat(function(b){return b.sb;}), fmtN);
        h+=rankBlock("防御率", pitList, pit(function(q){return q.era;}), fmtE, true);
        h+=rankBlock("奪三振", lp, pit(function(q){return q.so;}), fmtN);
        h+=rankBlock("勝利", lp, pit(function(q){return q.wins;}), fmtN);
        h+=rankBlock("セーブ", lp, pit(function(q){return q.saves;}), fmtN);
        h+=rankBlock("ホールド", lp, pit(function(q){return holdsOf(q);}), fmtN);
        h+=rankBlock("HP", lp, pit(function(q){return q.hp;}), fmtN);
        h+=rankBlock("勝率", lp, pit(function(q){
              return ((q.wins||0)+(q.losses||0))>=1 ? q.win_pct : null;
            }), fmtO);
        h+='</div>';
        h+='<div class="sub" style="font-size:11px;margin-bottom:8px">'+
           (usedQual ? '打率・防御率は規定到達者のみ（規定＝収集済み試合数×3.1打席／×1.0回）'
                     : '規定到達者がまだいないため、打率・防御率も全選手で表示しています')+
           '／勝率は勝敗がついた投手のみ／ホールドとHPはルールから算出した推定値です</div>';
      }
      h+='<button class="btn" onclick="setView(\'season\')">シーズン成績をすべて見る ▶</button></div>';
    }

    dv.innerHTML=h;
  }

  async function gotoGame(date, gid){
    setView("games");
    dp.value=date;
    await loadDay();
    loadGame(date, gid, null);

    setView("games");
    dp.value=date;
    loadDay();
  }
  function gotoPlayer(key){
    setView("season");
    setTimeout(function(){ showPlayer(key); }, 400);
  }

  /* ===== 画面切り替え（試合ビュー / シーズン成績ビュー） ===== */
  var curView = "games";      // games | season
  var seasonData = null;      // 読み込んだ選手成績
  var seasonTeams = null;
  var seasonSort = "avg";     // 並び替えキー
  var seasonTeamFilter = "all";
  var seasonLeagueFilter = "パ";
  var seasonQualified = "auto";   // auto | all | qualified
  var seasonGroup = "batter";     // batter | pitcher

  /* 並び替えできる項目（野手・投手で別々） */
  var SORTS_BAT = [["avg","打率"],["hr","本塁打"],["rbi","打点"],["hits","安打"],
                   ["obp","出塁率"],["slg","長打率"],["ops","OPS"],["sb","盗塁"],
                   ["pa","打席"],["so_b","三振"],["bb_b","四球"]];
  var SORTS_PIT = [["era","防御率"],["so_p","奪三振"],["wins","勝利"],["saves","セーブ"],
                   ["holds","ホールド"],["hp","HP"],["win_pct","勝率"],["whip","WHIP"],
                   ["outs","投球回"],["k9","K/9"],["bb_p","与四球"]];

  function defaultSort(group){
    return group==="pitcher" ? "era" : "avg";
  }

  /* 野手／投手の切替 */
  function setSeasonGroup(g){
    if(seasonGroup===g) return;
    seasonGroup=g;
    seasonSort=defaultSort(g);   // 項目もそのグループの既定に戻す
    renderSeason();
  }

  /* 自動モードで規定到達者だけに絞る指標。
     打率と防御率はタイトル同様に規定到達が前提なので、この2つだけを対象にする。 */
  var RATE_STATS = {avg:1, era:1};

  /* 実際に適用する規定モードを決める */
  function qualMode(){
    if(seasonQualified !== "auto") return seasonQualified;
    return RATE_STATS[seasonSort] ? "qualified" : "all";
  }

  function closeNavGroups(except){
    document.querySelectorAll(".navgroup").forEach(function(group){
      var keep=except && group.getAttribute("data-nav-group")===except;
      group.classList.toggle("open",!!keep);
      var button=group.querySelector(":scope > .vbtn");
      if(button) button.setAttribute("aria-expanded",keep?"true":"false");
    });
  }
  function toggleNavGroup(name,event){
    if(event) event.stopPropagation();
    var group=document.querySelector('.navgroup[data-nav-group="'+name+'"]');
    var willOpen=group && !group.classList.contains("open");
    closeNavGroups(willOpen?name:null);
  }
  document.addEventListener("click",function(event){
    if(!event.target.closest(".navgroup")) closeNavGroups();
  });
  document.addEventListener("keydown",function(event){
    if(event.key==="Escape") closeNavGroups();
  });

  function setView(v){

    closeNavGroups();
    var ids={dash:"dashView", games:"gameView", season:"seasonView",
             players:"playersView", roster:"rosterView", matchup:"matchupView", compare:"compareView", daily:"dailyView", rankmove:"rankMoveView", insights:"insightsView",
             playergraph:"playerGraphView", awards:"awardsView",
             awardsGuide:"awardsGuideView", sabermetrics:"sabermetricsView",
             glossary:"glossaryView",
             war:"warView", warGuide:"warGuideView",

    var navGroups={
      stats:["season","players","roster","matchup","compare"],
      analysis:["daily","rankmove","insights","playergraph","correlation","teamstyle"],

    if(v==="dash") loadDash();
    else if(v==="season") loadSeason();
    else if(v==="players") loadPlayers();
    else if(v==="roster") loadRosterAnnouncements();
    else if(v==="matchup") loadMatchups();
    else if(v==="compare") loadCompare();
    else if(v==="daily") loadDaily();
    else if(v==="rankmove") loadRankMovers();
    else if(v==="insights"&&typeof loadInsights==="function") loadInsights();
    else if(v==="playergraph") loadPlayerGraph();
    else if(v==="awards") loadAwards();
    else if(v==="awardsGuide"){
      document.getElementById("awardsGuideView").innerHTML=renderAwardsGuide();
    }
    else if(v==="sabermetrics") loadSabermetrics();
    else if(v==="glossary"){
      document.getElementById("glossaryView").innerHTML=renderGlossary();
    }
    else if(v==="war") loadWar();
    else if(v==="warGuide"){
      document.getElementById("warGuideView").innerHTML=renderWarGuide();
    }
    else if(v==="impact") loadImpact();
    else if(v==="impactGuide"){
      document.getElementById("impactGuideView").innerHTML=renderImpactGuide();
    }
    else if(v==="correlation") loadCorrelation();
    else if(v==="teamstyle") loadTeamStyle();
    else if(v==="export") loadExport();
    else if(v==="social") loadSocial();
    motionSchedule(document.getElementById(ids[v]));
  }

  async function loadSeason(){
    var sv=document.getElementById("seasonView");
    if(seasonData){ renderSeason(); return; }
    sv.innerHTML='<div class="msg">読み込み中…</div>';
    var year=(dp.value||todayJST()).split("-")[0];
    try{
      var r=await fetch("data/"+year+"/players/stats.json?t="+Date.now());
      if(!r.ok) throw 0;
      var d=await r.json();
      seasonData=d.players||[];
      try{
        var rt=await fetch("data/"+year+"/teams/stats.json?t="+Date.now());
        if(rt.ok){ seasonTeams=(await rt.json()).teams||[]; _tgCache=null; }
      }catch(e){}
      // 順位表は表示用（規定の判定には収集データの試合数を使う）
      if(!standings){
        try{
          var rs2=await fetch("data/"+year+"/standings.json?t="+Date.now());
          if(rs2.ok){ standings=await rs2.json(); }
        }catch(e){}
      }
      renderSeason();
    }catch(e){
      sv.innerHTML='<div class="msg">シーズン成績がまだありません<br>'+
        '<span style="font-size:12px">Actionsで収集すると自動生成されます</span></div>';
    }
  }

  /* 規定打席・規定投球回の目安（試合数ベースの簡易判定） */
  /* ===== 規定打席・規定投球回 =====
     NPBの基準:
       規定打席   = チーム試合数 × 3.1
       規定投球回 = チーム試合数 × 1.0
     チーム試合数は「収集済みデータ」の試合数を使う。
     公式の消化試合数ではなく手元のデータ量に合わせることで、
     集めた範囲の中での規定到達を判定できる。 */
  var _tgCache = null;

  function teamGamesMap(){
    if(_tgCache) return _tgCache;
    var m={};
    (seasonTeams||[]).forEach(function(t){
      if(t.team) m[t.team]=t.games||0;
    });
    _tgCache = m;
    return m;
  }

  /* 規定打席（整数に切り上げ）。チーム試合数が不明ならnull */
  function reqPA(team){
    var g=teamGamesMap()[team];
    return g ? Math.ceil(g*3.1) : null;
  }
  /* 規定投球回をアウト数に換算（1回=3アウト） */
  function reqOuts(team){
    var g=teamGamesMap()[team];
    return g ? g*3 : null;
  }

  /* 成績を持っているか（表示対象の判定） */
  function hasBatting(p){ return p.batting && (p.batting.pa||0)>=1; }
  function hasPitching(p){ return p.pitching && (p.pitching.outs||0)>=1; }

  /* 規定に到達しているか */
  function isQualifiedBatter(p){
    var need=reqPA(p.team);
    if(need==null) return false;
    return ((p.batting&&p.batting.pa)||0) >= need;
  }
  function isQualifiedPitcher(p){
    var need=reqOuts(p.team);
    if(need==null) return false;
    return ((p.pitching&&p.pitching.outs)||0) >= need;
  }

  /* ランキング下の注記（規定の基準値を明示する） */
  function qualNote(isPitchStat, applied, fellBack){
    var m=teamGamesMap();
    var gs=[];
    for(var k in m){ if(m[k]) gs.push(m[k]); }
    if(!gs.length){
      return (isPitchStat?"登板した投手":"打席に立った野手")+
             'を対象（収集済み試合数が不明なため規定は判定できません）';
    }
    var mn=Math.min.apply(null,gs), mx=Math.max.apply(null,gs);
    var base = mn===mx ? (mn+"試合") : (mn+"〜"+mx+"試合");
    var need = isPitchStat
      ? '規定投球回 = 試合数×1.0（'+ (mn===mx ? (mn+"回") : (mn+"〜"+mx+"回")) +'）'
      : '規定打席 = 試合数×3.1（'+
        (mn===mx ? Math.ceil(mn*3.1)+"打席"
                 : Math.ceil(mn*3.1)+"〜"+Math.ceil(mx*3.1)+"打席") +'）';

    var head;
    if(fellBack){
      head='規定到達者がまだいないため全選手を表示';
    }else if(applied==="qualified"){
      head='規定到達者のみ表示';
    }else{
      head=(isPitchStat?"登板した投手":"打席に立った野手")+"を対象";
    }
    return head+'／'+need+'　※収集済みの'+base+'を基準に算出';
  }

  function renderSeason(){
    var sv=document.getElementById("seasonView");
    if(!seasonData||!seasonData.length){
      sv.innerHTML='<div class="msg">選手データがありません</div>';
      return;
    }

    // チーム一覧（リーグ順→略称順で並べる）
    var teams={};
    seasonData.forEach(function(p){ if(p.team) teams[p.team]=1; });
    var teamList=Object.keys(teams).sort(function(a,b){
      var la=tLeague(a)||"ワ", lb=tLeague(b)||"ワ";
      if(la!==lb) return la==="セ"?-1:1;
      return String(tMini(a)).localeCompare(String(tMini(b)));
    });

    var isPitchStat = (seasonGroup==="pitcher");
    var sorts = isPitchStat ? SORTS_PIT : SORTS_BAT;

    // 項目が今のグループに無いものだったら既定に戻す
    var validSort=false;
    sorts.forEach(function(s){ if(s[0]===seasonSort) validSort=true; });
    if(!validSort) seasonSort=defaultSort(seasonGroup);

    var h='<div class="stabs">';
    [["セ","セ・リーグ","セ"],["パ","パ・リーグ","パ"],["all","両リーグ",null]].forEach(function(x){
      var col = x[2] ? LEAGUE_COLOR[x[2]] : "var(--accent)";
      h+='<button class="stab'+(seasonLeagueFilter===x[0]?" on":"")+'" style="--sc:'+col+'" '+
         'onclick="setSeasonLeague(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    // 野手／投手の切替
    h+='<div class="stabs gtabs">';
    [["batter","野手成績"],["pitcher","投手成績"]].forEach(function(x){
      h+='<button class="stab'+(seasonGroup===x[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setSeasonGroup(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    h+='<div class="toolbar">'+
      '<span class="lb">項目</span><select id="ssort" onchange="onSeasonChange()">'+
      sorts.map(function(s){
        return '<option value="'+s[0]+'"'+(seasonSort===s[0]?" selected":"")+'>'+s[1]+'</option>';
      }).join("")+'</select>'+
      '<span class="lb">チーム</span><select id="steam" onchange="onSeasonChange()">'+
      '<option value="all">全チーム</option>'+
      teamList.filter(function(t){
        return seasonLeagueFilter==="all" || tLeague(t)===seasonLeagueFilter;
      }).map(function(t){
        return '<option value="'+esc(t)+'"'+(seasonTeamFilter===t?" selected":"")+'>'+esc(t)+'</option>';
      }).join("")+'</select>'+
      '<span class="lb">対象</span><select id="squal" onchange="onSeasonChange()">'+
      '<option value="auto"'+(seasonQualified==="auto"?" selected":"")+'>自動（率は規定者のみ）</option>'+
      '<option value="all"'+(seasonQualified==="all"?" selected":"")+'>全選手</option>'+
      '<option value="qualified"'+(seasonQualified==="qualified"?" selected":"")+'>規定到達のみ</option>'+
      '</select></div>';

    var mode = qualMode();

    // まず所属・成績の有無で絞る
    var base=seasonData.filter(function(p){
      if(!p.name || !String(p.name).trim()) return false;   // 名前なしは除外
      if(seasonLeagueFilter!=="all" && tLeague(p.team)!==seasonLeagueFilter) return false;
      if(seasonTeamFilter!=="all" && p.team!==seasonTeamFilter) return false;
      return isPitchStat ? hasPitching(p) : hasBatting(p);
    });

    // 規定で絞る
    var list = base;
    var fellBack = false;
    if(mode==="qualified"){
      var q=base.filter(function(p){
        return isPitchStat ? isQualifiedPitcher(p) : isQualifiedBatter(p);
      });
      if(q.length){
        list=q;
      }else if(seasonQualified==="auto"){
        // 自動モードで到達者ゼロなら、空表示を避けて全選手に戻す
        list=base; fellBack=true;
      }else{
        list=q;
      }
    }

    // 並び替え
    function val(p){
      var b=p.batting||{}, q=p.pitching||{};
      switch(seasonSort){
        // 野手
        case "avg": return b.avg;
        case "hr": return b.hr;
        case "rbi": return b.rbi;
        case "hits": return b.hits;
        case "obp": return b.obp;
        case "slg": return b.slg;
        case "ops": return b.ops;
        case "sb": return b.sb;
        case "pa": return b.pa;
        case "so_b": return b.so;
        case "bb_b": return b.bb;
        // 投手
        case "era": return q.era;
        case "so_p": return q.so;
        case "wins": return q.wins;
        case "saves": return q.saves;
        case "holds": return holdsOf(q);
        case "hp": return q.hp;
        case "win_pct": return ((q.wins||0)+(q.losses||0))>=1 ? q.win_pct : null;
        case "whip": return q.whip;
        case "outs": return q.outs;
        case "k9": return q.k9;
        case "bb_p": return q.bb;
      }
      return null;
    }
    // 防御率・WHIPは小さいほうが上位
    var ASC={era:1, whip:1};
    list.sort(function(a,b){
      var va=val(a), vb=val(b);
      if(va==null) return 1;
      if(vb==null) return -1;
      return ASC[seasonSort] ? va-vb : vb-va;
    });

    if(!list.length){
      sv.innerHTML=h+'<div class="msg">該当する選手がいません</div><div id="playerDetail"></div>';
      return;
    }

    // ランキング表
    h+='<div class="card2"><h3>'+
       (isPitchStat?"投手":"野手")+'ランキング（'+
       sorts.filter(function(s){return s[0]===seasonSort;})[0][1]+'）</h3><div class="tblwrap">';
    if(isPitchStat){
      h+='<table class="stbl"><thead><tr><th>#</th><th class="nm">選手</th><th>チーム</th>'+
         '<th>登板</th><th>回</th><th>防御率</th><th>WHIP</th><th>K/9</th><th>奪三</th><th>四球</th>'+
         '<th>勝</th><th>敗</th><th>勝率</th><th>S</th><th>H</th><th>HP</th></tr></thead><tbody>';
      list.slice(0,50).forEach(function(p,i){
        var q=p.pitching||{};
        h+='<tr onclick="showPlayer(\''+esc(p.key)+'\')"><td class="num">'+(i+1)+'</td>'+
           '<td class="nm lnk">'+esc(p.name)+(isQualifiedPitcher(p)?'<span class="qmark" title="規定投球回到達">規</span>':'')+'</td><td>'+teamBadge(p.team)+'</td>'+
           '<td class="num">'+(q.games||0)+'</td>'+
           '<td class="num">'+esc(q.innings||"0")+'</td>'+
           '<td class="num hi">'+(q.era==null?"-":q.era.toFixed(2))+'</td>'+
           '<td class="num">'+(q.whip==null?"-":q.whip.toFixed(2))+'</td>'+
           '<td class="num">'+(q.k9==null?"-":q.k9.toFixed(1))+'</td>'+
           '<td class="num">'+(q.so||0)+'</td><td class="num">'+(q.bb||0)+'</td>'+
           '<td class="num">'+(q.wins||0)+'</td><td class="num">'+(q.losses||0)+'</td>'+
           '<td class="num">'+(q.win_pct==null?"-":q.win_pct.toFixed(3).replace(/^0\./,"."))+'</td>'+
           '<td class="num">'+(q.saves||0)+'</td>'+
           '<td class="num">'+holdsOf(q)+(holdsIsEst(q)?'<span class="estmark">推</span>':'')+'</td>'+
           '<td class="num">'+(q.hp||0)+'</td></tr>';
      });
    }else{
      h+='<table class="stbl"><thead><tr><th>#</th><th class="nm">選手</th><th>チーム</th>'+
         '<th>試合</th><th>打席</th><th>打数</th><th>安打</th><th>本</th><th>点</th><th>盗</th>'+
         '<th>打率</th><th>出塁</th><th>長打</th><th>OPS</th></tr></thead><tbody>';
      list.slice(0,50).forEach(function(p,i){
        var b=p.batting||{};
        h+='<tr onclick="showPlayer(\''+esc(p.key)+'\')"><td class="num">'+(i+1)+'</td>'+
           '<td class="nm lnk">'+esc(p.name)+(isQualifiedBatter(p)?'<span class="qmark" title="規定打席到達">規</span>':'')+'</td><td>'+teamBadge(p.team)+'</td>'+
           '<td class="num">'+(b.games||0)+'</td><td class="num">'+(b.pa||0)+'</td>'+
           '<td class="num">'+(b.ab||0)+'</td><td class="num">'+(b.hits||0)+'</td>'+
           '<td class="num'+((b.hr||0)>0?' hi':'')+'">'+(b.hr||0)+'</td>'+
           '<td class="num">'+(b.rbi||0)+'</td>'+
           '<td class="num">'+(b.sb||0)+'</td>'+
           '<td class="num hi">'+fmtAvg(b.avg)+'</td>'+
           '<td class="num">'+fmtAvg(b.obp)+'</td>'+
           '<td class="num">'+fmtAvg(b.slg)+'</td>'+
           '<td class="num">'+(b.ops==null?"-":b.ops.toFixed(3).replace(/^0\./,"."))+'</td></tr>';
      });
    }
    h+='</tbody></table></div>'+
       '<div class="sub" style="margin-top:8px;font-size:11px">'+
       qualNote(isPitchStat, mode, fellBack)+'／選手名をタップで詳細</div></div>';

    // チーム成績（セ・パでカードを分ける）
    if(seasonTeams&&seasonTeams.length){
      ["セ","パ"].forEach(function(lg){

      rosterRegistration=response.ok?await response.json():false;

  function registrationIndex(){
    var index={};
    if(rosterRegistration&&rosterRegistration.players){
      rosterRegistration.players.forEach(function(player){index[player.npb_id]=player;});
    }
    return index;
  }

  function registeredDaysAt(player, selectedDate){
    if(!player||!selectedDate) return 0;
    if(player.registered_dates){
      return player.registered_dates.filter(function(value){return value<=selectedDate;}).length;
    }
    var target=new Date(selectedDate+"T00:00:00"),total=0;
    (player.periods||[]).forEach(function(period){
      var begin=new Date(period.from+"T00:00:00");
      var finish=period.to?new Date(period.to+"T00:00:00"):target;
      if(begin>target) return;
      if(finish>target) finish=target;
      total+=Math.max(0,Math.round((finish-begin)/86400000)+1);
    });
    return total;
  }

  function registrationCountAt(player, selectedDate){
    return (player&&player.periods||[]).filter(function(period){return period.from<=selectedDate;}).length;
  }

  function lastDeregisteredAt(player, selectedDate){
    var latest="";
    (player&&player.periods||[]).forEach(function(period){
      if(!period.to||period.to>=selectedDate) return;
      var day=new Date(period.to+"T00:00:00");
      day.setDate(day.getDate()+1);
      var value=fmtDate(day);
      if(value<=selectedDate&&value>latest) latest=value;
    });
    return latest||"-";
  }

  function rosterDateLabel(value){
    if(!value) return "-";
    var parts=value.split("-");
    return Number(parts[1])+"月"+Number(parts[2])+"日";

  function rosterPeriodsText(player, selectedDate){
    if(!player||!player.periods) return "";
    var target=selectedDate||(rosterRegistration&&rosterRegistration.latest_date)||todayJST();
    return player.periods.filter(function(period){return period.from<=target;}).map(function(period){
      var finish=period.to&&period.to<target?period.to:target;
      var open=!period.to||period.to>=target;
      var days=player.registered_dates
        ? player.registered_dates.filter(function(value){return value>=period.from&&value<=finish;}).length
        : Math.round((new Date(finish+"T00:00:00")-new Date(period.from+"T00:00:00"))/86400000)+1;
      return rosterDateLabel(period.from)+'〜'+(open?"登録中":rosterDateLabel(finish))+'（'+days+'日）';

  /* ===== 公式名鑑（NPB公式・支配下選手のみ） ===== */
  var npbRoster=null;      // {updated_at, players:[...]}
  var playerProfiles=null; // {updated_at, players:[...]} NPB公式プロフィール・通算成績

  /* 氏名の正規化：スペースを除き、よくある異体字を寄せる。
     公式サイトとスポナビで表記が違うため、突合の前に必ず通す。 */
  var NAME_VARIANTS = {
    "髙":"高", "﨑":"崎", "濵":"浜", "濱":"浜", "邉":"辺", "邊":"辺",
    "齋":"斎", "齊":"斉", "澤":"沢", "栁":"柳", "曻":"昇", "祐":"祐",
    "德":"徳", "眞":"真", "淸":"清", "﨤":"返"
  };
  function normName(s){
    if(!s) return "";
    var t=String(s).replace(/[\s\u3000]/g,"");
    var out="";
    for(var i=0;i<t.length;i++){
      var c=t.charAt(i);
      out += (NAME_VARIANTS[c] || c);
    }
    return out;
  }

  async function loadRoster(){
    if(npbRoster!==null) return npbRoster;
    try{
      var r=await fetch("data/masters/npb_roster.json?t="+Date.now());
      npbRoster = r.ok ? await r.json() : false;
    }catch(e){ npbRoster=false; }
    return npbRoster;
  }

  async function loadPlayerProfiles(){
    if(playerProfiles!==null) return playerProfiles;
    try{
      var r=await fetch("data/masters/player_profiles.json?t="+Date.now());
      playerProfiles=r.ok?await r.json():false;
    }catch(e){playerProfiles=false;}
    return playerProfiles;

  function playerProfileIndex(){
    var index={};

  /* 成績（seasonData）を氏名＋球団で引けるようにする */
  function statsIndex(){
    var m={};
    (seasonData||[]).forEach(function(p){
      if(!p.name) return;
      var k=normName(p.name);
      if(!m[k]) m[k]=[];
      m[k].push(p);
    });
    return m;
  }
  function findStats(idx, name, team){
    var cand=idx[normName(name)];
    if(!cand || !cand.length) return null;
    if(cand.length===1) return cand[0];
    // 同姓同名は球団で絞る
    for(var i=0;i<cand.length;i++){
      if(cand[i].team===team) return cand[i];
    }
    return cand[0];
  }

  /* ===== 選手一覧 ===== */
  var plName="", plTeam="ソフトバンク", plKind="batter", plPos="all", plHand="all",
      plNum="", plQual="all", plPlayed="all", plRegistered="all", plSort="number", plSortDir="asc";

  var cmpSelected=[];
  function toggleCompare(key, ev){

  var PL_COLS_BAT = [
