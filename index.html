  /* 簡易CSVパーサ（引用符・改行を含むフィールドに対応） */
  function parseCSV(text){
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);   // BOMを除去
    var rows=[], row=[], cur="", inQ=false, i=0;
    while(i<text.length){
      var c=text[i];
      if(inQ){
        if(c==='"'){
          if(text[i+1]==='"'){ cur+='"'; i+=2; continue; }
          inQ=false; i++; continue;
        }
        cur+=c; i++; continue;
      }
      if(c==='"'){ inQ=true; i++; continue; }
      if(c===','){ row.push(cur); cur=""; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; i++; continue; }
      cur+=c; i++;
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function toCSV(header, rows){
    function q(v){
      v=(v==null?"":String(v));
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }
    var out=[header.map(q).join(",")];
    rows.forEach(function(r){ out.push(r.map(q).join(",")); });
    return out.join("\r\n");
  }

  var TEAM_COLS=["team","batting_team","fielding_team","home","away","opponent"];
  var PLAYER_COLS=["player","batter","pitcher","win_pitcher","lose_pitcher","save_pitcher"];

  function filterRows(header, rows){
    var idx={};
    header.forEach(function(hname,i){ idx[hname]=i; });
    var dateI=idx["date"];
    var teamIs=TEAM_COLS.filter(function(c){return idx[c]!=null;}).map(function(c){return idx[c];});
    var plIs=PLAYER_COLS.filter(function(c){return idx[c]!=null;}).map(function(c){return idx[c];});
    var pl=(expPlayer||"").trim();

    return rows.filter(function(r){
      if(dateI!=null){
        var d=r[dateI];
        if(expFrom && d < expFrom) return false;
        if(expTo && d > expTo) return false;
      }
      if(expTeam!=="all"){
        var okT=false;
        for(var i=0;i<teamIs.length;i++){ if(r[teamIs[i]]===expTeam){ okT=true; break; } }
        if(!okT) return false;
      }
      if(pl){
        var okP=false;
        for(var j=0;j<plIs.length;j++){
          if((r[plIs[j]]||"").indexOf(pl)>=0){ okP=true; break; }
        }
        if(!okP) return false;
      }
      return true;
    });
  }

  async function runExport(mode){
    if(expLoading) return;
    readExportForm();
    var res=document.getElementById("exResult");
    var year=(dp.value||todayJST()).split("-")[0];
    var url="data/"+year+"/dataset/"+expSet+".csv";

    try{
      if(!expCache[expSet]){
        expLoading=true;
        res.innerHTML='<div class="msg">読み込み中…（初回はファイルサイズにより時間がかかります）</div>';
        var r=await fetch(url+"?t="+Date.now());
        if(!r.ok) throw new Error("notfound");
        var text=await r.text();
        var all=parseCSV(text).filter(function(x){return x.length>1;});
        if(!all.length) throw new Error("empty");
        expCache[expSet]={header:all[0], rows:all.slice(1)};
        expLoading=false;
      }
      var d=expCache[expSet];
      var rows=filterRows(d.header, d.rows);

      if(mode==="download"){
        if(!rows.length){ res.innerHTML='<div class="msg">条件に合うデータがありません</div>'; return; }
        var csv=toCSV(d.header, rows);
        var blob=new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=fileNameFor(year);
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        res.innerHTML='<div class="exok">✓ '+rows.length.toLocaleString()+' 行を書き出しました（'+esc(a.download)+'）</div>';
        return;
      }

      // プレビュー
      var h='<div class="exok">該当 '+rows.length.toLocaleString()+' 行 / 全体 '+
            d.rows.length.toLocaleString()+' 行　（列数 '+d.header.length+'）</div>';
      if(rows.length){
        var cols=d.header.slice(0,10);
        h+='<div class="tblwrap"><table class="stbl"><thead><tr>'+
           cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+
           (d.header.length>10?'<th>…</th>':'')+'</tr></thead><tbody>';
        rows.slice(0,10).forEach(function(r){
          h+='<tr>'+cols.map(function(c,i){return '<td>'+esc(r[i])+'</td>';}).join("")+
             (d.header.length>10?'<td>…</td>':'')+'</tr>';
        });
        h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
           '先頭10行・先頭10列のみ表示しています</div>';
      }
      res.innerHTML=h;

    }catch(e){
      expLoading=false;
      res.innerHTML='<div class="msg">データセットが見つかりません<br>'+
        '<span style="font-size:12px">Actionsで収集すると '+esc(url)+' が生成されます</span></div>';
    }
  }

  function fileNameFor(year){
    var parts=["npb", year, expSet];
    if(expFrom||expTo) parts.push((expFrom||"start")+"_"+(expTo||"end"));
    if(expTeam!=="all") parts.push(tMini(expTeam)||expTeam);
    if(expPlayer) parts.push(expPlayer);
    return parts.join("_").replace(/[\/\\:*?"<>|]/g,"") + ".csv";
  }

  /* ===== スタメンタブ ===== */

  /* 打席データから背番号・初出場の回を拾う（選手IDで照合、無ければ名前で） */
  function playerMetaFromAtbats(g){
    var byId={}, byName={};
    function put(map, key, info){
      if(!key) return;
      if(!map[key]) map[key]={};
      var m=map[key];
      if(!m.number && info.number) m.number=info.number;
      if(!m.hand && info.hand) m.hand=info.hand;
      if(info.batHalf && !m.firstBat){ m.firstBat=info.batHalf; m.firstBatN=info.n; }
      if(info.pitHalf && !m.firstPitch){ m.firstPitch=info.pitHalf; m.firstPitchN=info.n; }
    }
    (g.atbats||[]).forEach(function(ab){
      var half=(ab.inning||"")+"回"+(ab.top_bottom||"");
      var n=(ab.inning||0)*2+(ab.top_bottom==="裏"?1:0);
      var b=ab.batter||{}, p=ab.pitcher||{};
      var bi={number:b.number, hand:b.hand, batHalf:half, n:n};
      put(byId, b.player_id, bi);
      put(byName, (b.name||"").replace(/\s|　/g,""), bi);
      var pi={number:p.number, hand:p.hand, pitHalf:half, n:n};
      put(byId, p.player_id, pi);
      put(byName, (p.name||"").replace(/\s|　/g,""), pi);
    });
    return {byId:byId, byName:byName};
  }
  function metaOf(meta, row){
    return (row.player_id && meta.byId[row.player_id])
        || meta.byName[(row.name||"").replace(/\s|　/g,"")]
        || {};
  }
  function numBadge(n){
    return n ? '<span class="unum">#'+esc(n)+'</span>' : '';
  }

  function renderLineup(g){
    var box=g.boxscore;
    if(!box||!box.batting) return notReady("スタメン");
    var anyOrder=false;
    ["away","home"].forEach(function(s){
      (box.batting[s]||[]).forEach(function(p){ if(p.order) anyOrder=true; });
    });
    if(!anyOrder){
      return '<div class="msg">この試合のデータには打順が入っていません<br>'+
        '<span style="font-size:12px">Actionsで再収集すると表示されます</span></div>';
    }

    var meta=playerMetaFromAtbats(g);
    var sides=[["away",g.away],["home",g.home]];

    // ---- スタメン（先発9人のみ）----
    var h='<div class="lineupwrap">';
    sides.forEach(function(x){
      var side=x[0], team=x[1];
      var rows=(box.batting[side]||[]).filter(function(p){return p.is_starter;});
      if(!rows.length) return;
      var pitchers=(box.pitching&&box.pitching[side])||[];
      var starter=pitchers.length?pitchers[0]:null;
      var sm=starter?metaOf(meta,starter):{};

      h+='<div class="card2"><h3 class="thead" style="border-left-color:'+
         (tColor(team)||'var(--accent)')+'">'+teamBadge(team)+' '+esc(team||side)+' スタメン</h3>';
      h+='<div class="tblwrap"><table class="stbl lineuptbl"><thead><tr>'+
         '<th>打順</th><th>位置</th><th>背番号</th><th class="nm">選手</th>'+
         '<th>打数</th><th>安打</th><th>点</th><th>本</th><th>打率</th>'+
         '</tr></thead><tbody>';
      rows.forEach(function(p){
        var m=metaOf(meta,p);
        h+='<tr>'+
          '<td class="num ord">'+(p.order||"")+'</td>'+
          '<td class="pos">'+esc(p.position||"")+'</td>'+
          '<td class="num unumcell">'+(m.number?esc(m.number):"-")+'</td>'+
          '<td class="nm">'+esc(p.name)+'</td>'+
          '<td class="num">'+(p.ab||0)+'</td>'+
          '<td class="num'+((p.hits||0)>0?' hi':'')+'">'+(p.hits||0)+'</td>'+
          '<td class="num">'+(p.rbi||0)+'</td>'+
          '<td class="num'+((p.hr||0)>0?' hi':'')+'">'+(p.hr||0)+'</td>'+
          '<td class="num">'+fmtAvg(p.season_avg)+'</td></tr>';
      });
      h+='</tbody></table></div>';
      if(starter){
        h+='<div class="kv" style="margin-top:10px"><span class="k">先発投手</span>'+
           '<b>'+numBadge(sm.number)+' '+esc(starter.name)+'</b> <span class="sub2">'+
           esc(starter.innings||"")+'回 '+(starter.pitches||0)+'球 自責'+(starter.earned_runs||0)+
           (starter.season_era!=null?' ／ 防御率'+starter.season_era.toFixed(2):'')+'</span></div>';
      }
      h+='</div>';
    });
    h+='</div>';

    // ---- 途中出場・交代 ----
    h+=renderSubs(g, box, meta, sides);
    return h;
  }

  function renderSubs(g, box, meta, sides){
    var h='', any=false;
    sides.forEach(function(x){
      var side=x[0], team=x[1];
      var subBat=(box.batting[side]||[]).filter(function(p){return !p.is_starter;});
      var pitchers=(box.pitching&&box.pitching[side])||[];
      var relievers=pitchers.slice(1);   // 1人目は先発
      if(!subBat.length && !relievers.length) return;
      any=true;

      h+='<div class="card2"><h3 class="thead" style="border-left-color:'+
         (tColor(team)||'var(--accent)')+'">'+teamBadge(team)+' '+esc(team||side)+' 途中出場・交代</h3>';

      // 野手
      if(subBat.length){
        subBat.sort(function(a,b){
          var ma=metaOf(meta,a), mb=metaOf(meta,b);
          return (ma.firstBatN||99) - (mb.firstBatN||99);
        });
        h+='<div class="subsec"><div class="subttl">野手</div><div class="tblwrap">'+
           '<table class="stbl"><thead><tr><th>種類</th><th>位置</th><th>背番号</th>'+
           '<th class="nm">選手</th><th>打順</th><th>初打席</th>'+
           '<th>打数</th><th>安打</th><th>点</th></tr></thead><tbody>';
        subBat.forEach(function(p){
          var m=metaOf(meta,p);
          h+='<tr><td><span class="subtag">'+esc(p.sub_type||"交代")+'</span></td>'+
            '<td class="pos">'+esc(p.position||"")+'</td>'+
            '<td class="num unumcell">'+(m.number?esc(m.number):"-")+'</td>'+
            '<td class="nm">'+esc(p.name)+'</td>'+
            '<td class="num">'+(p.order?p.order+"番":"-")+'</td>'+
            '<td class="num">'+(m.firstBat?esc(m.firstBat):'<span class="dim">打席なし</span>')+'</td>'+
            '<td class="num">'+(p.ab||0)+'</td>'+
            '<td class="num'+((p.hits||0)>0?' hi':'')+'">'+(p.hits||0)+'</td>'+
            '<td class="num">'+(p.rbi||0)+'</td></tr>';
        });
        h+='</tbody></table></div></div>';
      }

      // 投手（継投）
      if(relievers.length){
        h+='<div class="subsec"><div class="subttl">投手（継投）</div><div class="tblwrap">'+
           '<table class="stbl"><thead><tr><th>順</th><th>背番号</th><th class="nm">選手</th>'+
           '<th>登板</th><th>回</th><th>球数</th><th>被安</th><th>奪三</th><th>四球</th>'+
           '<th>失点</th><th>自責</th><th></th></tr></thead><tbody>';
        relievers.forEach(function(p,i){
          var m=metaOf(meta,p);
          var dec=p.decision||"";
          var dcls=/勝/.test(dec)?"win":(/敗/.test(dec)?"lose":(dec?"save":""));
          h+='<tr><td class="num">'+(i+2)+'</td>'+
            '<td class="num unumcell">'+(m.number?esc(m.number):"-")+'</td>'+
            '<td class="nm">'+esc(p.name)+'</td>'+
            '<td class="num">'+(m.firstPitch?esc(m.firstPitch):'<span class="dim">-</span>')+'</td>'+
            '<td class="num">'+esc(p.innings||"")+'</td>'+
            '<td class="num">'+(p.pitches||0)+'</td>'+
            '<td class="num">'+(p.hits_allowed||0)+'</td>'+
            '<td class="num'+((p.so||0)>0?' hi':'')+'">'+(p.so||0)+'</td>'+
            '<td class="num">'+(p.bb||0)+'</td>'+
            '<td class="num">'+(p.runs_allowed||0)+'</td>'+
            '<td class="num">'+(p.earned_runs||0)+'</td>'+
            '<td><span class="dec '+dcls+'">'+esc(dec)+'</span></td></tr>';
        });
        h+='</tbody></table></div></div>';
      }
      h+='</div>';
    });

    if(any){
      h+='<div class="sub" style="font-size:11px;margin-top:6px">'+
         '※ 投手の「登板」は最初に投げた回で、実際の登板回そのものです。'+
         '野手の「初打席」は最初に打席が回った回なので、交代した回より後になることがあります'+
         '（守備交代や代走で打席が回らなかった場合は「打席なし」）。</div>';
    }
    return h;
  }

  /* ===== 配球分析タブ ===== */
  var pitchFilter = {pitcher:"all", type:"all"};

  function collectPitches(g){
    // 全投球をフラットな配列にする（投手・打者・状況つき）
    var out=[];
    (g.atbats||[]).forEach(function(ab){
      var p=ab.pitcher||{}, b=ab.batter||{};
      (ab.pitches||[]).forEach(function(pt){
        out.push({
          pitcher: p.name||"-", pitcher_id: p.player_id,
          batter: b.name||"-", bhand: b.hand||"",
          inning: ab.inning, tb: ab.top_bottom,
          type: pt.type||"不明", speed: pt.speed_kmh,
          result: pt.result||"", kind: pt.kind||"",
          course: pt.course||null,
          last: false
        });
      });
      // 打席の最終球に印
      if(out.length && (ab.pitches||[]).length) out[out.length-1].last=true;
    });
    return out;
  }

  function renderAnalysis(g){
    var all=collectPitches(g);
    if(!all.length) return notReady("配球データ");

    // 投手の一覧（投球数順）
    var byPitcher={};
    all.forEach(function(p){byPitcher[p.pitcher]=(byPitcher[p.pitcher]||0)+1;});
    var pitchers=Object.keys(byPitcher).sort(function(a,b){return byPitcher[b]-byPitcher[a];});

    // フィルタ適用
    var ps=all.filter(function(p){
      if(pitchFilter.pitcher!=="all" && p.pitcher!==pitchFilter.pitcher) return false;
      if(pitchFilter.type!=="all" && p.type!==pitchFilter.type) return false;
      return true;
    });

    // 球種一覧
    var types={};
    all.forEach(function(p){types[p.type]=(types[p.type]||0)+1;});
    var typeList=Object.keys(types).sort(function(a,b){return types[b]-types[a];});

    var h='<div class="toolbar">'+
      '<span class="lb">投手</span><select id="fp" onchange="onAnalysisFilter()">'+
      '<option value="all">全投手</option>'+
      pitchers.map(function(n){
        return '<option value="'+esc(n)+'"'+(pitchFilter.pitcher===n?" selected":"")+'>'+
               esc(n)+' ('+byPitcher[n]+')</option>';
      }).join("")+
      '</select>'+
      '<span class="lb">球種</span><select id="ft" onchange="onAnalysisFilter()">'+
      '<option value="all">全球種</option>'+
      typeList.map(function(t){
        return '<option value="'+esc(t)+'"'+(pitchFilter.type===t?" selected":"")+'>'+
               esc(t)+'</option>';
      }).join("")+
      '</select></div>';

    if(!ps.length) return h+'<div class="msg">該当する投球がありません</div>';

    // --- 球種割合 ---
    var tcount={};
    ps.forEach(function(p){tcount[p.type]=(tcount[p.type]||0)+1;});
    var tkeys=Object.keys(tcount).sort(function(a,b){return tcount[b]-tcount[a];});
    h+='<div class="card2"><h3>球種割合（'+ps.length+'球）</h3>';
    tkeys.forEach(function(t){
      var n=tcount[t], pct=Math.round(n/ps.length*1000)/10;
      // その球種の平均球速
      var sp=ps.filter(function(x){return x.type===t&&x.speed;});
      var avg=sp.length?Math.round(sp.reduce(function(s,x){return s+x.speed;},0)/sp.length):null;
      h+='<div class="bar-row"><div class="bar-lb">'+esc(t)+'</div>'+
         '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
         '<div class="bar-val">'+pct+'% <span class="sub2">'+n+'球'+
         (avg?' / 平均'+avg+'km/h':'')+'</span></div></div>';
    });
    h+='</div>';

    // --- 球速 ---
    var speeds=ps.filter(function(p){return p.speed;}).map(function(p){return p.speed;});
    if(speeds.length){
      var mx=Math.max.apply(null,speeds), mn=Math.min.apply(null,speeds);
      var av=Math.round(speeds.reduce(function(a,b){return a+b;},0)/speeds.length);
      h+='<div class="card2"><h3>球速</h3><div class="statrow">'+
        '<div class="stat"><div class="sv">'+mx+'</div><div class="sl">最速 km/h</div></div>'+
        '<div class="stat"><div class="sv">'+av+'</div><div class="sl">平均 km/h</div></div>'+
        '<div class="stat"><div class="sv">'+mn+'</div><div class="sl">最遅 km/h</div></div>'+
        '</div></div>';
    }

    // --- コースヒートマップ（5×5） ---
    h+='<div class="card2"><h3>コース分布（投手から見た位置）</h3>'+buildHeatmap(ps)+'</div>';

    // --- 結果別の投球 ---
    var kinds={strike:"ストライク系",ball:"ボール",hit:"安打",out:"凡打",bunt:"犠打"};
    var kc={};
    ps.forEach(function(p){if(p.kind) kc[p.kind]=(kc[p.kind]||0)+1;});
    var kk=Object.keys(kc);
    if(kk.length){
      h+='<div class="card2"><h3>投球結果の内訳</h3><div class="statrow">';
      kk.forEach(function(k){
        h+='<div class="stat"><div class="sv">'+kc[k]+'</div><div class="sl">'+(kinds[k]||k)+'</div></div>';
      });
      h+='</div></div>';
    }

    return h;
  }

  function onAnalysisFilter(){
    var fp=document.getElementById("fp"), ft=document.getElementById("ft");
    if(fp) pitchFilter.pitcher=fp.value;
    if(ft) pitchFilter.type=ft.value;
    document.getElementById("tabbody").innerHTML=renderAnalysis(curGame);
  }

  /* 5×5ヒートマップ */
  function buildHeatmap(ps){
    var grid={}, max=0;
    ps.forEach(function(p){
      var c=p.course;
      if(!c||c.grid_row==null||c.grid_col==null) return;
      var k=c.grid_row+"-"+c.grid_col;
      grid[k]=(grid[k]||0)+1;
      if(grid[k]>max) max=grid[k];
    });
    if(!max) return '<div class="sub">コースデータがありません</div>';

    var h='<div class="heat">';
    for(var r=0;r<5;r++){
      for(var c=0;c<5;c++){
        var n=grid[r+"-"+c]||0;
        var ratio=max?n/max:0;
        // ストライクゾーン（中央3x3）に枠
        var inZone=(r>=1&&r<=3&&c>=1&&c<=3);
        h+='<div class="hcell'+(inZone?' zone':'')+'" '+
           'style="background:rgba(232,89,12,'+(ratio*0.85).toFixed(2)+')" '+
           'title="'+n+'球">'+(n||"")+'</div>';
      }
    }
    h+='</div><div class="heat-lg"><span>少</span>'+
       '<span class="hgrad"></span><span>多</span>'+
       '<span style="margin-left:auto">枠内＝ストライクゾーン</span></div>';
    return h;
  }

  /* ===== 全打席タブ（従来の一球表示） ===== */
  function renderPitches(){
    var g=curGame;if(!g) return;
    var fe=document.getElementById("flt");
    var fv=fe?fe.value:"all";
    var body=document.getElementById("tabbody");

    var h='<div class="toolbar"><span class="lb">表示</span>'+
       '<select id="flt" onchange="renderPitches()">'+
         '<option value="all">全打席</option>'+
         '<option value="'+esc(g.away)+'">'+esc(g.away)+' の攻撃</option>'+
         '<option value="'+esc(g.home)+'">'+esc(g.home)+' の攻撃</option>'+
         '<option value="score">得点した打席</option>'+
         '<option value="hit">安打・本塁打</option>'+
       '</select>'+
       '<button class="btn" onclick="toggleAll(true)">全部ひらく</button>'+
       '<button class="btn" onclick="toggleAll(false)">全部とじる</button></div>';

    var groups={},order=[];
    (g.atbats||[]).forEach(function(ab){
      var rs=ab.result_summary||"";
      if(fv==="score" && !/＋\d+点/.test(rs)) return;
      if(fv==="hit" && !/安打|本塁打|塁打/.test(rs)) return;
      if(fv!=="all"&&fv!=="score"&&fv!=="hit"&&ab.batting_team!==fv) return;
      var k=ab.inning+"-"+ab.top_bottom;
      if(!groups[k]){groups[k]=[];order.push(k);}
      groups[k].push(ab);
    });

    if(!order.length){
      body.innerHTML=h+'<div class="msg">該当する打席がありません</div>';
      var s0=document.getElementById("flt");if(s0)s0.value=fv;
      return;
    }

    order.forEach(function(k,gi){
      var abs=groups[k],first=abs[0],pts=0,np=0;
      abs.forEach(function(a){
        var m=/＋(\d+)点/.exec(a.result_summary||"");
        if(m) pts+=parseInt(m[1],10);
        np+=(a.pitch_count||0);
      });
      h+='<div class="inn'+(gi<2?' open':'')+'" id="inn-'+first.inning+'-'+first.top_bottom+'">'+
        '<div class="inn-h" onclick="this.parentNode.classList.toggle(\'open\')">'+
          '<div><span class="inn-t">'+first.inning+'回'+first.top_bottom+'</span> '+
          '<span class="inn-m">'+esc(first.batting_team||"")+' の攻撃</span></div>'+
          '<div><span class="inn-m">'+abs.length+'打席 / '+np+'球'+
          (pts?' <b style="color:var(--accent)">'+pts+'点</b>':'')+'</span> '+
          '<span class="caret">▶</span></div></div><div class="inn-b">';

      abs.forEach(function(ab){
        var b=ab.batter||{},p=ab.pitcher||{},r=ab.runners||{};
        // 走者表示（推定名つき）
        var rn=ab._runnerNames||{};
        var rparts=[];
        if(r.first) rparts.push("一塁 "+(rn[1]&&rn[1]!=="?"?rn[1]:"?"));
        if(r.second) rparts.push("二塁 "+(rn[2]&&rn[2]!=="?"?rn[2]:"?"));
        if(r.third) rparts.push("三塁 "+(rn[3]&&rn[3]!=="?"?rn[3]:"?"));
        var rtext=rparts.length?rparts.join(" ／ ")+' <span style="font-size:10px;color:var(--muted)">(推定)</span>':"走者なし";
        h+='<div class="ab"><div class="ab-h"><div class="ab-p">'+
          '<span class="lbl">打者</span> <b>'+esc(b.name||"-")+'</b> '+
          '<span class="no">'+(b.number?"#"+b.number:"")+'</span> '+
          '<span class="lbl">'+esc(b.hand||"")+'</span><br>'+
          '<span class="lbl">投手</span> <b>'+esc(p.name||"-")+'</b> '+
          '<span class="no">'+(p.number?"#"+p.number:"")+'</span> '+
          '<span class="lbl">'+esc(p.hand||"")+'</span><br>'+
          '<span class="lbl">走者</span> <span style="font-size:12px">'+rtext+'</span><br>'+
          '<span class="res '+rcls(ab.result_summary)+'">'+esc(ab.result_summary||"")+'</span>'+
          '</div>'+buildSitu(ab)+'</div>';
        h+=buildChart(ab);
        h+=buildField(ab);
        (ab.pitches||[]).forEach(function(pt){
          var c=(pt.course&&pt.course.label)?pt.course.label:"-";
          var kc=pt.kind?(" k-"+pt.kind):"";
          h+='<div class="pt"><div class="pt-n'+kc+'">'+(pt.no==null?"":pt.no)+'</div>'+
            '<div><span class="pt-t">'+esc(pt.type||"")+'</span> '+
            '<span class="pt-s">'+(pt.speed_kmh?pt.speed_kmh+"km/h":"")+'</span>'+
            '<div class="pt-c">'+esc(c)+'</div></div>'+
            '<div class="pt-r '+rcls(pt.result)+'">'+esc(pt.result||"")+'</div></div>';
        });
        h+='</div>';
      });
      h+='</div></div>';
    });

    body.innerHTML=h;
    var sel=document.getElementById("flt");if(sel) sel.value=fv;
  }

  function toggleAll(open){
    var l=document.querySelectorAll(".inn"),i;
    for(i=0;i<l.length;i++){
      if(open) l[i].classList.add("open"); else l[i].classList.remove("open");
    }
  }
  function fmtDate(t){
    var y=t.getFullYear();
    var m=("0"+(t.getMonth()+1)).slice(-2);
    var d=("0"+t.getDate()).slice(-2);
    return y+"-"+m+"-"+d;
  }
  function shift(n){
    var t=new Date(dp.value+"T00:00:00");
    t.setDate(t.getDate()+n);
    dp.value=fmtDate(t);
    loadDay();
  }
  function today(){dp.value=todayJST();loadDay();}
  dp.addEventListener("change",loadDay);
  // 初期表示はダッシュボード
  dp.value=todayJST();
  setView("dash");
</script>
</body>
</html>
