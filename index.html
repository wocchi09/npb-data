<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB SCOREBOARD</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9F0;--panel:#FFFFFF;--panel2:#FFF4E3;
    --line:#F0D9B5;--line2:#E5C596;
    --ink:#3D2510;--ink2:#6B4A28;--muted:#9A7B57;
    --accent:#E8590C;--accent2:#F59F00;--gold:#FFC93C;
    --hit:#D9480F;--out:#1C7ED6;
    --board-bg:#2B1B0E;--board-ink:#FFD43B;--board-line:#5A4028;
    --field:#2F6B3A;--field2:#C9A227;--dirt:#B07C4A;
    --shadow:0 2px 10px rgba(120,70,20,.10);
  }
  [data-theme="dark"]{
    --bg:#1A1208;--panel:#241809;--panel2:#2E1F0D;
    --line:#3D2A13;--line2:#54391B;
    --ink:#FFF0DB;--ink2:#E8CFA8;--muted:#A98858;
    --accent:#FF922B;--accent2:#FFC93C;--gold:#FFD43B;
    --hit:#FFA94D;--out:#74C0FC;
    --board-bg:#120C05;--board-ink:#FFD43B;--board-line:#3D2A13;
    --field:#1E4A28;--field2:#8A6415;--dirt:#7A5433;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;font-size:15.5px;line-height:1.75;transition:background .2s,color .2s;}
  .wrap{max-width:1600px;margin:0 auto;padding:0 20px 60px;}
  /* 試合ビュー・シーズン成績は読みやすさ優先で幅を抑える */
  #gameView,#seasonView{max-width:1100px;margin:0 auto;}

  .hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
    padding:18px 0 16px;margin-bottom:16px;}
  .hero-in{max-width:900px;margin:0 auto;padding:0 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .hero h1{font-family:'Roboto Mono',monospace;font-weight:700;
    font-size:clamp(19px,4.6vw,26px);color:#fff;letter-spacing:.16em;
    text-shadow:0 2px 6px rgba(120,50,0,.35);}
  .hero p{font-size:11px;color:rgba(255,255,255,.9);letter-spacing:.15em;}
  .theme-btn{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);
    color:#fff;font-size:19px;font-weight:700;width:42px;height:42px;
    border-radius:10px;cursor:pointer;flex-shrink:0;}
  .theme-btn:hover{background:rgba(255,255,255,.34);}

  .datebar{background:var(--panel);border:2px solid var(--line);
    border-radius:12px;padding:12px;box-shadow:var(--shadow);}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  input[type=date]{font-family:inherit;font-size:16px;font-weight:700;
    background:var(--panel2);color:var(--ink);border:2px solid var(--line2);
    border-radius:9px;padding:9px 11px;flex:1 1 160px;min-width:150px;}
  [data-theme="dark"] input[type=date]{color-scheme:dark;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;background:var(--panel2);
    color:var(--accent);border:2px solid var(--line2);border-radius:9px;
    padding:9px 13px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

  .games{margin-top:14px;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
  .game{background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s,border-color .12s;}
  .game:hover{border-color:var(--accent);transform:translateY(-2px);}
  .game.on{border-color:var(--accent);background:var(--panel2);}
  .gcard{font-size:17px;font-weight:700;}
  .gscore{font-size:19px;font-weight:700;display:flex;align-items:baseline;
    gap:7px;flex-wrap:wrap;}
  .gscore .w{color:var(--accent);}
  .gscore .dash{color:var(--muted);font-size:15px;}
  .gscore .gstate{font-size:10.5px;color:var(--muted);font-weight:500;
    border:1px solid var(--line2);border-radius:20px;padding:1px 7px;margin-left:2px;}
  .gpit{font-size:12px;color:var(--ink2);margin-top:5px;}
  .gpit b{color:var(--accent);font-weight:700;font-size:11px;}
  .ghr{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .gmeta{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .board{background:var(--board-bg);border-radius:12px;padding:12px;
    margin-top:16px;overflow-x:auto;box-shadow:var(--shadow);}
  table.sb{border-collapse:collapse;width:100%;min-width:420px;
    font-family:'Roboto Mono',monospace;}
  table.sb th,table.sb td{border:1px solid var(--board-line);padding:6px 4px;
    text-align:center;min-width:28px;color:var(--board-ink);font-size:16px;font-weight:500;}
  table.sb th{font-size:12px;color:#C9A227;}
  table.sb td.team{text-align:left;padding-left:10px;min-width:100px;
    font-family:'BIZ UDPGothic',sans-serif;font-weight:700;font-size:14px;
    color:#FFF3D6;white-space:nowrap;}
  table.sb td.total{color:#fff;font-weight:700;background:rgba(255,212,59,.12);}
  table.sb td.cell:hover{background:rgba(255,212,59,.22);}
  table.sb .win{color:#FFD43B;}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;
    padding:11px 13px;background:var(--panel);border:2px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);}
  .toolbar .lb{font-size:12px;color:var(--muted);font-weight:700;}
  select{font-family:inherit;font-size:13px;font-weight:700;background:var(--panel2);
    color:var(--ink);border:2px solid var(--line2);border-radius:9px;
    padding:7px 9px;cursor:pointer;}

  .inn{margin-top:12px;background:var(--panel);border:2px solid var(--line);
    border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .inn-h{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 14px;cursor:pointer;background:var(--panel2);}
  .inn-h:hover{background:var(--line);}
  .inn-t{font-size:15px;font-weight:700;color:var(--accent);}
  .inn-m{font-size:11.5px;color:var(--muted);font-weight:500;}
  .caret{color:var(--accent);font-size:13px;transition:transform .15s;}
  .inn.open .caret{transform:rotate(90deg);}
  .inn-b{display:none;}
  .inn.open .inn-b{display:block;}

  .ab{border-top:2px solid var(--line);}
  /* 打席ヘッダ：左＝選手情報 / 右＝ダイヤモンド＋カウント */
  .ab-h{display:grid;grid-template-columns:1fr auto;gap:12px;
    padding:11px 14px;align-items:start;}
  .ab-p{font-size:13.5px;line-height:1.75;}
  .ab-p b{font-weight:700;}
  .ab-p .lbl{color:var(--muted);font-size:11.5px;}
  .no{font-family:'Roboto Mono',monospace;color:var(--accent2);font-size:11.5px;}
  .res{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;
    background:var(--accent);padding:3px 10px;border-radius:20px;margin-top:5px;}
  .res.hit{background:var(--hit);}
  .res.out{background:var(--out);}

  /* ---- ダイヤモンド（走者図） ---- */
  .situ{display:flex;gap:10px;align-items:center;flex-shrink:0;}
  .dia{width:58px;height:58px;position:relative;}
  .bs{position:absolute;width:14px;height:14px;background:var(--panel2);
    border:2px solid var(--line2);transform:rotate(45deg);}
  .bs.on{background:var(--gold);border-color:var(--accent);}
  .bs.b1{right:0;top:22px;} .bs.b2{left:22px;top:0;} .bs.b3{left:0;top:22px;}
  .bs.home{left:22px;bottom:0;top:auto;background:var(--line2);border-color:var(--muted);}
  .cnt{font-size:11px;line-height:1.5;}
  .cnt .row{display:flex;align-items:center;gap:4px;}
  .cnt .k{width:12px;font-weight:700;color:var(--muted);font-family:'Roboto Mono',monospace;}
  .dotc{width:9px;height:9px;border-radius:50%;background:var(--panel2);
    border:1.5px solid var(--line2);display:inline-block;}
  .dotc.b{background:#40C057;border-color:#2B8A3E;}
  .dotc.s{background:#FAB005;border-color:#E67700;}
  .dotc.o{background:#FA5252;border-color:#C92A2A;}

  /* ---- 打球方向フィールド ---- */
  .fieldbox{margin:4px 14px 10px;padding:8px;background:var(--panel2);
    border:2px solid var(--line);border-radius:10px;
    display:flex;gap:12px;align-items:center;}
  .fieldsvg{width:110px;height:92px;flex-shrink:0;}
  .fieldtxt{font-size:12px;color:var(--ink2);line-height:1.7;}
  .fieldtxt b{color:var(--accent);font-weight:700;}

  .pt{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
    padding:7px 14px;border-top:1px dashed var(--line);}
  .pt-n{width:24px;height:24px;line-height:21px;text-align:center;
    font-family:'Roboto Mono',monospace;font-size:12px;border-radius:50%;
    background:var(--panel2);border:2px solid var(--line2);color:var(--accent);}
  .pt-n.k-ball{border-color:#40C057;color:#2B8A3E;}
  .pt-n.k-strike{border-color:#FAB005;color:#E67700;}
  .pt-n.k-hit{border-color:var(--accent);background:var(--accent);color:#fff;}
  .pt-n.k-out{border-color:#1C7ED6;color:#1C7ED6;}
  .pt-t{font-size:14px;font-weight:700;}
  .pt-s{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--accent);font-size:14.5px;letter-spacing:-.02em;}
  .pt-c{font-size:11px;color:var(--muted);}
  .pt-r{font-size:12.5px;text-align:right;color:var(--ink2);font-weight:700;}
  .pt-r.hit{color:var(--hit);} .pt-r.out{color:var(--out);}

  /* ---- タブ ---- */
  .tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;
    padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .tab{flex-shrink:0;font-family:inherit;font-size:14px;font-weight:700;
    padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;
    background:var(--panel2);color:var(--muted);
    border:2px solid var(--line);border-bottom:none;}
  .tab:hover{color:var(--accent);}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---- 成績カード・テーブル ---- */
  .card2{background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:14px;margin-top:12px;box-shadow:var(--shadow);}
  .card2 h3{font-size:15px;color:var(--accent);margin-bottom:10px;}
  .kv{display:flex;gap:10px;align-items:baseline;padding:4px 0;
    border-bottom:1px dashed var(--line);font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);font-size:12px;min-width:70px;}
  .kv .sub{color:var(--muted);font-size:12px;}
  .card2 .sub{color:var(--ink2);font-size:13px;}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.stbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;}
  table.stbl th{background:var(--panel2);color:var(--muted);font-size:11.5px;
    padding:7px 6px;white-space:nowrap;position:sticky;top:0;
    border-bottom:2px solid var(--line);}
  table.stbl td{padding:7px 6px;border-bottom:1px solid var(--line);
    white-space:nowrap;text-align:center;}
  table.stbl td.nm,table.stbl th.nm{text-align:left;font-weight:700;
    position:sticky;left:0;background:var(--panel);min-width:88px;}
  table.stbl th.nm{background:var(--panel2);}
  table.stbl td.num{font-family:'Roboto Mono',monospace;}
  table.stbl td.hi{color:var(--accent);font-weight:700;}
  table.stbl tr:hover td{background:var(--panel2);}
  .dec{display:inline-block;font-size:11px;font-weight:700;min-width:20px;}
  .dec.win{color:var(--accent);} .dec.lose{color:var(--out);}
  .dec.save{color:var(--accent2);}

  /* ---- ダッシュボード ---- */
  .dash-sec{margin-top:16px;background:var(--panel);border:2px solid var(--line);
    border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  .dash-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;
    margin-bottom:12px;}
  .dash-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .dash-date{margin-left:auto;font-size:12px;color:var(--muted);
    font-family:'Roboto Mono',monospace;}
  .dash-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;margin-bottom:12px;}
  .dgame{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;cursor:pointer;transition:border-color .15s;}
  .dgame:hover{border-color:var(--accent);}
  .dg-score{font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;
    display:flex;align-items:baseline;gap:5px;}
  .dg-score .w{color:var(--accent);}
  .dg-score .dash{color:var(--muted);font-size:13px;}
  .dg-pit{font-size:11px;color:var(--muted);margin-top:3px;}

  .rankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;margin-bottom:12px;}
  .rankcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;}
  .rankcard h4{font-size:13px;color:var(--accent);margin-bottom:6px;
    border-bottom:2px solid var(--line);padding-bottom:5px;}
  .rankrow{display:grid;grid-template-columns:20px 1fr auto auto;gap:6px;
    align-items:center;padding:4px 0;font-size:13px;cursor:pointer;}
  .rankrow:hover{color:var(--accent);}
  .rankrow .rk{font-family:'Roboto Mono',monospace;color:var(--muted);
    font-weight:700;text-align:center;}
  .rankrow .rn{font-weight:700;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .rankrow .rt{font-size:10px;color:var(--muted);white-space:nowrap;}
  .rankrow .rv{font-family:'Roboto Mono',monospace;font-weight:700;
    color:var(--accent);}

  .stabs.gtabs{margin-top:-2px;}
  .stabs.gtabs .stab{flex:1;max-width:200px;}

  /* ---- データ出力 ---- */
  .expsec{margin-top:14px;}
  .expsec:first-child{margin-top:0;}
  .expsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
  .expset{display:flex;flex-direction:column;gap:2px;cursor:pointer;
    background:var(--panel2);border:2px solid var(--line);border-radius:10px;
    padding:10px 12px;}
  .expset.on{border-color:var(--accent);background:var(--zone);}
  .expset input{display:none;}
  .expset .et{font-weight:700;font-size:14px;}
  .expset .ed{font-size:11px;color:var(--muted);line-height:1.4;}
  .expform{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .ef{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);}
  .ef input,.ef select{font-family:inherit;font-size:14px;padding:8px 10px;
    border-radius:8px;border:2px solid var(--line);background:var(--panel);
    color:var(--ink);}
  .expbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .exresult{margin-top:10px;}
  .exok{font-size:13px;font-weight:700;color:var(--accent);
    background:var(--zone);border:1px solid var(--line2);border-radius:8px;
    padding:9px 12px;}
  .explinks{display:flex;flex-wrap:wrap;gap:10px;}
  .explink{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;}
  .explink a{color:var(--accent);font-weight:700;margin-left:5px;}

  /* ---- スタメン・途中交代 ---- */
  .lineupwrap{display:grid;grid-template-columns:1fr;gap:0;}
  @media(min-width:1000px){
    .lineupwrap{grid-template-columns:1fr 1fr;gap:12px;}
    .lineupwrap>.card2{margin-top:12px;}
  }
  table.lineuptbl{min-width:480px;}
  table.lineuptbl td.ord{font-weight:700;font-size:15px;color:var(--accent);}
  table.stbl td.pos{font-size:12px;white-space:nowrap;}
  table.stbl td.unumcell{font-family:'Roboto Mono',monospace;color:var(--muted);
    font-size:12px;}
  .unum{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--muted);
    font-weight:400;}
  .subsec{margin-top:10px;}
  .subsec:first-child{margin-top:0;}
  .subttl{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;
    padding-left:3px;border-left:3px solid var(--line2);}
  .subtag{display:inline-block;font-size:10px;font-weight:700;padding:2px 5px;
    border-radius:3px;background:var(--accent2);color:#fff;line-height:1;
    vertical-align:middle;white-space:nowrap;}
  .dim{color:var(--muted);font-size:11px;}

  /* ---- 規定到達マーク ---- */
  .qmark{display:inline-block;margin-left:5px;font-size:9.5px;font-weight:700;
    line-height:1;padding:2px 4px;border-radius:3px;vertical-align:middle;
    background:var(--accent);color:#fff;}

  /* ---- ダッシュボードのリーグ別グループ ---- */
  .lgroup{margin-bottom:14px;}
  .lgroup-h{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;
    border-left:4px solid var(--accent);padding-left:8px;margin-bottom:7px;}
  .lgroup-h .sub2{font-weight:400;}

  /* ---- ダッシュボードのレイアウト ---- */
  .dashgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start;}
  .dash-main,.dash-side{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .dash-main>.dash-sec,.dash-side>.dash-sec{margin-top:0;}
  @media(min-width:1100px){
    .dashgrid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);}
  }

  /* 概況タイル */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:12px 10px;text-align:center;}
  .tile .tv{font-family:'Roboto Mono',monospace;font-size:24px;font-weight:700;
    color:var(--accent);line-height:1.1;}
  .tile .tl{font-size:11px;color:var(--muted);margin-top:3px;}

  /* ---- データカレンダー ---- */
  .calnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
  .callabel{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;
    min-width:110px;text-align:center;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cdow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);
    padding:4px 0;}
  .cdow.sun{color:#E03131;} .cdow.sat{color:#1C7ED6;}
  .cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);position:relative;}
  .cday.empty{border:none;background:none;}
  .cday .cnum{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;}
  .cday.none .cnum{color:var(--muted);opacity:.55;}
  .cday.has{background:var(--accent);border-color:var(--accent);cursor:pointer;}
  .cday.has .cnum{color:#fff;}
  .cday.has .ccnt{font-size:9.5px;color:#fff;opacity:.9;line-height:1;margin-top:1px;}
  .cday.has:hover{filter:brightness(1.12);}
  .cday.today{outline:2px solid var(--accent2);outline-offset:1px;}
  .callegend{display:flex;align-items:center;gap:6px;margin-top:10px;
    font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .cbox{width:12px;height:12px;border-radius:3px;display:inline-block;
    border:1px solid var(--line);}
  .cbox.has{background:var(--accent);border-color:var(--accent);}
  .cbox.none{background:var(--panel2);margin-left:8px;}

  /* ---- 順位表 ---- */
  .stabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .stab{font-family:inherit;font-size:13px;font-weight:700;padding:7px 16px;
    border-radius:20px;cursor:pointer;background:var(--panel2);
    color:var(--muted);border:2px solid var(--line);}
  .stab:hover{color:var(--sc);border-color:var(--sc);}
  .stab.on{background:var(--sc);color:#fff;border-color:var(--sc);}
  table.standtbl{min-width:620px;}
  table.standtbl td.rank{font-weight:700;font-size:14px;}
  table.standtbl td.plus{color:var(--accent);font-weight:700;}
  table.standtbl td.minus{color:var(--out);}
  table.standtbl tbody tr:first-child td.rank{color:var(--accent);}

  /* ---- チーム略称バッジ・リーグ表示 ---- */
  .tmini{display:inline-block;font-family:'Roboto Mono',monospace;font-size:10.5px;
    font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;
    vertical-align:middle;letter-spacing:0;min-width:14px;text-align:center;
    border:1px solid rgba(0,0,0,.18);}
  .lgbadge{display:inline-block;color:#fff;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:20px;vertical-align:middle;}
  h3.thead{border-left:5px solid var(--accent);padding-left:9px;
    display:flex;align-items:center;gap:6px;}

  /* ---- ビュー切替 ---- */
  .viewswitch{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .vbtn{flex:1 1 130px;font-family:inherit;font-size:14.5px;font-weight:700;
    padding:12px;border-radius:12px;cursor:pointer;
    background:var(--panel);color:var(--muted);
    border:2px solid var(--line);box-shadow:var(--shadow);}
  .vbtn:hover{color:var(--accent);border-color:var(--accent);}
  .vbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  .lnk{cursor:pointer;}
  .stbl tr[onclick]{cursor:pointer;}
  .stbl td.lnk{color:var(--accent);}
  .pcard{border-color:var(--accent);}

  /* ---- 配球分析 ---- */
  .bar-row{display:grid;grid-template-columns:80px 1fr auto;gap:10px;
    align-items:center;padding:5px 0;font-size:13px;}
  .bar-lb{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{background:var(--panel2);border-radius:20px;height:16px;overflow:hidden;
    border:1px solid var(--line);}
  .bar-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));
    height:100%;border-radius:20px;min-width:2px;}
  .bar-val{font-family:'Roboto Mono',monospace;font-size:12.5px;
    white-space:nowrap;color:var(--accent);font-weight:700;}
  .sub2{color:var(--muted);font-weight:400;font-size:11px;}

  .statrow{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1 1 80px;text-align:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 6px;}
  .stat .sv{font-family:'Roboto Mono',monospace;font-size:22px;
    font-weight:700;color:var(--accent);}
  .stat .sl{font-size:11px;color:var(--muted);margin-top:2px;}

  .heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
    max-width:280px;margin:0 auto;}
  .hcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;
    border:1px solid var(--line);border-radius:4px;color:var(--ink);}
  .hcell.zone{border-color:var(--accent);border-width:2px;}
  .heat-lg{display:flex;align-items:center;gap:6px;margin-top:10px;
    font-size:11px;color:var(--muted);}
  .hgrad{width:60px;height:10px;border-radius:5px;
    background:linear-gradient(90deg,rgba(232,89,12,.1),rgba(232,89,12,.85));}

  /* ---- 配球チャート（打席単位） ---- */
  .chartbox{margin:4px 14px 10px;padding:8px;background:var(--panel2);
    border:2px solid var(--line);border-radius:10px;
    display:flex;gap:12px;align-items:center;}
  .chartsvg{width:120px;height:120px;flex-shrink:0;}
  .charttxt{font-size:12px;color:var(--ink2);line-height:1.6;}
  .charttitle{font-weight:700;color:var(--accent);margin-bottom:4px;}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;}
  .lgd{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .chartnote{font-size:10px;color:var(--muted);margin-top:4px;}

  .msg{margin-top:16px;padding:30px 14px;text-align:center;
    border:2px dashed var(--line2);border-radius:12px;
    color:var(--muted);font-size:14px;line-height:2;}
  .foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.9;
    border-top:2px solid var(--line);padding-top:12px;}
  @media(max-width:560px){
    .games{grid-template-columns:1fr;}
    .ab-h{grid-template-columns:1fr;}
    .situ{margin-top:6px;}
    .pt{grid-template-columns:24px 1fr;}
    .pt-r{grid-column:2;text-align:left;padding-top:2px;}
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-in">
      <div><h1>NPB SCOREBOARD</h1><p>PITCH BY PITCH DATA</p></div>
      <button class="theme-btn" id="tb" onclick="toggleTheme()" title="ライト／ダーク切替">◐</button>
    </div>
  </div>

  <div class="wrap">
    <div class="viewswitch">
      <button class="vbtn on" id="vb-dash" onclick="setView('dash')">ホーム</button>
      <button class="vbtn" id="vb-games" onclick="setView('games')">試合</button>
      <button class="vbtn" id="vb-season" onclick="setView('season')">シーズン成績</button>
      <button class="vbtn" id="vb-players" onclick="setView('players')">選手一覧</button>
      <button class="vbtn" id="vb-export" onclick="setView('export')">データ出力</button>
    </div>

    <div id="dashView"></div>

    <div id="gameView" style="display:none">
      <div class="datebar">
        <div class="drow">
          <input type="date" id="dp">
          <button class="btn" onclick="shift(-1)">◀ 前日</button>
          <button class="btn primary" onclick="today()">今日</button>
          <button class="btn" onclick="shift(1)">翌日 ▶</button>
        </div>
      </div>
      <div id="games" class="games"></div>
      <div id="detail"></div>
    </div>

    <div id="seasonView" style="display:none"></div>

    <div id="playersView" style="display:none"></div>

    <div id="exportView" style="display:none"></div>

    <div class="foot">
      ▸ データは毎晩 JST 23時台に自動収集。過去の日付は Actions の「Run workflow」で収集できます。<br>
      ▸ 得点・カウントは打席データからの推定値です。コースは配球図座標の近似です。
    </div>
  </div>

<script>
  var dp=document.getElementById("dp"),
      gamesEl=document.getElementById("games"),
      detailEl=document.getElementById("detail"),
      curGame=null;

  function applyTheme(t){
    if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    document.getElementById("tb").textContent=(t==="dark")?"☀":"☾";
    try{localStorage.setItem("npbTheme",t);}catch(e){}
  }
  function toggleTheme(){
    var c=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
    applyTheme(c==="dark"?"light":"dark");
  }
  (function(){var t="light";try{t=localStorage.getItem("npbTheme")||"light";}catch(e){}applyTheme(t);})();

  function todayJST(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
  function sumPath(d){var p=d.split("-");return "data/"+p[0]+"/"+p[1]+"/"+p[2]+"/_summary.json";}
  function gamePath(d,g){var p=d.split("-");return "data/"+p[0]+"/"+p[1]+"/"+p[2]+"/"+g+".json";}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

  /* ===== 12球団のメタ情報（略称・リーグ・チームカラー） ===== */
  var TEAM_META={
    "巨人":       {mini:"巨", league:"セ", color:"#FF6600"},
    "阪神":       {mini:"神", league:"セ", color:"#FFE100"},
    "ヤクルト":   {mini:"ヤ", league:"セ", color:"#021C3A"},
    "DeNA":       {mini:"De", league:"セ", color:"#0052CD"},
    "広島":       {mini:"広", league:"セ", color:"#FF0000"},
    "中日":       {mini:"中", league:"セ", color:"#003595"},
    "ソフトバンク":{mini:"ソ", league:"パ", color:"#FFCC00"},
    "日本ハム":   {mini:"日", league:"パ", color:"#002B5C"},
    "ロッテ":     {mini:"ロ", league:"パ", color:"#000000"},
    "楽天":       {mini:"楽", league:"パ", color:"#8B0000"},
    "オリックス": {mini:"オ", league:"パ", color:"#000020"},
    "西武":       {mini:"西", league:"パ", color:"#002D62"}
  };
  var LEAGUE_COLOR={"セ":"#009E52","パ":"#0095D9"};
  var LEAGUE_NAME={"セ":"セントラル・リーグ","パ":"パシフィック・リーグ"};

  function tMeta(t){return TEAM_META[t]||null;}
  function tMini(t){var m=tMeta(t);return m?m.mini:(t||"");}
  function tLeague(t){var m=tMeta(t);return m?m.league:null;}
  function tColor(t){var m=tMeta(t);return m?m.color:null;}

  /* 背景色の明るさから文字色を決める（黄色系は黒字、濃色は白字） */
  function lumOf(hex){
    if(!hex||hex.charAt(0)!=="#") return 0.5;
    var h=hex.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return (0.299*r+0.587*g+0.114*b)/255;
  }
  function tTextColor(t){
    var c=tColor(t);
    return (c && lumOf(c)>0.62) ? "#1a1a1a" : "#fff";
  }

  /* チーム略称バッジ（チームカラー付き） */
  function teamBadge(team){
    var m=tMeta(team);
    if(!m) return "";
    return '<span class="tmini" style="background:'+m.color+';color:'+tTextColor(team)+'">'
      +esc(m.mini)+'</span>';
  }
  /* 選手名＋（略称） */
  function withTeam(name, team){
    if(!name) return "";
    var b=teamBadge(team);
    return esc(name)+(b?" "+b:"");
  }
  /* 得点差から責任投手の所属チームを判定する */
  function pitcherTeam(g, kind){
    var res=g.result||{};
    var hs=res.home_score, as_=res.away_score;
    if(hs==null||as_==null) return null;
    var winTeam = hs>as_ ? g.home : (as_>hs ? g.away : null);
    var loseTeam = hs>as_ ? g.away : (as_>hs ? g.home : null);
    if(kind==="lose") return loseTeam;
    return winTeam;   // 勝利・セーブは勝ったチーム
  }
  /* 本塁打の打者がどちらのチームかを出場成績から探す（姓の一致で判定） */
  function batterTeam(g, name){
    var box=g.boxscore;
    if(!box||!box.batting||!name) return null;
    var target=String(name).replace(/\s|　/g,"");
    var sides=[["away",g.away],["home",g.home]];
    for(var i=0;i<sides.length;i++){
      var rows=box.batting[sides[i][0]]||[];
      for(var j=0;j<rows.length;j++){
        var full=String(rows[j].name||"").replace(/\s|　/g,"");
        if(full===target || full.indexOf(target)===0) return sides[i][1];
      }
    }
    return null;
  }
  function rcls(r){
    if(!r) return "";
    if(/本塁打|安打|塁打|適時|四球|死球|安$|本$|２$|2$/.test(r)) return "hit";
    if(/三振|ゴロ|フライ|併殺|邪飛|直|飛$|犠/.test(r)) return "out";
    return "";
  }

  /* スコアボード（H/E付き・イニングセルはタップでジャンプ） */
  function buildBoard(g){
    var maxInn=1,i,away={},home={};
    var hitA=0,hitH=0,errA=0,errH=0;
    (g.atbats||[]).forEach(function(ab){
      if(ab.inning>maxInn) maxInn=ab.inning;
      var rs=ab.result_summary||"";
      var m=/＋(\d+)点/.exec(rs);
      var pts=m?parseInt(m[1],10):0;
      var isTop=(ab.top_bottom==="表");
      var t=isTop?away:home;
      t[ab.inning]=(t[ab.inning]||0)+pts;
      // H: 攻撃側の安打（安打・2塁打・3塁打・本塁打）
      if(/安打|２塁打|２塁打|2塁打|二塁打|三塁打|3塁打|塁打|本塁打/.test(rs)&&!/併殺/.test(rs)){
        if(isTop) hitA++; else hitH++;
      }
      // E: 守備側のエラー
      if(/エラー/.test(rs)){
        if(isTop) errH++; else errA++;
      }
    });
    if(maxInn<9) maxInn=9;
    var ta=0,th=0;
    for(i=1;i<=maxInn;i++){ta+=(away[i]||0);th+=(home[i]||0);}
    // 公式スコアがあれば計欄はそちらを使う
    var offA=null,offH=null,official=false;
    if(g.final_score&&g.final_score.length){
      g.final_score.forEach(function(s){
        if(s.team===g.away) offA=s.score;
        if(s.team===g.home) offH=s.score;
      });
      if(offA!=null&&offH!=null){ta=offA;th=offH;official=true;}
    }
    var h='<div class="board"><table class="sb"><thead><tr><th class="team"></th>';
    for(i=1;i<=maxInn;i++) h+='<th>'+i+'</th>';
    h+='<th>計</th><th>安</th><th>失</th></tr></thead><tbody>';
    [[g.away,away,ta,hitA,errA,"表"],[g.home,home,th,hitH,errH,"裏"]].forEach(function(row){
      h+='<tr><td class="team">'+esc(row[0]||"-")+'</td>';
      for(i=1;i<=maxInn;i++){
        var v=row[1][i];
        h+='<td class="cell" onclick="jumpInn('+i+',\''+row[5]+'\')" '+
           'style="cursor:pointer">'+(v==null?"-":v)+'</td>';
      }
      var win=(row[2]===Math.max(ta,th)&&ta!==th);
      h+='<td class="total'+(win?" win":"")+'">'+row[2]+'</td>'+
         '<td>'+row[3]+'</td><td>'+row[4]+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div style="font-size:11px;color:var(--muted);margin-top:6px;">'+
       (official?'※ 合計は公式スコア／イニング別・安・失は打席結果からの推定値':'※ 得点・安打・失策は打席結果からの推定値')+
       '／数字をタップするとそのイニングに移動します</div>';
    return h;
  }

  /* イニングへジャンプ（閉じてたら開く） */
  function jumpInn(inning,tb){
    var el=document.getElementById("inn-"+inning+"-"+tb);
    if(!el) return;
    el.classList.add("open");
    el.scrollIntoView({behavior:"smooth",block:"start"});
  }

  /* ダイヤモンド＋カウント（B緑・S黄・O赤）本塁なし */
  function buildSitu(ab){
    var r=ab.runners||{},c=ab.count||{};
    var h='<div class="situ"><div class="dia">'+
      '<div class="bs b2'+(r.second?" on":"")+'"></div>'+
      '<div class="bs b3'+(r.third?" on":"")+'"></div>'+
      '<div class="bs b1'+(r.first?" on":"")+'"></div>'+
      '</div><div class="cnt">';
    var rows=[["B",c.ball||0,3,"b"],["S",c.strike||0,2,"s"],["O",c.out||0,2,"o"]];
    rows.forEach(function(x){
      h+='<div class="row"><span class="k">'+x[0]+'</span>';
      for(var i=0;i<x[2];i++){
        h+='<span class="dotc '+(i<x[1]?x[3]:"")+'"></span>';
      }
      h+='</div>';
    });
    h+='</div></div>';
    return h;
  }

  /* ---- 走者名の推定エンジン ----
     打席の流れをシミュレートして「誰が塁にいるか」を推定する。
     各打席の塁コード(b110等)は公式値なので、毎打席それと答え合わせし、
     矛盾したら名前を「?」に落とす（塁の有無自体は常に公式値が正）。 */
  function inferRunnerNames(atbats){
    var bases={1:null,2:null,3:null}; // 各塁の走者名
    var curKey=null;
    atbats.forEach(function(ab){
      var key=ab.inning+"-"+ab.top_bottom;
      if(key!==curKey){ // イニングが変わったらリセット
        bases={1:null,2:null,3:null};
        curKey=key;
      }
      var r=ab.runners||{};
      // 公式の塁コードと答え合わせ
      var occ={1:!!r.first,2:!!r.second,3:!!r.third};
      for(var b=1;b<=3;b++){
        if(occ[b]&&!bases[b]) bases[b]="?";      // いるはずなのに名前不明
        if(!occ[b]) bases[b]=null;               // いないなら消す
      }
      // この打席の表示用にコピー
      ab._runnerNames={1:bases[1],2:bases[2],3:bases[3]};

      // 打席結果を反映して次の状態を作る
      var rs=ab.result_summary||"";
      var name=(ab.batter&&ab.batter.name)?ab.batter.name.split(/\s+/)[0]:null;
      function advanceAll(n){
        for(var i=3;i>=1;i--){
          if(bases[i]){
            var to=i+n;
            if(to<=3) bases[to]=bases[i];
            bases[i]=null;
          }
        }
      }
      if(/本塁打/.test(rs)){
        bases={1:null,2:null,3:null};
      }else if(/三塁打|3塁打|３塁打/.test(rs)){
        advanceAll(3); bases[3]=name;
      }else if(/二塁打|2塁打|２塁打/.test(rs)){
        advanceAll(2); bases[2]=name;
      }else if(/安打/.test(rs)&&!/併殺/.test(rs)){
        advanceAll(1); bases[1]=name;
      }else if(/四球|死球/.test(rs)){
        // 押し出し進塁（詰まっている塁だけ進む）
        if(bases[1]){
          if(bases[2]){
            if(bases[3]){/* 満塁: 三塁走者は生還扱い */ bases[3]=null;}
            bases[3]=bases[2];
          }
          bases[2]=bases[1];
        }
        bases[1]=name;
      }else if(/エラー/.test(rs)){
        advanceAll(1); bases[1]=name;
      }else if(/犠打|犠飛/.test(rs)){
        advanceAll(1);
      }else if(/併殺/.test(rs)){
        bases[1]=null; // 一塁走者アウト（代表的パターン）
      }
      // ゴロ・フライ・三振は走者そのまま
    });
  }

  /* ---- 配球チャート（ストライクゾーンに投球位置をプロット） ----
     コース座標は 0〜63px の範囲に分布。実データの検証から、
     ストライクゾーンは概ね top:10-58 / left:5-50 の内側。 */
  var CH={size:63, zTop:10, zBottom:58, zLeft:5, zRight:50};

  function buildChart(ab){
    var ps=(ab.pitches||[]).filter(function(p){
      return p.course&&p.course.top_px!=null&&p.course.left_px!=null;
    });
    if(!ps.length) return "";

    var V=100; // viewBox基準
    function sx(px){return px/CH.size*V;}
    // ゾーン枠の位置
    var zx=sx(CH.zLeft), zy=sx(CH.zTop),
        zw=sx(CH.zRight)-sx(CH.zLeft), zh=sx(CH.zBottom)-sx(CH.zTop);

    var s='<div class="chartbox"><svg class="chartsvg" viewBox="-8 -8 116 116">';
    // 外枠（ボールゾーン）
    s+='<rect x="-6" y="-6" width="112" height="112" rx="4" fill="var(--panel2)" stroke="var(--line)" stroke-width="1"/>';
    // ストライクゾーン
    s+='<rect x="'+zx+'" y="'+zy+'" width="'+zw+'" height="'+zh+'" fill="var(--zone)" stroke="var(--accent)" stroke-width="1.6"/>';
    // 3x3の区切り線
    for(var i=1;i<3;i++){
      s+='<line x1="'+(zx+zw*i/3)+'" y1="'+zy+'" x2="'+(zx+zw*i/3)+'" y2="'+(zy+zh)+'" stroke="var(--accent)" stroke-width=".5" opacity=".45"/>';
      s+='<line x1="'+zx+'" y1="'+(zy+zh*i/3)+'" x2="'+(zx+zw)+'" y2="'+(zy+zh*i/3)+'" stroke="var(--accent)" stroke-width=".5" opacity=".45"/>';
    }
    // 投球をプロット
    ps.forEach(function(p){
      var cx=sx(p.course.left_px), cy=sx(p.course.top_px);
      var fill="var(--panel)",stroke="var(--muted)",tc="var(--ink)";
      if(p.kind==="ball"){fill="#40C057";stroke="#2B8A3E";tc="#fff";}
      else if(p.kind==="strike"){fill="#FAB005";stroke="#E67700";tc="#3D2510";}
      else if(p.kind==="hit"){fill="var(--accent)";stroke="var(--accent)";tc="#fff";}
      else if(p.kind==="out"){fill="#1C7ED6";stroke="#1864AB";tc="#fff";}
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="7.5" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.4"/>';
      s+='<text x="'+cx+'" y="'+(cy+2.9)+'" text-anchor="middle" font-size="8.5" '+
         'font-family="Roboto Mono,monospace" font-weight="700" fill="'+tc+'">'+(p.no||"")+'</text>';
    });
    s+='</svg>';
    // 凡例
    s+='<div class="charttxt"><div class="charttitle">配球チャート</div>'+
       '<div class="lg"><span class="lgd" style="background:#FAB005"></span>ストライク</div>'+

  async function loadDay(){
    var d=dp.value;
    gamesEl.innerHTML='<div class="msg">読み込み中…</div>';
    detailEl.innerHTML="";curGame=null;
    try{
      var r=await fetch(sumPath(d)+"?t="+Date.now());
      if(!r.ok) throw 0;
      var s=await r.json();
      if(!s.games||!s.games.length) throw 0;
      gamesEl.innerHTML="";
      s.games.forEach(function(g){
        var el=document.createElement("div");
        el.className="game";
        var res=g.result||{};
        var h='';
        // スコア行（略称＋得点）
        if(res.home_score!=null&&res.away_score!=null){
          var hw=res.home_score>res.away_score, aw=res.away_score>res.home_score;
          h+='<div class="gscore">'+
            '<span class="'+(hw?"w":"")+'">'+esc(res.home_mini||res.home||"")+' '+res.home_score+'</span>'+
            '<span class="dash">-</span>'+
            '<span class="'+(aw?"w":"")+'">'+res.away_score+' '+esc(res.away_mini||res.away||"")+'</span>'+
            (res.state?'<span class="gstate">'+esc(res.state)+'</span>':'')+
            '</div>';
        }else{
          h+='<div class="gcard">'+esc(g.card||("GAME "+g.game_id))+'</div>';
        }
        // 責任投手
        var pit=[];
        if(res.win_pitcher) pit.push('<b>勝</b> '+esc(res.win_pitcher));
        if(res.lose_pitcher) pit.push('<b>敗</b> '+esc(res.lose_pitcher));
        if(res.save_pitcher) pit.push('<b>S</b> '+esc(res.save_pitcher));
        if(pit.length) h+='<div class="gpit">'+pit.join('　')+'</div>';
        // 本塁打
        if(res.homeruns&&res.homeruns.length){
          var hr=res.homeruns.map(function(x){
            return esc(x.batter)+(x.number?" "+x.number+"号":"");
          }).join('、');
          h+='<div class="ghr">本塁打 '+hr+'</div>';
        }
        h+='<div class="gmeta">'+g.atbat_count+' 打席 ／ '+g.pitch_count+' 球</div>';
        el.innerHTML=h;
        el.onclick=function(){loadGame(d,g.game_id,el);};
        gamesEl.appendChild(el);
      });
    }catch(e){
      gamesEl.innerHTML='<div class="msg">この日のデータはまだありません<br>'+
        '<span style="font-size:12px;">Actions の Run workflow で収集できます</span></div>';
    }
  }

  async function loadGame(d,gid,el){
    var l=document.querySelectorAll(".game"),i;
    for(i=0;i<l.length;i++) l[i].classList.remove("on");
    if(el) el.classList.add("on");
    detailEl.innerHTML='<div class="msg">読み込み中…</div>';
    try{
      var r=await fetch(gamePath(d,gid)+"?t="+Date.now());
      curGame=await r.json();
      inferRunnerNames(curGame.atbats||[]);
      curTab="summary";
      pitchFilter={pitcher:"all", type:"all"};
      render();
      detailEl.scrollIntoView({behavior:"smooth",block:"start"});
    }catch(e){
      detailEl.innerHTML='<div class="msg">読み込みに失敗しました</div>';
    }
  }

  /* ===== タブ制御 ===== */
  var curTab = "summary";

  function setTab(t){
    curTab = t;
    render();
  }

  function render(){
    var g=curGame;if(!g) return;
    var tabs=[["summary","概要"],["lineup","スタメン"],["batting","打撃"],["pitching","投手"],
              ["analysis","配球"],["pitches","全打席"]];
    var h='<div class="tabs">';
    tabs.forEach(function(t){
      h+='<button class="tab'+(curTab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
    });
    h+='</div><div id="tabbody"></div>';
    detailEl.innerHTML=h;

    var body=document.getElementById("tabbody");
    if(curTab==="summary") body.innerHTML=renderSummary(g);
    else if(curTab==="lineup") body.innerHTML=renderLineup(g);
    else if(curTab==="batting") body.innerHTML=renderBatting(g);
    else if(curTab==="pitching") body.innerHTML=renderPitching(g);
    else if(curTab==="analysis") body.innerHTML=renderAnalysis(g);
    else renderPitches();

  /* ===== 概要タブ ===== */
  function renderSummary(g){
    var h=buildBoard(g);
    var res=g.result||{};
    // 責任投手（所属チームは得点差から判定）
    var pit=[];
    if(res.win_pitcher) pit.push('<div class="kv"><span class="k">勝利投手</span><b>'+withTeam(res.win_pitcher,pitcherTeam(g,"win"))+'</b></div>');
    if(res.lose_pitcher) pit.push('<div class="kv"><span class="k">敗戦投手</span><b>'+withTeam(res.lose_pitcher,pitcherTeam(g,"lose"))+'</b></div>');
    if(res.save_pitcher) pit.push('<div class="kv"><span class="k">セーブ</span><b>'+withTeam(res.save_pitcher,pitcherTeam(g,"save"))+'</b></div>');
    if(pit.length) h+='<div class="card2"><h3>責任投手</h3>'+pit.join("")+'</div>';

    // 本塁打（打者の所属は出場成績から照合）
    if(res.homeruns&&res.homeruns.length){
      var hr=res.homeruns.map(function(x){
        return '<div class="kv"><span class="k">'+withTeam(x.batter,batterTeam(g,x.batter))+'</span><b>'+

      }).join("");
      h+='<div class="card2"><h3>本塁打</h3>'+hr+'</div>';

    // バッテリー
    if(res.battery&&res.battery.text){
      h+='<div class="card2"><h3>バッテリー</h3><div class="sub">'+esc(res.battery.text)+'</div></div>';
    }
    return h;
  }

  /* データの概況を数字で示すタイル */
  function renderSummaryTiles(latestDate, players, year){
    var days=0, gamesTotal=0;
    for(var k in dashDays){ days++; gamesTotal+=dashDays[k]; }
    var batters=0, pitchers=0;

  /* ===== データカレンダー ===== */
  var dashDays = {};      // "2026-07-24" -> その日の試合ファイル数
  var calMonth = null;    // 表示中の月 "2026-07"

  function shiftCalMonth(n){
    if(!calMonth) return;
    var y=parseInt(calMonth.slice(0,4),10), m=parseInt(calMonth.slice(5,7),10);
    m+=n;
    while(m<1){ m+=12; y--; }
    while(m>12){ m-=12; y++; }
    calMonth=y+"-"+("0"+m).slice(-2);
    var el=document.getElementById("calBody");
    if(el) el.innerHTML=renderCalBody();
    var lb=document.getElementById("calLabel");
    if(lb) lb.textContent=y+"年"+m+"月";
  }

  function renderCalendar(){
    if(!calMonth) return "";
    var y=parseInt(calMonth.slice(0,4),10), m=parseInt(calMonth.slice(5,7),10);
    var total=0, daysWith=0;
    for(var k in dashDays){ total+=dashDays[k]; if(dashDays[k]>0) daysWith++; }

    return '<div class="dash-sec"><div class="dash-h"><span class="dot"></span>データカレンダー'+
      '<span class="dash-date">'+daysWith+'日分 / 計'+total+'試合</span></div>'+
      '<div class="calnav">'+
        '<button class="btn" onclick="shiftCalMonth(-1)">◀</button>'+
        '<span id="calLabel" class="callabel">'+y+'年'+m+'月</span>'+
        '<button class="btn" onclick="shiftCalMonth(1)">▶</button>'+
      '</div>'+
      '<div id="calBody">'+renderCalBody()+'</div>'+
      '<div class="callegend"><span class="cbox has"></span>データあり'+
      '<span class="cbox none"></span>データなし　※日付をタップでその日の試合へ</div>'+
      '</div>';
  }

  function renderCalBody(){
    var y=parseInt(calMonth.slice(0,4),10), m=parseInt(calMonth.slice(5,7),10);
    // その月の1日の曜日と日数（ローカル日付で計算してズレを防ぐ）
    var first=new Date(y, m-1, 1);
    var startDow=first.getDay();
    var lastDay=new Date(y, m, 0).getDate();
    var today=todayJST();

    var h='<div class="cal">';
    ["日","月","火","水","木","金","土"].forEach(function(w,i){
      h+='<div class="cdow'+(i===0?" sun":(i===6?" sat":""))+'">'+w+'</div>';
    });
    // 月初めまでの空白
    for(var i=0;i<startDow;i++) h+='<div class="cday empty"></div>';

    for(var d=1;d<=lastDay;d++){
      var ds=y+"-"+("0"+m).slice(-2)+"-"+("0"+d).slice(-2);
      var n=dashDays[ds]||0;
      var cls="cday"+(n>0?" has":" none")+(ds===today?" today":"");
      if(n>0){
        h+='<div class="'+cls+'" onclick="openGamesDay(\''+ds+'\')" title="'+ds+'：'+n+'試合">'+
           '<span class="cnum">'+d+'</span><span class="ccnt">'+n+'</span></div>';
      }else{
        h+='<div class="'+cls+'"><span class="cnum">'+d+'</span></div>';
      }
    }
    h+='</div>';
    return h;
  }

  /* ===== ダッシュボード（ホーム） ===== */
  var dashLoaded = false;
  var dashData = null;        // 読み込んだデータを保持（リーグ切替で再描画するため）
  var dashLeague = "パ";      // ランキングの表示リーグ（既定はパ・リーグ）

  function setDashLeague(l){
    dashLeague = l;
    if(dashData) renderDash(dashData.date, dashData.games, dashData.players, dashData.year);
  }

  /* 試合がどのリーグか判定（両リーグ対戦なら交流戦） */
  function gameLeague(g){
    var res=g.result||{};
    var lh=tLeague(res.home||g.home), la=tLeague(res.away||g.away);
    if(!lh||!la) return null;
    return lh===la ? lh : "交";
  }

  async function loadDash(){
    var dv=document.getElementById("dashView");
    if(dashLoaded){ return; }
    dv.innerHTML='<div class="msg">読み込み中…</div>';

    // 1) 最新のデータがある日を index.json から検出
    var latestDate=null;
    try{
      var ri=await fetch("data/index.json?t="+Date.now());
      if(ri.ok){
        var idx=await ri.json();
        var days={};
        (idx.files||[]).forEach(function(f){
          var m=f.match(/data\/(\d{4})\/(\d{2})\/(\d{2})\/([^\/]+)$/);
          if(!m) return;
          var d=m[1]+"-"+m[2]+"-"+m[3];
          var name=m[4];
          if(!days[d]) days[d]=0;
          // _summary.json 以外＝試合ファイルとして数える
          if(name.charAt(0)!=="_" && name!=="index.json") days[d]++;
        });
        dashDays=days;
        var dl=Object.keys(days).sort();
        if(dl.length) latestDate=dl[dl.length-1];
      }
    }catch(e){}

    // 2) シーズン成績を読む（ランキング用）
    var year=(latestDate||todayJST()).split("-")[0];
    var players=[];
    try{
      var rp=await fetch("data/"+year+"/players/stats.json?t="+Date.now());
      if(rp.ok) players=(await rp.json()).players||[];
    }catch(e){}

    // 2.5) 順位表を読む
    try{
      var rst=await fetch("data/"+year+"/standings.json?t="+Date.now());
      if(rst.ok){ standings=await rst.json(); _tgCache=null; }
    }catch(e){}

    // 3) 最新日の試合結果を読む
    var latestGames=[];
    if(latestDate){
      try{
        var rs=await fetch(sumPath(latestDate)+"?t="+Date.now());
        if(rs.ok) latestGames=(await rs.json()).games||[];
      }catch(e){}
    }

    dashData = {date: latestDate, games: latestGames, players: players, year: year};
    if(!calMonth) calMonth=(latestDate||todayJST()).slice(0,7);
    renderDash(latestDate, latestGames, players, year);
    dashLoaded=true;  }

  function rankBlock(title, players, statFn, fmtFn, asc){
    var list=players.filter(function(p){return statFn(p)!=null;});
    list.sort(function(a,b){
      var va=statFn(a), vb=statFn(b);
      return asc ? va-vb : vb-va;
    });
    if(!list.length) return "";
    var h='<div class="rankcard"><h4>'+title+'</h4>';
    list.slice(0,5).forEach(function(p,i){
      h+='<div class="rankrow" onclick="gotoPlayer(\''+esc(p.key)+'\')">'+
         '<span class="rk">'+(i+1)+'</span>'+
         '<span class="rn">'+esc(p.name)+'</span>'+
         '<span class="rt">'+teamBadge(p.team)+'</span>'+
         '<span class="rv">'+fmtFn(statFn(p))+'</span></div>';
    });
    h+='</div>';
    return h;
  }

  function renderDash(latestDate, games, players, year){
    var dv=document.getElementById("dashView");
    var h='<div class="dashgrid">';

    // ===== 左カラム =====
    h+='<div class="dash-main">';

    // --- 順位表 ---
    h+=renderStandings();

    // --- 最新の試合結果（セ・パ・交流戦で分ける） ---
    if(latestDate && games.length){
      h+='<div class="dash-sec"><div class="dash-h">'+
         '<span class="dot"></span>最新の試合結果'+
         '<span class="dash-date">'+latestDate.replace(/-/g,"/")+'</span></div>';

      function gameCard(g){
        var res=g.result||{};
        var sc='';
        if(res.home_score!=null&&res.away_score!=null){
          var hw=res.home_score>res.away_score, aw=res.away_score>res.home_score;
          sc='<span class="'+(hw?"w":"")+'">'+esc(res.home_mini||res.home||"")+' '+res.home_score+'</span>'+
             '<span class="dash">-</span>'+
             '<span class="'+(aw?"w":"")+'">'+res.away_score+' '+esc(res.away_mini||res.away||"")+'</span>';
        }else{
          sc=esc(g.card||"");
        }
        return '<div class="dgame" onclick="gotoGame(\''+latestDate+'\',\''+g.game_id+'\')">'+
           '<div class="dg-score">'+sc+'</div>'+
           (res.win_pitcher?'<div class="dg-pit">勝 '+esc(res.win_pitcher)+
             (res.lose_pitcher?'／敗 '+esc(res.lose_pitcher):'')+'</div>':'')+
           '</div>';
      }

      // リーグごとに仕分ける
      var byLg={"セ":[],"パ":[],"交":[],"?":[]};
      games.forEach(function(g){ (byLg[gameLeague(g)||"?"]).push(g); });

      [["セ","セ・リーグ"],["パ","パ・リーグ"],["交","交流戦"],["?","その他"]].forEach(function(x){
        var list=byLg[x[0]];
        if(!list.length) return;
        var col = LEAGUE_COLOR[x[0]] || "var(--accent)";
        h+='<div class="lgroup"><div class="lgroup-h" style="border-left-color:'+col+'">'+
           '<span class="lgbadge" style="background:'+col+'">'+esc(x[0]==="?"?"他":x[0])+'</span> '+
           esc(x[1])+' <span class="sub2">'+list.length+'試合</span></div>'+
           '<div class="dash-games">'+list.map(gameCard).join("")+'</div></div>';
      });

      h+='<button class="btn" onclick="openGamesDay(\''+latestDate+'\')">この日の試合を詳しく見る ▶</button></div>';
    }else{
      h+='<div class="dash-sec"><div class="msg">まだ試合データがありません<br>'+
         '<span style="font-size:12px">Actionsで収集すると表示されます</span></div></div>';
    }

    h+='</div>';   // /dash-main

    // ===== 右カラム =====
    h+='<div class="dash-side">';
    h+=renderSummaryTiles(latestDate, players, year);
    h+=renderCalendar();
    h+='</div>';   // /dash-side

    h+='</div>';   // /dashgrid

    // --- ランキングハイライト（リーグ切替つき） ---
    if(players.length){
      var fmtA=function(v){return fmtAvg(v);};
      var fmtN=function(v){return v;};
      var fmtE=function(v){return v==null?"-":v.toFixed(2);};
      var fmtO=function(v){return v==null?"-":v.toFixed(3).replace(/^0\./,".");};

      var bat=function(f){return function(p){return p.batting?f(p.batting):null;};};
      var pit=function(f){return function(p){return (p.pitching&&(p.pitching.outs||0)>=1)?f(p.pitching):null;};};

      // 選択中のリーグで絞る
      var lp = players.filter(function(p){
        return dashLeague==="all" || tLeague(p.team)===dashLeague;
      });

      h+='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>'+
         year+' シーズンリーダー</div>';
      h+='<div class="stabs">';
      [["セ","セ・リーグ","セ"],["パ","パ・リーグ","パ"],["all","両リーグ",null]].forEach(function(x){
        var col = x[2] ? LEAGUE_COLOR[x[2]] : "var(--accent)";
        h+='<button class="stab'+(dashLeague===x[0]?" on":"")+'" style="--sc:'+col+'" '+
           'onclick="setDashLeague(\''+x[0]+'\')">'+x[1]+'</button>';
      });
      h+='</div>';

      if(!lp.length){
        h+='<div class="msg">このリーグの選手データがありません</div>';
      }else{
        h+='<div class="rankgrid">';
        h+=rankBlock("打率", lp, bat(function(b){return b.pa>=1?b.avg:null;}), fmtA);
        h+=rankBlock("本塁打", lp, bat(function(b){return b.hr;}), fmtN);
        h+=rankBlock("打点", lp, bat(function(b){return b.rbi;}), fmtN);
        h+=rankBlock("安打", lp, bat(function(b){return b.hits;}), fmtN);
        h+=rankBlock("OPS", lp, bat(function(b){return b.pa>=1?b.ops:null;}), fmtO);
        h+=rankBlock("盗塁", lp, bat(function(b){return b.sb;}), fmtN);
        h+=rankBlock("防御率", lp, pit(function(q){return q.era;}), fmtE, true);
        h+=rankBlock("奪三振", lp, pit(function(q){return q.so;}), fmtN);
        h+=rankBlock("勝利", lp, pit(function(q){return q.wins;}), fmtN);
        h+='</div>';
      }
      h+='<button class="btn" onclick="setView(\'season\')">シーズン成績をすべて見る ▶</button></div>';
    }

    dv.innerHTML=h;
  }

  /* ダッシュボードからの遷移 */
  async function gotoGame(date, gid){
    setView("games");
    dp.value=date;
    await loadDay();
    loadGame(date, gid, null);
  }
  function openGamesDay(date){
    setView("games");
    dp.value=date;
    loadDay();
  }
  function gotoPlayer(key){
    setView("season");
    setTimeout(function(){ showPlayer(key); }, 400);
  }

  /* ===== 画面切り替え（試合ビュー / シーズン成績ビュー） ===== */
  var curView = "games";      // games | season
  var seasonData = null;      // 読み込んだ選手成績
  var seasonTeams = null;
  var seasonSort = "avg";     // 並び替えキー
  var seasonTeamFilter = "all";
  var seasonLeagueFilter = "パ";
  var seasonQualified = "auto";   // auto | all | qualified
  var seasonGroup = "batter";     // batter | pitcher

  /* 並び替えできる項目（野手・投手で別々） */
  var SORTS_BAT = [["avg","打率"],["hr","本塁打"],["rbi","打点"],["hits","安打"],
                   ["obp","出塁率"],["slg","長打率"],["ops","OPS"],["sb","盗塁"],
                   ["pa","打席"],["so_b","三振"],["bb_b","四球"]];
  var SORTS_PIT = [["era","防御率"],["so_p","奪三振"],["wins","勝利"],["saves","セーブ"],
                   ["whip","WHIP"],["outs","投球回"],["k9","K/9"],["bb_p","与四球"]];

  function defaultSort(group){
    return group==="pitcher" ? "era" : "avg";
  }

  /* 野手／投手の切替 */
  function setSeasonGroup(g){
    if(seasonGroup===g) return;
    seasonGroup=g;
    seasonSort=defaultSort(g);   // 項目もそのグループの既定に戻す
    renderSeason();
  }

  /* 自動モードで規定到達者だけに絞る指標。
     打率と防御率はタイトル同様に規定到達が前提なので、この2つだけを対象にする。 */
  var RATE_STATS = {avg:1, era:1};

  /* 実際に適用する規定モードを決める */
  function qualMode(){
    if(seasonQualified !== "auto") return seasonQualified;
    return RATE_STATS[seasonSort] ? "qualified" : "all";
  }

  function setView(v){
    curView = v;
    var ids={dash:"dashView", games:"gameView", season:"seasonView",
             players:"playersView", export:"exportView"};
    for(var k in ids){
      var el=document.getElementById(ids[k]);
      if(el) el.style.display = (k===v ? "block" : "none");
      var btn=document.getElementById("vb-"+k);
      if(btn) btn.classList.toggle("on", k===v);
    }
    if(v==="dash") loadDash();
    else if(v==="season") loadSeason();
    else if(v==="players") loadPlayers();
    else if(v==="export") loadExport();
  }

  async function loadSeason(){
    var sv=document.getElementById("seasonView");
    if(seasonData){ renderSeason(); return; }
    sv.innerHTML='<div class="msg">読み込み中…</div>';
    var year=(dp.value||todayJST()).split("-")[0];
    try{
      var r=await fetch("data/"+year+"/players/stats.json?t="+Date.now());
      if(!r.ok) throw 0;
      var d=await r.json();
      seasonData=d.players||[];
      try{
        var rt=await fetch("data/"+year+"/teams/stats.json?t="+Date.now());
        if(rt.ok){ seasonTeams=(await rt.json()).teams||[]; _tgCache=null; }
      }catch(e){}
      // 順位表は表示用（規定の判定には収集データの試合数を使う）
      if(!standings){
        try{
          var rs2=await fetch("data/"+year+"/standings.json?t="+Date.now());
          if(rs2.ok){ standings=await rs2.json(); }
        }catch(e){}
      }
      renderSeason();
    }catch(e){
      sv.innerHTML='<div class="msg">シーズン成績がまだありません<br>'+
        '<span style="font-size:12px">Actionsで収集すると自動生成されます</span></div>';
    }
  }

  /* 規定打席・規定投球回の目安（試合数ベースの簡易判定） */
  /* ===== 規定打席・規定投球回 =====
     NPBの基準:
       規定打席   = チーム試合数 × 3.1
       規定投球回 = チーム試合数 × 1.0
     チーム試合数は「収集済みデータ」の試合数を使う。
     公式の消化試合数ではなく手元のデータ量に合わせることで、
     集めた範囲の中での規定到達を判定できる。 */
  var _tgCache = null;

  function teamGamesMap(){
    if(_tgCache) return _tgCache;
    var m={};
    (seasonTeams||[]).forEach(function(t){
      if(t.team) m[t.team]=t.games||0;
    });
    _tgCache = m;
    return m;
  }

  /* 規定打席（整数に切り上げ）。チーム試合数が不明ならnull */
  function reqPA(team){
    var g=teamGamesMap()[team];
    return g ? Math.ceil(g*3.1) : null;
  }
  /* 規定投球回をアウト数に換算（1回=3アウト） */
  function reqOuts(team){
    var g=teamGamesMap()[team];
    return g ? g*3 : null;
  }

  /* 成績を持っているか（表示対象の判定） */
  function hasBatting(p){ return p.batting && (p.batting.pa||0)>=1; }
  function hasPitching(p){ return p.pitching && (p.pitching.outs||0)>=1; }

  /* 規定に到達しているか */
  function isQualifiedBatter(p){
    var need=reqPA(p.team);
    if(need==null) return false;
    return ((p.batting&&p.batting.pa)||0) >= need;
  }
  function isQualifiedPitcher(p){
    var need=reqOuts(p.team);
    if(need==null) return false;
    return ((p.pitching&&p.pitching.outs)||0) >= need;
  }

  /* ランキング下の注記（規定の基準値を明示する） */
  function qualNote(isPitchStat, applied, fellBack){
    var m=teamGamesMap();
    var gs=[];
    for(var k in m){ if(m[k]) gs.push(m[k]); }
    if(!gs.length){
      return (isPitchStat?"登板した投手":"打席に立った野手")+
             'を対象（収集済み試合数が不明なため規定は判定できません）';
    }
    var mn=Math.min.apply(null,gs), mx=Math.max.apply(null,gs);
    var base = mn===mx ? (mn+"試合") : (mn+"〜"+mx+"試合");
    var need = isPitchStat
      ? '規定投球回 = 試合数×1.0（'+ (mn===mx ? (mn+"回") : (mn+"〜"+mx+"回")) +'）'
      : '規定打席 = 試合数×3.1（'+
        (mn===mx ? Math.ceil(mn*3.1)+"打席"
                 : Math.ceil(mn*3.1)+"〜"+Math.ceil(mx*3.1)+"打席") +'）';

    var head;
    if(fellBack){
      head='規定到達者がまだいないため全選手を表示';
    }else if(applied==="qualified"){
      head='規定到達者のみ表示';
    }else{
      head=(isPitchStat?"登板した投手":"打席に立った野手")+"を対象";
    }
    return head+'／'+need+'　※収集済みの'+base+'を基準に算出';
  }

  function renderSeason(){
    var sv=document.getElementById("seasonView");
    if(!seasonData||!seasonData.length){
      sv.innerHTML='<div class="msg">選手データがありません</div>';
      return;
    }

    // チーム一覧（リーグ順→略称順で並べる）
    var teams={};
    seasonData.forEach(function(p){ if(p.team) teams[p.team]=1; });
    var teamList=Object.keys(teams).sort(function(a,b){
      var la=tLeague(a)||"ワ", lb=tLeague(b)||"ワ";
      if(la!==lb) return la==="セ"?-1:1;
      return String(tMini(a)).localeCompare(String(tMini(b)));
    });

    var isPitchStat = (seasonGroup==="pitcher");
    var sorts = isPitchStat ? SORTS_PIT : SORTS_BAT;

    // 項目が今のグループに無いものだったら既定に戻す
    var validSort=false;
    sorts.forEach(function(s){ if(s[0]===seasonSort) validSort=true; });
    if(!validSort) seasonSort=defaultSort(seasonGroup);

    var h='<div class="stabs">';
    [["セ","セ・リーグ","セ"],["パ","パ・リーグ","パ"],["all","両リーグ",null]].forEach(function(x){
      var col = x[2] ? LEAGUE_COLOR[x[2]] : "var(--accent)";
      h+='<button class="stab'+(seasonLeagueFilter===x[0]?" on":"")+'" style="--sc:'+col+'" '+
         'onclick="setSeasonLeague(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    // 野手／投手の切替
    h+='<div class="stabs gtabs">';
    [["batter","野手成績"],["pitcher","投手成績"]].forEach(function(x){
      h+='<button class="stab'+(seasonGroup===x[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setSeasonGroup(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    h+='<div class="toolbar">'+
      '<span class="lb">項目</span><select id="ssort" onchange="onSeasonChange()">'+
      sorts.map(function(s){
        return '<option value="'+s[0]+'"'+(seasonSort===s[0]?" selected":"")+'>'+s[1]+'</option>';
      }).join("")+'</select>'+
      '<span class="lb">チーム</span><select id="steam" onchange="onSeasonChange()">'+
      '<option value="all">全チーム</option>'+
      teamList.filter(function(t){
        return seasonLeagueFilter==="all" || tLeague(t)===seasonLeagueFilter;
      }).map(function(t){
        return '<option value="'+esc(t)+'"'+(seasonTeamFilter===t?" selected":"")+'>'+esc(t)+'</option>';
      }).join("")+'</select>'+
      '<span class="lb">対象</span><select id="squal" onchange="onSeasonChange()">'+
      '<option value="auto"'+(seasonQualified==="auto"?" selected":"")+'>自動（率は規定者のみ）</option>'+
      '<option value="all"'+(seasonQualified==="all"?" selected":"")+'>全選手</option>'+
      '<option value="qualified"'+(seasonQualified==="qualified"?" selected":"")+'>規定到達のみ</option>'+
      '</select></div>';

    var mode = qualMode();

    // まず所属・成績の有無で絞る
    var base=seasonData.filter(function(p){
      if(seasonLeagueFilter!=="all" && tLeague(p.team)!==seasonLeagueFilter) return false;
      if(seasonTeamFilter!=="all" && p.team!==seasonTeamFilter) return false;
      return isPitchStat ? hasPitching(p) : hasBatting(p);
    });

    // 規定で絞る
    var list = base;
    var fellBack = false;
    if(mode==="qualified"){
      var q=base.filter(function(p){
        return isPitchStat ? isQualifiedPitcher(p) : isQualifiedBatter(p);
      });
      if(q.length){
        list=q;
      }else if(seasonQualified==="auto"){
        // 自動モードで到達者ゼロなら、空表示を避けて全選手に戻す
        list=base; fellBack=true;
      }else{
        list=q;
      }
    }

    // 並び替え
    function val(p){
      var b=p.batting||{}, q=p.pitching||{};
      switch(seasonSort){
        // 野手
        case "avg": return b.avg;
        case "hr": return b.hr;
        case "rbi": return b.rbi;
        case "hits": return b.hits;
        case "obp": return b.obp;
        case "slg": return b.slg;
        case "ops": return b.ops;
        case "sb": return b.sb;
        case "pa": return b.pa;
        case "so_b": return b.so;
        case "bb_b": return b.bb;
        // 投手
        case "era": return q.era;
        case "so_p": return q.so;
        case "wins": return q.wins;
        case "saves": return q.saves;
        case "whip": return q.whip;
        case "outs": return q.outs;
        case "k9": return q.k9;
        case "bb_p": return q.bb;
      }
      return null;
    }
    // 防御率・WHIPは小さいほうが上位
    var ASC={era:1, whip:1};
    list.sort(function(a,b){
      var va=val(a), vb=val(b);
      if(va==null) return 1;
      if(vb==null) return -1;
      return ASC[seasonSort] ? va-vb : vb-va;
    });

    if(!list.length){
      sv.innerHTML=h+'<div class="msg">該当する選手がいません</div><div id="playerDetail"></div>';
      return;
    }

    // ランキング表
    h+='<div class="card2"><h3>'+
       (isPitchStat?"投手":"野手")+'ランキング（'+
       sorts.filter(function(s){return s[0]===seasonSort;})[0][1]+'）</h3><div class="tblwrap">';
    if(isPitchStat){
      h+='<table class="stbl"><thead><tr><th>#</th><th class="nm">選手</th><th>チーム</th>'+
         '<th>登板</th><th>回</th><th>防御率</th><th>WHIP</th><th>K/9</th><th>奪三</th><th>四球</th>'+
         '<th>勝</th><th>敗</th><th>S</th></tr></thead><tbody>';
      list.slice(0,50).forEach(function(p,i){
        var q=p.pitching||{};
        h+='<tr onclick="showPlayer(\''+esc(p.key)+'\')"><td class="num">'+(i+1)+'</td>'+
           '<td class="nm lnk">'+esc(p.name)+(isQualifiedPitcher(p)?'<span class="qmark" title="規定投球回到達">規</span>':'')+'</td><td>'+teamBadge(p.team)+'</td>'+
           '<td class="num">'+(q.games||0)+'</td>'+
           '<td class="num">'+esc(q.innings||"0")+'</td>'+
           '<td class="num hi">'+(q.era==null?"-":q.era.toFixed(2))+'</td>'+
           '<td class="num">'+(q.whip==null?"-":q.whip.toFixed(2))+'</td>'+
           '<td class="num">'+(q.k9==null?"-":q.k9.toFixed(1))+'</td>'+
           '<td class="num">'+(q.so||0)+'</td><td class="num">'+(q.bb||0)+'</td>'+
           '<td class="num">'+(q.wins||0)+'</td><td class="num">'+(q.losses||0)+'</td>'+
           '<td class="num">'+(q.saves||0)+'</td></tr>';
      });
    }else{
      h+='<table class="stbl"><thead><tr><th>#</th><th class="nm">選手</th><th>チーム</th>'+
         '<th>試合</th><th>打席</th><th>打数</th><th>安打</th><th>本</th><th>点</th><th>盗</th>'+
         '<th>打率</th><th>出塁</th><th>長打</th><th>OPS</th></tr></thead><tbody>';
      list.slice(0,50).forEach(function(p,i){
        var b=p.batting||{};
        h+='<tr onclick="showPlayer(\''+esc(p.key)+'\')"><td class="num">'+(i+1)+'</td>'+
           '<td class="nm lnk">'+esc(p.name)+(isQualifiedBatter(p)?'<span class="qmark" title="規定打席到達">規</span>':'')+'</td><td>'+teamBadge(p.team)+'</td>'+
           '<td class="num">'+(b.games||0)+'</td><td class="num">'+(b.pa||0)+'</td>'+
           '<td class="num">'+(b.ab||0)+'</td><td class="num">'+(b.hits||0)+'</td>'+
           '<td class="num'+((b.hr||0)>0?' hi':'')+'">'+(b.hr||0)+'</td>'+
           '<td class="num">'+(b.rbi||0)+'</td>'+
           '<td class="num">'+(b.sb||0)+'</td>'+
           '<td class="num hi">'+fmtAvg(b.avg)+'</td>'+
           '<td class="num">'+fmtAvg(b.obp)+'</td>'+

  function isPitcherP(p){ return !!(p.pitching && (p.pitching.outs||0)>0); }
  function isBatterP(p){ return !!(p.batting && (p.batting.pa||0)>0); }

  function renderPlayers(){
    var pv=document.getElementById("playersView");
    if(!seasonData||!seasonData.length){
      pv.innerHTML='<div class="msg">選手データがありません</div>';
      return;
    }

    // 選択肢はデータから作る
    var teams={}, poss={}, hands={};
    seasonData.forEach(function(p){
      if(p.team) teams[p.team]=1;
      if(p.position) poss[p.position]=1;
      (p.positions||[]).forEach(function(x){ if(x.pos) poss[x.pos]=1; });
      if(p.hand) hands[p.hand]=1;
    });
    var teamList=Object.keys(teams).sort(function(a,b){
      var la=tLeague(a)||"ワ", lb=tLeague(b)||"ワ";
      if(la!==lb) return la==="セ"?-1:1;
      return String(tMini(a)).localeCompare(String(tMini(b)));
    });
    var posList=Object.keys(poss).sort();
    var handList=Object.keys(hands).sort();

    function sel(id,label,cur,opts,allLabel){
      var h='<label class="ef"><span>'+label+'</span><select id="'+id+'" onchange="onPlayersChange()">'+
             '<option value="all">'+allLabel+'</option>';
      opts.forEach(function(o){
        var v=(typeof o==="string")?o:o[0], t=(typeof o==="string")?o:o[1];
        h+='<option value="'+esc(v)+'"'+(cur===v?" selected":"")+'>'+esc(t)+'</option>';
      });
      return h+'</select></label>';
    }

    var h='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>選手一覧'+
      '<span class="dash-date">'+seasonData.length+'人 登録</span></div>';

    h+='<div class="expform">'+
      '<label class="ef"><span>選手名</span><input type="text" id="plName" placeholder="部分一致" value="'+esc(plName)+'" oninput="onPlayersChange()"></label>'+
      sel("plTeam","球団",plTeam,teamList,"全球団")+
      sel("plKind","区分",plKind,[["batter","野手"],["pitcher","投手"]],"すべて")+
      sel("plPos","守備位置",plPos,posList,"すべて")+
      sel("plHand","投打",plHand,handList,"すべて")+
      '<label class="ef"><span>背番号</span><input type="text" id="plNum" placeholder="例: 7" value="'+esc(plNum)+'" oninput="onPlayersChange()"></label>'+
      sel("plQual","規定",plQual,[["qualified","規定到達のみ"]],"すべて")+
      sel("plSort","並び順",plSort,[["team","球団・背番号"],["name","名前"],
          ["avg","打率"],["hr","本塁打"],["era","防御率"]],"球団・背番号")+
      '</div><div class="expbtns" style="margin-top:10px">'+
      '<button class="btn" onclick="resetPlayers()">条件をクリア</button></div>';

    // 絞り込み
    var list=seasonData.filter(function(p){
      if(plName && (p.name||"").indexOf(plName)<0) return false;
      if(plTeam!=="all" && p.team!==plTeam) return false;
      if(plKind==="pitcher" && !isPitcherP(p)) return false;
      if(plKind==="batter" && !isBatterP(p)) return false;
      if(plPos!=="all"){
        var hit=(p.position===plPos);
        (p.positions||[]).forEach(function(x){ if(x.pos===plPos) hit=true; });
        if(!hit) return false;
      }
      if(plHand!=="all" && p.hand!==plHand) return false;
      if(plNum && String(p.number||"")!==String(plNum).trim()) return false;
      if(plQual==="qualified"){
        var q = isPitcherP(p) ? isQualifiedPitcher(p) : isQualifiedBatter(p);
        if(!q) return false;
      }
      return true;
    });

    // 並び替え
    list.sort(function(a,b){
      if(plSort==="name") return (a.name||"").localeCompare(b.name||"");
      if(plSort==="avg") return ((b.batting&&b.batting.avg)||-1)-((a.batting&&a.batting.avg)||-1);
      if(plSort==="hr") return ((b.batting&&b.batting.hr)||0)-((a.batting&&a.batting.hr)||0);
      if(plSort==="era"){
        var ea=(a.pitching&&a.pitching.era), eb=(b.pitching&&b.pitching.era);
        if(ea==null) return 1;
        if(eb==null) return -1;
        return ea-eb;
      }
      // 球団→背番号
      var ta=a.team||"", tb=b.team||"";
      if(ta!==tb){
        var la=tLeague(ta)||"ワ", lb=tLeague(tb)||"ワ";
        if(la!==lb) return la==="セ"?-1:1;
        return ta.localeCompare(tb);
      }
      var na=parseInt(a.number,10), nb=parseInt(b.number,10);
      if(isNaN(na)) na=9999;
      if(isNaN(nb)) nb=9999;
      return na-nb;
    });

    h+='<div class="exok" style="margin:10px 0">該当 '+list.length+' 人</div>';

    if(!list.length){
      h+='<div class="msg">条件に合う選手がいません</div></div><div id="plDetail"></div>';
      pv.innerHTML=h;
      return;
    }

    h+='<div class="tblwrap"><table class="stbl"><thead><tr>'+
       '<th>背番号</th><th class="nm">選手</th><th>球団</th><th>位置</th><th>投打</th>'+
       '<th>試合</th><th>打率</th><th>本</th><th>点</th>'+
       '<th>防御率</th><th>回</th><th>奪三</th></tr></thead><tbody>';
    list.slice(0,300).forEach(function(p){
      var b=p.batting||{}, q=p.pitching||{};
      var isP=isPitcherP(p);
      var qmark = isP ? (isQualifiedPitcher(p)?'<span class="qmark">規</span>':'')
                      : (isQualifiedBatter(p)?'<span class="qmark">規</span>':'');
      h+='<tr onclick="showPlayerDetail(\''+esc(p.key)+'\')">'+
        '<td class="num unumcell">'+(p.number?esc(p.number):"-")+'</td>'+
        '<td class="nm lnk">'+esc(p.name)+qmark+'</td>'+
        '<td>'+teamBadge(p.team)+'</td>'+
        '<td class="pos">'+esc(p.position||"-")+'</td>'+
        '<td class="pos">'+esc(p.hand||"-")+'</td>'+
        '<td class="num">'+(isP?(q.games||0):(b.games||0))+'</td>'+
        '<td class="num">'+(isBatterP(p)?fmtAvg(b.avg):"-")+'</td>'+
        '<td class="num'+((b.hr||0)>0?' hi':'')+'">'+(isBatterP(p)?(b.hr||0):"-")+'</td>'+
        '<td class="num">'+(isBatterP(p)?(b.rbi||0):"-")+'</td>'+
        '<td class="num'+(isP?' hi':'')+'">'+(isP&&q.era!=null?q.era.toFixed(2):"-")+'</td>'+
        '<td class="num">'+(isP?esc(q.innings||"0"):"-")+'</td>'+
        '<td class="num">'+(isP?(q.so||0):"-")+'</td>'+
        '</tr>';
    });
    h+='</tbody></table></div>';
    if(list.length>300){
      h+='<div class="sub" style="font-size:11px;margin-top:6px">上位300人を表示しています（条件で絞り込んでください）</div>';
    }
    h+='<div class="sub" style="font-size:11px;margin-top:6px">'+
       '選手名をタップすると詳細が開きます／「規」は規定到達</div>';
    h+='</div><div id="plDetail"></div>';
    pv.innerHTML=h;
  }

  /* ===== 選手スプリット（試合ログ・月別・対戦別など） ===== */
  var splitCache={};        // 'batting_lines' -> {header, rows}
  var curSplitPlayer=null;  // 表示中の選手
  var splitTab="log";

  async function loadSplitFile(name){
    if(splitCache[name]) return splitCache[name];
    var year=(dp.value||todayJST()).split("-")[0];
    var r=await fetch("data/"+year+"/dataset/"+name+".csv?t="+Date.now());
    if(!r.ok) throw new Error("notfound");
    var all=parseCSV(await r.text()).filter(function(x){return x.length>1;});
    if(!all.length) throw new Error("empty");
    var header=all[0], idx={};
    header.forEach(function(h,i){ idx[h]=i; });
    // 行を扱いやすいオブジェクトにする
    var rows=all.slice(1).map(function(r2){
      var o={};
      header.forEach(function(h,i){ o[h]=r2[i]; });
      return o;
    });
    splitCache[name]={header:header, rows:rows, idx:idx};
    return splitCache[name];
  }

  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  function outsToIp(o){ return (o%3) ? (Math.floor(o/3)+"."+(o%3)) : String(Math.floor(o/3)); }

  function aggBat(rows){
    var a={games:rows.length, ab:0, hits:0, hr:0, rbi:0, bb:0, so:0, sb:0, runs:0};
    rows.forEach(function(r){
      a.ab+=num(r.ab); a.hits+=num(r.hits); a.hr+=num(r.hr); a.rbi+=num(r.rbi);
      a.bb+=num(r.bb)+num(r.hbp); a.so+=num(r.so); a.sb+=num(r.sb); a.runs+=num(r.runs);
    });
    a.avg = a.ab ? a.hits/a.ab : null;
    return a;
  }
  function aggPit(rows){
    var a={games:rows.length, outs:0, er:0, ra:0, so:0, bb:0, ha:0, hra:0,
           pitches:0, w:0, l:0, s:0, qs:0};
    rows.forEach(function(r){
      a.outs+=num(r.outs); a.er+=num(r.earned_runs); a.ra+=num(r.runs_allowed);
      a.so+=num(r.so); a.bb+=num(r.bb); a.ha+=num(r.hits_allowed);
      a.hra+=num(r.hr_allowed); a.pitches+=num(r.pitches);
      var d=r.decision||"";
      if(d.indexOf("勝")>=0) a.w++;
      if(d.indexOf("敗")>=0) a.l++;
      if(d.indexOf("Ｓ")>=0||d.indexOf("S")>=0) a.s++;
      if(String(r.is_qs).toLowerCase()==="true") a.qs++;
    });
    var ip=a.outs/3;
    a.innings=outsToIp(a.outs);
    a.era = ip ? a.er*9/ip : null;
    a.whip = ip ? (a.ha+a.bb)/ip : null;
    return a;
  }

  function playerRows(data, p){
    return data.rows.filter(function(r){
      if(p.key && r.player_key) return r.player_key===p.key;
      if(p.player_id && r.player_id) return r.player_id===String(p.player_id);
      return r.player===p.name;
    });
  }

  /* 任意のキーでまとめる */
  function splitBy(bl, pl, isP, keyFn, label, sortKeyAsc){
    var rows=isP?pl:bl;
    var groups={}, order=[];
    rows.forEach(function(r){
      var k=keyFn(r);
      if(!groups[k]){ groups[k]=[]; order.push(k); }
      groups[k].push(r);
    });
    order.sort(function(a,b){
      return sortKeyAsc ? a.localeCompare(b) : groups[b].length-groups[a].length;
    });
    if(!order.length) return '<div class="msg">データがありません</div>';

    var h='<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">'+esc(label)+'</th>';
    h += isP
      ? '<th>登板</th><th>回</th><th>防御率</th><th>WHIP</th><th>奪三</th><th>四球</th><th>被安</th><th>勝</th><th>敗</th><th>S</th>'
      : '<th>試合</th><th>打数</th><th>安打</th><th>打率</th><th>本</th><th>点</th><th>三振</th><th>四球</th><th>盗</th>';
    h+='</tr></thead><tbody>';

    order.forEach(function(k){
      var g=groups[k];
      var disp = (label==="対戦相手") ? (teamBadge(k)+" "+esc(k)) : esc(k);
      h+='<tr><td class="nm">'+disp+'</td>';
      if(isP){
        var a=aggPit(g);

           '<td class="num hi">'+(a.era==null?"-":a.era.toFixed(2))+'</td>'+
           '<td class="num">'+(a.whip==null?"-":a.whip.toFixed(2))+'</td>'+
           '<td class="num">'+a.so+'</td><td class="num">'+a.bb+'</td>'+
           '<td class="num">'+a.ha+'</td><td class="num">'+a.w+'</td>'+
