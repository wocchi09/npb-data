    ["woba_est","推wOBA"],["wrc_plus_est","推wRC+"],["rc27","RC27"],["xr27","XR27"],
    ["gpa","GPA"],["seca","SecA"],["ta","TA"],["bsr_est","推BsR"]
  ];
  var PL_COLS_PIT = [
    ["number","背番号"],["name","選手"],["team","球団"],["roster_status","一軍"],["registered_days","登録日数"],["hand","投打"],
    ["games","登板"],["outs","回"],["era","防御率"],["fip","FIP"],["whip","WHIP"],["k9","K/9"],
    ["bb9","BB/9"],["hr9","HR/9"],["k_bb","K/BB"],["k_pct","K%"],["bb_pct","BB%"],
    ["lob_pct_est","推LOB%"],["so","奪三"],["bb","四球"],["wins","勝"],["losses","敗"],["win_pct","勝率"],
    ["saves","S"],["holds","H"],["hp","HP"]
  ];
  /* 小さいほど良い項目は、最初のクリックで昇順にする */
  var PL_ASC_FIRST = {era:1, fip:1, whip:1, losses:1, name:1, team:1, position:1, hand:1, number:1};

  function setPlSort(k){
    if(plSort===k){
      plSortDir = (plSortDir==="desc") ? "asc" : "desc";
    }else{
      plSort=k;
      var pitchLower = plKind==="pitcher" &&
        /^(bb9|hr9|bb_pct|era|fip|whip|losses)$/.test(k);
      plSortDir = (PL_ASC_FIRST[k] || pitchLower) ? "asc" : "desc";
    }
    renderPlayers();
  }
  function setPlKind(k){
    if(plKind===k) return;
    plKind=k;
    plSort="team"; plSortDir="asc";
    renderPlayers();
  }
  /* 並び替えに使う値を取り出す */
  function plValue(p, key){
    var b=p.batting||{}, q=p.pitching||{};
    switch(key){
      case "number": var n=parseInt(p.number,10); return isNaN(n)?99999:n;
      case "name": return p.name||"";
      case "team": return p.team||"";
      case "roster_status": return p.current_registered?1:0;
      case "registered_days": return p.registered_days==null?null:p.registered_days;
      case "position": return p.position||"";
      case "hand": return p.hand||"";
      case "games": return plKind==="pitcher" ? (q.games||0) : (b.games||0);
      case "pa": return b.pa||0;
      case "ab": return b.ab||0;
      case "hits": return b.hits||0;
      case "hr": return b.hr||0;
      case "rbi": return b.rbi||0;
      case "sb": return b.sb||0;
      case "avg": return b.avg;
      case "obp": return b.obp;
      case "slg": return b.slg;
      case "ops": return b.ops;
      case "iso": return b.iso;
      case "babip": return b.babip;
      case "bb_pct": return plKind==="pitcher" ? q.bb_pct : b.bb_pct;
      case "k_pct": return plKind==="pitcher" ? q.k_pct : b.k_pct;
      case "bb_k": return b.bb_k;
      case "woba_est": return b.woba_est;
      case "wrc_plus_est": return b.wrc_plus_est;
      case "rc27": return b.rc27;
      case "xr27": return b.xr27;
      case "gpa": return b.gpa;
      case "seca": return b.seca;
      case "ta": return b.ta;
      case "bsr_est": return b.bsr_est;
      case "outs": return q.outs||0;
      case "era": return q.era;
      case "fip": return q.fip;
      case "whip": return q.whip;
      case "k9": return q.k9;
      case "bb9": return q.bb9;
      case "hr9": return q.hr9;
      case "k_bb": return q.k_bb;
      case "lob_pct_est": return q.lob_pct_est;
      case "so": return q.so||0;
      case "bb": return q.bb||0;
      case "wins": return q.wins||0;
      case "losses": return q.losses||0;
      case "win_pct": return ((q.wins||0)+(q.losses||0))>=1 ? q.win_pct : null;
      case "saves": return q.saves||0;
      case "holds": return holdsOf(q);
      case "hp": return q.hp||0;
    }
    return null;
  }

  async function loadPlayers(){
    var pv=document.getElementById("playersView");
    if(seasonData && npbRoster!==null && rosterRegistration!==null && playerProfiles!==null){ renderPlayers(); return; }
    pv.innerHTML='<div class="msg">読み込み中…</div>';
    // 公式名鑑（一覧の基準）と、成績（表示用）の両方を読む
    await loadRoster();
    await loadPlayerProfiles();
    await loadRegistrationData();
    if(!seasonData) await loadSeason();
    if(!npbRoster && !seasonData){
      pv.innerHTML='<div class="msg">選手データがまだありません<br>'+
        '<span style="font-size:12px">Actions の「Update NPB Roster」を実行すると名鑑が作られます</span></div>';
      return;
    }
    renderPlayers();
  }

  function onPlayersChange(){
    var g=function(id){var e=document.getElementById(id);return e?e.value:"";};
    plName=g("plName");
    plPos=g("plPos"); plHand=g("plHand"); plNum=g("plNum");
    plQual=g("plQual"); plPlayed=g("plPlayed"); plRegistered=g("plRegistered");
    renderPlayers();
  }
  function resetPlayers(){
    plName=""; plTeam="all"; plPos="all"; plHand="all";
    plNum=""; plQual="all"; plPlayed="all"; plRegistered="all"; plSort="team"; plSortDir="asc";
    renderPlayers();
  }

  /* ホールド：公式記録があればそれを、無ければルールベースの推定値を使う */
  function holdsOf(q){
    if(!q) return 0;
    if((q.holds||0)>0) return q.holds;
    return q.holds_est||0;
  }
  function holdsIsEst(q){ return q && (q.holds||0)===0 && (q.holds_est||0)>0; }

  function isPitcherP(p){ return !!(p.pitching && (p.pitching.outs||0)>0); }
  function isBatterP(p){ return !!(p.batting && (p.batting.pa||0)>0); }

  /* 球団タブ1個ぶん（チームカラーで塗る） */
  function teamTabBtn(t){
    var on=(plTeam===t);
    var col=tColor(t)||"var(--accent)";
    var style=on ? 'background:'+col+';color:'+tTextColor(t)+';border-color:'+col
                 : 'border-color:'+col;
    return '<button class="ttab'+(on?" on":"")+'" style="'+style+'" '+
           'onclick="setPlTeam(\''+esc(t)+'\')" title="'+esc(t)+'">'+
           '<span class="tm">'+esc(tMini(t))+'</span>'+
           '<span class="tn">'+esc(t)+'</span></button>';
  }
  function setPlTeam(t){
    if(plTeam===t) return;
    plTeam=t;
    renderPlayers();
  }

  /* 一覧に並べる選手を作る。
     公式名鑑があればそれを基準にし（支配下のみ・背番号や投打も公式値）、
     無ければ従来どおり成績データから組み立てる。 */
  function buildPlayerList(){
    var idx=statsIndex();
    var regIdx=registrationIndex();
    var profileIdx=playerProfileIndex();
    if(npbRoster && npbRoster.players && npbRoster.players.length){
      return npbRoster.players.map(function(r){
        var st=findStats(idx, r.name, r.team) || {};
        var b=st.batting, q=st.pitching;
        var registration=regIdx[r.npb_id]||null;
        return {
          key: st.key || ("npb:"+(r.npb_id||r.name)),
          npb_id: r.npb_id,
          player_id: st.player_id || null,
          name: r.name,
          team: r.team,
          number: r.number,                       // 公式の背番号
          position: r.position_group,              // 公式の守備区分（投/捕/内/外）
          hand: (r.throws?r.throws+"投":"") + (r.bats?r.bats+"打":""),
          throws: r.throws, bats: r.bats,
          birthdate: r.birthdate, height: r.height, weight: r.weight,
          profile: profileIdx[String(r.npb_id)]||null,
          is_pitcher: !!r.is_pitcher,
          played: !!(b || q),                     // 一軍出場（収集済み試合に登場したか）
          batting: b, pitching: q,
          positions: st.positions || null,
          current_registered: !!(registration&&registration.current_registered),
          registered_days: registration?registration.registered_days:null,
          registration_count: registration?registration.registration_count:null,
          registration_periods: registration?registration.periods:null,
          first_registered: registration?registration.first_registered:null,
          last_deregistered: registration?registration.last_deregistered:null,
          fromRoster: true
        };
      });
    }
    // 名鑑が無い場合のフォールバック
    return (seasonData||[]).filter(function(p){
      return p.name && String(p.name).trim();
    }).map(function(p){
      var o={};
      for(var k in p) o[k]=p[k];
      o.played = true;
      o.fromRoster = false;
      o.profile = null;
      return o;
    });
  }

  function renderPlayers(){
    var pv=document.getElementById("playersView");
    var all=buildPlayerList();
    if(!all.length){
      pv.innerHTML='<div class="msg">選手データがありません</div>';
      return;
    }

    // 選択肢はデータから作る
    var teams={}, poss={}, hands={};
    all.forEach(function(p){
      if(p.team) teams[p.team]=1;
      if(p.position) poss[p.position]=1;
      (p.positions||[]).forEach(function(x){ if(x.pos) poss[x.pos]=1; });
      if(p.hand) hands[p.hand]=1;
    });
    var teamList=Object.keys(teams).sort(function(a,b){
      var la=tLeague(a)||"ワ", lb=tLeague(b)||"ワ";
      if(la!==lb) return la==="セ"?-1:1;
      return String(tMini(a)).localeCompare(String(tMini(b)));
    });
    var posList=Object.keys(poss).sort();
    var handList=Object.keys(hands).sort();

    function sel(id,label,cur,opts,allLabel){
      var h='<label class="ef"><span>'+label+'</span><select id="'+id+'" onchange="onPlayersChange()">'+
             '<option value="all">'+allLabel+'</option>';
      opts.forEach(function(o){
        var v=(typeof o==="string")?o:o[0], t=(typeof o==="string")?o:o[1];
        h+='<option value="'+esc(v)+'"'+(cur===v?" selected":"")+'>'+esc(t)+'</option>';
      });
      return h+'</select></label>';
    }

    var h='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>選手一覧'+
      '<span class="dash-date">'+all.length+'人'+
      (npbRoster&&npbRoster.players?'（支配下）':'')+'</span></div>';

    // 球団タブ（パ→区切り→セ の順）
    h+='<div class="teamtabs">'+
       '<button class="ttab'+(plTeam==="all"?" on":"")+'" onclick="setPlTeam(\'all\')">全球団</button>'+
       '<span class="tsep"></span>';
    TEAM_ORDER_PA.forEach(function(t){
      if(!teams[t]) return;
      h+=teamTabBtn(t);
    });
    h+='<span class="tsep"></span>';
    TEAM_ORDER_SE.forEach(function(t){
      if(!teams[t]) return;
      h+=teamTabBtn(t);
    });
    h+='</div>';

    // 野手／投手の切替
    h+='<div class="stabs gtabs">';
    [["batter","野手"],["pitcher","投手"]].forEach(function(x){
      h+='<button class="stab'+(plKind===x[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setPlKind(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    h+='<div class="expform">'+
      '<label class="ef"><span>選手名</span><input type="text" id="plName" placeholder="部分一致" value="'+esc(plName)+'" oninput="onPlayersChange()"></label>'+

      sel("plPos","守備位置",plPos,posList,"すべて")+
      sel("plHand","投打",plHand,handList,"すべて")+
      '<label class="ef"><span>背番号</span><input type="text" id="plNum" placeholder="例: 7" value="'+esc(plNum)+'" oninput="onPlayersChange()"></label>'+
      sel("plQual","規定",plQual,[["qualified","規定到達のみ"]],"すべて")+
      sel("plPlayed","一軍出場",plPlayed,[["played","出場ありのみ"]],"すべて")+
      sel("plRegistered","現在の登録",plRegistered,[["registered","一軍登録中のみ"],["not_registered","登録外のみ"]],"すべて")+
      '</div><div class="expbtns" style="margin-top:10px">'+
      '<button class="btn" onclick="resetPlayers()">条件をクリア</button></div>';

    // 絞り込み（名前が取れていないデータは表示しない）
    var list=all.filter(function(p){
      if(!p.name || !String(p.name).trim()) return false;
      if(plName && (p.name||"").indexOf(plName)<0) return false;
      if(plTeam!=="all" && p.team!==plTeam) return false;
      // 公式名鑑がある場合は守備区分で分ける（試合に出ていない選手も並ぶ）
      if(p.fromRoster){
        if(plKind==="pitcher" && !p.is_pitcher) return false;
        if(plKind==="batter" && p.is_pitcher) return false;
      }else{
        if(plKind==="pitcher" && !isPitcherP(p)) return false;
        if(plKind==="batter" && !isBatterP(p)) return false;
      }
      if(plPlayed==="played" && !p.played) return false;
      if(plRegistered==="registered" && !p.current_registered) return false;
      if(plRegistered==="not_registered" && p.current_registered) return false;
      if(plPos!=="all"){
        var hit=(p.position===plPos);
        (p.positions||[]).forEach(function(x){ if(x.pos===plPos) hit=true; });
        if(!hit) return false;
      }
      if(plHand!=="all" && p.hand!==plHand) return false;
      if(plNum && String(p.number||"")!==String(plNum).trim()) return false;
      if(plQual==="qualified"){
        if(!p.batting && !p.pitching) return false;
        var q = isPitcherP(p) ? isQualifiedPitcher(p) : isQualifiedBatter(p);
        if(!q) return false;
      }
      return true;
    });

    // 並び替え（ヘッダークリックで切り替え。値が無いものは常に最後）
    var dir = (plSortDir==="asc") ? 1 : -1;
    list.sort(function(a,b){
      if(plSort==="team"){
        var ta=a.team||"", tb=b.team||"";
        if(ta!==tb){
          var la=tLeague(ta)||"ワ", lb=tLeague(tb)||"ワ";
          if(la!==lb) return (la==="パ"?-1:1)*dir;
          return ta.localeCompare(tb)*dir;
        }
        var na=parseInt(a.number,10), nb=parseInt(b.number,10);
        if(isNaN(na)) na=99999;
        if(isNaN(nb)) nb=99999;
        return (na-nb)*dir;
      }
      var va=plValue(a, plSort), vb=plValue(b, plSort);
      if(va==null && vb==null) return 0;
      if(va==null) return 1;      // 欠損は常に最後
      if(vb==null) return -1;
      if(typeof va==="string" || typeof vb==="string"){
        return String(va).localeCompare(String(vb))*dir;
      }
      return (va-vb)*dir;
    });

    h+='<div class="exok" style="margin:10px 0">該当 '+list.length+' 人</div>';

    if(!list.length){
      h+='<div class="msg">条件に合う選手がいません</div></div><div id="plDetail"></div>';
      pv.innerHTML=h;
      return;
    }

    var isPitTab = (plKind==="pitcher");
    var cols = isPitTab ? PL_COLS_PIT : PL_COLS_BAT;

    if(cmpSelected.length){
      h+='<div class="cmpbar">比較に選択中: '+
        cmpSelected.map(function(k){
          var pp=list.concat(all).find(function(x){return x.key===k;});
          return pp?'<span class="cmpchip">'+esc(pp.name)+
            '<span class="cmpx" onclick="toggleCompare(\''+esc(k)+'\',event)">×</span></span>':'';
        }).join("")+
        (cmpSelected.length===2
          ?'<button class="btn primary" onclick="goCompare()">この2人を比較する ▶</button>'
          :'<span class="sub" style="font-size:11px">あと1人選んでください</span>')+
        '</div>';
    }

    // 見出し（クリックで並び替え。矢印で現在の方向を示す）
    h+='<div class="tblwrap"><table class="stbl"><thead><tr><th class="no-sort">比較</th>';
    cols.forEach(function(c){
      var on=(plSort===c[0]);
      var arrow = on ? (plSortDir==="asc" ? ' ▲' : ' ▼') : '';
      h+='<th class="sortable'+(on?" on":"")+(c[0]==="name"?" nm":"")+'" '+
         'onclick="setPlSort(\''+c[0]+'\')" title="クリックで並び替え">'+
         esc(c[1])+arrow+'</th>';
    });
    h+='</tr></thead><tbody>';

    list.slice(0,300).forEach(function(p){
      var b=p.batting||{}, q=p.pitching||{};
      var qmark = isPitTab ? (isQualifiedPitcher(p)?'<span class="qmark">規</span>':'')
                           : (isQualifiedBatter(p)?'<span class="qmark">規</span>':'');
      var checked = cmpSelected.indexOf(p.key)>=0;
      h+='<tr onclick="showPlayerDetail(\''+esc(p.key)+'\')">';
      h+='<td onclick="event.stopPropagation()"><input type="checkbox" class="cmpcheck" '+
         (checked?"checked":"")+' onchange="toggleCompare(\''+esc(p.key)+'\')"></td>';
      h+='<td class="num unumcell">'+(p.number?esc(p.number):"-")+'</td>'+
         '<td class="nm lnk">'+esc(p.name)+qmark+'</td>'+
         '<td>'+teamBadge(p.team)+'</td>'+
         '<td>'+(p.current_registered?'<span class="roster-status on">登録中</span>':'<span class="roster-status off">登録外</span>')+'</td>'+
         '<td class="num">'+(p.registered_days==null?"-":p.registered_days+'日')+'</td>';
      if(isPitTab){
        h+='<td class="pos">'+esc(p.hand||"-")+'</td>'+
           '<td class="num">'+(q.games||0)+'</td>'+
           '<td class="num">'+esc(q.innings||"0")+'</td>'+
           '<td class="num hi">'+(q.era==null?"-":q.era.toFixed(2))+'</td>'+
           '<td class="num">'+(q.fip==null?"-":q.fip.toFixed(2))+'</td>'+
           '<td class="num">'+(q.whip==null?"-":q.whip.toFixed(2))+'</td>'+
           '<td class="num">'+(q.k9==null?"-":q.k9.toFixed(1))+'</td>'+
           '<td class="num">'+(q.bb9==null?"-":q.bb9.toFixed(1))+'</td>'+
           '<td class="num">'+(q.hr9==null?"-":q.hr9.toFixed(1))+'</td>'+
           '<td class="num">'+(q.k_bb==null?"-":q.k_bb.toFixed(2))+'</td>'+
           '<td class="num">'+(q.k_pct==null?"-":(q.k_pct*100).toFixed(1)+"%")+'</td>'+
           '<td class="num">'+(q.bb_pct==null?"-":(q.bb_pct*100).toFixed(1)+"%")+'</td>'+
           '<td class="num">'+(q.lob_pct_est==null?"-":(q.lob_pct_est*100).toFixed(1)+"%")+'</td>'+
           '<td class="num">'+(q.so||0)+'</td>'+
           '<td class="num">'+(q.bb||0)+'</td>'+
           '<td class="num'+((q.wins||0)>0?' hi':'')+'">'+(q.wins||0)+'</td>'+
           '<td class="num">'+(q.losses||0)+'</td>'+
           '<td class="num">'+(q.win_pct==null?"-":q.win_pct.toFixed(3).replace(/^0\./,"."))+'</td>'+
           '<td class="num'+((q.saves||0)>0?' hi':'')+'">'+(q.saves||0)+'</td>'+
           '<td class="num">'+holdsOf(q)+(holdsIsEst(q)?'<span class="estmark">推</span>':'')+'</td>'+
           '<td class="num">'+(q.hp||0)+'</td>';
      }else{
        h+='<td class="pos">'+esc(p.position||"-")+'</td>'+
           '<td class="pos">'+esc(p.hand||"-")+'</td>'+
           '<td class="num">'+(b.games||0)+'</td>'+
           '<td class="num">'+(b.pa||0)+'</td>'+
           '<td class="num">'+(b.ab||0)+'</td>'+
           '<td class="num'+((b.hits||0)>0?' hi':'')+'">'+(b.hits||0)+'</td>'+
           '<td class="num'+((b.hr||0)>0?' hi':'')+'">'+(b.hr||0)+'</td>'+
           '<td class="num">'+(b.rbi||0)+'</td>'+
           '<td class="num">'+(b.sb||0)+'</td>'+
           '<td class="num hi">'+fmtAvg(b.avg)+'</td>'+
           '<td class="num">'+fmtAvg(b.obp)+'</td>'+
           '<td class="num">'+fmtAvg(b.slg)+'</td>'+
           '<td class="num">'+(b.ops==null?"-":b.ops.toFixed(3).replace(/^0\./,"."))+'</td>'+
           '<td class="num">'+fmtAvg(b.iso)+'</td>'+
           '<td class="num">'+fmtAvg(b.babip)+'</td>'+
           '<td class="num">'+(b.bb_pct==null?"-":(b.bb_pct*100).toFixed(1)+"%")+'</td>'+
           '<td class="num">'+(b.k_pct==null?"-":(b.k_pct*100).toFixed(1)+"%")+'</td>'+
           '<td class="num">'+(b.bb_k==null?"-":b.bb_k.toFixed(2))+'</td>'+
           '<td class="num">'+fmtAvg(b.woba_est)+'</td>'+
           '<td class="num hi">'+(b.wrc_plus_est==null?"-":Math.round(b.wrc_plus_est))+'</td>'+
           '<td class="num">'+(b.rc27==null?"-":b.rc27.toFixed(2))+'</td>'+
           '<td class="num">'+(b.xr27==null?"-":b.xr27.toFixed(2))+'</td>'+
           '<td class="num">'+fmtAvg(b.gpa)+'</td>'+
           '<td class="num">'+fmtAvg(b.seca)+'</td>'+
           '<td class="num">'+fmtAvg(b.ta)+'</td>'+
           '<td class="num">'+(b.bsr_est==null?"-":b.bsr_est.toFixed(2))+'</td>';
      }
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    if(list.length>300){
      h+='<div class="sub" style="font-size:11px;margin-top:6px">上位300人を表示しています（条件で絞り込んでください）</div>';
    }
    h+='<div class="sub" style="font-size:11px;margin-top:6px">'+
       '選手名をタップすると詳細が開きます／「規」は規定到達'+
       (npbRoster&&npbRoster.updated_at
         ? '<br>選手情報の出典：NPB公式（支配下選手のみ・'+
           esc(String(npbRoster.updated_at).slice(0,10))+' 更新）。成績はスポーツナビの試合データから集計'
         : '')+'</div>';
    h+='</div><div id="plDetail"></div>';
    pv.innerHTML=h;
  }

  /* ===== 選手比較 ===== */
  async function loadCompare(){
    var cv=document.getElementById("compareView");
    if(!seasonData){
      cv.innerHTML='<div class="msg">読み込み中…</div>';
      await loadSeason();
    }
    if(cmpSelected.length!==2){
      cv.innerHTML='<div class="msg">[選手一覧] で比較したい2人にチェックを入れてください<br>'+
        '<span style="font-size:12px">現在の選択: '+cmpSelected.length+'人</span></div>'+
        '<div class="expbtns" style="margin-top:10px">'+
        '<button class="btn" onclick="setView(\'players\')">選手一覧へ ▶</button></div>';
      return;
    }
    renderCompare();
  }

  function findPlayer(key){
    if(!seasonData) return null;
    for(var i=0;i<seasonData.length;i++){
      if(seasonData[i].key===key) return seasonData[i];
    }
    return null;
  }

  function cmpBetter(a,b,lowerIsBetter){
    if(a==null||b==null) return 0;
    if(a===b) return 0;
    if(lowerIsBetter) return a<b?1:-1;
    return a>b?1:-1;
  }

  function cmpRow(label, a, b, fmtFn, lowerIsBetter){
    var av=a, bv=b;
    var winner=cmpBetter(av,bv,lowerIsBetter);
    var at=fmtFn?fmtFn(av):(av==null?"-":av);
    var bt=fmtFn?fmtFn(bv):(bv==null?"-":bv);
    return '<tr><td class="num cmpval'+(winner===1?' win':'')+'">'+at+'</td>'+
      '<td class="nm cmplabel">'+esc(label)+'</td>'+
      '<td class="num cmpval'+(winner===-1?' win':'')+'">'+bt+'</td></tr>';
  }

  function renderCompare(){
    var cv=document.getElementById("compareView");
    var pA=findPlayer(cmpSelected[0]), pB=findPlayer(cmpSelected[1]);
    if(!pA||!pB){
      cv.innerHTML='<div class="msg">選手データが見つかりません</div>';
      return;
    }

  var impactTrendCache={};

  async function getImpactTrends(year){
    if(Object.prototype.hasOwnProperty.call(impactTrendCache,year)){
      return impactTrendCache[year];
    }
    try{
      var r=await fetch("data/"+year+"/w_impact_trends.json?t="+Date.now());

      impactTrendCache[year]=await r.json();
    }catch(e){
      impactTrendCache[year]=false;
    }
    return impactTrendCache[year];
  }
  function trendNumber(v,digits){
    if(v==null || !isFinite(Number(v))) return "-";
    return Number(v).toFixed(digits);
  }
  function trendChart(title,points,key,digits,baseline,volumeKey,volumeLabel){
    var valid=(points||[]).filter(function(p){
      return p[key]!=null && isFinite(Number(p[key]));
    });
    if(!valid.length){
      return '<div class="trend-card"><div class="trend-title">'+esc(title)+'</div>'+
             '<div class="msg" style="padding:24px 4px">データなし</div></div>';
    }
    var values=valid.map(function(p){return Number(p[key]);});
    var min=Math.min.apply(null,values),max=Math.max.apply(null,values);
    if(baseline!=null){min=Math.min(min,baseline);max=Math.max(max,baseline);}
    var spread=max-min;
    if(spread<0.0001){spread=Math.max(Math.abs(max)*0.12,1);min-=spread/2;max+=spread/2;}
    else{min-=spread*0.12;max+=spread*0.12;}
    var w=360,h=145,l=42,r=9,t=12,b=24;
    function px(i){return l+(valid.length<=1?0.5:(i/(valid.length-1)))*(w-l-r);}
    function py(v){return t+(max-v)/(max-min)*(h-t-b);}
    var coords=valid.map(function(p,i){return px(i).toFixed(1)+","+py(Number(p[key])).toFixed(1);});
    var svg='<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(title)+'の推移">';
    [0,0.5,1].forEach(function(rate){
      var value=max-(max-min)*rate,y=py(value);
      svg+='<line class="trend-gridline" x1="'+l+'" y1="'+y.toFixed(1)+'" x2="'+(w-r)+'" y2="'+y.toFixed(1)+'"></line>'+
           '<text class="trend-axis" x="'+(l-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+
           trendNumber(value,digits)+'</text>';
    });
    if(baseline!=null && baseline>=min && baseline<=max){
      var by=py(baseline);
      svg+='<line class="trend-baseline" x1="'+l+'" y1="'+by.toFixed(1)+'" x2="'+(w-r)+'" y2="'+by.toFixed(1)+'"></line>';
    }
    svg+='<polyline class="trend-line" points="'+coords.join(" ")+'"></polyline>';
    valid.forEach(function(p,i){
      var volume=volumeKey&&p[volumeKey]!=null?" / "+volumeLabel+p[volumeKey]:"";
      svg+='<circle class="trend-dot" cx="'+px(i).toFixed(1)+'" cy="'+py(Number(p[key])).toFixed(1)+'" r="3">'+
           '<title>'+esc(p.date)+" "+esc(title)+" "+trendNumber(p[key],digits)+esc(volume)+'</title></circle>';
    });
    var firstDate=valid[0].date.slice(5).replace("-","/"),lastDate=valid[valid.length-1].date.slice(5).replace("-","/");
    svg+='<text class="trend-axis" x="'+l+'" y="'+(h-5)+'">'+esc(firstDate)+'</text>'+
         '<text class="trend-axis" x="'+(w-r)+'" y="'+(h-5)+'" text-anchor="end">'+esc(lastDate)+'</text></svg>';
    var latest=valid[valid.length-1],delta=Number(latest[key])-Number(valid[0][key]);
    return '<div class="trend-card"><div class="trend-title">'+esc(title)+
           '<span class="trend-latest">'+trendNumber(latest[key],digits)+'</span>'+
           (valid.length>1?'<span class="trend-delta">'+(delta>=0?"+":"")+trendNumber(delta,digits)+'</span>':'')+
           '</div>'+svg+
           '<div class="trend-volume">最新窓：'+esc(volumeLabel)+(latest[volumeKey]||0)+
           '／'+latest.games+'試合</div></div>';
  }
  function findPlayerTrend(data,key,name,team){
    if(!data||!data.players) return null;
    if(data.players[key]) return data.players[key];
    var wanted=normName(name);
    for(var k in data.players){
      var p=data.players[k];
      if(p.team===team && normName(p.name)===wanted) return p;
    }
    return null;
  }
  function renderPlayerTrends(containerId){
    var ctx=playerTrendContexts[containerId],el=document.getElementById(containerId);

      return;

    if(!player){
      el.innerHTML='<div class="subsec"><div class="subttl">直近推移</div><div class="msg">対象期間の出場データがありません</div></div>';

         esc(containerId)+'\','+n+')">'+n+'試合</button>';
    });
    h+='</div></div>';
    var batter=(player.batter||{})[String(period)]||[];

      h+='<div class="subttl">野手</div><div class="trend-grid">'+
         trendChart("OPS",batter,"ops",3,null,"pa","打席")+
         trendChart("W-Rating",batter,"w_rating",1,100,"pa","打席")+
         trendChart("W-Value",batter,"w_value",2,0,"pa","打席")+'</div>';
    }
    if(pitcher.length){
      h+='<div class="subttl" style="margin-top:10px">投手</div><div class="trend-grid">'+
         trendChart("防御率",pitcher,"era",2,null,"innings","投球回")+
         trendChart("W-Rating",pitcher,"w_rating",1,100,"innings","投球回")+
         trendChart("W-Value",pitcher,"w_value",2,0,"innings","投球回")+'</div>';
    }
    h+='<div class="trend-volume">欠場試合は数えません。W-Ratingは表示期間ごとにリーグ内で再標準化。'+
       '点に触れると試合日と出場量を確認できます。／データ基準日 '+esc(data.latest_date||"-")+'</div></div>';
    el.innerHTML=h;
  }
  function setPlayerTrendPeriod(containerId,period){
    playerTrendPeriods[containerId]=period;
    renderPlayerTrends(containerId);
  }
  async function loadPlayerTrends(key,name,team,containerId){
    var year=(dp.value||todayJST()).split("-")[0];
    playerTrendContexts[containerId]={key:key,name:name,team:team,year:year};

  /* ===== 全選手グラフ ===== */
  var pgData=null,pgPlayers=[],pgYear="",pgKind="batter",pgTeam="all",pgPeriod=5,
      pgMetric="ops",pgSelectedKeys=[],pgParamsApplied=false,pgLoading=null;
  var PG_COLORS=["#e8590c","#1971c2","#2f9e44"];

  function pgMetricDefs(){
    return pgKind==="pitcher"
      ?[{key:"era",label:"防御率",digits:2,baseline:null,reverse:true},
        {key:"w_rating",label:"W-Rating",digits:1,baseline:100,reverse:false},
        {key:"w_value",label:"W-Value",digits:2,baseline:0,reverse:false}]
      :[{key:"ops",label:"OPS",digits:3,baseline:null,reverse:false},
        {key:"w_rating",label:"W-Rating",digits:1,baseline:100,reverse:false},
        {key:"w_value",label:"W-Value",digits:2,baseline:0,reverse:false}];
  }
  function pgMetricDef(){
    return pgMetricDefs().find(function(x){return x.key===pgMetric;})||pgMetricDefs()[0];
  }
  function pgPlayer(key){
    return pgPlayers.find(function(p){return p.key===key;})||null;
  }
  function pgTrend(player){
    return player?findPlayerTrend(pgData,player.key,player.name,player.team):null;
  }
  function pgPoints(key){
    var player=pgPlayer(key),trend=pgTrend(player);
    return trend&&trend[pgKind]&&trend[pgKind][String(pgPeriod)]||[];
  }
  function pgCandidates(search){
    var wanted=normName(search||"");
    return pgPlayers.filter(function(p){
      var hasKind=pgKind==="pitcher"?!!p.pitching:!!p.batting;
      return hasKind&&(pgTeam==="all"||p.team===pgTeam)&&
        (!wanted||normName(p.name).indexOf(wanted)>=0||String(p.number||"").indexOf(wanted)>=0);
    }).sort(function(a,b){
      var order=TEAM_ORDER_PA.concat(TEAM_ORDER_SE),ta=order.indexOf(a.team),tb=order.indexOf(b.team);
      var na=parseInt(a.number,10),nb=parseInt(b.number,10);
      return (ta<0?99:ta)-(tb<0?99:tb)||
        (isFinite(na)?na:9999)-(isFinite(nb)?nb:9999)||a.name.localeCompare(b.name,"ja");
    });
  }
  function pgDefaultKey(){
    var ranked=pgCandidates("").map(function(p){
      var points=pgPoints(p.key),last=points[points.length-1];
      return {key:p.key,value:last&&Number(last.w_value)};
    }).filter(function(x){return isFinite(x.value);})
      .sort(function(a,b){return b.value-a.value;});
    return ranked.length?ranked[0].key:(pgCandidates("")[0]||{}).key;
  }
  function pgEnsureSelection(){
    pgSelectedKeys=pgSelectedKeys.filter(function(key){
      var p=pgPlayer(key);return p&&(pgKind==="pitcher"?!!p.pitching:!!p.batting);
    }).slice(0,3);
    if(!pgSelectedKeys.length){var key=pgDefaultKey();if(key)pgSelectedKeys=[key];}
  }
  function pgApplyUrl(){
    if(pgParamsApplied) return;

    try{
      var params=new URLSearchParams(location.search);
      if(params.get("view")!=="playergraph") return;
      if(params.get("kind")==="pitcher") pgKind="pitcher";
      var period=Number(params.get("window"));
      if((pgData.windows||[]).indexOf(period)>=0) pgPeriod=period;
      var allowed=pgMetricDefs().map(function(x){return x.key;});
      if(allowed.indexOf(params.get("metric"))>=0) pgMetric=params.get("metric");
      pgSelectedKeys=(params.get("players")||"").split(",").filter(Boolean).slice(0,3);
    }catch(e){}
  }
  async function loadPlayerGraph(){
    var view=document.getElementById("playerGraphView"),year=(dp.value||todayJST()).split("-")[0];

      try{
        var trend=await getImpactTrends(year);
        if(!seasonData){
          var response=await fetch("data/"+year+"/players/stats.json?t="+Date.now());
          if(!response.ok) throw 0;
          seasonData=(await response.json()).players||[];
        }
        pgData=trend||{players:{},windows:[5,15]};pgPlayers=seasonData||[];pgYear=year;
        if((pgData.windows||[]).indexOf(pgPeriod)<0) pgPeriod=(pgData.windows||[5])[0];

  function pgFormat(v,digits){return v==null||!isFinite(Number(v))?"-":Number(v).toFixed(digits);}
  function pgShowTooltip(event,node){
    var stage=node&&node.closest(".pg-chart-stage"),tip=stage&&stage.querySelector(".pg-chart-tooltip");
    if(!stage||!tip)return;

  function pgChart(){
    var def=pgMetricDef(),series=pgSelectedKeys.map(function(key,index){
      return {player:pgPlayer(key),color:PG_COLORS[index],points:pgPoints(key).filter(function(p){
        return p[def.key]!=null&&isFinite(Number(p[def.key]));
      })};
    }).filter(function(x){return x.player&&x.points.length;});
    if(!series.length) return '<div class="msg">この期間の出場データがありません</div>';
    var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});
    var values=all.map(function(p){return Number(p[def.key]);});
    var dates=all.map(function(p){return new Date(p.date+"T00:00:00").getTime();});
    var min=Math.min.apply(null,values),max=Math.max.apply(null,values);
    if(def.baseline!=null){min=Math.min(min,def.baseline);max=Math.max(max,def.baseline);}
    var spread=max-min||Math.max(Math.abs(max)*.12,1);min-=spread*.12;max+=spread*.12;
    var dmin=Math.min.apply(null,dates),dmax=Math.max.apply(null,dates);
    if(dmin===dmax){dmin-=86400000;dmax+=86400000;}
    var w=860,h=390,l=62,r=18,t=20,b=48,pw=w-l-r,ph=h-t-b;
    function px(date){return l+(new Date(date+"T00:00:00").getTime()-dmin)/(dmax-dmin)*pw;}
    function py(value){return t+(max-Number(value))/(max-min)*ph;}
    var svg='<svg class="pg-svg" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(def.label)+'の選手比較グラフ"><defs>';
    series.forEach(function(s,index){
      svg+='<linearGradient id="pg-gradient-'+index+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="'+s.color+'" stop-opacity=".72"/>'+
        '<stop offset="100%" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>';
    });
    svg+='</defs>';
    for(var i=0;i<=4;i++){

  function pgCommentary(player){
    var points=pgPoints(player.key),def=pgMetricDef(),valid=points.filter(function(p){return p[def.key]!=null;});
    if(!valid.length) return "選択期間の出場記録がないため、推移は評価していません。";
    if(valid.length===1) return "比較できる出場が1試合のみです。サンプルが増えてから推移を確認してください。";
    var first=Number(valid[0][def.key]),last=Number(valid[valid.length-1][def.key]),delta=last-first;
    var threshold=def.key==="w_rating"?5:def.key==="w_value"?.08:def.key==="era"?.5:.05;
    var improved=def.reverse?delta<=-threshold:delta>=threshold;
    var declined=def.reverse?delta>=threshold:delta<=-threshold;
    var direction=improved?"上向き":declined?"下降傾向":"おおむね横ばい";
    var volume=pgKind==="pitcher"?(valid[valid.length-1].innings+"回"):(valid[valid.length-1].pa+"打席");
    return "直近"+pgPeriod+"試合の"+def.label+"は"+direction+"です。最新窓は"+volume+
      "。欠場は数えず、短期間の数値は対戦相手や出場量の影響も受けます。";

  function socialDateISO(value){

    var probe=new Date(Date.UTC(year,month-1,day));
    if(probe.getUTCFullYear()!==year||probe.getUTCMonth()!==month-1||probe.getUTCDate()!==day)return "";

  function socialHomeRunText(date,rows,state,total,index,parts){

  function socialBuildHomeRunPosts(summary,date,league){
    var rows=socialHomeRunRows(summary,league),state=socialSummaryState(summary);
    if(!rows.length){
      return [socialDateLabel(date)+" 本日の本塁打\n\n本塁打なし\n\n"+state+"\n\n#NPB"];
    }
    var chunks=[],current=[];
    rows.forEach(function(row){
      var candidate=current.concat([row]);
      /* 分割番号と球団タグが増えても280文字以内に収まるよう250で余裕を持たせる。 */
      var probe=socialHomeRunText(date,candidate,state,rows.length,8,8);
      if(current.length&&socialWeightedLength(probe)>250){chunks.push(current);current=[row];}
      else current=candidate;
    });
    if(current.length) chunks.push(current);
    return chunks.map(function(chunk,index){
      return socialHomeRunText(date,chunk,state,rows.length,index,chunks.length);

  function socialPost(id,category,title,text){return {id:id,category:category,title:title,text:text};}

  function socialChunkEntries(id,category,title,heading,entries,footer){
    if(!entries.length)return [];
    function build(chunk,index,parts){
      var teams=[];chunk.forEach(function(entry){teams=teams.concat(entry.teams||[]);});
      var head=heading+(parts>1?"（"+(index+1)+"/"+parts+"）":"");
      return head+"\n\n"+chunk.map(function(entry){return entry.text;}).join("\n")+
        (footer?"\n\n"+footer:"")+"\n\n"+socialTags(teams);
    }
    var chunks=[],current=[];
    entries.forEach(function(entry){
      var candidate=current.concat([entry]),probe=build(candidate,8,8);
      if(current.length&&socialWeightedLength(probe)>250){chunks.push(current);current=[entry];}
      else current=candidate;
    });
    if(current.length)chunks.push(current);
    return chunks.map(function(chunk,index){
      return socialPost(id+"-"+index,category,title+(chunks.length>1?" "+(index+1)+"/"+chunks.length:""),build(chunk,index,chunks.length));
    });
  }

  function socialPitcherInfo(game,name,decision){
    var pitching=(game.boxscore&&game.boxscore.pitching)||{};
    var target=normName(name),fuzzy=[];
    for(var i=0;i<["home","away"].length;i++){
      var side=["home","away"][i],rows=pitching[side]||[];
      for(var j=0;j<rows.length;j++){
        var rowName=normName(rows[j].name);
        if(rowName===target)return {team:socialGameTeam(game,side),name:rows[j].name||name};
        if(rowName.indexOf(target)===0||target.indexOf(rowName)===0){
          fuzzy.push({team:socialGameTeam(game,side),name:rows[j].name||name,decision:String(rows[j].decision||"").replace("Ｓ","S")});
        }
      }
    }
    if(fuzzy.length>1&&decision){
      var decided=fuzzy.filter(function(info){return info.decision===decision;});
      if(decided.length===1)return decided[0];
    }
    return fuzzy.length===1?fuzzy[0]:{team:"",name:name};
  }

  function socialMilestonePosts(){

    var dailyBat={},dailyPit={};
    (socialState.games||[]).forEach(function(game){
      var batting=(game.boxscore&&game.boxscore.batting)||{},pitching=(game.boxscore&&game.boxscore.pitching)||{};
      ["home","away"].forEach(function(side){
        (batting[side]||[]).forEach(function(row){
          if(!row.player_id)return;var d=dailyBat[row.player_id]||(dailyBat[row.player_id]={hits:0,hr:0,rbi:0,sb:0});
          d.hits+=num(row.hits);d.hr+=num(row.hr);d.rbi+=num(row.rbi);d.sb+=num(row.sb);
        });
        (pitching[side]||[]).forEach(function(row){
          if(!row.player_id)return;var d=dailyPit[row.player_id]||(dailyPit[row.player_id]={wins:0,saves:0,holds:0,so:0});

        });
      });
    });

    (socialState.players||[]).forEach(function(player){
      if(!socialTeamAllowed(player.team))return;
      var labels=[],b=player.batting||{},q=player.pitching||{},db=dailyBat[player.player_id]||{},dpit=dailyPit[player.player_id]||{};
      socialMilestoneReached(b.hits,db.hits,[50,100,150,200]).forEach(function(v){labels.push("今季"+v+"安打");});
      socialMilestoneReached(b.hr,db.hr,[10,20,30,40,50]).forEach(function(v){labels.push("今季"+v+"本塁打");});
      socialMilestoneReached(b.rbi,db.rbi,[50,100]).forEach(function(v){labels.push("今季"+v+"打点");});
      socialMilestoneReached(b.sb,db.sb,[10,20,30,40,50]).forEach(function(v){labels.push("今季"+v+"盗塁");});

      detailed=socialState.games.length,ended=socialState.games.filter(function(game){return /試合終了|中止|ノーゲーム/.test(String((game.result&&game.result.state)||""));}).length;
    var complete=listed===detailed&&detailed===ended&&(!expected||listed===expected),text="試合データ "+detailed+"/"+(expected||listed)+"件取得";
    text+=complete?"・全試合終了":"・未取得または試合途中のデータがあります";
    if(!socialState.award)text+="／日刊表彰データなし";
    if(!dashData||socialState.date!==dashData.date)text+="／シーズン節目は最新日のみ判定";
    return {complete:complete,text:text};
  }

      return socialState.category==="all"||item.post.category===socialState.category;
    });
    container.innerHTML=visible.length?visible.map(function(item){
      var post=item.post,index=item.index,text=post.text,length=socialWeightedLength(text),posted=socialIsPosted(post);
      return '<div class="social-post'+(posted?' posted':'')+'" data-post-index="'+index+'"><div class="social-post-head"><span>'+esc(post.title)+
        (posted?' <span class="social-posted-badge">投稿済み</span>':'')+'</span>'+
        '<span id="socialCount'+index+'" class="social-count'+(length>280?' warn':'')+'">'+length+' / 280</span></div>'+
        '<textarea id="socialPost'+index+'" class="social-text" oninput="socialRefreshCount('+index+')">'+esc(text)+'</textarea>'+
        '<div class="social-actions"><button class="btn primary" onclick="socialOpenPost('+index+')">Xで投稿</button>'+
        '<button class="btn" onclick="socialCopyPost('+index+')">本文をコピー</button>'+

  function careerValue(value,key){
    if(value==null||value==="") return "-";
    if(/^(win_pct|batting_average|slugging_percentage|on_base_percentage)$/.test(key)){
      return Number(value).toFixed(3).replace(/^0\./,".");
    }
    if(key==="era") return Number(value).toFixed(2);
    return String(value);
  }

  function careerStatsTable(title,data,defs,emptyLabel){
    var h='<div class="career-stats"><div class="subttl">'+esc(title)+'</div>';
    if(!data) return h+'<div class="career-empty">'+esc(emptyLabel||"NPB一軍の通算成績はありません")+'</div></div>';
    h+='<div class="tblwrap"><table class="stbl"><thead><tr>';
    defs.forEach(function(def){h+='<th>'+esc(def[1])+'</th>';});
    h+='</tr></thead><tbody><tr>';
    defs.forEach(function(def){h+='<td class="num">'+esc(careerValue(data[def[0]],def[0]))+'</td>';});
    return h+'</tr></tbody></table></div></div>';
  }

  function yearlyStatsTable(title,rows,total,defs,emptyLabel){
    rows=Array.isArray(rows)?rows:[];
    var h='<details class="yearly-stats" open><summary>'+esc(title)+'</summary>';
    if(!rows.length&&!total){
      return h+'<div class="career-empty" style="margin:10px">'+esc(emptyLabel||"NPB一軍成績はありません")+'</div></details>';
    }
    h+='<div class="tblwrap"><table class="stbl"><thead><tr><th>年度</th><th>所属球団</th>';
    defs.forEach(function(def){h+='<th>'+esc(def[1])+'</th>';});
    h+='</tr></thead><tbody>';
    rows.forEach(function(row){
      h+='<tr><td>'+esc(row.year||"-")+'</td><td>'+esc(row.team||"-")+'</td>';
      defs.forEach(function(def){h+='<td class="num">'+esc(careerValue(row[def[0]],def[0]))+'</td>';});
      h+='</tr>';
    });
    if(total){
      h+='<tr class="yearly-total"><td colspan="2">通算</td>';
      defs.forEach(function(def){h+='<td class="num">'+esc(careerValue(total[def[0]],def[0]))+'</td>';});
      h+='</tr>';
    }
    return h+'</tbody></table></div></details>';
  }

  function matchupVerdict(row,isPitcher){
    var pa=Number(row.pa)||0,ops=Number(row.ops)||0;
    if(pa<10)return {label:"参考",tone:"normal"};
    if(isPitcher){
      if(pa>=15&&ops<.500)return {label:"超得意",tone:"good"};
      if(ops<.600)return {label:"得意",tone:"good"};
      if(ops>=1.000&&pa>=15)return {label:"超苦手",tone:"bad"};
      if(ops>=.900)return {label:"苦手",tone:"bad"};
      return {label:"普通",tone:"normal"};
    }
    if(pa>=15&&ops>=1.000)return {label:"超得意",tone:"good"};
    if(ops>=.900)return {label:"得意",tone:"good"};
    if(pa>=15&&ops<.500)return {label:"超苦手",tone:"bad"};
    if(ops<.600)return {label:"苦手",tone:"bad"};
    return {label:"普通",tone:"normal"};
  }
  function matchupRanked(rows,isPitcher){
    var minPa=Math.max(matchupRankingMinPa(),Number(matchupState.minPa)||1);
    var eligible=rows.filter(function(row){return row.pa>=minPa&&row.ops!=null&&isFinite(Number(row.ops));});
    if(!isPitcher){
      var byOpsDesc=eligible.slice().sort(function(a,b){return (Number(b.ops)||0)-(Number(a.ops)||0)||(Number(b.avg)||0)-(Number(a.avg)||0)||b.pa-a.pa||String(a.name).localeCompare(String(b.name),"ja");});
      var byOpsAsc=eligible.slice().sort(function(a,b){return (Number(a.ops)||0)-(Number(b.ops)||0)||(Number(a.avg)||0)-(Number(b.avg)||0)||b.pa-a.pa||String(a.name).localeCompare(String(b.name),"ja");});
      return {
        good:byOpsDesc.slice(0,5),
        bad:byOpsAsc.slice(0,5),
        minPa:minPa
      };
    }
    var totalPa=eligible.reduce(function(sum,row){return sum+row.pa;},0);
    var mean=totalPa?eligible.reduce(function(sum,row){return sum+matchupProduction(row)*row.pa;},0)/totalPa:0;
    var scored=eligible.map(function(row){
      var confidence=row.pa/(row.pa+12);
      return {row:row,score:(matchupProduction(row)-mean)*confidence};
    });
    var high=scored.slice().sort(function(a,b){return b.score-a.score||b.row.pa-a.row.pa||String(a.row.name).localeCompare(String(b.row.name),"ja");});
    var low=scored.slice().sort(function(a,b){return a.score-b.score||b.row.pa-a.row.pa||String(a.row.name).localeCompare(String(b.row.name),"ja");});
    var good=(isPitcher?low:high).filter(function(x){return isPitcher?x.score<0:x.score>0;});
    var bad=(isPitcher?high:low).filter(function(x){return isPitcher?x.score>0:x.score<0;});
    return {good:good.slice(0,5).map(function(x){return x.row;}),bad:bad.slice(0,5).map(function(x){return x.row;}),minPa:minPa};
  }

  function pitchHeatmapColor(t){
    var stops=[[43,108,176],[158,202,225],[247,247,242],[253,174,97],[215,25,28]],scaled=Math.max(0,Math.min(.999,t))*(stops.length-1),i=Math.floor(scaled),f=scaled-i;

  function drawPitchHeatmapSurface(){
    var canvas=document.getElementById("pitchHeatCanvas"),render=pitchHeatmapRenderData;if(!canvas||!render||!render.total)return;
    var size=300,ctx=canvas.getContext("2d");canvas.width=size;canvas.height=size;ctx.clearRect(0,0,size,size);
    var density=new Float32Array(size*size),sigma=.135,sigma2=2*sigma*sigma,maxDensity=0,zones=render.zones;
    for(var y=0;y<size;y++){
      var py=(y+.5)/size;
      for(var x=0;x<size;x++){
        var px=(x+.5)/size,sum=0;
        zones.forEach(function(item,index){
          if(!item.count||item.value==null)return;
          var zx=(index%5+.5)/5,zy=(Math.floor(index/5)+.5)/5,dx=px-zx,dy=py-zy;
          var normalized=render.metric==="count"||render.metric==="share"?(render.max?item.value/render.max:0):
            (render.metric==="speed"?(render.max>render.min?(item.value-render.min)/(render.max-render.min):.5):item.value);
          var reliability=Math.min(1,item.count/8),weight=(.08+.92*Math.max(0,normalized))*reliability;
          sum+=weight*Math.exp(-(dx*dx+dy*dy)/sigma2);
        });
        density[y*size+x]=sum;if(sum>maxDensity)maxDensity=sum;
      }
    }
    var image=ctx.createImageData(size,size);
    for(var i=0;i<density.length;i++){
      var t=maxDensity?density[i]/maxDensity:0,offset=i*4;
      if(t<.018){image.data[offset+3]=0;continue;}
      var rgb=pitchHeatmapColor(Math.pow(t,.72));
      image.data[offset]=rgb[0];image.data[offset+1]=rgb[1];image.data[offset+2]=rgb[2];image.data[offset+3]=Math.round(70+Math.min(1,t)*175);
    }
    ctx.putImageData(image,0,0);
    var ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#202020";
    ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.strokeRect(size*.2,size*.2,size*.6,size*.6);
    ctx.beginPath();ctx.moveTo(size*.39,size*.93);ctx.lineTo(size*.61,size*.93);ctx.lineTo(size*.67,size*.97);ctx.lineTo(size*.5,size*.995);ctx.lineTo(size*.33,size*.97);ctx.closePath();ctx.stroke();
  }

    var zones=Array.from({length:25},function(){return {count:0,swings:0,misses:0,called:0,inplay:0,speedSum:0,speedCount:0};}),usedGames=0,usedBatters=new Set();

      a.gameSet[e[0]]=1;a.pa+=Number(e[3])||0;a.ab+=Number(e[4])||0;a.h+=Number(e[5])||0;a.single+=Number(e[6])||0;a.double+=Number(e[7])||0;a.triple+=Number(e[8])||0;a.hr+=Number(e[9])||0;a.bb+=Number(e[10])||0;a.hbp+=Number(e[11])||0;a.so+=Number(e[12])||0;a.sf+=Number(e[13])||0;a.sh+=Number(e[14])||0;a.gidp+=Number(e[15])||0;a.error+=Number(e[16])||0;a.rbi+=Number(e[17])||0;a.pitches+=Number(e[18])||0;a.outs+=Number(e[19])||0;

    var rows=Object.keys(grouped).map(function(key){

    var opponentItems=Object.keys(opponents).sort().map(function(team){return inningOption(team,team,inningSplitState.opponent);}).join("");
    var metricItems=isP?[["ops","被OPS"],["avg","被打率"],["kpct","K%"],["bbpct","BB%"],["pitches","投球数"]]:[["ops","OPS"],["avg","打率"],["hr","本塁打"],["kpct","三振率"]];
    if(!metricItems.some(function(item){return item[0]===inningSplitState.metric;}))inningSplitState.metric="ops";
    var controls='<div class="inning-split-controls">'+

      '<label class="ef inning-game-field'+(inningSplitState.scope!=="game"?' is-hidden':'')+'"><span>対象試合</span><select id="inningGame" onchange="inningSplitChanged()">'+gameItems+'</select></label>'+
      '<label class="ef"><span>対戦球団</span><select id="inningOpponent" onchange="inningSplitChanged()">'+inningOption("all","全球団",inningSplitState.opponent)+opponentItems+'</select></label>'+
      '<label class="ef"><span>ホーム/ビジター</span><select id="inningVenue" onchange="inningSplitChanged()">'+inningOption("all","すべて",inningSplitState.venue)+inningOption("home","ホーム",inningSplitState.venue)+inningOption("away","ビジター",inningSplitState.venue)+'</select></label>'+
      '<label class="ef"><span>相手の左右</span><select id="inningHand" onchange="inningSplitChanged()">'+inningOption("all","左右すべて",inningSplitState.hand)+inningOption("1",isP?"右打者":"右投手",inningSplitState.hand)+inningOption("2",isP?"左打者":"左投手",inningSplitState.hand)+'</select></label>'+
      '<label class="ef"><span>グラフ指標</span><select id="inningMetric" onchange="inningSplitChanged()">'+metricItems.map(function(item){return inningOption(item[0],item[1],inningSplitState.metric);}).join("")+'</select></label>'+
      '<label class="ef inning-date-range"><span>期間（任意）</span><span class="inning-date-inputs"><input id="inningFrom" aria-label="開始日" type="date" value="'+esc(inningSplitState.from)+'" onchange="inningSplitChanged()"><i>〜</i><input id="inningTo" aria-label="終了日" type="date" value="'+esc(inningSplitState.to)+'" onchange="inningSplitChanged()"></span></label></div>';
    if(!rows.length){box.innerHTML='<div class="inning-split">'+controls+'<div class="msg">条件に合う回別成績がありません</div></div>';return;}
    var metric=inningSplitState.metric,max=Math.max.apply(null,rows.map(function(row){return Number(row[metric])||0;}))||1;
    var metricLabel=(metricItems.find(function(item){return item[0]===metric;})||[metric,metric])[1];
    var chart='<div class="subttl">'+esc(metricLabel)+'の回別比較</div><div class="inning-split-chart">';
    rows.forEach(function(row,index){var value=Number(row[metric])||0,display=(metric==="kpct"||metric==="bbpct")?inningPctText(row[metric]):((metric==="ops"||metric==="avg")?inningRateText(row[metric]):String(value));var sample=row.pa>=20?'<span class="inning-sample ok">十分</span>':'<span class="inning-sample">少数</span>';chart+='<div class="inning-chart-card" style="animation-delay:'+(index*35)+'ms"><div class="inning-chart-head"><div class="inning-chart-label">'+row.inning+'回</div>'+sample+'</div><div class="inning-chart-value">'+display+'</div><div class="inning-chart-metric">'+esc(metricLabel)+'</div><div class="inning-chart-meta">'+row.pa+(isP?'打者':'打席')+' ／ '+row.games+'試合</div><div class="inning-chart-track"><div class="inning-chart-bar" style="width:'+Math.max(1,value/max*100).toFixed(1)+'%"></div></div></div>';});chart+='</div>';
    var h='<div class="inning-split">'+controls+chart+'<div class="inning-table-title"><div class="subttl">回別の詳細成績</div><span class="sub2">表は横にスクロールできます</span></div><div class="tblwrap"><table class="stbl inning-split-table"><thead><tr><th>回</th><th>試合</th><th>'+(isP?'打者':'打席')+'</th>'+(isP?'<th>記録回</th><th>球数</th>':'')+'<th>打数</th><th>'+(isP?'被安':'安打')+'</th><th>二塁</th><th>三塁</th><th>'+(isP?'被本':'本塁打')+'</th><th>四球</th><th>死球</th><th>三振</th>'+(isP?'':'<th>打点</th>')+'<th>'+(isP?'被打率':'打率')+'</th><th>'+(isP?'被出塁':'出塁率')+'</th><th>'+(isP?'被長打':'長打率')+'</th><th>'+(isP?'被OPS':'OPS')+'</th><th>K%</th><th>BB%</th><th>標本</th></tr></thead><tbody>';
    rows.forEach(function(row){var sample=row.pa>=20?'<span class="inning-sample ok">十分</span>':'<span class="inning-sample">少数</span>';h+='<tr><td class="num hi">'+row.inning+'回</td><td class="num">'+row.games+'</td><td class="num">'+row.pa+'</td>'+(isP?'<td class="num">'+outsToIp(row.outs)+'</td><td class="num">'+row.pitches+'</td>':'')+'<td class="num">'+row.ab+'</td><td class="num">'+row.h+'</td><td class="num">'+row.double+'</td><td class="num">'+row.triple+'</td><td class="num">'+row.hr+'</td><td class="num">'+row.bb+'</td><td class="num">'+row.hbp+'</td><td class="num">'+row.so+'</td>'+(isP?'':'<td class="num">'+row.rbi+'</td>')+'<td class="num">'+inningRateText(row.avg)+'</td><td class="num">'+inningRateText(row.obp)+'</td><td class="num">'+inningRateText(row.slg)+'</td><td class="num hi">'+inningRateText(row.ops)+'</td><td class="num">'+inningPctText(row.kpct)+'</td><td class="num">'+inningPctText(row.bbpct)+'</td><td>'+sample+'</td></tr>';});
    h+='</tbody></table></div><div class="inning-split-note">回別の打撃結果は各打席の終了回で集計しています。標本「少数」は20打席未満です。'+(isP?'記録回は打席データのアウト進行から集計しています。自責点を回別に推測しないため、回別防御率は表示しません。':'打率・OPSなどは選択条件内の打席から再計算しています。')+'</div></div>';box.innerHTML=h;
  }

  async function loadSplitFile(name){
    if(splitCache[name]) return splitCache[name];
    var year=(dp.value||todayJST()).split("-")[0];
    var r=await fetch("data/"+year+"/dataset/"+name+".csv?t="+Date.now());
    if(!r.ok) throw new Error("notfound");
    var all=parseCSV(await r.text()).filter(function(x){return x.length>1;});
    if(!all.length) throw new Error("empty");
    var header=all[0], idx={};
    header.forEach(function(h,i){ idx[h]=i; });
    // 行を扱いやすいオブジェクトにする
    var rows=all.slice(1).map(function(r2){
      var o={};
      header.forEach(function(h,i){ o[h]=r2[i]; });
      return o;
    });
    splitCache[name]={header:header, rows:rows, idx:idx};
    return splitCache[name];
  }

  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  function outsToIp(o){ return (o%3) ? (Math.floor(o/3)+"."+(o%3)) : String(Math.floor(o/3)); }

  function aggBat(rows){
    var a={games:rows.length, ab:0, hits:0, hr:0, rbi:0, bb:0, so:0, sb:0, runs:0};
    rows.forEach(function(r){
      a.ab+=num(r.ab); a.hits+=num(r.hits); a.hr+=num(r.hr); a.rbi+=num(r.rbi);
      a.bb+=num(r.bb)+num(r.hbp); a.so+=num(r.so); a.sb+=num(r.sb); a.runs+=num(r.runs);
    });
    a.avg = a.ab ? a.hits/a.ab : null;
    return a;
  }
  function aggPit(rows){
    var a={games:rows.length, outs:0, er:0, ra:0, so:0, bb:0, ha:0, hra:0,
           pitches:0, w:0, l:0, s:0, qs:0};
    rows.forEach(function(r){
      a.outs+=num(r.outs); a.er+=num(r.earned_runs); a.ra+=num(r.runs_allowed);
      a.so+=num(r.so); a.bb+=num(r.bb); a.ha+=num(r.hits_allowed);
      a.hra+=num(r.hr_allowed); a.pitches+=num(r.pitches);
      var d=r.decision||"";
      if(d.indexOf("勝")>=0) a.w++;
      if(d.indexOf("敗")>=0) a.l++;
      if(d.indexOf("Ｓ")>=0||d.indexOf("S")>=0) a.s++;
      if(String(r.is_qs).toLowerCase()==="true") a.qs++;
    });
    var ip=a.outs/3;
    a.innings=outsToIp(a.outs);
    a.era = ip ? a.er*9/ip : null;
    a.whip = ip ? (a.ha+a.bb)/ip : null;
    return a;
  }

  function playerRows(data, p){
    return data.rows.filter(function(r){
      if(p.key && r.player_key) return r.player_key===p.key;
      if(p.player_id && r.player_id) return r.player_id===String(p.player_id);
      return r.player===p.name;
    });
  }

  async function openSplits(key){
    curSplitPlayer=null;
    resetInningSplit();
    for(var i=0;i<seasonData.length;i++){
      if(seasonData[i].key===key){ curSplitPlayer=seasonData[i]; break; }
    }
    if(!curSplitPlayer) return;
    var el=document.getElementById("plSplits");
    if(!el) return;
    el.innerHTML='<div class="msg">読み込み中…</div>';
    try{
      await loadSplitFile("batting_lines");
      await loadSplitFile("pitching_lines");
      renderSplits();
    }catch(e){
      el.innerHTML='<div class="msg">1試合ごとのデータがまだありません<br>'+
        '<span style="font-size:12px">Actionsで収集すると dataset/batting_lines.csv が生成されます</span></div>';
    }
  }
  function setSplitTab(t){ splitTab=t; renderSplits(); }

  function renderSplits(){
    var el=document.getElementById("plSplits");
    var p=curSplitPlayer;
    if(!el||!p) return;

    var bl=playerRows(splitCache["batting_lines"], p);
    var pl=playerRows(splitCache["pitching_lines"], p);
    if(!bl.length && !pl.length){
      el.innerHTML='<div class="msg">この選手の1試合ごとのデータが見つかりません</div>';
      return;
    }
    var isP=pl.length>0;

    var tabs=[["log","試合ログ"],["month","月別"],["opp","対戦球団別"],
              ["park","球場別"],["ha","ホーム/ビジター"],["recent","直近5・10試合"],["inning","回別"]];
    tabs.push(isP ? ["mix","配球分析"] : ["swing","スイング指標"]);

    var h='<div class="stabs" style="margin-top:12px">';
    tabs.forEach(function(t){
      h+='<button class="stab'+(splitTab===t[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setSplitTab(\''+t[0]+'\')">'+t[1]+'</button>';
    });
    h+='</div>';

    if(splitTab==="log") h+=splitLog(bl, pl, isP);
    else if(splitTab==="month") h+=splitBy(bl, pl, isP, function(r){return (r.date||"").slice(0,7);}, "月", true);
    else if(splitTab==="opp") h+=splitBy(bl, pl, isP, function(r){return r.opponent||"-";}, "対戦相手", false);
    else if(splitTab==="park") h+=splitBy(bl, pl, isP, function(r){return r.stadium||"不明";}, "球場", false);
    else if(splitTab==="ha") h+=splitBy(bl, pl, isP, function(r){
        return String(r.is_home).toLowerCase()==="true" ? "ホーム" : "ビジター";
      }, "区分", false);
    else if(splitTab==="inning"){
      h+='<div id="plInnings"><div class="msg">回別データを読み込み中…</div></div>';
      el.innerHTML=h;
      loadInningSplit();
      return;
    }
    else if(splitTab==="mix" || splitTab==="swing"){
      h+='<div id="plPitches"><div class="msg">読み込み中…</div></div>';
      el.innerHTML=h;
      loadPitchSplit(isP);
      return;
    }
    else h+=splitRecent(bl, pl, isP);

    el.innerHTML=h;
  }

  /* 一球データを読み込んで配球／スイングを描画 */
  async function loadPitchSplit(isP){
    var box=document.getElementById("plPitches");
    if(!box) return;
    try{
      var d=await loadSplitFile("pitches");
      var p=curSplitPlayer;
      var rows=d.rows.filter(function(r){
        if(isP){
          if(p.key && r.pitcher_key) return r.pitcher_key===p.key;
          if(p.player_id && r.pitcher_id) return r.pitcher_id===String(p.player_id);
          return r.pitcher===p.name;
        }
        if(p.key && r.batter_key) return r.batter_key===p.key;
        if(p.player_id && r.batter_id) return r.batter_id===String(p.player_id);
        return r.batter===p.name;
      });
      box.innerHTML = isP ? splitPitchMix(rows) : splitSwing(rows);
    }catch(e){
      box.innerHTML='<div class="msg">一球データがまだありません<br>'+
        '<span style="font-size:12px">Actionsで収集すると dataset/pitches.csv が生成されます</span></div>';
    }
  }

  /* 試合ログ */

      : '<th>打順</th><th>位置</th><th>打数</th><th>安打</th><th>本</th><th>点</th><th>三振</th><th>四球</th><th>盗</th>';
    h+='</tr></thead><tbody>';
    rows.forEach(function(r){
      var home=String(r.is_home).toLowerCase()==="true";
      h+='<tr><td class="num">'+esc((r.date||"").slice(5).replace("-","/"))+'</td>'+

      if(isP){

        h+='<td><span class="dec '+dcls+'">'+esc(d)+'</span></td>'+
           '<td class="num">'+esc(r.innings||"")+'</td>'+

           '<td class="num">'+esc(r.hits_allowed||"0")+'</td>'+
           '<td class="num'+(num(r.so)>0?' hi':'')+'">'+esc(r.so||"0")+'</td>'+
           '<td class="num">'+esc(r.bb||"0")+'</td>'+
           '<td class="num">'+esc(r.runs_allowed||"0")+'</td>'+
           '<td class="num">'+esc(r.earned_runs||"0")+'</td>'+
           '<td class="num">'+(String(r.is_qs).toLowerCase()==="true"?'<span class="qmark">QS</span>':'')+'</td>';
      }else{
        h+='<td class="num">'+(r.order?esc(r.order)+"番":"-")+'</td>'+
           '<td class="pos">'+esc(r.position||"")+'</td>'+
           '<td class="num">'+esc(r.ab||"0")+'</td>'+
           '<td class="num'+(num(r.hits)>0?' hi':'')+'">'+esc(r.hits||"0")+'</td>'+

  /* 任意のキーでまとめる */
  function splitBy(bl, pl, isP, keyFn, label, sortKeyAsc){
    var rows=isP?pl:bl;
    var groups={}, order=[];
    rows.forEach(function(r){
      var k=keyFn(r);
      if(!groups[k]){ groups[k]=[]; order.push(k); }
      groups[k].push(r);
    });
    order.sort(function(a,b){
      return sortKeyAsc ? a.localeCompare(b) : groups[b].length-groups[a].length;
    });
    if(!order.length) return '<div class="msg">データがありません</div>';

    var h='<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">'+esc(label)+'</th>';
    h += isP
      ? '<th>登板</th><th>回</th><th>防御率</th><th>WHIP</th><th>奪三</th><th>四球</th><th>被安</th><th>勝</th><th>敗</th><th>S</th>'
      : '<th>試合</th><th>打数</th><th>安打</th><th>打率</th><th>本</th><th>点</th><th>三振</th><th>四球</th><th>盗</th>';
    h+='</tr></thead><tbody>';

    order.forEach(function(k){
      var g=groups[k];
      var disp = (label==="対戦相手") ? (teamBadge(k)+" "+esc(k)) : esc(k);
      h+='<tr><td class="nm">'+disp+'</td>';
      if(isP){
        var a=aggPit(g);
        h+='<td class="num">'+a.games+'</td><td class="num">'+esc(a.innings)+'</td>'+
           '<td class="num hi">'+(a.era==null?"-":a.era.toFixed(2))+'</td>'+
           '<td class="num">'+(a.whip==null?"-":a.whip.toFixed(2))+'</td>'+
           '<td class="num">'+a.so+'</td><td class="num">'+a.bb+'</td>'+
           '<td class="num">'+a.ha+'</td><td class="num">'+a.w+'</td>'+
           '<td class="num">'+a.l+'</td><td class="num">'+a.s+'</td>';
      }else{
        var b=aggBat(g);
        h+='<td class="num">'+b.games+'</td><td class="num">'+b.ab+'</td>'+
           '<td class="num">'+b.hits+'</td>'+
           '<td class="num hi">'+fmtAvg(b.avg)+'</td>'+
           '<td class="num'+(b.hr>0?' hi':'')+'">'+b.hr+'</td>'+
           '<td class="num">'+b.rbi+'</td><td class="num">'+b.so+'</td>'+
           '<td class="num">'+b.bb+'</td><td class="num">'+b.sb+'</td>';
      }
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    return h;
  }

  /* 直近5試合・10試合 */
  function splitRecent(bl, pl, isP){
    var rows=(isP?pl:bl).slice().sort(function(a,b){
      return (b.date||"").localeCompare(a.date||"");
    });
    var h='';
    [["直近5試合",5],["直近10試合",10],["全期間",rows.length]].forEach(function(x){
      var g=rows.slice(0,x[1]);
      if(!g.length) return;
      h+='<div class="subsec"><div class="subttl">'+x[0]+'（'+g.length+'試合）</div><div class="statrow">';
      if(isP){
        var a=aggPit(g);
        h+='<div class="stat"><div class="sv">'+(a.era==null?"-":a.era.toFixed(2))+'</div><div class="sl">防御率</div></div>'+
           '<div class="stat"><div class="sv">'+esc(a.innings)+'</div><div class="sl">投球回</div></div>'+
           '<div class="stat"><div class="sv">'+a.so+'</div><div class="sl">奪三振</div></div>'+
           '<div class="stat"><div class="sv">'+(a.whip==null?"-":a.whip.toFixed(2))+'</div><div class="sl">WHIP</div></div>'+
           '<div class="stat"><div class="sv">'+a.w+'-'+a.l+'</div><div class="sl">勝敗</div></div>';
      }else{
        var b=aggBat(g);
        h+='<div class="stat"><div class="sv">'+fmtAvg(b.avg)+'</div><div class="sl">打率</div></div>'+
           '<div class="stat"><div class="sv">'+b.ab+'</div><div class="sl">打数</div></div>'+
           '<div class="stat"><div class="sv">'+b.hits+'</div><div class="sl">安打</div></div>'+
           '<div class="stat"><div class="sv">'+b.hr+'</div><div class="sl">本塁打</div></div>'+
           '<div class="stat"><div class="sv">'+b.rbi+'</div><div class="sl">打点</div></div>';
      }
      h+='</div></div>';
    });
    return h;
  }

  /* ===== 配球分析・スイング指標（一球データから） ===== */
  function bool01(v){ return String(v).toLowerCase()==="true"; }
  function pct(n, d, digits){
    if(!d) return "-";
    return (n/d*100).toFixed(digits==null?1:digits)+"%";
  }
  function handSide(h){
    h=String(h||"");
    if(h.indexOf("左")>=0) return "左";
    if(h.indexOf("右")>=0) return "右";
    if(h.indexOf("両")>=0) return "両";
    return "不明";
  }

  /* 行の集合から投球の基本指標をまとめる */
  function pitchAgg(rows){
    var a={n:rows.length, swing:0, miss:0, called:0, foul:0, ball:0, inplay:0,
           spdSum:0, spdN:0, spdMax:null, hits:0, endAB:0, so:0};
    rows.forEach(function(r){
      if(bool01(r.is_swing)) a.swing++;
      if(bool01(r.is_miss)) a.miss++;
      if(bool01(r.is_called)) a.called++;
      if(bool01(r.is_foul)) a.foul++;
      if(bool01(r.is_ball)) a.ball++;
      if(bool01(r.is_inplay)) a.inplay++;
      var s=parseFloat(r.speed_kmh);
      if(!isNaN(s)&&s>0){ a.spdSum+=s; a.spdN++; if(a.spdMax==null||s>a.spdMax) a.spdMax=s; }
      if(bool01(r.is_last_pitch)){
        a.endAB++;
        if(num(r.ab_hit)>0) a.hits++;
        if((r.ab_result||"").indexOf("三振")>=0) a.so++;
      }
    });
    a.avgSpd = a.spdN ? Math.round(a.spdSum/a.spdN) : null;
    a.strike = a.n - a.ball;
    return a;
  }

  function groupRows(rows, keyFn){
    var g={}, order=[];
    rows.forEach(function(r){
      var k=keyFn(r);
      if(k==null||k==="") k="不明";
      if(!g[k]){ g[k]=[]; order.push(k); }
      g[k].push(r);
    });
    return {groups:g, keys:order};
  }

  /* --- 投手：配球分析 --- */
  function splitPitchMix(rows){
    if(!rows.length) return '<div class="msg">一球データがありません</div>';
    var h='';

    // 球種別サマリー
    var g=groupRows(rows, function(r){return r.pitch_type;});
    g.keys.sort(function(a,b){ return g.groups[b].length-g.groups[a].length; });
    h+='<div class="subsec"><div class="subttl">球種別（'+rows.length+'球）</div><div class="tblwrap">'+
       '<table class="stbl"><thead><tr><th class="nm">球種</th><th>球数</th><th>割合</th>'+
       '<th>平均</th><th>最速</th><th>ストライク率</th><th>空振り率</th><th>Whiff%</th>'+
       '<th>被安打</th></tr></thead><tbody>';
    g.keys.forEach(function(k){
      var a=pitchAgg(g.groups[k]);
      h+='<tr><td class="nm">'+esc(k)+'</td>'+
         '<td class="num">'+a.n+'</td>'+
         '<td class="num hi">'+pct(a.n, rows.length)+'</td>'+
         '<td class="num">'+(a.avgSpd||"-")+'</td>'+
         '<td class="num">'+(a.spdMax||"-")+'</td>'+
         '<td class="num">'+pct(a.strike, a.n)+'</td>'+
         '<td class="num">'+pct(a.miss, a.n)+'</td>'+
         '<td class="num">'+pct(a.miss, a.swing)+'</td>'+
         '<td class="num">'+a.hits+'</td></tr>';
    });
    h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
       '空振り率＝全投球に対する空振りの割合／Whiff%＝スイングされた球のうち空振りの割合</div></div>';

    // カウント別の球種割合
    h+=crossTab(rows, "カウント別の球種割合",
        function(r){return r.count_before||"-";},
        function(r){return r.pitch_type;},
        function(a,b){
          var pa=a.split("-"), pb=b.split("-");
          return (num(pa[0])-num(pb[0])) || (num(pa[1])-num(pb[1]));
        });

    // 左右打者別
    h+=crossTab(rows, "左右打者別の球種割合",
        function(r){return "対"+handSide(r.bat_hand)+"打者";},
        function(r){return r.pitch_type;}, null);

    // 決め球（2ストライク後）
    var two=rows.filter(function(r){return num(r.strikes_before)>=2;});
    if(two.length){
      var g2=groupRows(two, function(r){return r.pitch_type;});
      g2.keys.sort(function(a,b){return g2.groups[b].length-g2.groups[a].length;});
      h+='<div class="subsec"><div class="subttl">決め球（2ストライク後の'+two.length+'球）</div>'+
         '<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">球種</th>'+
         '<th>球数</th><th>割合</th><th>空振り率</th><th>奪三振</th></tr></thead><tbody>';
      g2.keys.forEach(function(k){
        var a=pitchAgg(g2.groups[k]);
        h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+a.n+'</td>'+
           '<td class="num hi">'+pct(a.n, two.length)+'</td>'+
           '<td class="num">'+pct(a.miss, a.n)+'</td>'+
           '<td class="num'+(a.so>0?' hi':'')+'">'+a.so+'</td></tr>';
      });
      h+='</tbody></table></div></div>';
    }

    // 被安打・被本塁打となった球
    var ends=rows.filter(function(r){return bool01(r.is_last_pitch);});
    var hitP=ends.filter(function(r){return num(r.ab_hit)>0;});
    if(hitP.length){
      var g3=groupRows(hitP, function(r){return r.pitch_type;});
      g3.keys.sort(function(a,b){return g3.groups[b].length-g3.groups[a].length;});
      h+='<div class="subsec"><div class="subttl">被安打となった球（'+hitP.length+'本）</div>'+
         '<div class="tblwrap"><table class="stbl"><thead><tr><th class="nm">球種</th>'+
         '<th>被安打</th><th>その球種の投球数</th><th>被安打率</th></tr></thead><tbody>';
      g3.keys.forEach(function(k){
        var all=rows.filter(function(r){return r.pitch_type===k;}).length;
        h+='<tr><td class="nm">'+esc(k)+'</td>'+
           '<td class="num hi">'+g3.groups[k].length+'</td>'+
           '<td class="num">'+all+'</td>'+
           '<td class="num">'+pct(g3.groups[k].length, all, 2)+'</td></tr>';
      });
      h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
         '被安打率＝その球種を投げたうち安打になった割合</div></div>';
    }

    // ゾーン別の投球分布・被安打
    h+=zoneSection(rows, "ゾーン別の投球",
        "安打率＝そのゾーンで打席が終わった球のうち安打になった割合");

    // 被打率のスプリット
    h+=resultSplit(rows, "対左右打者別の被成績", function(r){return "対"+handSide(r.bat_hand)+"打者";});
    h+=resultSplit(rows, "対戦チーム別の被成績", function(r){return r.batting_team||"不明";});
    h+=resultSplit(rows, "球場別の被成績", function(r){return r.stadium||"不明";});

    // ゾーン内外
    h+=zoneSummary(rows, "ゾーン内外の投球");
    return h;
  }

  /* --- 打者：スイング指標 --- */
  function splitSwing(rows){
    if(!rows.length) return '<div class="msg">一球データがありません</div>';
    var a=pitchAgg(rows);
    var inZ=rows.filter(function(r){return bool01(r.in_zone);});
    var outZ=rows.filter(function(r){return String(r.in_zone).toLowerCase()==="false";});
    var inZa=pitchAgg(inZ), outZa=pitchAgg(outZ);
    var first=rows.filter(function(r){return num(r.pitch_no)===1;});
    var firsta=pitchAgg(first);

    var h='<div class="subsec"><div class="subttl">スイング指標（'+rows.length+'球）</div>'+
      '<div class="statrow">'+
      '<div class="stat"><div class="sv">'+pct(a.swing,a.n)+'</div><div class="sl">スイング率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.miss,a.n)+'</div><div class="sl">空振り率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.swing-a.miss,a.swing)+'</div><div class="sl">コンタクト率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.miss,a.swing)+'</div><div class="sl">Whiff%</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.called,a.n)+'</div><div class="sl">見逃し率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(a.foul,a.n)+'</div><div class="sl">ファウル率</div></div>'+
      '</div><div class="statrow" style="margin-top:8px">'+
      '<div class="stat"><div class="sv">'+pct(inZa.swing,inZa.n)+'</div><div class="sl">ゾーン内スイング率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(outZa.swing,outZa.n)+'</div><div class="sl">ゾーン外スイング率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(inZa.swing-inZa.miss,inZa.swing)+'</div><div class="sl">ゾーン内コンタクト率</div></div>'+
      '<div class="stat"><div class="sv">'+pct(firsta.swing,firsta.n)+'</div><div class="sl">初球スイング率</div></div>'+
      '</div><div class="sub" style="font-size:11px;margin-top:6px">'+
      'ゾーン外スイング率が低いほど選球眼がよく、コンタクト率が高いほどバットに当てる能力が高いとされます'+
      '（ゾーンは配球図の中央3×3を内側として判定）</div></div>';

    // 球種別
    var g=groupRows(rows, function(r){return r.pitch_type;});
    g.keys.sort(function(a2,b2){return g.groups[b2].length-g.groups[a2].length;});
    h+='<div class="subsec"><div class="subttl">球種別</div><div class="tblwrap">'+
       '<table class="stbl"><thead><tr><th class="nm">球種</th><th>球数</th><th>割合</th>'+
       '<th>平均球速</th><th>スイング率</th><th>空振り率</th><th>コンタクト率</th>'+
       '<th>安打</th></tr></thead><tbody>';
    g.keys.forEach(function(k){
      var x=pitchAgg(g.groups[k]);
      h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+x.n+'</td>'+
         '<td class="num">'+pct(x.n, rows.length)+'</td>'+
         '<td class="num">'+(x.avgSpd||"-")+'</td>'+
         '<td class="num">'+pct(x.swing,x.n)+'</td>'+
         '<td class="num">'+pct(x.miss,x.n)+'</td>'+
         '<td class="num">'+pct(x.swing-x.miss,x.swing)+'</td>'+
         '<td class="num'+(x.hits>0?' hi':'')+'">'+x.hits+'</td></tr>';
    });
    h+='</tbody></table></div></div>';

    // カウント別
    var gc=groupRows(rows, function(r){return r.count_before||"-";});
    gc.keys.sort(function(a2,b2){
      var pa=a2.split("-"), pb=b2.split("-");
      return (num(pa[0])-num(pb[0])) || (num(pa[1])-num(pb[1]));
    });
    h+='<div class="subsec"><div class="subttl">カウント別</div><div class="tblwrap">'+
       '<table class="stbl"><thead><tr><th class="nm">カウント</th><th>球数</th>'+
       '<th>スイング率</th><th>空振り率</th><th>見逃し率</th></tr></thead><tbody>';
    gc.keys.forEach(function(k){
      var x=pitchAgg(gc.groups[k]);
      h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+x.n+'</td>'+
         '<td class="num">'+pct(x.swing,x.n)+'</td>'+
         '<td class="num">'+pct(x.miss,x.n)+'</td>'+
         '<td class="num">'+pct(x.called,x.n)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';

    // 左右投手別
    h+=crossTab(rows, "左右投手別に見た球種",
        function(r){return "対"+handSide(r.pit_hand)+"投手";},
        function(r){return r.pitch_type;}, null);

    // ゾーン別の成績（得意・苦手）
    h+=zoneSection(rows, "ゾーン別成績（得意・苦手）",
        "安打率＝そのゾーンで打席が終わった球のうち安打になった割合");

    // 打撃成績のスプリット（対左右・球場別・対チーム別）
    h+=resultSplit(rows, "対左右投手別の成績", function(r){return "対"+handSide(r.pit_hand)+"投手";});
    h+=resultSplit(rows, "球場別の成績", function(r){return r.stadium||"不明";});
    h+=resultSplit(rows, "対戦チーム別の成績", function(r){return r.fielding_team||"不明";});

    h+=zoneSummary(rows, "ゾーン内外");
    return h;
  }

  /* 一球データから打撃成績を切り口別に集計する */
  function resultSplit(rows, title, keyFn){
    // 打席を終えた球だけを見る
    var ends=rows.filter(function(r){return bool01(r.is_last_pitch);});
    if(!ends.length) return "";
    var g=groupRows(ends, keyFn);
    g.keys.sort(function(a,b){return g.groups[b].length-g.groups[a].length;});

    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div><div class="tblwrap">'+
      '<table class="stbl"><thead><tr><th class="nm">区分</th><th>打席</th><th>打数</th>'+
      '<th>安打</th><th>安打率</th><th>三振</th><th>四死球</th></tr></thead><tbody>';
    g.keys.forEach(function(k){
      var rs=g.groups[k];
      var pa=rs.length, ab=0, hits=0, so=0, bb=0;
      rs.forEach(function(r){
        var ar=r.ab_result||"";
        if(ar.indexOf("四球")>=0 || ar.indexOf("死球")>=0){ bb++; return; }
        if(ar.indexOf("犠")>=0) return;
        ab++;
        if(num(r.ab_hit)>0) hits++;
        if(ar.indexOf("三振")>=0) so++;
      });
      var disp = /チーム/.test(title) ? (teamBadge(k)+" "+esc(k)) : esc(k);
      h+='<tr><td class="nm">'+disp+'</td>'+
         '<td class="num">'+pa+'</td><td class="num">'+ab+'</td>'+
         '<td class="num'+(hits>0?' hi':'')+'">'+hits+'</td>'+
         '<td class="num hi">'+(ab?fmtAvg(hits/ab):"-")+'</td>'+
         '<td class="num">'+so+'</td><td class="num">'+bb+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    return h;
  }

  /* 行キー×列キーの割合クロス表 */
  function crossTab(rows, title, rowKeyFn, colKeyFn, rowSort){
    var rg=groupRows(rows, rowKeyFn);
    var cols={}, colOrder=[];
    rows.forEach(function(r){
      var c=colKeyFn(r)||"不明";
      if(!cols[c]){ cols[c]=0; colOrder.push(c); }
      cols[c]++;
    });
    colOrder.sort(function(a,b){ return cols[b]-cols[a]; });
    if(!rg.keys.length || !colOrder.length) return "";
    if(rowSort) rg.keys.sort(rowSort);

    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div><div class="tblwrap">'+
      '<table class="stbl"><thead><tr><th class="nm">'+'</th><th>球数</th>'+
      colOrder.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+
      '</tr></thead><tbody>';
    rg.keys.forEach(function(k){
      var g=rg.groups[k];
      h+='<tr><td class="nm">'+esc(k)+'</td><td class="num">'+g.length+'</td>';
      colOrder.forEach(function(c){
        var n=g.filter(function(r){return (colKeyFn(r)||"不明")===c;}).length;
        var p=g.length?n/g.length*100:0;
        var bg = p>0 ? 'style="background:rgba(232,89,12,'+(Math.min(p,60)/60*0.5).toFixed(2)+')"' : '';
        h+='<td class="num" '+bg+'>'+(n?p.toFixed(0)+"%":"-")+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
       '色が濃いほど割合が高い／各行の合計が100%</div></div>';
    return h;
  }

  /* ゾーン内外のまとめ */
  function zoneSummary(rows, title){
    var inZ=rows.filter(function(r){return bool01(r.in_zone);});
    var outZ=rows.filter(function(r){return String(r.in_zone).toLowerCase()==="false";});
    if(!inZ.length && !outZ.length) return "";
    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div><div class="tblwrap">'+
      '<table class="stbl"><thead><tr><th class="nm">区分</th><th>球数</th><th>割合</th>'+
      '<th>スイング率</th><th>空振り率</th><th>安打</th></tr></thead><tbody>';
    [["ゾーン内",inZ],["ゾーン外",outZ]].forEach(function(x){
      if(!x[1].length) return;
      var a=pitchAgg(x[1]);
      h+='<tr><td class="nm">'+x[0]+'</td><td class="num">'+a.n+'</td>'+

  /* 5×5ゾーンの成績グリッド（打者から見た得意・苦手の可視化） */
  function zoneGrid(rows, mode){
    // ゾーンごとに集計
    var cell={};
    rows.forEach(function(r){
      var gr=r.zone_row, gc=r.zone_col;
      if(gr===""||gc===""||gr==null||gc==null) return;
      var k=gr+"-"+gc;
      if(!cell[k]) cell[k]={n:0, swing:0, miss:0, hits:0, endAB:0};
      var c=cell[k];
      c.n++;
      if(bool01(r.is_swing)) c.swing++;
      if(bool01(r.is_miss)) c.miss++;
      if(bool01(r.is_last_pitch)){
        var ar=r.ab_result||"";
        // 四死球・犠打は打数に数えない
        if(ar && ar.indexOf("四球")<0 && ar.indexOf("死球")<0 && ar.indexOf("犠")<0){
          c.endAB++;
          if(num(r.ab_hit)>0) c.hits++;
        }
      }
    });

    function val(c){
      if(!c) return null;
      if(mode==="avg")   return c.endAB>=1 ? c.hits/c.endAB : null;
      if(mode==="miss")  return c.n>=1 ? c.miss/c.n : null;
      if(mode==="swing") return c.n>=1 ? c.swing/c.n : null;
      return c.n;
    }
    // 色の基準（最大値）
    var mx=0;
    for(var k in cell){
      var v=val(cell[k]);
      if(v!=null && v>mx) mx=v;
    }
    if(!mx) return '<div class="sub">ゾーンデータがありません</div>';

    var h='<div class="heat zgrid">';
    for(var r0=0;r0<5;r0++){
      for(var c0=0;c0<5;c0++){
        var c=cell[r0+"-"+c0];
        var v=val(c);
        var inZone=(r0>=1&&r0<=3&&c0>=1&&c0<=3);
        var ratio=(v==null||!mx)?0:(v/mx);
        var txt="-", sub="";
        if(c){
          if(mode==="avg") txt = (c.endAB>=1) ? fmtAvg(v) : "-";
          else if(mode==="count") txt = String(c.n);
          else txt = (v==null) ? "-" : Math.round(v*100)+"%";
          sub = (mode==="avg") ? (c.endAB+"打数") : (c.n+"球");
        }
        h+='<div class="hcell zcell'+(inZone?' zone':'')+'" '+
           'style="background:rgba(232,89,12,'+(ratio*0.85).toFixed(2)+')" '+
           'title="'+(c?(c.n+"球 / "+c.endAB+"打数 "+c.hits+"安打"):"データなし")+'">'+
           '<span class="zv">'+txt+'</span>'+
           (sub?'<span class="zs">'+sub+'</span>':'')+'</div>';
      }
    }
    h+='</div>';
    return h;
  }

    var year=(awardsKind==="daily"?awardsDate:awardsKind==="weekly"?awardsMonday:awardsMonth).split("-")[0];

            : awardsKind==="weekly" ? "data/"+year+"/awards/weekly/"+awardsMonday+".json"
            : "data/"+year+"/awards/monthly/"+awardsMonth+".json";
    try{
      var r=await fetch(url+"?t="+Date.now());
      awardsData = r.ok ? await r.json() : null;

      var p=awardsMonth.split("-"); var y=parseInt(p[0],10), m=parseInt(p[1],10)+n;
      while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}

  function mvpCard(title, x, isPit){
    if(!x) return '<div class="card2"><h3>'+title+'</h3><div class="msg">該当なし</div></div>';
    var col=tColor(x.team)||"var(--accent)";
    var h='<div class="card2 mvpcard" style="border-left:5px solid '+col+'">'+
      '<h3>'+title+(isPit&&x.role?' <span class="subtag">'+esc(x.role)+'</span>':'')+'</h3>'+
      '<div class="mvpname">'+teamBadge(x.team)+' '+esc(x.name)+'</div>'+
      '<div class="mvpscore"><span class="motion-count">'+x.score+'</span><span class="mvpunit">点</span>'+
      (x.margin!=null?'<span class="mvpmargin">2位と +'+x.margin+'</span>':'')+'</div>'+
      '<div class="mvpstat">'+esc(x.stat_line||"")+'</div>';
    if((x.reasons||[]).length){
      h+='<div class="mvprow"><span class="k">加点</span>'+
         x.reasons.map(function(r){return '<span class="qmark">'+esc(r)+'</span>';}).join(" ")+'</div>';
    }
    if((x.minus_reasons||[]).length){
      h+='<div class="mvprow"><span class="k">減点</span>'+
         x.minus_reasons.map(function(r){
           return '<span class="subtag" style="background:var(--muted)">'+esc(r)+'</span>';}).join(" ")+'</div>';
    }
    var volumeMult=x.sample_multiplier!=null?x.sample_multiplier:x.workload_multiplier;
    if(volumeMult!=null && volumeMult<0.999){
      h+='<div class="mvprow"><span class="k">出場量</span>'+
         '<span class="subtag">補正 ×'+Number(volumeMult).toFixed(3)+'</span></div>';
    }
    if(x.comment) h+='<div class="mvpcomment">'+esc(x.comment)+'</div>';
    if(x.breakdown){
      h+='<div class="mvpbd">';
      var lb={basicBatting:"打撃",runProduction:"得点貢献",clutch:"勝負強さ",
              baserunning:"走塁",defense:"守備",teamWin:"勝利",penalty:"減点",
              innings:"投球回",prevention:"失点抑制",strikeout:"奪三振",
              whip:"WHIP",winContrib:"勝利貢献",achievement:"特別記録",base:"基礎",situation:"場面"};
      for(var k in x.breakdown){
        var v=x.breakdown[k];
        if(!v) continue;
        h+='<span class="bdchip'+(v<0?" minus":"")+'">'+(lb[k]||k)+' '+v+'</span>';
      }
      h+='</div>';
    }
    return h+'</div>';
  }
