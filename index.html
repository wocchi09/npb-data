  function rankTable(title, list, isPit){
    if(!list.length) return "";
    var h='<div class="subsec"><div class="subttl">'+esc(title)+'</div>'+
      '<div class="tblwrap"><table class="stbl"><thead><tr>'+
      '<th>#</th><th class="nm">選手</th><th>球団</th>'+
      (isPit?'':'<th>位置</th>')+'<th>スコア</th>'+
      '<th class="nm">成績</th><th class="nm">加点／減点</th></tr></thead><tbody>';
    list.forEach(function(x,i){
      var good=(x.reasons||[]).join("／");
      var bad=(x.minus_reasons||[]).join("／");
      var volumeMult=x.sample_multiplier!=null?x.sample_multiplier:x.workload_multiplier;
      if(volumeMult!=null && volumeMult<0.999){
        bad+=(bad?"／":"")+"出場量補正×"+Number(volumeMult).toFixed(3);
      }
      h+='<tr><td class="num">'+(i+1)+'</td>'+
        '<td class="nm">'+esc(x.name)+'</td>'+
        '<td>'+teamBadge(x.team)+'</td>'+
        (isPit?'':'<td class="pos">'+esc(x.position||"-")+'</td>')+
        '<td class="num hi">'+x.score+'</td>'+
        '<td class="nm" style="font-weight:400;font-size:12px">'+esc(x.stat_line||"")+'</td>'+
        '<td class="nm" style="font-weight:400;font-size:11px">'+esc(good)+
          (bad?'<span class="dim">／'+esc(bad)+'</span>':'')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    return h;
  }

  /* ===== セイバーメトリクス分析 ===== */
  var saberData=null, saberKind="batter", saberLeague="all", saberTeam="all",
      saberQual="qualified", saberMetric="wrc_plus_est", saberSelectedKey=null,
      saberCurrentTop=[], saberAiText="", saberAiState="";

  function saberDefs(){
    if(saberKind==="pitcher"){
      return [
        {key:"era",label:"防御率",digits:2,higher:false,desc:"9回あたりの自責点"},
        {key:"fip",label:"FIP",digits:2,higher:false,desc:"守備に依存しにくい投球評価"},
        {key:"whip",label:"WHIP",digits:2,higher:false,desc:"1回あたりに許した走者"},
        {key:"k_pct",label:"K%",digits:1,higher:true,pct:true,desc:"対戦打者から三振を奪った割合"},
        {key:"bb_pct",label:"BB%",digits:1,higher:false,pct:true,desc:"対戦打者へ四球を与えた割合"},
        {key:"k_bb",label:"K/BB",digits:2,higher:true,desc:"奪三振と与四球の比率"},
        {key:"lob_pct_est",label:"推定LOB%",digits:1,higher:true,pct:true,desc:"走者を生還させなかった推定割合"},
        {key:"k9",label:"K/9",digits:2,higher:true,desc:"9回あたり奪三振"},
        {key:"w_rating",label:"W-Rating",digits:1,higher:true,root:true,desc:"役割調整済みの質"}
      ];
    }
    return [
      {key:"wrc_plus_est",label:"推定wRC+",digits:0,higher:true,desc:"リーグ平均100の打撃得点創出力"},
      {key:"woba_est",label:"推定wOBA",digits:3,higher:true,desc:"打席あたりの加重得点貢献"},
      {key:"ops",label:"OPS",digits:3,higher:true,desc:"出塁率と長打率の合計"},
      {key:"iso",label:"ISO",digits:3,higher:true,desc:"純粋な長打力"},
      {key:"bb_pct",label:"BB%",digits:1,higher:true,pct:true,desc:"四球を選んだ打席割合"},
      {key:"k_pct",label:"K%",digits:1,higher:false,pct:true,desc:"三振した打席割合"},
      {key:"bb_k",label:"BB/K",digits:2,higher:true,desc:"四球と三振の比率"},
      {key:"rc27",label:"RC27",digits:2,higher:true,desc:"27アウトあたりの推定得点"},
      {key:"xr27",label:"XR27",digits:2,higher:true,desc:"27アウトあたりの推定XR"},
      {key:"bsr_est",label:"推定BsR",digits:2,higher:true,desc:"取得可能な走塁イベントの得点価値"},
      {key:"w_rating",label:"W-Rating",digits:1,higher:true,root:true,desc:"役割調整済みの質"}
    ];
  }
  function saberDef(key){
    var defs=saberDefs();
    for(var i=0;i<defs.length;i++) if(defs[i].key===key) return defs[i];
    return defs[0];
  }
  function saberValue(row,key){
    if(!row) return null;
    var d=saberDef(key),value=d.root?row[key]:(row.stats||{})[key];
    if(value==null||value==="") return null;
    value=Number(value);
    return isFinite(value)?value:null;
  }
  function saberFmt(value,key){
    if(value==null||!isFinite(value)) return "-";
    var d=saberDef(key);
    if(d.pct) return (value*100).toFixed(d.digits)+"%";
    if(d.digits===0) return String(Math.round(value));
    return value.toFixed(d.digits);
  }
  function saberRows(){
    if(!saberData) return [];
    var source=saberKind==="pitcher"?saberData.pitchers:saberData.batters;
    return impactUniqueRows(source||[]).filter(function(row){
      var s=row.stats||{},lg=row.league||tLeague(row.team);
      if(saberLeague!=="all"&&lg!==saberLeague) return false;
      if(saberTeam!=="all"&&row.team!==saberTeam) return false;
      if(saberQual==="qualified"){
        return saberKind==="pitcher"?!!s.qualified_ip:!!s.qualified_pa;
      }
      if(saberQual==="regular"){
        return saberKind==="pitcher"?Number(s.innings||0)>=10:Number(s.pa||0)>=50;
      }
      return true;
    });
  }
  function saberSorted(rows,key){
    var d=saberDef(key);
    return rows.filter(function(row){return saberValue(row,key)!=null;})
      .sort(function(a,b){
        var av=saberValue(a,key),bv=saberValue(b,key);
        return (d.higher?bv-av:av-bv)||Number(b.w_value||0)-Number(a.w_value||0);
      });
  }
  function saberPercentile(row,key,rows){
    var value=saberValue(row,key),d=saberDef(key);
    var values=rows.map(function(x){return saberValue(x,key);})
      .filter(function(x){return x!=null;});
    if(value==null||!values.length) return null;
    var favorable=values.filter(function(x){return d.higher?x<=value:x>=value;}).length;
    return Math.round(favorable/values.length*100);
  }
  function saberSetKind(kind){
    saberKind=kind;saberTeam="all";saberSelectedKey=null;saberAiText="";saberAiState="";
    saberMetric=kind==="pitcher"?"fip":"wrc_plus_est";
    renderSabermetrics();
  }
  function saberSetLeague(lg){
    saberLeague=lg;
    if(saberTeam!=="all"&&lg!=="all"&&tLeague(saberTeam)!==lg) saberTeam="all";
    saberSelectedKey=null;saberAiText="";saberAiState="";renderSabermetrics();
  }
  function saberSetTeam(team){
    saberTeam=team;saberSelectedKey=null;saberAiText="";saberAiState="";
    renderSabermetrics();
  }
  function saberSetQual(qual){
    saberQual=qual;saberSelectedKey=null;saberAiText="";saberAiState="";
    renderSabermetrics();
  }
  function saberSetMetric(metric){
    saberMetric=metric;saberSelectedKey=null;saberAiText="";saberAiState="";
    renderSabermetrics();
  }
  function saberSelect(key){
    saberSelectedKey=key;saberAiText="";saberAiState="";renderSabermetrics();
  }
  function saberSelectIndex(index){
    var row=saberCurrentTop[index];
    if(row) saberSelect(row.player_key);
  }
  function saberTeamOptions(rows){
    var seen={},teams=[];
    (rows||[]).forEach(function(row){
      var lg=row.league||tLeague(row.team);
      if(row.team&&(saberLeague==="all"||lg===saberLeague)&&!seen[row.team]){
        seen[row.team]=1;teams.push(row.team);
      }
    });
    var order=TEAM_ORDER_PA.concat(TEAM_ORDER_SE);
    teams.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
    return '<option value="all">全12球団</option>'+teams.map(function(team){
      return '<option value="'+esc(team)+'"'+(saberTeam===team?" selected":"")+'>'+
        esc(team)+'</option>';
    }).join("");
  }
  async function loadSabermetrics(){
    var view=document.getElementById("sabermetricsView");
    view.innerHTML='<div class="msg">セイバーメトリクスデータを読み込み中…</div>';
    var year=(dp.value||todayJST()).split("-")[0];
    try{
      var response=await fetch("data/"+year+"/w_impact.json?t="+Date.now());
      saberData=response.ok?await response.json():null;
    }catch(e){saberData=null;}
    renderSabermetrics();
  }
  function saberKpis(rows){
    var keys=saberKind==="pitcher"
      ?["era","fip","k_pct","k_bb"]
      :["wrc_plus_est","woba_est","rc27","bsr_est"];
    return '<div class="saber-kpis">'+keys.map(function(key){
      var leader=saberSorted(rows,key)[0],d=saberDef(key);
      return '<div class="saber-kpi"><div class="saber-kpi-label">'+esc(d.label)+' リーダー</div>'+
        (leader?'<div class="saber-kpi-player">'+teamBadge(leader.team)+' '+esc(leader.name)+'</div>'+
        '<div class="saber-kpi-value">'+saberFmt(saberValue(leader,key),key)+'</div>':
        '<div class="saber-kpi-player">該当なし</div>')+'</div>';
    }).join("")+'</div>';
  }
  function saberBarChart(rows){
    var ranked=saberSorted(rows,saberMetric).slice(0,10),d=saberDef(saberMetric);
    saberCurrentTop=ranked;
    if(!ranked.length) return '<div class="msg">グラフに表示できる選手がいません</div>';
    var w=760,left=150,right=72,top=15,rowH=34,h=top+ranked.length*rowH+14;
    var values=ranked.map(function(row){return saberValue(row,saberMetric);});
    var min=Math.min.apply(null,values),max=Math.max.apply(null,values);
    var low=Math.min(0,min),range=(max-low)||1,plot=w-left-right;
    var s='<div class="saber-bar-scroll"><svg class="saber-bar-svg" viewBox="0 0 '+w+' '+h+
      '" role="img" aria-label="'+esc(d.label)+'上位選手">';
    ranked.forEach(function(row,index){
      var value=values[index],desirable=d.higher?(value-low)/range:(max-value)/(max-min||1);
      var width=Math.max(18,plot*(.28+.72*desirable)),y=top+index*rowH;
      var color=tColor(row.team)||"#e8590c",selected=row.player_key===saberSelectedKey;
      s+='<text class="bar-name" x="'+(left-8)+'" y="'+(y+20)+'" text-anchor="end">'+
        (index+1)+'. '+esc(row.name)+'</text>'+
        '<rect class="bar-bg" x="'+left+'" y="'+(y+6)+'" width="'+plot+'" height="20" rx="7"/>'+
        '<rect class="bar'+(selected?" selected":"")+'" x="'+left+'" y="'+(y+6)+
        '" width="'+width+'" height="20" rx="7" fill="'+color+'" onclick="saberSelectIndex('+index+')">'+
        '<title>'+esc(row.name)+'（'+esc(row.team)+'） '+esc(d.label)+' '+
        saberFmt(value,saberMetric)+'</title></rect>'+
        '<text x="'+(left+width+7)+'" y="'+(y+20)+'">'+saberFmt(value,saberMetric)+'</text>';
    });
    return s+'</svg></div>';
  }
  function saberRadarDefs(){
    return saberKind==="pitcher"
      ?["era","fip","whip","k_pct","k_bb","lob_pct_est"]
      :["wrc_plus_est","woba_est","iso","bb_pct","bsr_est","w_rating"];
  }
  function saberRadar(row,rows){
    var keys=saberRadarDefs(),cx=170,cy=137,r=102,count=keys.length;
    function point(radius,index){
      var angle=-Math.PI/2+Math.PI*2*index/count;
      return [cx+Math.cos(angle)*radius,cy+Math.sin(angle)*radius];
    }
    var s='<svg class="saber-radar" viewBox="0 0 340 285" role="img" aria-label="'+
      esc(row.name)+'の指標パーセンタイル">';
    [20,40,60,80,100].forEach(function(level){
      var pts=keys.map(function(_,i){return point(r*level/100,i).join(",");});
      s+='<polygon class="grid" points="'+pts.join(" ")+'"/>';
    });
    keys.forEach(function(key,i){
      var edge=point(r,i),label=point(r+23,i),anchor=label[0]<cx-8?"end":label[0]>cx+8?"start":"middle";
      s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+edge[0]+'" y2="'+edge[1]+'"/>'+
        '<text x="'+label[0]+'" y="'+(label[1]+4)+'" text-anchor="'+anchor+'">'+
        esc(saberDef(key).label)+'</text>';
    });
    var shape=keys.map(function(key,i){
      var percentile=saberPercentile(row,key,rows);
      return point(r*Math.max(5,percentile==null?5:percentile)/100,i).join(",");
    });
    return s+'<polygon class="shape" points="'+shape.join(" ")+'"/></svg>';
  }
  function saberStatGrid(row){
    return '<div class="saber-stat-grid">'+saberRadarDefs().map(function(key){
      return '<div class="saber-stat"><span>'+esc(saberDef(key).label)+'</span><b>'+
        saberFmt(saberValue(row,key),key)+'</b></div>';
    }).join("")+'</div>';
  }
  function saberCommentary(row,rows){
    var keys=saberRadarDefs(),strengths=[],watch=[],s=row.stats||{};
    keys.forEach(function(key){
      var p=saberPercentile(row,key,rows),label=saberDef(key).label;
      if(p!=null&&p>=75) strengths.push(label+"（上位"+(100-p)+"%）");
      else if(p!=null&&p<=25) watch.push(label+"（下位"+p+"%）");
    });
    var primary=saberDef(saberMetric),rank=saberSorted(rows,saberMetric)
      .findIndex(function(x){return x.player_key===row.player_key;})+1;
    var volume=saberKind==="pitcher"
      ?Number(s.games||0)+"登板・"+Number(s.innings||0).toFixed(1)+"回"
      :Number(s.games||0)+"試合・"+Number(s.pa||0)+"打席";
    var text='<b>'+esc(row.name)+'</b>は、現在の絞り込み内で'+esc(primary.label)+
      'が'+(rank>0?rank+"位":"比較対象外")+"。"+esc(volume)+"の出場量があります。";
    if(strengths.length) text+=" 強みは"+esc(strengths.slice(0,3).join("、"))+"です。";
    if(watch.length) text+=" 一方、"+esc(watch.slice(0,2).join("、"))+
      "は相対的に低く、役割やサンプル数も含めて見る必要があります。";
    text+=" 数値は同じ条件の選手との相対比較で、将来成績を保証するものではありません。";
    return text;

  function saberAiPrompt(row,rows){
    var facts=saberRadarDefs().map(function(key){

        "（パーセンタイル"+saberPercentile(row,key,rows)+"）";
    }).join("、");

      "将来予測は書かないでください。選手="+row.name+"、球団="+row.team+"、区分="+
      (saberKind==="pitcher"?"投手":"野手")+"、出場量="+
      (saberKind==="pitcher"?(s.games+"登板・"+s.innings+"回"):(s.games+"試合・"+s.pa+"打席"))+

  function saberPuterText(response){
    if(typeof response==="string") return response.trim();
    if(response&&response.message){
      var content=response.message.content;
      if(typeof content==="string") return content.trim();
      if(Array.isArray(content)) return content.map(function(part){
        return typeof part==="string"?part:String((part&&part.text)||"");
      }).join("").trim();
    }
    return String((response&&(response.text||response.response))||"").trim();
  }
  async function saberGeneratePuterAI(row,rows,resultEl){
    if(!window.puter||!puter.ai||typeof puter.ai.chat!=="function"){
      throw new Error("Puter AIを読み込めませんでした");
    }
    resultEl.textContent="AIが公開データを分析しています…";
    var response=await puter.ai.chat(saberAiPrompt(row,rows));
    var answer=saberPuterText(response);
    if(!answer) throw new Error("AIから文章を取得できませんでした");
    return answer;
  }
  async function saberGenerateLocalAI(row,rows,resultEl){
    if(typeof LanguageModel==="undefined") throw new Error("このブラウザは端末内AIに対応していません");
    var options={
      expectedInputs:[{type:"text",languages:["ja"]}],
      expectedOutputs:[{type:"text",languages:["ja"]}]
    };
    var availability=await LanguageModel.availability(options);
    if(availability==="unavailable") throw new Error("この端末ではAIモデルを利用できません");
    if(availability==="downloadable"||availability==="downloading"){
      resultEl.textContent="初回AIモデルをダウンロードしています。しばらくお待ちください…";
    }else{
      resultEl.textContent="端末内AIが公開データを分析しています…";
    }
    var session=await LanguageModel.create(options);
    try{
      return String(await session.prompt(saberAiPrompt(row,rows))||"").trim();
    }finally{
      if(session.destroy) session.destroy();
    }
  }
  async function saberGenerateAI(){
    var rows=saberRows(),row=rows.find(function(x){return x.player_key===saberSelectedKey;});
    var resultEl=document.getElementById("saberAiResult"),button=document.getElementById("saberAiButton");
    if(!row||!resultEl) return;
    saberAiState="loading";button.disabled=true;resultEl.textContent="AIを準備しています…";
    try{
      var answer="",puterError=null;
      try{
        answer=await saberGeneratePuterAI(row,rows,resultEl);
      }catch(error){
        puterError=error;
        resultEl.textContent="クラウドAIを利用できないため、端末内AIへ切り替えています…";
        try{
          answer=await saberGenerateLocalAI(row,rows,resultEl);
        }catch(localError){
          throw new Error((puterError&&puterError.message?puterError.message:"クラウドAIを利用できません")+
            "／"+(localError&&localError.message?localError.message:"端末内AIを利用できません"));
        }
      }
      if(!answer) throw new Error("AIから文章を取得できませんでした");
      saberAiText=String(answer||"").trim();
      saberAiState="done";
      resultEl.textContent=saberAiText||"AIから文章を取得できませんでした";
    }catch(error){
      saberAiState="error";
      resultEl.textContent=(error&&error.message?error.message:"AIを利用できません")+
        "。上の自動寸評は引き続き利用できます。";
    }finally{
      button.disabled=false;
    }
  }

  function renderGlossary(){
    var implCount=0, estimateCount=0, unavailableCount=0;
    STAT_GLOSSARY.forEach(function(g){
      g.items.forEach(function(it){
        if(it.status==="impl") implCount++;
        else if(it.status==="estimate" || it.status==="partial") estimateCount++;
        else unavailableCount++;
      });
    });

    var h='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>セイバーメトリクス指標一覧'+
      '<span class="dash-date">実装'+implCount+' ／ 参考値'+estimateCount+' ／ データ不足'+unavailableCount+'</span></div>';

    h+='<p style="line-height:1.8;font-size:13.5px">利用できる試合データだけで算出可否を分類しています。'+
       '<span class="qmark">実装済</span> は定義どおり算出、'+
       '<span class="subtag" style="background:var(--accent2)">参考値</span> は固定係数や取得できるイベントだけで算出、'+
       '<span class="subtag" style="background:var(--muted)">データ不足</span> は必要なトラッキング情報などが無いため数値を作っていません。</p>';

    STAT_GLOSSARY.forEach(function(g){
      h+='<div class="subsec"><div class="subttl">'+esc(g.group)+'</div>';
      g.items.forEach(function(it){
        var badge = it.status==="impl"
          ? '<span class="qmark">実装済</span>'
          : (it.status==="estimate" || it.status==="partial")
          ? '<span class="subtag" style="background:var(--accent2)">'+
            (it.status==="partial"?"一部実装":"参考値")+'</span>'
          : '<span class="subtag" style="background:var(--muted)">データ不足</span>';
        h+='<div class="glossitem"><div class="glosshead">'+
           '<span class="glossabbr">'+esc(it.abbr)+'</span>'+
           '<span class="glossname">'+esc(it.name)+'</span>'+badge+'</div>'+
           '<div class="glossformula">'+esc(it.formula)+'</div>'+
           '<div class="glossdesc">'+esc(it.desc)+'</div>'+
           (it.note?'<div class="glossnote">'+esc(it.note)+'</div>':'')+

      });
      h+='</div>';

    h+='<div class="expbtns" style="margin-top:12px">'+

  var warData=null, warLg="パ", warKind="batter";

  async function loadWar(){
    var wv=document.getElementById("warView");
    wv.innerHTML='<div class="msg">読み込み中…</div>';
    var year=(dp.value||todayJST()).split("-")[0];
    try{
      var r=await fetch("data/"+year+"/war.json?t="+Date.now());
      warData = r.ok ? await r.json() : null;
    }catch(e){ warData=null; }
    renderWar();
  }
  function setWarLg(l){ warLg=l; renderWar(); }
  function setWarKind(k){ warKind=k; renderWar(); }

  function renderWar(){
    var wv=document.getElementById("warView");
    var h='<div class="dash-sec"><div class="dash-h"><span class="dot"></span>簡易WAR'+
      '<span class="dash-date">守備抜き・参考値</span></div>';

    h+='<div class="warwarn">⚠ このWARには<b>守備貢献が含まれていません</b>。'+
       '取得元のデータに打球の速度・到達地点が無く、守備範囲や失点抑止を算出できないためです。'+
       '打撃・走塁・ポジション補正のみで算出した参考値としてご覧ください。'+
       '　<a href="#" onclick="setView(\'warGuide\');return false;">算出方法の詳細 ▶</a></div>';

    if(!warData){
      h+='<div class="msg">WARデータがまだありません<br>'+
         '<span style="font-size:12px">Actionsで再集計すると作られます</span></div></div>';
      wv.innerHTML=h;
      return;
    }

    h+='<div class="stabs">';
    [["セ","セ・リーグ"],["パ","パ・リーグ"]].forEach(function(x){
      h+='<button class="stab'+(warLg===x[0]?" on":"")+'" style="--sc:'+LEAGUE_COLOR[x[0]]+'" '+
         'onclick="setWarLg(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div><div class="stabs gtabs">';
    [["batter","野手"],["pitcher","投手"]].forEach(function(x){
      h+='<button class="stab'+(warKind===x[0]?" on":"")+'" style="--sc:var(--accent)" '+
         'onclick="setWarKind(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';

    var list = (warKind==="batter" ? warData.batters : warData.pitchers)
      .filter(function(x){ return tLeague(x.team)===warLg; });

    if(!list.length){
      h+='<div class="msg">データがありません</div></div>';
      wv.innerHTML=h;
      return;
    }

    h+='<div class="tblwrap"><table class="stbl"><thead><tr>'+
       '<th>#</th><th class="nm">選手</th><th>球団</th>'+
       (warKind==="batter"?'<th>位置</th>':'')+
       '<th>WAR</th>'+
       (warKind==="batter"
         ?'<th>打撃</th><th>走塁</th><th>位置補正</th>'
         :'<th>FIP</th><th>回</th>')+
       '</tr></thead><tbody>';
    list.forEach(function(x,i){
      var c=x.components||{};
      h+='<tr><td class="num">'+(i+1)+'</td>'+
        '<td class="nm">'+esc(x.name)+
          (warKind==="batter"&&!x.qualified?'<span class="subtag" style="background:var(--muted)">規定未満</span>':'')+
        '</td><td>'+teamBadge(x.team)+'</td>'+
        (warKind==="batter"?'<td class="pos">'+esc(x.position||"-")+'</td>':'')+
        '<td class="num hi">'+x.war+'</td>'+
        (warKind==="batter"
          ?'<td class="num">'+(c.r_bat==null?"-":c.r_bat)+'</td>'+
           '<td class="num">'+(c.r_baser==null?"-":c.r_baser)+'</td>'+
           '<td class="num">'+(c.r_pos==null?"-":c.r_pos)+'</td>'
          :'<td class="num">'+(c.fip==null?"-":c.fip)+'</td>'+
           '<td class="num">'+(c.ip==null?"-":c.ip)+'</td>')+
        '</tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="sub" style="font-size:11px;margin-top:8px">'+esc(warData.note||"")+'</div>';
    h+='</div>';
    wv.innerHTML=h;
  }

  /* ===== サイト独自指標 W-Impact ===== */

  async function loadImpact(){

  function setImpactLg(l){ impactLg=l; renderImpact(); }
  function setImpactKind(k){
    impactKind=k;
    if((k==="batter" && impactQual==="ip") ||
       (k==="pitcher" && impactQual==="pa")) impactQual="all";
    if((k==="overall" && (impactSort.indexOf("components.")===0 || impactSort.indexOf("stats.")===0)) ||
       (k==="batter" && impactSort==="stats.innings") ||

  function setImpactQual(k){ impactQual=k; renderImpact(); }

  function toggleImpactSortDir(){
    impactSortDir=impactSortDir==="desc"?"asc":"desc";
    renderImpact();
  }
  function impactNum(v){ return v==null?"-":Number(v).toFixed(1); }
  function impactConfidenceBadge(x,compact){
    var c=(x||{}).confidence;
    if(!c)return '<span class="impact-confidence c1" title="W-Impact v1.6で再集計すると表示されます">再集計待ち</span>';
    var score=Number(c.score||0),level=Number(c.level||1);
    var title="指標信頼度 "+score+"点：標本量と収集データの充足度。成績の良し悪しではありません";
    return '<span class="impact-confidence c'+level+'" title="'+esc(title)+'">'+
      (compact?'C '+score:'<span class="impact-confidence-stars">'+esc(c.stars||"★☆☆☆☆")+'</span> '+
       esc(c.label||"低い")+' '+score)+'</span>';
  }
  function impactContextCell(x){
    var c=(x||{}).context;if(!c)return '<span class="sub">-</span>';
    var pct=(Number(c.adjustment||1)-1)*100,sign=pct>0?"+":"";
    var title="球場係数 "+Number(c.park_factor||1).toFixed(3)+
      " ／ 対戦相手係数 "+Number(c.opponent_factor||1).toFixed(3)+
      " ／ 中立化倍率 "+Number(c.adjustment||1).toFixed(3);
    return '<span class="impact-context" title="'+esc(title)+'"><b>'+sign+pct.toFixed(1)+'%</b><small>球場・相手</small></span>';
  }
  function impactPosition(x){
    var players=npbRoster&&npbRoster.players;
    if(players){
      var nn=normName(x.name);
      for(var i=0;i<players.length;i++){
        if(players[i].team===x.team && normName(players[i].name)===nn){
          return players[i].position_group||"-";
        }
      }
    }
    return x.position||"-";
  }
  function impactSortValue(x,key){
    if(key==="name") return x.name||"";
    if(key==="team") return x.team||"";
    if(key==="position") return impactPosition(x);
    if(key.indexOf("components.")===0){
      return Number((x.components||{})[key.slice(11)]||0);
    }
    if(key.indexOf("stats.")===0){
      return Number((x.stats||{})[key.slice(6)]||0);
    }
    if(key.indexOf("confidence.")===0){
      return Number((x.confidence||{})[key.slice(11)]||0);
    }
    if(key.indexOf("context.")===0){
      return Number((x.context||{})[key.slice(8)]||0);
    }
    return Number(x[key]||0);
  }
  function impactUniqueRows(rows){
    var best={},order=[];
    (rows||[]).forEach(function(x){
      var key=x.player_key||((x.team||"")+"|"+normName(x.name||""));
      var current=best[key];
      var games=Number(((x.stats||{}).games)||0);
      var currentGames=current?Number(((current.stats||{}).games)||0):0;
      if(!current){
        best[key]=x;order.push(key);
      }else if(
        Number(x.w_value||0)>Number(current.w_value||0) ||
        (Number(x.w_value||0)===Number(current.w_value||0) && games>currentGames) ||
        (Number(x.w_value||0)===Number(current.w_value||0) && games===currentGames &&
         Number(x.w_rating||0)>Number(current.w_rating||0))
      ){
        best[key]=x;
      }
    });
    return order.map(function(key){return best[key];});
  }
  function impactCompositeRows(rows,referenceRows){
    rows=impactUniqueRows(rows);
    referenceRows=impactUniqueRows(referenceRows||rows);
    function percentileMap(key){
      var values=referenceRows.map(function(x){return Number(x[key]||0);})
        .sort(function(a,b){return b-a;});
      var out={};
      rows.forEach(function(x){
        var v=Number(x[key]||0), first=values.indexOf(v), last=values.lastIndexOf(v);
        var rank=(first+last)/2;
        // 中央順位型の百分位。部門1位を機械的に100点へ固定しない。
        out[x.player_key]=values.length?
          100*(values.length-0.5-rank)/values.length:50;
      });
      return out;
    }
    var valuePct=percentileMap("w_value"), ratingPct=percentileMap("w_rating");
    return rows.map(function(x){
      return {player:x,score:0.7*valuePct[x.player_key]+0.3*ratingPct[x.player_key]};
    }).sort(function(a,b){
      return b.score-a.score ||
             Number(b.player.w_value||0)-Number(a.player.w_value||0) ||
             Number(b.player.w_rating||0)-Number(a.player.w_rating||0);
    });
  }
  function impactDepartments(){

      return (x.league||tLeague(x.team))===impactLg;
    });

      return batters.filter(function(x){
        return (x.stats||{}).primary_position===pos;
      });
    }
    function roleRows(role){
      return pitchers.filter(function(x){ return x.role===role; });
    }

      ["先発",roleRows("先発")],["中継ぎ",roleRows("中継ぎ")],["抑え",roleRows("抑え")],
      ["捕手",posRows("捕")],["一塁手",posRows("一")],["二塁手",posRows("二")],
      ["三塁手",posRows("三")],["遊撃手",posRows("遊")],["左翼手",posRows("左")],
      ["中堅手",posRows("中")],["右翼手",posRows("右")]
    ];
    if(impactLg==="パ") groups.push(["指名打者",posRows("指")]);
    return groups.map(function(group,index){
      var reference=index<3?pitchers:batters;
      return {title:group[0],top:impactCompositeRows(group[1],reference).slice(0,5)};
    });
  }

  function corrMetric(key){
    var defs=corrMetricDefs();
    for(var i=0;i<defs.length;i++) if(defs[i][0]===key) return defs[i];
    return defs[0];
  }
  function corrValue(row,key){
    var parts=key.split("."), value=row;
    for(var i=0;i<parts.length;i++) value=value==null?null:value[parts[i]];
    if(value==null || value==="") return null;
    value=Number(value);
    return isFinite(value)?value:null;
  }
  function corrFmt(value,key){
    if(value==null || !isFinite(value)) return "-";

  function corrRows(){
    if(!impactData) return [];

  function corrPairs(rows,xKey,yKey){
    var pairs=[];

  function corrHighlights(pairs,limit){
    if(!pairs.length) return [];
    var xs=pairs.map(function(p){return p.x;}),ys=pairs.map(function(p){return p.y;});
    var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),

  function corrPearson(pairs){
    var n=pairs.length;
    if(n<3) return null;
    var sx=0,sy=0;
    pairs.forEach(function(p){sx+=p.x;sy+=p.y;});
    var mx=sx/n,my=sy/n,num=0,dx=0,dy=0;
    pairs.forEach(function(p){
      var a=p.x-mx,b=p.y-my;num+=a*b;dx+=a*a;dy+=b*b;
    });
    return dx&&dy?num/Math.sqrt(dx*dy):null;
  }
  function corrRanks(values){
    var indexed=values.map(function(v,i){return {v:v,i:i};})
      .sort(function(a,b){return a.v-b.v;});
    var ranks=new Array(values.length),i=0;
    while(i<indexed.length){
      var j=i+1;
      while(j<indexed.length && indexed[j].v===indexed[i].v) j++;
      var rank=(i+j-1)/2+1;
      for(var k=i;k<j;k++) ranks[indexed[k].i]=rank;
      i=j;
    }
    return ranks;
  }
  function corrSpearman(pairs){
    if(pairs.length<3) return null;
    var rx=corrRanks(pairs.map(function(p){return p.x;}));
    var ry=corrRanks(pairs.map(function(p){return p.y;}));
    return corrPearson(rx.map(function(x,i){return {x:x,y:ry[i]};}));
  }

    return s+(a<.2?"":(r>0?"正の相関":"負の相関"));
  }

  function corrScatter(rows){

    if(pairs.length<2) return '<div class="msg">散布図を表示できる選手が足りません</div>';
    var xs=pairs.map(function(p){return p.x;}),ys=pairs.map(function(p){return p.y;});
    var volumeKey=corrKind==="pitcher"?"stats.innings":"stats.pa";
    var volumeLabel=corrKind==="pitcher"?"投球回":"打席";
    var volumes=pairs.map(function(p){return corrValue(p.row,volumeKey)||0;});
    var vmin=Math.min.apply(null,volumes),vmax=Math.max.apply(null,volumes);
    var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),
        ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
    var xpad=(xmax-xmin)*.07||1,ypad=(ymax-ymin)*.09||1;
    xmin-=xpad;xmax+=xpad;ymin-=ypad;ymax+=ypad;
    function px(x){return l+(x-xmin)/(xmax-xmin)*pw;}
    function py(y){return t+ph-(y-ymin)/(ymax-ymin)*ph;}

  /* ===== 球団スタイルマップ ===== */
  var teamStyleLeague="all", teamStylePrimary="ソフトバンク", teamStyleCompare="阪神";
  var TEAM_STYLE_AXES=[
    ["batting","打撃"],["clutch","勝負"],["baserunning","走塁"],
    ["defense","守備参考"],["starter","先発"],["relief","救援"]
  ];

  function teamStyleWeighted(rows,valueFn,weightFn){
    var total=0,weight=0;
    rows.forEach(function(row){
      var value=valueFn(row),w=Math.max(0,Number(weightFn(row)||0));
      if(value!=null&&isFinite(value)&&w>0){total+=value*w;weight+=w;}
    });
    return weight?total/weight:100;
  }
  function teamStylePitchScore(row){
    var c=row.components||{};
    return .55*Number(c.pitching||100)+.20*Number(c.dominance||100)+
      .25*Number(c.run_prevention||100);
  }
  function teamStyleRows(){
    if(!impactData) return [];
    var batters=impactUniqueRows(impactData.batters||[]);
    var pitchers=impactUniqueRows(impactData.pitchers||[]);
    return Object.keys(TEAM_META).map(function(team){
      var bats=batters.filter(function(x){return x.team===team;});
      var pits=pitchers.filter(function(x){return x.team===team;});
      var starters=pits.filter(function(x){return x.role==="先発";});
      var relief=pits.filter(function(x){return x.role!=="先発";});
      function batComponent(key){
        return teamStyleWeighted(bats,function(x){
          var v=(x.components||{})[key];return v==null?null:Number(v);
        },function(x){return Number((x.stats||{}).pa||0);});
      }
      function pitchGroup(rows){
        return teamStyleWeighted(rows,teamStylePitchScore,function(x){
          return Math.max(1,Number((x.stats||{}).innings||0));
        });
      }
      var scores={
        batting:batComponent("batting"),
        clutch:batComponent("clutch"),
        baserunning:batComponent("baserunning"),
        defense:batComponent("defense"),
        starter:pitchGroup(starters),
        relief:pitchGroup(relief)
      };
      var offense=.55*scores.batting+.25*scores.clutch+.20*scores.baserunning;
      var pitching=.55*scores.starter+.45*scores.relief;
      var wValue=bats.concat(pits).reduce(function(sum,x){return sum+Number(x.w_value||0);},0);
      return {
        team:team,league:tLeague(team),scores:scores,offense:offense,pitching:pitching,
        total:.5*offense+.5*pitching,w_value:wValue,
        batters:bats.length,pitchers:pits.length
      };
    });
  }
  function teamStyleFiltered(rows){
    return rows.filter(function(x){return teamStyleLeague==="all"||x.league===teamStyleLeague;});
  }
  function teamStyleAxisLabel(key){
    for(var i=0;i<TEAM_STYLE_AXES.length;i++) if(TEAM_STYLE_AXES[i][0]===key) return TEAM_STYLE_AXES[i][1];
    return key;
  }
  function teamStyleType(row){
    var ranked=TEAM_STYLE_AXES.map(function(axis){
      return {key:axis[0],label:axis[1],value:row.scores[axis[0]]};
    }).sort(function(a,b){return b.value-a.value;});
    var type;
    if(row.offense>=105&&row.pitching>=105) type="投打充実型";
    else if(row.offense-row.pitching>=6) type="攻撃型";
    else if(row.pitching-row.offense>=6) type="投手型";
    else if(ranked[0].key==="baserunning") type="機動力型";
    else if(ranked[0].key==="clutch") type="勝負強さ型";
    else if(ranked[0].key==="defense") type="守備堅実型";
    else if(ranked[0].key==="starter") type="先発主導型";
    else if(ranked[0].key==="relief") type="救援主導型";
    else type="バランス型";
    return {
      type:type,
      copy:"最大の特徴は"+ranked[0].label+"（"+ranked[0].value.toFixed(1)+
        "）。相対的に低い軸は"+ranked[ranked.length-1].label+"（"+
        ranked[ranked.length-1].value.toFixed(1)+"）です。"
    };
  }
  function teamStyleCompareColor(primary,compare){
    var base=tColor(compare.team);
    if(!base||!primary) return base||"#0095D9";
    var a=tColor(primary.team);
    function rgb(hex){
      var value=parseInt(String(hex||"").replace("#",""),16);
      return [(value>>16)&255,(value>>8)&255,value&255];
    }
    var x=rgb(a),y=rgb(base);
    var distance=Math.sqrt(Math.pow(x[0]-y[0],2)+Math.pow(x[1]-y[1],2)+Math.pow(x[2]-y[2],2));
    return distance<105?(LEAGUE_COLOR[compare.league]||"#0095D9"):base;
  }

  function teamStyleMap(rows,primary){
    var w=720,h=430,l=68,r=28,t=32,b=64,pw=w-l-r,ph=h-t-b;
    var xs=rows.map(function(x){return x.offense;}).concat([100]);
    var ys=rows.map(function(x){return x.pitching;}).concat([100]);
    var minX=Math.floor((Math.min.apply(null,xs)-3)/5)*5;

    if(maxX-minX<10){minX-=5;maxX+=5;}
    if(maxY-minY<10){minY-=5;maxY+=5;}
    function px(x){return l+(x-minX)/(maxX-minX)*pw;}

    var values=rows.map(function(x){return x.w_value;});
    var vmin=Math.min.apply(null,values),vmax=Math.max.apply(null,values);
    function size(v){return 14+(vmax===vmin?3:8*Math.sqrt((v-vmin)/(vmax-vmin)));}
    var s='<svg class="ts-svg ts-map" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="攻撃力と投手力の球団マップ">'+

        (minX+(maxX-minX)*i/5).toFixed(1)+'</text>'+

  /* 簡易CSVパーサ（引用符・改行を含むフィールドに対応） */
  function parseCSV(text){
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);   // BOMを除去
    var rows=[], row=[], cur="", inQ=false, i=0;
    while(i<text.length){
      var c=text[i];
      if(inQ){
        if(c==='"'){
          if(text[i+1]==='"'){ cur+='"'; i+=2; continue; }
          inQ=false; i++; continue;
        }
        cur+=c; i++; continue;
      }
      if(c==='"'){ inQ=true; i++; continue; }
      if(c===','){ row.push(cur); cur=""; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; i++; continue; }
      cur+=c; i++;
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function toCSV(header, rows){
    function q(v){
      v=(v==null?"":String(v));
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }
    var out=[header.map(q).join(",")];
    rows.forEach(function(r){ out.push(r.map(q).join(",")); });
    return out.join("\r\n");
  }

  var TEAM_COLS=["team","batting_team","fielding_team","home","away","opponent"];
  var PLAYER_COLS=["player","batter","pitcher","win_pitcher","lose_pitcher","save_pitcher"];

  function filterRows(header, rows){
    var idx={};
    header.forEach(function(hname,i){ idx[hname]=i; });
    var dateI=idx["date"];
    var teamIs=TEAM_COLS.filter(function(c){return idx[c]!=null;}).map(function(c){return idx[c];});
    var plIs=PLAYER_COLS.filter(function(c){return idx[c]!=null;}).map(function(c){return idx[c];});
    var pl=(expPlayer||"").trim();

    return rows.filter(function(r){
      if(dateI!=null){
        var d=r[dateI];
        if(expFrom && d < expFrom) return false;
        if(expTo && d > expTo) return false;
      }
      if(expTeam!=="all"){
        var okT=false;
        for(var i=0;i<teamIs.length;i++){ if(r[teamIs[i]]===expTeam){ okT=true; break; } }
        if(!okT) return false;
      }
      if(pl){
        var okP=false;
        for(var j=0;j<plIs.length;j++){
          if((r[plIs[j]]||"").indexOf(pl)>=0){ okP=true; break; }
        }
        if(!okP) return false;
      }
      return true;
    });
  }

  async function runExport(mode){
    if(expLoading) return;
    readExportForm();
    var res=document.getElementById("exResult");
    var year=(dp.value||todayJST()).split("-")[0];
    var url="data/"+year+"/dataset/"+expSet+".csv";

    try{
      if(!expCache[expSet]){
        expLoading=true;
        res.innerHTML='<div class="msg">読み込み中…（初回はファイルサイズにより時間がかかります）</div>';
        var r=await fetch(url+"?t="+Date.now());
        if(!r.ok) throw new Error("notfound");
        var text=await r.text();
        var all=parseCSV(text).filter(function(x){return x.length>1;});
        if(!all.length) throw new Error("empty");
        expCache[expSet]={header:all[0], rows:all.slice(1)};
        expLoading=false;
      }
      var d=expCache[expSet];
      var rows=filterRows(d.header, d.rows);

      if(mode==="download"){
        if(!rows.length){ res.innerHTML='<div class="msg">条件に合うデータがありません</div>'; return; }
        var csv=toCSV(d.header, rows);
        var blob=new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=fileNameFor(year);
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        res.innerHTML='<div class="exok">✓ '+rows.length.toLocaleString()+' 行を書き出しました（'+esc(a.download)+'）</div>';
        return;
      }

      // プレビュー
      var h='<div class="exok">該当 '+rows.length.toLocaleString()+' 行 / 全体 '+
            d.rows.length.toLocaleString()+' 行　（列数 '+d.header.length+'）</div>';

        var cols=d.header.slice(0,10);
        h+='<div class="tblwrap"><table class="stbl"><thead><tr>'+
           cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+
           (d.header.length>10?'<th>…</th>':'')+'</tr></thead><tbody>';
        rows.slice(0,10).forEach(function(r){
          h+='<tr>'+cols.map(function(c,i){return '<td>'+esc(r[i])+'</td>';}).join("")+
             (d.header.length>10?'<td>…</td>':'')+'</tr>';
        });
        h+='</tbody></table></div><div class="sub" style="font-size:11px;margin-top:5px">'+
           '先頭10行・先頭10列のみ表示しています</div>';
      }
      res.innerHTML=h;

    }catch(e){
      expLoading=false;
      res.innerHTML='<div class="msg">データセットが見つかりません<br>'+
        '<span style="font-size:12px">Actionsで収集すると '+esc(url)+' が生成されます</span></div>';
    }
  }

  function fileNameFor(year){
    var parts=["npb", year, expSet];
    if(expFrom||expTo) parts.push((expFrom||"start")+"_"+(expTo||"end"));
    if(expTeam!=="all") parts.push(tMini(expTeam)||expTeam);
    if(expPlayer) parts.push(expPlayer);
    return parts.join("_").replace(/[\/\\:*?"<>|]/g,"") + ".csv";
  }

  /* ===== スタメンタブ ===== */

  /* 打席データから背番号・初出場の回を拾う（選手IDで照合、無ければ名前で） */
  function playerMetaFromAtbats(g){
    var byId={}, byName={};
    function put(map, key, info){
      if(!key) return;
      if(!map[key]) map[key]={};
      var m=map[key];
      if(!m.number && info.number) m.number=info.number;
      if(!m.hand && info.hand) m.hand=info.hand;
      if(info.batHalf && !m.firstBat){ m.firstBat=info.batHalf; m.firstBatN=info.n; }
      if(info.pitHalf && !m.firstPitch){ m.firstPitch=info.pitHalf; m.firstPitchN=info.n; }
    }
    (g.atbats||[]).forEach(function(ab){
      var half=(ab.inning||"")+"回"+(ab.top_bottom||"");
      var n=(ab.inning||0)*2+(ab.top_bottom==="裏"?1:0);
      var b=ab.batter||{}, p=ab.pitcher||{};
      var bi={number:b.number, hand:b.hand, batHalf:half, n:n};
      put(byId, b.player_id, bi);
      put(byName, (b.name||"").replace(/\s|　/g,""), bi);
      var pi={number:p.number, hand:p.hand, pitHalf:half, n:n};
      put(byId, p.player_id, pi);
      put(byName, (p.name||"").replace(/\s|　/g,""), pi);
    });
    return {byId:byId, byName:byName};
  }
  function metaOf(meta, row){
    return (row.player_id && meta.byId[row.player_id])
        || meta.byName[(row.name||"").replace(/\s|　/g,"")]
        || {};
  }

  /* ===== 配球分析タブ ===== */
  var pitchFilter = {team:"all", pitcher:"all", type:"all"};

  /* 投手ロール（先発・中継ぎ・抑え）を判定する。
     scraper/lib/awards.py の _role_of と同じ考え方をJS側でも使う。
       ・その試合の1人目 → 先発
       ・決着に「Ｓ」がつく → 抑え
       ・最後に登板し、その試合の最終回まで投げている → 抑え扱い
       ・それ以外 → 中継ぎ
     判定できない（出場成績が無い）場合はnullを返す。 */
  function getPitcherRoles(g){
    var box=g.boxscore;
    var roles={};   // 選手名 -> "先発"|"中継ぎ"|"抑え"
    if(!box||!box.pitching) return roles;
    var lastInning=0;
    (g.atbats||[]).forEach(function(a){ if(a.inning>lastInning) lastInning=a.inning; });

    ["away","home"].forEach(function(side){
      var rows=(box.pitching&&box.pitching[side])||[];
      rows.forEach(function(row,i){
        var name=row.name;
        if(!name) return;
        var role;
        if(i===0){
          role="先発";
        }else{
          var dec=row.decision||"";
          if(dec.indexOf("Ｓ")>=0 || /(^|[^A-Za-z])S([^A-Za-z]|$)/.test(dec)){
            role="抑え";
          }else if(i===rows.length-1){
            // 最後の登板投手が、その試合の最終回まで投げていれば抑え扱い
            var mine=(g.atbats||[]).filter(function(a){
              return (a.pitcher&&a.pitcher.player_id)===row.player_id ||
                     (a.pitcher&&a.pitcher.name)===name;
            });
            var reachedLast = mine.some(function(a){ return a.inning>=lastInning; });
            role = reachedLast ? "抑え" : "中継ぎ";
          }else{
            role="中継ぎ";
          }
        }
        roles[name]=role;
      });
    });
    return roles;
  }
  var ROLE_COLOR={"先発":"var(--accent)","中継ぎ":"#1C7ED6","抑え":"#E03131"};
  function roleBadge(role){
    if(!role) return "";
    return '<span class="rolebadge" style="background:'+(ROLE_COLOR[role]||"var(--muted)")+
           '">'+esc(role)+'</span>';
  }

  function collectPitches(g){
    // 全投球をフラットな配列にする（投手・打者・状況つき）
    var roles=getPitcherRoles(g);
    var out=[];
    (g.atbats||[]).forEach(function(ab){
      var p=ab.pitcher||{}, b=ab.batter||{};
      (ab.pitches||[]).forEach(function(pt){
        out.push({
          pitcher: p.name||"-", pitcher_id: p.player_id,
          pitcherRole: roles[p.name]||null,
          batter: b.name||"-", bhand: b.hand||"",
          // 投げている側＝守備側のチーム
          team: ab.fielding_team||"", batTeam: ab.batting_team||"",
          inning: ab.inning, tb: ab.top_bottom,
          type: pt.type||"不明", speed: pt.speed_kmh,
          result: pt.result||"", kind: pt.kind||"",
          course: pt.course||null,
          last: false
        });
      });
      // 打席の最終球に印
      if(out.length && (ab.pitches||[]).length) out[out.length-1].last=true;
    });
    return out;
  }

  function renderAnalysis(g){
    var all=collectPitches(g);
    if(!all.length) return notReady("配球データ");

    // 投球している側（守備側）のチーム一覧
    var byTeam={};
    all.forEach(function(p){ if(p.team) byTeam[p.team]=(byTeam[p.team]||0)+1; });
    var teamList=Object.keys(byTeam);
    // 選択中のチームが実際に存在しなければ全体に戻す
    if(pitchFilter.team!=="all" && !byTeam[pitchFilter.team]) pitchFilter.team="all";

    // チームで絞ったあとの母集合（投手・球種の選択肢もこれに合わせる）
    var pool=all.filter(function(p){
      return pitchFilter.team==="all" || p.team===pitchFilter.team;
    });

    // 投手の一覧（投球数順）。チームを選ぶとその球団の投手だけになる
    var byPitcher={};
    pool.forEach(function(p){byPitcher[p.pitcher]=(byPitcher[p.pitcher]||0)+1;});
    var pitchers=Object.keys(byPitcher).sort(function(a,b){return byPitcher[b]-byPitcher[a];});
    if(pitchFilter.pitcher!=="all" && !byPitcher[pitchFilter.pitcher]) pitchFilter.pitcher="all";

    // 球種一覧
    var types={};
    pool.forEach(function(p){types[p.type]=(types[p.type]||0)+1;});
    var typeList=Object.keys(types).sort(function(a,b){return types[b]-types[a];});
    if(pitchFilter.type!=="all" && !types[pitchFilter.type]) pitchFilter.type="all";

    // フィルタ適用
    var ps=pool.filter(function(p){
      if(pitchFilter.pitcher!=="all" && p.pitcher!==pitchFilter.pitcher) return false;
      if(pitchFilter.type!=="all" && p.type!==pitchFilter.type) return false;
      return true;
    });

    // チームはタブで切り替える（1試合に2球団なので選びやすい）
    var h='<div class="stabs">';
    h+='<button class="stab'+(pitchFilter.team==="all"?" on":"")+'" '+
       'style="--sc:var(--accent)" onclick="setAnalysisTeam(\'all\')">両チーム</button>';
    [g.home, g.away].forEach(function(t){
      if(!t || !byTeam[t]) return;
      var col=tColor(t)||"var(--accent)";
      h+='<button class="stab'+(pitchFilter.team===t?" on":"")+'" style="--sc:'+col+'" '+
         'onclick="setAnalysisTeam(\''+esc(t)+'\')">'+teamBadge(t)+' '+esc(t)+
         ' <span class="sub2">'+byTeam[t]+'球</span></button>';
    });
    h+='</div>';

    h+='<div class="toolbar">'+
      '<span class="lb">投手</span><select id="fp" onchange="onAnalysisFilter()">'+
      '<option value="all">全投手</option>'+
      pitchers.map(function(n){
        var r=pool.length ? (function(){
          for(var i=0;i<pool.length;i++){ if(pool[i].pitcher===n) return pool[i].pitcherRole; }
          return null;
        })() : null;
        return '<option value="'+esc(n)+'"'+(pitchFilter.pitcher===n?" selected":"")+'>'+
               esc(n)+(r?'（'+r+'）':'')+' ('+byPitcher[n]+')</option>';
      }).join("")+
      '</select>'+
      '<span class="lb">球種</span><select id="ft" onchange="onAnalysisFilter()">'+
      '<option value="all">全球種</option>'+
      typeList.map(function(t){
        return '<option value="'+esc(t)+'"'+(pitchFilter.type===t?" selected":"")+'>'+
               esc(t)+'</option>';
      }).join("")+
      '</select></div>';

    // 選択中の投手の役割バッジ（先発・中継ぎ・抑え）
    if(pitchFilter.pitcher!=="all"){
      var curRole=null;
      for(var ri=0;ri<pool.length;ri++){
        if(pool[ri].pitcher===pitchFilter.pitcher){ curRole=pool[ri].pitcherRole; break; }
      }
      if(curRole){
        h+='<div style="margin:-4px 0 10px">'+esc(pitchFilter.pitcher)+' '+roleBadge(curRole)+'</div>';
      }
    }

    if(!ps.length) return h+'<div class="msg">該当する投球がありません</div>';

    // --- 球種割合 ---
    var tcount={};
    ps.forEach(function(p){tcount[p.type]=(tcount[p.type]||0)+1;});
    var tkeys=Object.keys(tcount).sort(function(a,b){return tcount[b]-tcount[a];});
    h+='<div class="card2"><h3>球種割合（'+ps.length+'球）</h3>';
    tkeys.forEach(function(t){
      var n=tcount[t], pct=Math.round(n/ps.length*1000)/10;
      // その球種の平均球速
      var sp=ps.filter(function(x){return x.type===t&&x.speed;});
      var avg=sp.length?Math.round(sp.reduce(function(s,x){return s+x.speed;},0)/sp.length):null;
      h+='<div class="bar-row"><div class="bar-lb">'+esc(t)+'</div>'+
         '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
         '<div class="bar-val">'+pct+'% <span class="sub2">'+n+'球'+
         (avg?' / 平均'+avg+'km/h':'')+'</span></div></div>';
    });
    h+='</div>';

    // --- 球速 ---
    var speeds=ps.filter(function(p){return p.speed;}).map(function(p){return p.speed;});
    if(speeds.length){
      var mx=Math.max.apply(null,speeds), mn=Math.min.apply(null,speeds);
      var av=Math.round(speeds.reduce(function(a,b){return a+b;},0)/speeds.length);
      h+='<div class="card2"><h3>球速</h3><div class="statrow">'+
        '<div class="stat"><div class="sv">'+mx+'</div><div class="sl">最速 km/h</div></div>'+
        '<div class="stat"><div class="sv">'+av+'</div><div class="sl">平均 km/h</div></div>'+
        '<div class="stat"><div class="sv">'+mn+'</div><div class="sl">最遅 km/h</div></div>'+
        '</div></div>';
    }

    // --- コースヒートマップ（5×5） ---
    h+='<div class="card2"><h3>コース分布（投手から見た位置）</h3>'+buildHeatmap(ps)+'</div>';

    // --- 結果別の投球 ---
    var kinds={strike:"ストライク系",ball:"ボール",hit:"安打",out:"凡打",bunt:"犠打"};
    var kc={};
    ps.forEach(function(p){if(p.kind) kc[p.kind]=(kc[p.kind]||0)+1;});
    var kk=Object.keys(kc);
    if(kk.length){
      h+='<div class="card2"><h3>投球結果の内訳</h3><div class="statrow">';
      kk.forEach(function(k){
        h+='<div class="stat"><div class="sv">'+kc[k]+'</div><div class="sl">'+(kinds[k]||k)+'</div></div>';
      });
      h+='</div></div>';
    }

    return h;
  }

  function setAnalysisTeam(t){
    if(pitchFilter.team===t) return;
    pitchFilter.team=t;
    // チームを変えたら投手と球種の選択はリセットする
    pitchFilter.pitcher="all";
    pitchFilter.type="all";
    document.getElementById("tabbody").innerHTML=renderAnalysis(curGame);
  }

  function onAnalysisFilter(){
    var fp=document.getElementById("fp"), ft=document.getElementById("ft");
    if(fp) pitchFilter.pitcher=fp.value;
    if(ft) pitchFilter.type=ft.value;
    document.getElementById("tabbody").innerHTML=renderAnalysis(curGame);
  }

  /* 5×5ヒートマップ */
  function buildHeatmap(ps){
    var grid={}, max=0;
    ps.forEach(function(p){
      var c=p.course;
      if(!c||c.grid_row==null||c.grid_col==null) return;
      var k=c.grid_row+"-"+c.grid_col;
      grid[k]=(grid[k]||0)+1;
      if(grid[k]>max) max=grid[k];
    });
    if(!max) return '<div class="sub">コースデータがありません</div>';

    var h='<div class="heat">';
    for(var r=0;r<5;r++){
      for(var c=0;c<5;c++){
        var n=grid[r+"-"+c]||0;
        var ratio=max?n/max:0;
        // ストライクゾーン（中央3x3）に枠
        var inZone=(r>=1&&r<=3&&c>=1&&c<=3);
        h+='<div class="hcell'+(inZone?' zone':'')+'" '+
           'style="background:rgba(232,89,12,'+(ratio*0.85).toFixed(2)+')" '+
           'title="'+n+'球">'+(n||"")+'</div>';
      }
    }
    h+='</div><div class="heat-lg"><span>少</span>'+
       '<span class="hgrad"></span><span>多</span>'+
       '<span style="margin-left:auto">枠内＝ストライクゾーン</span></div>';
    return h;
  }

  /* ===== 全打席タブ（従来の一球表示） ===== */
  function renderPitches(){

       '<select id="flt" onchange="renderPitches()">'+
         '<option value="all">全打席</option>'+

         '<option value="'+esc(g.home)+'">'+esc(g.home)+' の攻撃</option>'+
         '<option value="score">得点した打席</option>'+
         '<option value="hit">安打・本塁打</option>'+
       '</select>'+
       '<button class="btn" onclick="toggleAll(true)">全部ひらく</button>'+
       '<button class="btn" onclick="toggleAll(false)">全部とじる</button></div>';

    var groups={},order=[];
    (g.atbats||[]).forEach(function(ab){
      var rs=ab.result_summary||"";
      if(fv==="score" && !/＋\d+点/.test(rs)) return;

    });

    }

    order.forEach(function(k,gi){
      var abs=groups[k],first=abs[0],pts=0,np=0;
      abs.forEach(function(a){
        var m=/＋(\d+)点/.exec(a.result_summary||"");
        if(m) pts+=parseInt(m[1],10);
        np+=(a.pitch_count||0);
      });
      h+='<div class="inn'+(gi<2?' open':'')+'" id="inn-'+first.inning+'-'+first.top_bottom+'">'+
        '<div class="inn-h" onclick="this.parentNode.classList.toggle(\'open\')">'+
          '<div><span class="inn-t">'+first.inning+'回'+first.top_bottom+'</span> '+
          '<span class="inn-m">'+esc(first.batting_team||"")+' の攻撃</span></div>'+
          '<div><span class="inn-m">'+abs.length+'打席 / '+np+'球'+
          (pts?' <b style="color:var(--accent)">'+pts+'点</b>':'')+'</span> '+
          '<span class="caret">▶</span></div></div><div class="inn-b">';

      abs.forEach(function(ab){
        var b=ab.batter||{},p=ab.pitcher||{},r=ab.runners||{};
        // 走者表示（推定名つき）
        var rn=ab._runnerNames||{};
        var rparts=[];
        if(r.first) rparts.push("一塁 "+(rn[1]&&rn[1]!=="?"?rn[1]:"?"));
        if(r.second) rparts.push("二塁 "+(rn[2]&&rn[2]!=="?"?rn[2]:"?"));
        if(r.third) rparts.push("三塁 "+(rn[3]&&rn[3]!=="?"?rn[3]:"?"));
        var rtext=rparts.length?rparts.join(" ／ ")+' <span style="font-size:10px;color:var(--muted)">(推定)</span>':"走者なし";
        h+='<div class="ab"><div class="ab-h"><div class="ab-p">'+
          '<span class="lbl">打者</span> <b>'+esc(b.name||"-")+'</b> '+
          '<span class="no">'+(b.number?"#"+b.number:"")+'</span> '+
          '<span class="lbl">'+esc(b.hand||"")+'</span><br>'+
          '<span class="lbl">投手</span> <b>'+esc(p.name||"-")+'</b> '+
          '<span class="no">'+(p.number?"#"+p.number:"")+'</span> '+
          '<span class="lbl">'+esc(p.hand||"")+'</span><br>'+
          '<span class="lbl">走者</span> <span style="font-size:12px">'+rtext+'</span><br>'+
          '<span class="res '+rcls(ab.result_summary)+'">'+esc(ab.result_summary||"")+'</span>'+
          '</div>'+buildSitu(ab)+'</div>';
        h+=buildChart(ab);
        h+=buildField(ab);
        (ab.pitches||[]).forEach(function(pt){
          var c=(pt.course&&pt.course.label)?pt.course.label:"-";
          var kc=pt.kind?(" k-"+pt.kind):"";
          h+='<div class="pt"><div class="pt-n'+kc+'">'+(pt.no==null?"":pt.no)+'</div>'+
            '<div><span class="pt-t">'+esc(pt.type||"")+'</span> '+
            '<span class="pt-s">'+(pt.speed_kmh?pt.speed_kmh+"km/h":"")+'</span>'+
            '<div class="pt-c">'+esc(c)+'</div></div>'+
            '<div class="pt-r '+rcls(pt.result)+'">'+esc(pt.result||"")+'</div></div>';
        });
        h+='</div>';
      });
      h+='</div></div>';
    });

    body.innerHTML=h;
    var sel=document.getElementById("flt");if(sel) sel.value=fv;
  }

  function toggleAll(open){
    var l=document.querySelectorAll(".inn"),i;
    for(i=0;i<l.length;i++){
      if(open) l[i].classList.add("open"); else l[i].classList.remove("open");
    }
  }
  function fmtDate(t){
    var y=t.getFullYear();
    var m=("0"+(t.getMonth()+1)).slice(-2);
    var d=("0"+t.getDate()).slice(-2);
    return y+"-"+m+"-"+d;
  }
  function shift(n){
    var t=new Date(dp.value+"T00:00:00");
    t.setDate(t.getDate()+n);
    dp.value=fmtDate(t);
    loadDay();
  }
  function today(){dp.value=todayJST();loadDay();}

  /* ===== 共通アニメーション ===== */
  var motionTimers={};
  function motionReduced(){
    return window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function motionCount(root){
    if(!root||motionReduced()) return;
    var selector=".motion-count,.stat .sv,.saber-stat b,.corr-kpi strong";
    Array.prototype.forEach.call(root.querySelectorAll(selector),function(el){
      if(el.getAttribute("data-motion-counted")==="1") return;
      var raw=(el.textContent||"").trim();
      var match=/^([+-]?)(\d+(?:\.\d+)?|\.\d+)([%点]?)$/.exec(raw);
      if(!match) return;
      var target=Number((match[1]||"")+match[2]);
      if(!isFinite(target)) return;
      var decimals=(match[2].split(".")[1]||"").length;
      var leadingDot=match[2].charAt(0)===".";
      var prefix=match[1]==="+"?"+":"",suffix=match[3]||"";
      var start=performance.now(),duration=620;
      el.setAttribute("data-motion-counted","1");
      function frame(now){
        var p=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-p,3);
        var value=target*eased,formatted=value.toFixed(decimals);
        if(leadingDot) formatted=formatted.replace(/^(-?)0\./,"$1.");
        el.textContent=prefix+formatted+suffix;
        if(p<1) requestAnimationFrame(frame); else el.textContent=raw;
      }
      requestAnimationFrame(frame);
    });
  }
  function motionRun(root){
    if(!root||root.style.display==="none"||motionReduced()) return;
    root.classList.remove("motion-enter");
    void root.offsetWidth;
    root.classList.add("motion-enter");
    var selector=":scope > .dash-sec,:scope > .card2,.mvpgrid > .mvpcard,"+
      ".rankgrid > .rankcard,.dash-games > .dgame,.games > .game,"+
      ".saber-kpis > *,.corr-kpis > *,.teamstyle-grid > *,.pg-player-card,.pg-panel";
    var items=Array.prototype.slice.call(root.querySelectorAll(selector),0,24);
    items.forEach(function(el,index){
      el.classList.remove("motion-rise");
      el.style.setProperty("--motion-order",String(Math.min(index,12)));
      void el.offsetWidth;
      el.classList.add("motion-rise");
    });
    motionCount(root);
    window.setTimeout(function(){
      root.classList.remove("motion-enter");
      items.forEach(function(el){el.classList.remove("motion-rise");});
    },1100);
  }
  function motionSchedule(root){
    if(!root) return;
    var key=root.id||"motion-root";
    clearTimeout(motionTimers[key]);
    motionTimers[key]=setTimeout(function(){motionRun(root);},45);
  }
  function motionSetup(){
    var ids=["dashView","gameView","seasonView","playersView","rosterView","matchupView","compareView","dailyView","rankMoveView","playerGraphView",
      "awardsView","awardsGuideView","sabermetricsView","glossaryView","warView",
      "warGuideView","impactView","impactGuideView","correlationView","teamstyleView","exportView","socialView"];
    ids.forEach(function(id){
      var root=document.getElementById(id);
      if(!root) return;
      new MutationObserver(function(changes){
        var hasElement=changes.some(function(change){
          return Array.prototype.some.call(change.addedNodes,function(node){return node.nodeType===1;});
        });
        if(hasElement) motionSchedule(root);
      }).observe(root,{childList:true,subtree:true});
    });
  }

  /* ===== 共通テーブルソート =====
     選手一覧のように専用ソートを持つ列は従来処理を優先し、
     それ以外の一覧表は見出しクリックで表示行を並べ替える。 */
  function genericSortValue(cell){
    var raw=(cell.getAttribute("data-sort-value")||cell.textContent||"").trim();
    if(!raw || raw==="-" || raw==="—") return {missing:true,value:null,type:"missing"};
    var compact=raw.replace(/,/g,"");
    if(/^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/.test(compact)){
      return {missing:false,value:compact.slice(0,10).replace(/\//g,"-"),type:"text"};
    }
    var m=/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?=$|[%点試合打席打数安本点盗回球勝敗分ＳSH]|\s)/.exec(compact);
    if(m) return {missing:false,value:Number(m[1]),type:"number"};
    return {missing:false,value:raw,type:"text"};
  }
  function genericSortAscFirst(label){
    return /^(#|順位|背番号|選手|チーム|球団|位置|役割|部門|区分|種類|日付|対戦|H\/V|防御率|ERA|FIP|WHIP|敗|失点|自責)$/.test(label);
  }
  document.addEventListener("click",function(ev){
    var th=ev.target.closest&&ev.target.closest("table.stbl thead th");
    if(!th || th.classList.contains("no-sort") || th.classList.contains("sortable")) return;
    var table=th.closest("table");
    var tbody=table&&table.tBodies&&table.tBodies[0];
    if(!tbody || tbody.rows.length<2) return;
    var col=th.cellIndex;
    var label=(th.textContent||"").trim().replace(/[▲▼]$/,"").trim();
    var same=table.getAttribute("data-sort-col")===String(col);
    var dir=same
      ? (table.getAttribute("data-sort-dir")==="asc"?"desc":"asc")
      : (genericSortAscFirst(label)?"asc":"desc");
    var rows=Array.prototype.slice.call(tbody.rows).map(function(row,index){
      return {row:row,index:index,sort:genericSortValue(row.cells[col]||row.cells[0])};
    });
    rows.sort(function(a,b){
      if(a.sort.missing!==b.sort.missing) return a.sort.missing?1:-1;
      if(a.sort.missing) return a.index-b.index;
      var cmp;
      if(a.sort.type==="number"&&b.sort.type==="number"){
        cmp=a.sort.value-b.sort.value;
      }else{
        cmp=String(a.sort.value).localeCompare(String(b.sort.value),"ja",{numeric:true});
      }
      return (dir==="asc"?cmp:-cmp)||(a.index-b.index);
    });
    rows.forEach(function(x){tbody.appendChild(x.row);});
    Array.prototype.forEach.call(table.tHead.querySelectorAll("th"),function(x){
      x.classList.remove("generic-sorted");
      x.removeAttribute("data-sort-arrow");
    });
    th.classList.add("generic-sorted");
    th.setAttribute("data-sort-arrow",dir==="asc"?"▲":"▼");
    table.setAttribute("data-sort-col",String(col));
    table.setAttribute("data-sort-dir",dir);
  });

  dp.addEventListener("change",loadDay);
  // 共有URLで選手グラフ・対戦成績を直接開ける。それ以外はダッシュボード。
  dp.value=todayJST();
  var personalPostingMode=initPersonalPostingMode();
  motionSetup();
  var initialView="dash";
  try{
    var initialParams=new URLSearchParams(location.search),requestedView=initialParams.get("view");
    if(requestedView==="playergraph")initialView="playergraph";
    else if(requestedView==="matchup")initialView="matchup";
    else if(requestedView==="roster")initialView="roster";
    // インサイトは外部スクリプト読込後に初期表示する
    else if(requestedView==="social"&&personalPostingMode)initialView="social";
  }catch(e){}
  setView(initialView);
</script>
