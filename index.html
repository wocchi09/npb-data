<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB SCOREBOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="insights.css">
<style>
  :root{
    --font-ui:'Noto Sans JP','BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif;
    --font-brand:'Roboto','Noto Sans JP',sans-serif;
    --bg:#FFF9F0;--panel:#FFFFFF;--panel2:#FFF4E3;
    --line:#F0D9B5;--line2:#E5C596;
    --ink:#3D2510;--ink2:#6B4A28;--muted:#9A7B57;
    --accent:#E8590C;--accent2:#F59F00;--gold:#FFC93C;
    --hit:#D9480F;--out:#1C7ED6;--safe:#2F9E44;
    --board-bg:#2B1B0E;--board-ink:#FFD43B;--board-line:#5A4028;
    --field:#2F6B3A;--field2:#C9A227;--dirt:#B07C4A;
    --shadow:0 2px 10px rgba(120,70,20,.10);
  }
  [data-theme="dark"]{
    --bg:#1A1208;--panel:#241809;--panel2:#2E1F0D;
    --line:#3D2A13;--line2:#54391B;
    --ink:#FFF0DB;--ink2:#E8CFA8;--muted:#A98858;
    --accent:#FF922B;--accent2:#FFC93C;--gold:#FFD43B;
    --hit:#FFA94D;--out:#74C0FC;--safe:#69DB7C;
    --board-bg:#120C05;--board-ink:#FFD43B;--board-line:#3D2A13;
    --field:#1E4A28;--field2:#8A6415;--dirt:#7A5433;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);
    min-height:100vh;font-size:15.5px;line-height:1.75;transition:background .2s,color .2s;}
  .wrap{max-width:1600px;margin:0 auto;padding:0 20px 60px;}
  /* 試合ビュー・シーズン成績は読みやすさ優先で幅を抑える */
  #gameView,#seasonView{max-width:1100px;margin:0 auto;}

  .hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
    padding:18px 0 16px;margin-bottom:16px;}
  .hero-in{max-width:900px;margin:0 auto;padding:0 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .hero h1{font-family:'Roboto Mono',monospace;font-weight:700;
    font-size:clamp(19px,4.6vw,26px);color:#fff;letter-spacing:.16em;
    text-shadow:0 2px 6px rgba(120,50,0,.35);}
  .hero p{font-size:11px;color:rgba(255,255,255,.9);letter-spacing:.15em;}
  .theme-btn{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);
    color:#fff;font-size:19px;font-weight:700;width:42px;height:42px;
    border-radius:10px;cursor:pointer;flex-shrink:0;}
  .theme-btn:hover{background:rgba(255,255,255,.34);}

  .datebar{background:var(--panel);border:2px solid var(--line);
    border-radius:12px;padding:12px;box-shadow:var(--shadow);}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  input[type=date]{font-family:inherit;font-size:16px;font-weight:700;
    background:var(--panel2);color:var(--ink);border:2px solid var(--line2);
    border-radius:9px;padding:9px 11px;flex:1 1 160px;min-width:150px;}
  [data-theme="dark"] input[type=date]{color-scheme:dark;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;background:var(--panel2);
    color:var(--accent);border:2px solid var(--line2);border-radius:9px;
    padding:9px 13px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

  .games{margin-top:14px;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
  .game{background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s,border-color .12s;}
  .game:hover{border-color:var(--accent);transform:translateY(-2px);}
  .game.on{border-color:var(--accent);background:var(--panel2);}
  .gcard{font-size:17px;font-weight:700;}
  .gscore{font-size:19px;font-weight:700;display:flex;align-items:baseline;
    gap:7px;flex-wrap:wrap;}
  .gscore .w{color:var(--accent);}
  .gscore .dash{color:var(--muted);font-size:15px;}
  .gscore .gstate{font-size:10.5px;color:var(--muted);font-weight:500;
    border:1px solid var(--line2);border-radius:20px;padding:1px 7px;margin-left:2px;}
  .gpit{font-size:12px;color:var(--ink2);margin-top:5px;}
  .gpit b{color:var(--accent);font-weight:700;font-size:11px;}
  .ghr{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .gmeta{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .board{background:var(--board-bg);border-radius:12px;padding:12px;
    margin-top:16px;overflow-x:auto;box-shadow:var(--shadow);}
  table.sb{border-collapse:collapse;width:100%;min-width:420px;
    font-family:'Roboto Mono',monospace;}
  table.sb th,table.sb td{border:1px solid var(--board-line);padding:6px 4px;
    text-align:center;min-width:28px;color:var(--board-ink);font-size:16px;font-weight:500;}
  table.sb th{font-size:12px;color:#C9A227;}
  table.sb td.team{text-align:left;padding-left:10px;min-width:100px;
    font-family:'BIZ UDPGothic',sans-serif;font-weight:700;font-size:14px;
    color:#FFF3D6;white-space:nowrap;}
  table.sb td.total{color:#fff;font-weight:700;background:rgba(255,212,59,.12);}
  table.sb td.cell:hover{background:rgba(255,212,59,.22);}
  table.sb .win{color:#FFD43B;}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;
    padding:11px 13px;background:var(--panel);border:2px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);}
  .toolbar .lb{font-size:12px;color:var(--muted);font-weight:700;}
  select{font-family:inherit;font-size:13px;font-weight:700;background:var(--panel2);
    color:var(--ink);border:2px solid var(--line2);border-radius:9px;
    padding:7px 9px;cursor:pointer;}

  .inn{margin-top:12px;background:var(--panel);border:2px solid var(--line);
    border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .inn-h{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 14px;cursor:pointer;background:var(--panel2);}
  .inn-h:hover{background:var(--line);}
  .inn-t{font-size:15px;font-weight:700;color:var(--accent);}
  .inn-m{font-size:11.5px;color:var(--muted);font-weight:500;}
  .caret{color:var(--accent);font-size:13px;transition:transform .15s;}
  .inn.open .caret{transform:rotate(90deg);}
  .inn-b{display:none;}
  .inn.open .inn-b{display:block;}

  .ab{border-top:2px solid var(--line);}
  /* 打席ヘッダ：左＝選手情報 / 右＝ダイヤモンド＋カウント */
  .ab-h{display:grid;grid-template-columns:1fr auto;gap:12px;
    padding:11px 14px;align-items:start;}
  .ab-p{font-size:13.5px;line-height:1.75;}
  .ab-p b{font-weight:700;}
  .ab-p .lbl{color:var(--muted);font-size:11.5px;}
  .no{font-family:'Roboto Mono',monospace;color:var(--accent2);font-size:11.5px;}
  .res{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;
    background:var(--accent);padding:3px 10px;border-radius:20px;margin-top:5px;}
  .res.hit{background:var(--hit);}
  .res.out{background:var(--out);}

  /* ---- ダイヤモンド（走者図） ---- */
  .situ{display:flex;gap:10px;align-items:center;flex-shrink:0;}
  .dia{width:58px;height:58px;position:relative;}
  .bs{position:absolute;width:14px;height:14px;background:var(--panel2);
    border:2px solid var(--line2);transform:rotate(45deg);}
  .bs.on{background:var(--gold);border-color:var(--accent);}
  .bs.b1{right:0;top:22px;} .bs.b2{left:22px;top:0;} .bs.b3{left:0;top:22px;}
  .bs.home{left:22px;bottom:0;top:auto;background:var(--line2);border-color:var(--muted);}
  .cnt{font-size:11px;line-height:1.5;}
  .cnt .row{display:flex;align-items:center;gap:4px;}
  .cnt .k{width:12px;font-weight:700;color:var(--muted);font-family:'Roboto Mono',monospace;}
  .dotc{width:9px;height:9px;border-radius:50%;background:var(--panel2);
    border:1.5px solid var(--line2);display:inline-block;}
  .dotc.b{background:#40C057;border-color:#2B8A3E;}
  .dotc.s{background:#FAB005;border-color:#E67700;}
  .dotc.o{background:#FA5252;border-color:#C92A2A;}

  /* ---- 打球方向フィールド ---- */
  .fieldbox{margin:4px 14px 10px;padding:8px;background:var(--panel2);
    border:2px solid var(--line);border-radius:10px;
    display:flex;gap:12px;align-items:center;}
  .fieldsvg{width:110px;height:92px;flex-shrink:0;}
  .fieldtxt{font-size:12px;color:var(--ink2);line-height:1.7;}
  .fieldtxt b{color:var(--accent);font-weight:700;}

  .pt{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
    padding:7px 14px;border-top:1px dashed var(--line);}
  .pt-n{width:24px;height:24px;line-height:21px;text-align:center;
    font-family:'Roboto Mono',monospace;font-size:12px;border-radius:50%;
    background:var(--panel2);border:2px solid var(--line2);color:var(--accent);}
  .pt-n.k-ball{border-color:#40C057;color:#2B8A3E;}
  .pt-n.k-strike{border-color:#FAB005;color:#E67700;}
  .pt-n.k-hit{border-color:var(--accent);background:var(--accent);color:#fff;}
  .pt-n.k-out{border-color:#1C7ED6;color:#1C7ED6;}
  .pt-t{font-size:14px;font-weight:700;}
  .pt-s{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--accent);font-size:14.5px;letter-spacing:-.02em;}
  .pt-c{font-size:11px;color:var(--muted);}
  .pt-r{font-size:12.5px;text-align:right;color:var(--ink2);font-weight:700;}
  .pt-r.hit{color:var(--hit);} .pt-r.out{color:var(--out);}

  /* ---- タブ ---- */
  .tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;
    padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .tab{flex-shrink:0;font-family:inherit;font-size:14px;font-weight:700;
    padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;
    background:var(--panel2);color:var(--muted);
    border:2px solid var(--line);border-bottom:none;}
  .tab:hover{color:var(--accent);}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---- 成績カード・テーブル ---- */
  .card2{background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:14px;margin-top:12px;box-shadow:var(--shadow);}
  .card2 h3{font-size:15px;color:var(--accent);margin-bottom:10px;}
  .kv{display:flex;gap:10px;align-items:baseline;padding:4px 0;
    border-bottom:1px dashed var(--line);font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);font-size:12px;min-width:70px;}
  .kv .sub{color:var(--muted);font-size:12px;}
  .card2 .sub{color:var(--ink2);font-size:13px;}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.stbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;}
  table.stbl th{background:var(--panel2);color:var(--muted);font-size:11.5px;
    padding:7px 6px;white-space:nowrap;position:sticky;top:0;
    border-bottom:2px solid var(--line);}
  table.stbl td{padding:7px 6px;border-bottom:1px solid var(--line);
    white-space:nowrap;text-align:center;}
  table.stbl td.nm,table.stbl th.nm{text-align:left;font-weight:700;
    position:sticky;left:0;background:var(--panel);min-width:88px;}
  table.stbl th.nm{background:var(--panel2);}
  table.stbl td.num{font-family:'Roboto Mono',monospace;}
  table.stbl td.hi{color:var(--accent);font-weight:700;}
  table.stbl tr:hover td{background:var(--panel2);}
  table.stbl thead th:not(.no-sort){cursor:pointer;user-select:none;}
  table.stbl thead th:not(.no-sort):hover{color:var(--accent);}
  table.stbl thead th.generic-sorted{color:var(--accent);background:var(--zone);}
  table.stbl thead th.generic-sorted::after{content:attr(data-sort-arrow);
    margin-left:3px;font-size:10px;}
  .dec{display:inline-block;font-size:11px;font-weight:700;min-width:20px;}
  .dec.win{color:var(--accent);} .dec.lose{color:var(--out);}
  .dec.save{color:var(--accent2);}

  /* ---- ダッシュボード ---- */
  .dash-sec{margin-top:16px;background:var(--panel);border:2px solid var(--line);
    border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  .dash-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;
    margin-bottom:12px;}
  .dash-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .dash-date{margin-left:auto;font-size:12px;color:var(--muted);
    font-family:'Roboto Mono',monospace;}
  .dash-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;margin-bottom:12px;}
  .dgame{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;cursor:pointer;transition:border-color .15s;}
  .dgame:hover{border-color:var(--accent);}
  .dg-score{font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;
    display:flex;align-items:baseline;gap:5px;}
  .dg-score .w{color:var(--accent);}
  .dg-score .dash{color:var(--muted);font-size:13px;}
  .dg-pit{font-size:11px;color:var(--muted);margin-top:3px;}

  .rankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;margin-bottom:12px;}
  .rankcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;}
  .rankcard h4{font-size:13px;color:var(--accent);margin-bottom:6px;
    border-bottom:2px solid var(--line);padding-bottom:5px;}
  .rankrow{display:grid;grid-template-columns:20px 1fr auto auto;gap:6px;
    align-items:center;padding:4px 0;font-size:13px;cursor:pointer;}
  .rankrow:hover{color:var(--accent);}
  .rankrow .rk{font-family:'Roboto Mono',monospace;color:var(--muted);
    font-weight:700;text-align:center;}
  .rankrow .rn{font-weight:700;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .rankrow .rt{font-size:10px;color:var(--muted);white-space:nowrap;}
  .rankrow .rv{font-family:'Roboto Mono',monospace;font-weight:700;
    color:var(--accent);}

  .stabs.gtabs{margin-top:-2px;}
  .stabs.gtabs .stab{flex:1;max-width:200px;}

  /* ---- ゾーン別成績グリッド ---- */
  .zgrid{max-width:340px;}
  .zcell{flex-direction:column;gap:1px;}
  .zcell .zv{font-family:'Roboto Mono',monospace;font-size:12.5px;font-weight:700;}
  .zcell .zs{font-size:8.5px;color:var(--muted);line-height:1;}
  .stab.zmode{padding:5px 12px;font-size:12px;}

  .calnav #dailyPick{font-family:inherit;font-size:14px;padding:7px 10px;
    border-radius:8px;border:2px solid var(--line);background:var(--panel);
    color:var(--ink);}

  /* ---- 配球タブ：投手ロール ---- */
  .rolebadge{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;
    padding:2px 7px;border-radius:20px;vertical-align:middle;line-height:1.4;}

  /* ---- 選手比較 ---- */
  .cmpbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--zone);border:1px solid var(--line2);border-radius:10px;
    padding:8px 10px;margin-bottom:10px;}
  .cmpchip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);
    border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 10px;
    font-size:12.5px;font-weight:700;}
  .cmpx{cursor:pointer;color:var(--muted);font-weight:400;padding:0 4px;}
  .cmpx:hover{color:var(--out);}
  input.cmpcheck{width:16px;height:16px;cursor:pointer;}
  .cmpheads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .cmphead{border:2px solid var(--line);border-radius:10px;padding:10px 12px;
    text-align:center;}
  .cmpname{font-size:16px;font-weight:700;margin-bottom:3px;}
  table.cmptbl{width:100%;}
  table.cmptbl td{padding:7px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  table.cmptbl td.cmplabel{text-align:center;font-size:11.5px;color:var(--muted);
    font-weight:700;width:90px;}
  table.cmptbl td.cmpval{text-align:center;font-family:'Roboto Mono',monospace;
    font-weight:700;width:auto;}
  table.cmptbl td.cmpval.win{color:var(--accent);background:var(--zone);
    border-radius:6px;}

  /* ---- WAR ---- */
  .warwarn{background:rgba(232,89,12,.08);border:1px solid var(--accent2);
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;
    margin-bottom:12px;}
  .warwarn a{color:var(--accent);font-weight:700;}

  /* ---- W-Impact 部門別TOP5 ---- */
  .impact-dept{margin:10px 0 12px;}
  .impact-dept-head{display:flex;align-items:flex-end;justify-content:space-between;
    gap:10px;margin-bottom:6px;}
  .impact-dept-title{font-size:13px;font-weight:700;color:var(--accent);}
  .impact-dept-note{font-size:10.5px;color:var(--muted);}
  table.impact-dept-table{min-width:1120px;table-layout:fixed;font-size:11px;}
  table.impact-dept-table th:first-child{width:78px;}
  table.impact-dept-table td{padding:5px 6px;white-space:normal;vertical-align:middle;}
  table.impact-dept-table td.dept-name{font-weight:700;color:var(--accent);
    background:var(--panel2);white-space:nowrap;}
  table.impact-dept-table tr.dept-break td{border-top:3px solid var(--line2);}
  .impact-dept-player{display:flex;align-items:center;gap:5px;min-width:0;}
  .impact-dept-player b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .impact-dept-score{display:flex;align-items:baseline;gap:6px;margin-top:1px;
    font-family:'Roboto Mono',monospace;}
  .impact-dept-score strong{color:var(--accent);font-size:12px;}
  .impact-dept-score span{font-size:9px;color:var(--muted);white-space:nowrap;}
  .impact-confidence{display:inline-flex;align-items:center;gap:4px;border-radius:999px;
    padding:3px 7px;font-size:9.5px;font-weight:800;white-space:nowrap;border:1px solid currentColor;}
  .impact-confidence.c5,.impact-confidence.c4{color:#147a47;background:rgba(25,150,90,.10);}
  .impact-confidence.c3{color:#875500;background:rgba(245,166,35,.14);}
  .impact-confidence.c2,.impact-confidence.c1{color:#b33a2f;background:rgba(200,61,50,.10);}
  .impact-confidence-stars{font:700 9px 'Roboto Mono',monospace;letter-spacing:-1px;}
  .impact-context{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.25;
    white-space:nowrap;}
  .impact-context b{font:800 10.5px 'Roboto Mono',monospace;color:var(--ink2);}
  .impact-context small{font-size:8.5px;color:var(--muted);}
  .impact-method{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:9px 0;}
  .impact-method>div{border:1px solid var(--line);border-radius:9px;background:var(--panel2);
    padding:8px 10px;font-size:10.5px;line-height:1.6;color:var(--ink2);}
  .impact-method b{display:block;color:var(--accent);font-size:11px;}
  @media(max-width:680px){
    .impact-dept-head{align-items:flex-start;flex-direction:column;gap:2px;}
    .impact-method{grid-template-columns:1fr;}
  }

  /* ---- 今日のランキング変動 ---- */
  .rankmove-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
    margin:10px 0 12px;}
  .rankmove-kpi{border:1px solid var(--line);border-radius:12px;padding:10px 11px;
    background:linear-gradient(145deg,var(--panel2),var(--panel));min-width:0;}
  .rankmove-kpi span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;}
  .rankmove-kpi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .rankmove-kpi strong{font:800 18px 'Roboto Mono',monospace;color:var(--accent);}
  .rankmove-kpi.down strong{color:#c83d32;}
  .rankmove-row{cursor:pointer;transition:background .15s,transform .15s;}
  .rankmove-row:hover{background:var(--zone);}
  .rankmove-arrow{display:inline-flex;align-items:center;justify-content:center;min-width:50px;
    border-radius:999px;padding:3px 7px;font:800 11px 'Roboto Mono',monospace;}
  .rankmove-arrow.up{color:#147a47;background:rgba(25,150,90,.12);}
  .rankmove-arrow.down{color:#c83d32;background:rgba(200,61,50,.12);}
  .rankmove-arrow.same{color:var(--muted);background:var(--panel2);}
  .rankmove-arrow.new{color:#875500;background:rgba(245,166,35,.18);}
  .rankmove-delta{font:700 11px 'Roboto Mono',monospace;}
  .rankmove-delta.positive{color:#147a47;}
  .rankmove-delta.negative{color:#c83d32;}
  .rankmove-active{display:inline-block;margin-left:5px;color:var(--accent);
    font-size:9px;font-weight:700;vertical-align:middle;}
  @media(max-width:760px){
    .rankmove-kpis{grid-template-columns:1fr 1fr;}
    .rankmove-hide-mobile{display:none;}
  }

  /* ---- 相関分析 ---- */
  .corr-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.7fr);
    gap:12px;margin-top:10px;}
  .corr-panel{border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(145deg,var(--panel2),var(--panel));
    padding:12px;min-width:0;box-shadow:0 8px 24px rgba(80,45,15,.07);}
  .corr-panel-head{display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;margin-bottom:8px;}
  .corr-panel-title{font-size:13px;font-weight:700;color:var(--accent);}
  .corr-panel-sub{font-size:10.5px;color:var(--muted);line-height:1.5;text-align:right;}
  .corr-svg{display:block;width:100%;height:auto;min-height:360px;border-radius:11px;}
  .corr-chart-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:11px;
    background:radial-gradient(circle at 75% 15%,rgba(232,89,12,.08),transparent 38%),
      linear-gradient(145deg,var(--panel),var(--panel2));}
  .corr-svg text{font-family:'Roboto Mono',monospace;fill:var(--muted);font-size:11px;}
  .corr-svg .axis-label{fill:var(--ink);font-family:inherit;font-weight:700;font-size:12px;}
  .corr-svg .plot-bg{fill:var(--panel);opacity:.62;}
  .corr-svg .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 6;}
  .corr-svg .axis{stroke:var(--muted);stroke-width:1.2;}
  .corr-svg .mean{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:2 5;opacity:.5;}
  .corr-svg .mean-label{fill:var(--ink2);font-family:inherit;font-size:10px;font-weight:700;}
  .corr-svg .confidence{fill:var(--accent);opacity:.12;}
  .corr-svg .trend{stroke:var(--accent);stroke-width:3;stroke-linecap:round;
    filter:drop-shadow(0 1px 2px rgba(232,89,12,.35));}
  .corr-svg .point{stroke:var(--panel);stroke-width:1.7;opacity:.78;cursor:pointer;
    transition:opacity .15s,stroke-width .15s;}
  .corr-svg .point:hover{opacity:1;stroke:var(--ink);stroke-width:2.8;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));}
  .corr-svg .point.selected{opacity:1;stroke:var(--accent);stroke-width:3.2;
    filter:drop-shadow(0 2px 4px rgba(232,89,12,.45));}
  .corr-svg .highlight-ring{fill:none;stroke:var(--ink);stroke-width:1.8;opacity:.8;
    pointer-events:none;}
  .corr-svg .point-label{font-family:'Roboto Mono',monospace;font-size:10px;
    font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px;
    stroke-linejoin:round;pointer-events:none;}
  .corr-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .corr-kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px;text-align:center;}
  .corr-kpi strong{display:block;color:var(--accent);font-family:'Roboto Mono',monospace;
    font-size:24px;line-height:1.2;}
  .corr-kpi span{font-size:10.5px;color:var(--muted);}
  .corr-reading{font-size:12px;line-height:1.7;background:var(--panel);
    border-radius:8px;padding:9px 10px;}
  .corr-selected{background:linear-gradient(135deg,rgba(232,89,12,.12),var(--panel));
    border:1px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px;}
  .corr-selected-label{font-size:9.5px;color:var(--muted);font-weight:700;}
  .corr-selected-name{font-size:15px;font-weight:700;margin:2px 0 6px;
    display:flex;align-items:center;gap:5px;}
  .corr-selected-values{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .corr-selected-value{background:var(--panel);border-radius:6px;padding:5px 6px;
    font-size:9px;color:var(--muted);}
  .corr-selected-value strong{display:block;font:700 13px 'Roboto Mono',monospace;
    color:var(--accent);margin-top:1px;}
  .corr-quads{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;}
  .corr-quad{font-size:10.5px;line-height:1.45;background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:6px 7px;color:var(--ink2);}
  .corr-quad b{display:block;color:var(--accent);font-size:10px;}
  .corr-highlights{margin-top:9px;}
  .corr-highlight-title{font-size:11px;font-weight:700;color:var(--accent);
    margin-bottom:4px;}
  .corr-highlight{display:grid;grid-template-columns:18px minmax(0,1fr) auto;
    align-items:center;gap:5px;border-top:1px dashed var(--line);padding:5px 1px;
    font-size:11px;}
  .corr-highlight-rank{font-family:'Roboto Mono',monospace;color:var(--accent);font-weight:700;}
  .corr-highlight-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .corr-highlight-values{font:9.5px 'Roboto Mono',monospace;color:var(--muted);
    white-space:nowrap;text-align:right;}
  .corr-legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
  .corr-legend span{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 7px;}
  .corr-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .corr-legend .corr-size-dot{width:12px;height:12px;border:2px solid var(--accent);
    background:transparent;}
  .corr-matrix{margin-top:12px;}
  table.corr-table{min-width:780px;table-layout:fixed;font-size:10.5px;}
  table.corr-table th,table.corr-table td{text-align:center;padding:4px 3px;height:42px;}
  table.corr-table th:first-child{width:104px;text-align:left;position:sticky;left:0;
    z-index:2;background:var(--panel2);}
  .corr-cell{width:100%;height:32px;border:0;border-radius:5px;
    font:700 10.5px 'Roboto Mono',monospace;cursor:pointer;color:var(--ink);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);transition:transform .12s;}
  .corr-cell:hover{outline:2px solid var(--accent);outline-offset:1px;transform:scale(1.06);}
  .corr-diag{background:var(--line);cursor:default;}
  .corr-note{font-size:10.5px;color:var(--muted);line-height:1.65;margin-top:8px;}
  @media(max-width:820px){
    .corr-layout{grid-template-columns:1fr;}
    .corr-svg{min-width:680px;min-height:0;}
    .corr-panel-sub{text-align:left;}
  }

  /* ---- 球団スタイルマップ ---- */
  .ts-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
    gap:12px;margin-top:10px;}
  .ts-panel{border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(145deg,var(--panel2),var(--panel));padding:12px;
    min-width:0;box-shadow:0 8px 24px rgba(80,45,15,.07);}
  .ts-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:3px;}
  .ts-sub{font-size:10.5px;color:var(--muted);line-height:1.6;}
  .ts-svg{display:block;width:100%;height:auto;}
  .ts-map-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:11px;
    background:radial-gradient(circle at 80% 12%,rgba(232,89,12,.08),transparent 38%),
      var(--panel);}
  .ts-map{min-width:640px;}
  .ts-svg text{font-family:'Roboto Mono',monospace;fill:var(--muted);font-size:10px;}
  .ts-svg .ts-grid{stroke:var(--line);fill:none;stroke-width:1;}
  .ts-svg .ts-axis{stroke:var(--line2);stroke-width:1;}
  .ts-svg .ts-avg{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:4 5;opacity:.55;}
  .ts-svg .ts-axis-label{fill:var(--ink);font-family:inherit;font-size:11px;font-weight:700;}
  .ts-svg .ts-team-point{cursor:pointer;stroke:var(--panel);stroke-width:2;opacity:.9;}
  .ts-svg .ts-team-point:hover{stroke:var(--ink);stroke-width:3;opacity:1;}
  .ts-svg .ts-team-point.selected{stroke:var(--accent);stroke-width:4;}
  .ts-svg .ts-team-label{fill:var(--ink);font-family:inherit;font-size:10px;font-weight:700;
    paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none;}
  .ts-radar-wrap{max-width:520px;margin:0 auto;}
  .ts-radar-poly{stroke-width:3;stroke-linejoin:round;}
  .ts-style-card{border:1px solid var(--accent2);border-radius:10px;
    background:linear-gradient(135deg,rgba(232,89,12,.12),var(--panel));
    padding:10px 12px;margin-top:8px;}
  .ts-style-head{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;}
  .ts-style-type{display:inline-block;background:var(--accent);color:#fff;
    border-radius:20px;padding:3px 9px;font-size:11px;margin:6px 0;}
  .ts-style-copy{font-size:11.5px;line-height:1.7;color:var(--ink2);}
  .ts-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .ts-legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:3px 8px;}
  .ts-legend i{width:11px;height:4px;border-radius:4px;display:inline-block;}
  .ts-table{margin-top:12px;}
  table.ts-score-table{min-width:800px;}
  table.ts-score-table td.ts-score{font:700 11px 'Roboto Mono',monospace;text-align:center;}
  table.ts-score-table tr{cursor:pointer;}
  table.ts-score-table tr:hover td{outline:1px solid var(--accent2);}
  @media(max-width:850px){
    .ts-layout{grid-template-columns:1fr;}
  }

  /* ---- セイバーメトリクス ---- */
  .saber-hero{border:1px solid var(--accent2);border-radius:15px;padding:16px;
    background:
      radial-gradient(circle at 88% 12%,rgba(232,89,12,.18),transparent 30%),
      linear-gradient(135deg,var(--panel2),var(--panel));margin-bottom:10px;}
  .saber-hero h2{margin:0 0 5px;color:var(--accent);font-size:20px;}
  .saber-hero p{margin:0;color:var(--ink2);font-size:12px;line-height:1.75;}
  .saber-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
    margin:10px 0;}
  .saber-kpi{border:1px solid var(--line);border-radius:11px;padding:10px;
    background:var(--panel);min-width:0;}
  .saber-kpi-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
  .saber-kpi-player{font-size:12px;font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
  .saber-kpi-value{font:700 22px 'Roboto Mono',monospace;color:var(--accent);
    margin-top:3px;}
  .saber-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(310px,.75fr);
    gap:10px;margin-top:10px;}
  .saber-panel{border:1px solid var(--line);border-radius:14px;padding:12px;
    background:linear-gradient(145deg,var(--panel2),var(--panel));min-width:0;}
  .saber-panel-title{font-size:13px;font-weight:700;color:var(--accent);
    margin-bottom:2px;}
  .saber-panel-note{font-size:10px;color:var(--muted);line-height:1.55;
    margin-bottom:8px;}
  .saber-bar-scroll{overflow-x:auto;}
  .saber-bar-svg{display:block;width:100%;height:auto;min-width:620px;}
  .saber-bar-svg text{font-family:'Roboto Mono',monospace;fill:var(--muted);
    font-size:10px;}
  .saber-bar-svg .bar-name{fill:var(--ink);font-family:inherit;font-weight:700;}
  .saber-bar-svg .bar-bg{fill:var(--line);opacity:.55;}
  .saber-bar-svg .bar{cursor:pointer;opacity:.84;transition:opacity .15s;}
  .saber-bar-svg .bar:hover,.saber-bar-svg .bar.selected{opacity:1;
    stroke:var(--ink);stroke-width:2;}
  .saber-profile-head{display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:7px;}
  .saber-profile-name{font-size:18px;font-weight:700;display:flex;
    align-items:center;gap:6px;}
  .saber-profile-meta{font-size:10px;color:var(--muted);text-align:right;}
  .saber-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
    margin-bottom:8px;}
  .saber-stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:6px;text-align:center;}
  .saber-stat span{display:block;font-size:9px;color:var(--muted);}
  .saber-stat b{display:block;font:700 13px 'Roboto Mono',monospace;
    color:var(--accent);margin-top:2px;}
  .saber-radar{display:block;width:100%;height:auto;max-width:360px;margin:0 auto;}
  .saber-radar .grid{fill:none;stroke:var(--line);stroke-width:1;}
  .saber-radar .axis{stroke:var(--line2);stroke-width:1;}
  .saber-radar .shape{fill:rgba(232,89,12,.2);stroke:var(--accent);
    stroke-width:3;stroke-linejoin:round;}
  .saber-radar text{font-size:10px;fill:var(--ink2);font-family:inherit;font-weight:700;}
  .saber-comment{border-left:4px solid var(--accent);border-radius:8px;
    background:var(--panel);padding:9px 11px;font-size:12px;line-height:1.8;
    margin-top:8px;}
  .saber-comment b{color:var(--accent);}
  .saber-ai{border:1px dashed var(--accent2);border-radius:9px;padding:9px 10px;
    margin-top:8px;background:rgba(232,89,12,.05);}
  .saber-ai-head{display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:5px;}
  .saber-ai-title{font-size:11px;font-weight:700;color:var(--accent);}
  .saber-ai-copy{font-size:10.5px;color:var(--muted);line-height:1.6;}
  .saber-ai-result{font-size:12px;line-height:1.8;color:var(--ink);
    white-space:pre-wrap;margin-top:6px;}
  table.saber-table{min-width:900px;}
  table.saber-table tr{cursor:pointer;}
  table.saber-table tr:hover td{background:rgba(232,89,12,.07);}
  @media(max-width:860px){
    .saber-grid{grid-template-columns:1fr;}
    .saber-kpis{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:520px){
    .saber-kpis{grid-template-columns:1fr;}
    .saber-stat-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* ---- 指標一覧 ---- */
  .glossitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    margin-bottom:8px;background:var(--panel2);}
  .glosshead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .glossabbr{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;
    color:var(--accent);min-width:52px;}
  .glossname{font-size:13.5px;font-weight:700;}
  .glossformula{font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--ink2);
    background:var(--panel);border-radius:6px;padding:5px 8px;margin-bottom:6px;
    display:inline-block;}
  .glossdesc{font-size:12.5px;line-height:1.7;}
  .glossnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px;
    padding-top:5px;border-top:1px dashed var(--line);}

  /* ---- 表彰 ---- */
  .mvpgrid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:900px){ .mvpgrid{grid-template-columns:1fr 1fr;} }
  .mvpcard{margin-top:0;}
  .mvpname{font-size:19px;font-weight:700;display:flex;align-items:center;gap:7px;
    margin-bottom:4px;}
  .mvpscore{font-family:'Roboto Mono',monospace;font-size:34px;font-weight:700;
    color:var(--accent);line-height:1.1;display:flex;align-items:baseline;gap:6px;}
  .mvpunit{font-size:14px;color:var(--muted);}
  .mvpmargin{font-size:11.5px;color:var(--muted);font-family:inherit;font-weight:400;
    margin-left:auto;}
  .mvpstat{font-size:13.5px;margin:6px 0 8px;}
  .mvprow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:5px;}
  .mvprow .k{font-size:11px;color:var(--muted);min-width:30px;}
  .mvpcomment{font-size:12.5px;line-height:1.7;background:var(--panel2);
    border-radius:8px;padding:8px 10px;margin-top:8px;}
  .mvpbd{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
  .bdchip{font-size:10.5px;font-family:'Roboto Mono',monospace;
    background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:2px 6px;color:var(--muted);}
  .bdchip.minus{color:var(--out);}
  .calnav #awDate{font-family:inherit;font-size:14px;padding:7px 10px;
    border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink);}

  /* ---- 球団タブ ---- */
  .teamtabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;}
  .ttab{font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;

  .ttab.on{box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .ttab .tm{font-family:'Roboto Mono',monospace;font-size:12px;min-width:16px;

  .ttab .tn{font-size:12.5px;}
  @media(max-width:640px){ .ttab .tn{display:none;} .ttab{padding:8px 10px;} }
  .tsep{width:1px;align-self:stretch;background:var(--line2);margin:0 4px;
    min-height:26px;}

  /* ---- データ出力 ---- */
  .expsec{margin-top:14px;}
  .expsec:first-child{margin-top:0;}
  .expsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
  .expset{display:flex;flex-direction:column;gap:2px;cursor:pointer;
    background:var(--panel2);border:2px solid var(--line);border-radius:10px;
    padding:10px 12px;}

  .expset input{display:none;}
  .expset .et{font-weight:700;font-size:14px;}
  .expset .ed{font-size:11px;color:var(--muted);line-height:1.4;}

  .ef{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);}
  .ef input,.ef select{font-family:inherit;font-size:14px;padding:8px 10px;

  .expbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .exresult{margin-top:10px;}
  .exok{font-size:13px;font-weight:700;color:var(--accent);

    padding:9px 12px;}
  .explinks{display:flex;flex-wrap:wrap;gap:10px;}
  .explink{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;}
  .explink a{color:var(--accent);font-weight:700;margin-left:5px;}

  /* ---- スタメン・途中交代 ---- */
  .lineupwrap{display:grid;grid-template-columns:1fr;gap:0;}
  @media(min-width:1000px){
    .lineupwrap{grid-template-columns:1fr 1fr;gap:12px;}
    .lineupwrap>.card2{margin-top:12px;}
  }
  table.lineuptbl{min-width:480px;}
  table.lineuptbl td.ord{font-weight:700;font-size:15px;color:var(--accent);}
  table.stbl td.pos{font-size:12px;white-space:nowrap;}
  table.stbl td.unumcell{font-family:'Roboto Mono',monospace;color:var(--muted);
    font-size:12px;}
  .unum{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--muted);
    font-weight:400;}
  .subsec{margin-top:10px;}
  .subsec:first-child{margin-top:0;}
  .subttl{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;
    padding-left:3px;border-left:3px solid var(--line2);}
  .subtag{display:inline-block;font-size:10px;font-weight:700;padding:2px 5px;
    border-radius:3px;background:var(--accent2);color:#fff;line-height:1;
    vertical-align:middle;white-space:nowrap;}
  .dim{color:var(--muted);font-size:11px;}

  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--accent);}
  th.sortable.on{color:var(--accent);background:var(--zone);}

  .estmark{display:inline-block;margin-left:3px;font-size:8.5px;font-weight:700;
    padding:1px 3px;border-radius:2px;background:var(--muted);color:#fff;
    vertical-align:super;line-height:1;}

  /* ---- 選手の直近推移 ---- */
  .trend-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .trend-head .stabs{margin:0 0 0 auto;}
  .trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:9px;}
  .trend-card{background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;min-width:0;}
  .trend-title{display:flex;align-items:baseline;gap:7px;font-size:12px;
    font-weight:700;color:var(--ink2);}
  .trend-latest{font-family:'Roboto Mono',monospace;color:var(--accent);
    font-size:18px;}
  .trend-delta{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--muted);}
  .trend-svg{display:block;width:100%;height:145px;margin-top:3px;overflow:visible;}
  .trend-gridline{stroke:var(--line);stroke-width:1;}
  .trend-baseline{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;}
  .trend-line{fill:none;stroke:var(--accent);stroke-width:2.5;
    stroke-linecap:round;stroke-linejoin:round;}
  .trend-dot{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;}
  .trend-axis{fill:var(--muted);font-size:9px;font-family:'Roboto Mono',monospace;}
  .trend-volume{font-size:10.5px;color:var(--muted);margin-top:4px;}

  /* ---- 全選手グラフ ---- */
  .pg-intro{font-size:12.5px;line-height:1.8;color:var(--ink2);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:10px;}
  .pg-controls{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:8px;
    align-items:end;margin-bottom:10px;}
  .pg-control{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .pg-control label{font-size:10px;color:var(--muted);font-weight:700;}
  .pg-control select,.pg-control input{width:100%;min-width:0;font-family:inherit;
    font-size:13px;font-weight:700;background:var(--panel2);color:var(--ink);
    border:2px solid var(--line2);border-radius:9px;padding:8px 9px;}
  .pg-picker{display:grid;grid-template-columns:minmax(170px,1fr) auto;gap:7px;align-items:end;}
  .pg-selected{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 11px;}
  .pg-selected-label{font-size:10px;color:var(--muted);font-weight:700;}
  .pg-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
    border-radius:999px;background:var(--panel2);padding:4px 6px 4px 9px;font-size:12px;
    font-weight:700;box-shadow:var(--shadow);}
  .pg-chip i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .pg-chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:14px;line-height:1;padding:1px 3px;}
  .pg-chip button:hover{color:var(--out);}
  .pg-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.65fr);
    gap:11px;align-items:start;}
  .pg-panel{background:linear-gradient(145deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
  .pg-panel-head{display:flex;align-items:flex-start;justify-content:space-between;
    gap:8px;margin-bottom:6px;}
  .pg-panel-title{font-size:13px;font-weight:700;color:var(--accent);}
  .pg-panel-note{font-size:9.5px;color:var(--muted);text-align:right;}
  .pg-chart-stage{position:relative;isolation:isolate;overflow:hidden;border-radius:10px;
    background:
      radial-gradient(circle at 82% 10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 34%),
      linear-gradient(160deg,color-mix(in srgb,var(--panel) 90%,transparent),var(--panel2));
    animation:pg-stage-in .48s cubic-bezier(.2,.75,.25,1) both;}
  .pg-chart-stage::before{content:"";position:absolute;inset:-35% -12%;z-index:-1;pointer-events:none;
    background:linear-gradient(110deg,transparent 34%,rgba(255,255,255,.2) 48%,transparent 62%);
    transform:translateX(-65%);animation:pg-sheen 1.05s .08s ease-out both;}
  .pg-chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .pg-svg{display:block;width:100%;height:auto;min-width:660px;min-height:350px;overflow:visible;}
  .pg-svg text{font:10px 'Roboto Mono',monospace;fill:var(--muted);}
  .pg-svg .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 6;
    animation:pg-grid-in .55s ease-out both;animation-delay:var(--pg-grid-delay,0ms);}
  .pg-svg .axis{stroke:var(--muted);stroke-width:1.2;}
  .pg-svg .baseline{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 5;opacity:.55;}
  .pg-svg .series{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 2px 3px rgba(70,35,10,.2));stroke-dasharray:1;
    stroke-dashoffset:1;animation:pg-line-draw 1.05s cubic-bezier(.42,0,.18,1) forwards;
    animation-delay:var(--pg-series-delay,0ms);}
  .pg-svg .area{opacity:0;animation:pg-area-in .65s ease-out forwards;
    animation-delay:calc(var(--pg-series-delay,0ms) + 420ms);}
  .pg-svg .dot{stroke:var(--panel);stroke-width:2;transform-box:fill-box;
    transform-origin:center;transform:scale(0);opacity:0;
    animation:pg-dot-in .36s cubic-bezier(.2,1.7,.35,1) forwards;
    animation-delay:var(--pg-dot-delay,0ms);cursor:pointer;transition:r .16s,filter .16s;}
  .pg-svg .dot:hover,.pg-svg .dot:focus{r:6;outline:none;
    filter:drop-shadow(0 0 5px currentColor);}
  .pg-svg .latest-halo{fill:none;stroke-width:2;opacity:0;transform-box:fill-box;
    transform-origin:center;animation:pg-latest-pulse 2s calc(var(--pg-series-delay,0ms) + 1s) ease-out infinite;}
  .pg-chart-tooltip{position:absolute;z-index:3;pointer-events:none;min-width:135px;max-width:210px;
    padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--ink) 92%,transparent);
    color:var(--panel);font-size:10px;line-height:1.55;box-shadow:0 8px 24px rgba(20,10,0,.24);
    opacity:0;transform:translate(-50%,8px) scale(.96);transition:opacity .16s,transform .16s;}
  .pg-chart-tooltip.show{opacity:1;transform:translate(-50%,0) scale(1);}
  .pg-chart-tooltip b{display:block;color:#fff;font-size:11px;margin-bottom:1px;}
  .pg-chart-tooltip span{color:rgba(255,255,255,.72);}
  .pg-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:10.5px;}
  .pg-legend span{display:inline-flex;align-items:center;gap:4px;animation:pg-legend-in .42s ease-out both;
    animation-delay:var(--pg-legend-delay,0ms);}
  .pg-legend i{width:13px;height:4px;border-radius:4px;display:inline-block;}
  .pg-profiles{display:grid;gap:8px;}
  .pg-player-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;border-left:4px solid var(--accent);animation:pg-card-in .48s ease-out both;
    animation-delay:var(--pg-card-delay,0ms);}
  .pg-player-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .pg-player-meta{font-size:10px;color:var(--muted);margin:2px 0 6px;}
  .pg-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
  .pg-kpi{background:var(--panel2);border-radius:6px;padding:4px;text-align:center;}
  .pg-kpi span{display:block;font-size:8.5px;color:var(--muted);}
  .pg-kpi b{display:block;font:700 11.5px 'Roboto Mono',monospace;color:var(--accent);}
  .pg-comment{font-size:11.5px;line-height:1.7;margin-top:7px;padding-top:6px;
    border-top:1px dashed var(--line);}
  .pg-table{margin-top:10px;}
  .pg-share-result{font-size:10px;color:var(--accent);min-height:16px;margin-top:3px;}
  /* ---- 個人用SNS投稿 ---- */
  .social-intro{font-size:12.5px;line-height:1.8;color:var(--ink2);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:10px;}
  .social-controls{display:grid;grid-template-columns:minmax(160px,220px) minmax(130px,190px) minmax(150px,210px) auto;
    gap:8px;align-items:end;margin-bottom:12px;}
  .social-field{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .social-field label{font-size:10px;color:var(--muted);font-weight:700;}
  .social-field input,.social-field select{width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;
    color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;}
  .social-field input[type=date]{flex:none;min-width:0;font-weight:700;}
  .social-posts{display:grid;gap:10px;}
  .social-post{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;
    background:var(--panel);padding:10px;}
  .social-post.posted{border-left-color:var(--safe);opacity:.72;}
  .social-post-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:6px;font-size:12px;font-weight:700;color:var(--accent);}
  .social-count{font:10px 'Roboto Mono',monospace;color:var(--muted);}
  .social-count.warn{color:var(--out);font-weight:700;}
  .social-text{width:100%;min-height:150px;resize:vertical;box-sizing:border-box;font-family:inherit;
    font-size:13px;line-height:1.65;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:9px;}
  .social-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;}
  .social-note{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px;}
  .social-status{font-size:11px;color:var(--accent);min-height:18px;margin-top:5px;}
  .social-progress{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:7px 9px;margin-bottom:9px;}
  .social-progress b{color:var(--accent);}
  .social-complete{font-size:11px;line-height:1.65;border:1px solid var(--safe);border-radius:9px;
    color:var(--safe);background:color-mix(in srgb,var(--safe) 7%,var(--panel));padding:7px 9px;margin-bottom:9px;}
  .social-complete.warn{color:var(--out);border-color:var(--out);
    background:color-mix(in srgb,var(--out) 7%,var(--panel));font-weight:700;}
  .social-template{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:8px 10px;margin-bottom:10px;}
  .social-template summary{cursor:pointer;font-size:11px;font-weight:700;color:var(--accent);}
  .social-template-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end;margin-top:8px;}
  .social-posted-badge{font-size:9px;color:var(--safe);border:1px solid currentColor;border-radius:12px;padding:2px 6px;}
  .social-card-maker{border:1px solid var(--line);border-radius:14px;background:var(--panel2);
    padding:12px;margin:12px 0;}
  .social-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:9px;}
  .social-card-head h3{font-size:14px;color:var(--accent);}
  .social-card-controls{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,2fr) auto;
    gap:8px;align-items:end;margin-bottom:10px;}
  .social-card-preview{border:1px solid var(--line2);border-radius:12px;overflow:hidden;
    background:#fff;box-shadow:var(--shadow);}
  .social-card-preview canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;}
  .social-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}

  /* ---- 試合ストーリー ---- */
  .story-hero{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:16px;
    background:radial-gradient(circle at 90% 0,rgba(245,159,0,.18),transparent 35%),
      linear-gradient(145deg,var(--panel2),var(--panel));}
  .story-kicker{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:.12em;}
  .story-headline{font-size:clamp(20px,4vw,30px);line-height:1.4;margin:3px 0 6px;}
  .story-summary{font-size:12.5px;color:var(--ink2);line-height:1.8;}
  .story-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px;}
  .story-kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
  .story-kpi span{display:block;font-size:9.5px;color:var(--muted);}
  .story-kpi b{font:800 17px 'Roboto Mono',monospace;color:var(--accent);}
  .story-turning{border-left:5px solid var(--accent);margin:11px 0;padding:11px 13px;
    border-radius:9px;background:rgba(232,89,12,.08);}
  .story-turning small{display:block;color:var(--muted);font-size:9.5px;font-weight:700;}
  .story-turning b{font-size:14px;}
  .story-timeline{position:relative;margin:13px 0 4px;padding-left:28px;}
  .story-timeline:before{content:"";position:absolute;left:10px;top:7px;bottom:7px;width:2px;
    background:linear-gradient(var(--accent2),var(--accent));}
  .story-event{position:relative;border:1px solid var(--line);background:var(--panel);
    border-radius:11px;padding:10px 12px;margin-bottom:9px;}
  .story-event:before{content:"";position:absolute;left:-24px;top:16px;width:12px;height:12px;
    border-radius:50%;background:var(--accent);border:3px solid var(--bg);}
  .story-event-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .story-inning{font:800 12px 'Roboto Mono',monospace;color:var(--accent);}
  .story-type{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;
    color:#fff;background:var(--accent);}
  .story-type.tie{background:#1971c2}.story-type.comeback{background:#c92a2a}
  .story-score{margin-left:auto;font:800 12px 'Roboto Mono',monospace;color:var(--ink2);}
  .story-play{font-size:13px;font-weight:700;margin-top:4px;}
  .story-detail{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .story-bullpen{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
  .story-bullpen span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel2);padding:4px 8px;font-size:10px;color:var(--ink2);}
  .note-article{border:1px solid var(--line);border-left:4px solid #41c9a5;border-radius:12px;background:var(--panel);padding:14px;margin:12px 0;}
  .note-article-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
  .note-article-head h3{margin:0;font-size:16px;color:var(--ink);}
  .note-article-title{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;}
  .note-article-text{width:100%;min-height:460px;box-sizing:border-box;resize:vertical;font-family:inherit;font-size:13px;line-height:1.85;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .note-article-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .note-article-meta{font-size:10px;color:var(--muted);line-height:1.6;margin-top:7px;}
  /* ---- 選手別対戦成績 ---- */
  .matchup-hero{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .matchup-hero-main{min-width:220px;flex:1;}
  .matchup-player{font-size:20px;font-weight:800;line-height:1.3;}
  .matchup-sub{font-size:11px;color:var(--muted);margin-top:3px;}
  .matchup-controls{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,minmax(110px,170px));gap:8px;margin:10px 0;}
  .matchup-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0;}
  .matchup-kpi{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 10px;min-width:0;}
  .matchup-kpi span{display:block;font-size:9px;color:var(--muted);margin-bottom:4px;}
  .matchup-kpi b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .matchup-kpi em{display:block;font:700 13px 'Roboto Mono',monospace;color:var(--accent);margin-top:2px;font-style:normal;}
  .matchup-rank-list{display:grid;gap:7px;margin-top:7px;}
  .matchup-rank-row{border-top:1px dashed var(--line);padding-top:7px;min-width:0;}
  .matchup-rank-row:first-child{border-top:0;padding-top:0;}
  .matchup-rank-name{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;}
  .matchup-rank-name .rank{color:var(--accent);font:800 11px 'Roboto Mono',monospace;min-width:14px;}
  .matchup-rank-stats{font:600 10px/1.65 'Roboto Mono',var(--font-ui);color:var(--ink2);margin-top:2px;overflow-wrap:anywhere;}
  .matchup-rank-stats strong{color:var(--accent);font-weight:800;}
  .matchup-rank-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px;}
  .matchup-rank-pa{font:800 12px 'Roboto Mono',var(--font-ui);color:var(--ink);}
  .matchup-rank-confidence{font:700 10px 'Roboto Mono',var(--font-ui);color:var(--muted);}
  .matchup-verdict{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:800;line-height:1.4;}
  .matchup-verdict.good{background:#dcfce7;color:#166534;border:1px solid #86efac;}
  .matchup-verdict.normal{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;}
  .matchup-verdict.bad{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
  .matchup-criteria{display:grid;gap:5px;margin:9px 0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:10px;line-height:1.65;color:var(--ink2);}
  .matchup-criteria b{color:var(--accent);font-size:10.5px;}
  .matchup-table .matchup-verdict{white-space:nowrap;}
  .matchup-table .matchup-confidence-cell{font:700 10px 'Roboto Mono',var(--font-ui);color:var(--muted);white-space:nowrap;}
  .matchup-note{font-size:10px;line-height:1.6;color:var(--muted);margin-top:7px;}
  .pitch-heatmap-sec{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;}
  .pitch-heatmap-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
  .pitch-heatmap-title{font-size:15px;font-weight:800;color:var(--ink);}
  .pitch-heatmap-title small{display:block;margin-top:3px;font-size:10px;font-weight:500;color:var(--muted);}

  .pitch-heatmap-advanced-grid .ef input,.pitch-heatmap-advanced-grid .ef select{width:100%;min-width:0;box-sizing:border-box;}
  .pitch-heatmap-advanced{border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:11px;}
  .pitch-heatmap-advanced summary{cursor:pointer;list-style:none;padding:9px 11px;font-size:11px;font-weight:800;color:var(--accent);}
  .pitch-heatmap-advanced summary::-webkit-details-marker{display:none;}
  .pitch-heatmap-advanced summary::after{content:'＋';float:right;}
  .pitch-heatmap-advanced[open] summary::after{content:'－';}
  .pitch-heatmap-advanced-grid{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));gap:7px;padding:0 10px 10px;}
  .pitch-heatmap-reset{align-self:end;min-height:34px;}
  .pitch-heatmap-active{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:-2px 0 10px;}
  .pitch-heatmap-active span{font-size:9px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);padding:3px 7px;color:var(--ink2);}
  .pitch-heatmap-layout{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:14px;align-items:center;}
  .pitch-heatmap-grid{max-width:390px;width:100%;}
  .pitch-heatmap-grid .hcell{position:relative;font-size:15px;transition:background-color .2s ease,transform .2s ease;}
  .pitch-heatmap-grid .hcell small{display:block;font-size:8px;font-weight:600;opacity:.76;margin-left:2px;}
  .pitch-heatmap-surface{position:relative;width:min(100%,390px);aspect-ratio:1;margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel2) 78%,#dbeafe);box-shadow:inset 0 0 25px rgba(15,23,42,.05);}
  .pitch-heatmap-surface canvas{display:block;width:100%;height:100%;}
  .pitch-contour-legend{width:92px;height:11px;border-radius:6px;background:linear-gradient(90deg,#2b6cb0,#9ecae1,#f7f7f2,#fdae61,#d7191c);border:1px solid rgba(0,0,0,.08);}
  .pitch-heatmap-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:11px;color:var(--muted);}
  .pitch-heatmap-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .pitch-heatmap-summary .stat{min-width:0;}
  .pitch-heatmap-guide{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center;margin:0 0 5px;}
  .pitch-heatmap-note{font-size:10px;line-height:1.65;color:var(--muted);margin-top:9px;}
  .inning-split{margin-top:10px;}
  .inning-split-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);}
  .inning-split-controls input[type=date]{flex:none;min-width:0;width:100%;box-sizing:border-box;font-size:14px;font-weight:500;padding:8px 10px;}
  .inning-split-controls .ef span{font-size:11px;font-weight:700;color:var(--ink2);}
  .inning-game-field.is-hidden{display:none;}
  .inning-date-range{grid-column:span 2;}
  .inning-date-inputs{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;}
  .inning-date-inputs i{font-style:normal;font-size:12px;color:var(--muted);}
  .inning-split-chart{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-bottom:15px;}
  .inning-chart-card{position:relative;overflow:hidden;min-height:104px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px 11px;box-shadow:0 2px 8px rgba(70,45,20,.05);animation:inning-card-in .4s ease-out both;}
  .inning-chart-head{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .inning-chart-label{font-size:13px;font-weight:800;color:var(--ink);}
  .inning-chart-value{font:800 24px/1.15 'Roboto Mono',var(--font-ui);color:var(--accent);margin-top:9px;letter-spacing:-.04em;}
  .inning-chart-metric{font-size:9px;font-weight:700;color:var(--muted);margin-top:1px;}
  .inning-chart-meta{font-size:10px;color:var(--ink2);margin-top:8px;}
  .inning-chart-track{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--panel2);}
  .inning-chart-bar{height:100%;min-width:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:inning-bar-in .45s ease-out both;transform-origin:left;}
  .inning-table-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0 7px;}
  .inning-table-title .sub2{font-size:10px;}
  .inning-split-table{min-width:1040px;}
  .inning-split-table th,.inning-split-table td{padding:8px 9px;white-space:nowrap;}
  .inning-split-table th:first-child,.inning-split-table td:first-child{position:sticky;left:0;z-index:2;background:var(--panel);box-shadow:2px 0 0 var(--line);}
  .inning-split-table th:first-child{z-index:3;background:var(--panel2);}
  .inning-split-table tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 58%,var(--panel));}
  .inning-split-table tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb,var(--panel2) 58%,var(--panel));}
  .inning-split-note{font-size:10px;line-height:1.65;color:var(--muted);margin-top:8px;}
  .inning-sample{display:inline-block;border-radius:999px;padding:2px 6px;font-size:9px;font-weight:700;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--muted);}
  .inning-sample.ok{background:#dcfce7;border-color:#86efac;color:#166534;}
  @keyframes inning-bar-in{from{transform:scaleX(0);opacity:.35}to{transform:scaleX(1);opacity:1}}
  @keyframes inning-card-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @keyframes pg-stage-in{from{opacity:0;transform:translateY(7px) scale(.995)}to{opacity:1;transform:none}}
  @keyframes pg-sheen{from{transform:translateX(-65%)}to{transform:translateX(65%)}}
  @keyframes pg-grid-in{from{opacity:0}to{opacity:1}}
  @keyframes pg-line-draw{to{stroke-dashoffset:0}}
  @keyframes pg-area-in{from{opacity:0}to{opacity:.16}}
  @keyframes pg-dot-in{to{opacity:1;transform:scale(1)}}
  @keyframes pg-latest-pulse{0%{opacity:.7;transform:scale(.65)}75%,100%{opacity:0;transform:scale(2.3)}}
  @keyframes pg-legend-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes pg-card-in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
  @media(max-width:920px){
    .pg-controls{grid-template-columns:repeat(2,minmax(0,1fr));}
    .pg-layout{grid-template-columns:1fr;}
    .pg-profiles{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
  }
  @media(max-width:520px){
    .pg-controls{grid-template-columns:1fr 1fr;}
    .pg-picker{grid-template-columns:1fr;}
    .pg-picker .btn{width:100%;}
    .pg-svg{min-width:620px;}
    .social-controls{grid-template-columns:1fr 1fr;}
    .social-controls .btn{grid-column:1/-1;width:100%;}
    .social-actions .btn{flex:1;}
    .social-template-grid{grid-template-columns:1fr;}
    .social-card-controls{grid-template-columns:1fr;}
    .social-card-actions .btn{flex:1;}
    .story-kpis{grid-template-columns:1fr;}
    .note-article-actions .btn{flex:1;min-width:120px;}
    .note-article-text{min-height:420px;}
    .matchup-controls{grid-template-columns:1fr 1fr;}
    .matchup-kpis{grid-template-columns:1fr;}
    .pitch-heatmap-controls{grid-template-columns:1fr;}
    .pitch-heatmap-advanced-grid{grid-template-columns:1fr;}
    .pitch-heatmap-reset{grid-column:1/-1;}
    .pitch-heatmap-layout{grid-template-columns:1fr;}
    .pitch-heatmap-grid{max-width:340px;margin:0 auto;}
    .inning-split-controls{grid-template-columns:1fr 1fr;}
    .inning-date-range{grid-column:1/-1;}
    .inning-split-chart{grid-template-columns:repeat(2,minmax(0,1fr));}
    .pg-svg .area{display:none;}
    .pg-svg .series{filter:none;animation-duration:.62s;}
    .pg-svg .latest-halo{animation-iteration-count:1;}
    .pg-chart-stage::before{display:none;}
  }
  @media(max-width:900px){
    .social-controls{grid-template-columns:repeat(2,minmax(0,1fr));}
    .social-controls .btn{grid-column:1/-1;width:100%;}
    .inning-split-controls{grid-template-columns:1fr 1fr;}
    .inning-date-range{grid-column:1/-1;}
  }
  @media(max-width:440px){
    .inning-split-controls{grid-template-columns:1fr;padding:10px;}
    .inning-date-range{grid-column:auto;}
    .inning-date-inputs{grid-template-columns:1fr;}
    .inning-date-inputs i{display:none;}
    .inning-split-chart{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
    .inning-chart-card{min-height:96px;padding:9px;}
    .inning-chart-value{font-size:21px;}
  }

  /* ---- 規定到達マーク ---- */
  .qmark{display:inline-block;margin-left:5px;font-size:9.5px;font-weight:700;
    line-height:1;padding:2px 4px;border-radius:3px;vertical-align:middle;
    background:var(--accent);color:#fff;}

  /* ---- ダッシュボードのリーグ別グループ ---- */
  .lgroup{margin-bottom:14px;}
  .lgroup-h{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;
    border-left:4px solid var(--accent);padding-left:8px;margin-bottom:7px;}
  .lgroup-h .sub2{font-weight:400;}

  /* ---- ダッシュボードのレイアウト ---- */
  .dashgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start;}
  .dash-main,.dash-side{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .dash-main>.dash-sec,.dash-side>.dash-sec{margin-top:0;}
  @media(min-width:1100px){
    .dashgrid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);}
  }

  /* ---- マイNPB ---- */
  .mynpb{position:relative;overflow:hidden;margin-top:16px;background:var(--panel);
    border:2px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
  .mynpb::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;
    background:var(--my-team-color,var(--accent));}
  .mynpb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    margin-bottom:12px;padding-left:3px;}
  .mynpb-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;}
  .mynpb-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;
    background:var(--my-team-color,var(--accent));color:var(--my-team-text,#fff);font-size:15px;}
  .mynpb-sub{font-size:11px;color:var(--muted);margin-top:3px;}
  .mynpb-empty{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;
    border-radius:12px;padding:18px;background:linear-gradient(135deg,var(--panel2),var(--zone));}
  .mynpb-empty strong{display:block;font-size:15px;margin-bottom:4px;}
  .mynpb-empty span{font-size:12px;color:var(--muted);line-height:1.7;}
  .mynpb-grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.6fr);gap:12px;}
  .mynpb-team-card,.mynpb-player{border:1px solid var(--line);border-radius:12px;background:var(--panel2);}
  .mynpb-team-card{padding:14px;position:relative;overflow:hidden;}
  .mynpb-team-card::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;
    right:-45px;top:-55px;background:var(--my-team-color,var(--accent));opacity:.13;}
  .mynpb-team-name{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin-bottom:9px;}
  .mynpb-game-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
  .mynpb-game-score{font-family:'Roboto Mono',monospace;font-size:19px;font-weight:800;}
  .mynpb-game-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6;}
  .mynpb-players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .mynpb-player{padding:11px 12px;cursor:pointer;transition:transform .15s,border-color .15s;min-width:0;}
  .mynpb-player:hover{transform:translateY(-1px);border-color:var(--accent);}
  .mynpb-player-head{display:flex;align-items:center;gap:6px;min-width:0;margin-bottom:8px;}
  .mynpb-player-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mynpb-reg{margin-left:auto;flex-shrink:0;border-radius:20px;padding:2px 6px;font-size:9px;font-weight:800;}
  .mynpb-reg.on{background:rgba(0,158,82,.13);color:#007a40;}
  .mynpb-reg.off{background:rgba(224,49,49,.12);color:#c92a2a;}
  [data-theme="dark"] .mynpb-reg.on{color:#69db9d;} [data-theme="dark"] .mynpb-reg.off{color:#ff8787;}
  .mynpb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .mynpb-stat{text-align:center;min-width:0;}
  .mynpb-stat b{display:block;font-family:'Roboto Mono',monospace;color:var(--accent);font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mynpb-stat span{display:block;color:var(--muted);font-size:8.5px;margin-top:2px;}
  .mynpb-editor{border-top:1px dashed var(--line);padding-top:13px;margin-top:12px;}
  .mynpb-editor-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:8px;align-items:end;}
  .mynpb-field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;}
  .mynpb-field select{width:100%;font-family:inherit;font-size:13px;padding:8px 9px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);}
  .mynpb-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;min-height:25px;}
  .mynpb-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
    padding:4px 5px 4px 9px;background:var(--panel2);font-size:11px;font-weight:700;}
  .mynpb-chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 4px;font-size:14px;}
  .mynpb-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;}
  @media(max-width:820px){
    .mynpb-grid{grid-template-columns:1fr;}.mynpb-players{grid-template-columns:repeat(2,minmax(0,1fr));}
    .mynpb-editor-grid{grid-template-columns:1fr 1fr;}.mynpb-editor-grid .mynpb-field:nth-child(3){grid-column:1/-1;}
  }
  @media(max-width:560px){
    .mynpb{padding:13px 12px 13px 16px}.mynpb-head{align-items:center}.mynpb-sub{display:none;}
    .mynpb-empty{grid-template-columns:1fr;padding:14px}.mynpb-empty .btn{width:100%;}
    .mynpb-players{grid-template-columns:1fr}.mynpb-editor-grid{grid-template-columns:1fr;}
    .mynpb-editor-grid .mynpb-field:nth-child(3){grid-column:auto}.mynpb-actions .btn{flex:1;}
  }

  /* 概況タイル */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:12px 10px;text-align:center;}
  .tile .tv{font-family:'Roboto Mono',monospace;font-size:24px;font-weight:700;
    color:var(--accent);line-height:1.1;}
  .tile .tl{font-size:11px;color:var(--muted);margin-top:3px;}

  /* ---- データカレンダー ---- */
  .calnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
  .callabel{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;
    min-width:110px;text-align:center;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cdow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);
    padding:4px 0;}
  .cdow.sun{color:#E03131;} .cdow.sat{color:#1C7ED6;}
  .cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);position:relative;}
  .cday.empty{border:none;background:none;}
  .cday .cnum{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;}
  .cday.none .cnum{color:var(--muted);opacity:.55;}
  .cday.has{background:var(--accent);border-color:var(--accent);cursor:pointer;}
  .cday.has .cnum{color:#fff;}
  .cday.has .ccnt{font-size:9.5px;color:#fff;opacity:.9;line-height:1;margin-top:1px;}
  .cday.has:hover{filter:brightness(1.12);}
  .cday.today{outline:2px solid var(--accent2);outline-offset:1px;}
  .callegend{display:flex;align-items:center;gap:6px;margin-top:10px;
    font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .cbox{width:12px;height:12px;border-radius:3px;display:inline-block;
    border:1px solid var(--line);}
  .cbox.has{background:var(--accent);border-color:var(--accent);}
  .cbox.none{background:var(--panel2);margin-left:8px;}
  .cday.nogame{background:var(--panel2);border-style:dashed;border-color:var(--line2);}
  .cday.nogame .cnum{color:var(--muted);}
  .cday.nogame .ccnt{font-size:10px;color:var(--muted);line-height:1;}
  .cbox.nogame{background:var(--panel2);border-style:dashed;border-color:var(--line2);
    margin-left:8px;}
  .cday.excl{background:var(--accent2);}
  .cday.excl .ccnt{font-size:8.5px;}
  .cbox.excl{background:var(--accent2);border-color:var(--accent2);margin-left:8px;}

  /* ---- 順位表 ---- */
  .stabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .stab{font-family:inherit;font-size:13px;font-weight:700;padding:7px 16px;
    border-radius:20px;cursor:pointer;background:var(--panel2);
    color:var(--muted);border:2px solid var(--line);}
  .stab:hover{color:var(--sc);border-color:var(--sc);}
  .stab.on{background:var(--sc);color:#fff;border-color:var(--sc);}
  table.standtbl{min-width:620px;}
  table.standtbl td.rank{font-weight:700;font-size:14px;}
  table.standtbl td.plus{color:var(--accent);font-weight:700;}
  table.standtbl td.minus{color:var(--out);}
  table.standtbl tbody tr:first-child td.rank{color:var(--accent);}

  /* ---- チーム略称バッジ・リーグ表示 ---- */
  .tmini{display:inline-block;font-family:'Roboto Mono',monospace;font-size:10.5px;
    font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;
    vertical-align:middle;letter-spacing:0;min-width:14px;text-align:center;
    border:1px solid rgba(0,0,0,.18);}
  .lgbadge{display:inline-block;color:#fff;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:20px;vertical-align:middle;}
  h3.thead{border-left:5px solid var(--accent);padding-left:9px;
    display:flex;align-items:center;gap:6px;}

  /* ---- ビュー切替 ---- */
  .viewswitch{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
    gap:8px;margin-top:16px;position:relative;z-index:20;}
  .vbtn{width:100%;height:100%;font-family:inherit;font-size:14.5px;font-weight:700;
    padding:12px;border-radius:12px;cursor:pointer;
    background:var(--panel);color:var(--muted);
    border:2px solid var(--line);box-shadow:var(--shadow);}
  .vbtn:hover{color:var(--accent);border-color:var(--accent);}
  .vbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .navgroup.open>.vbtn{color:var(--accent);border-color:var(--accent);}
  .navgroup.open>.vbtn.on{color:#fff;}
  .navgroup{position:relative;min-width:0;}
  .navcaret{display:inline-block;margin-left:5px;font-size:11px;
    transition:transform .15s;}
  .navgroup.open .navcaret{transform:rotate(180deg);}
  .navmenu{display:none;position:absolute;z-index:50;top:calc(100% + 6px);
    left:0;right:0;min-width:180px;padding:6px;background:var(--panel);
    border:2px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(45,25,10,.18);}
  .navgroup.open .navmenu{display:grid;gap:4px;}
  .navitem{width:100%;font-family:inherit;font-size:13px;font-weight:700;
    text-align:left;padding:10px 11px;border:0;border-radius:8px;cursor:pointer;
    background:transparent;color:var(--ink2);}
  .navitem:hover,.navitem.on{background:var(--zone);color:var(--accent);}
  @media(max-width:900px){
    .viewswitch{grid-template-columns:repeat(4,minmax(0,1fr));}
  }
  @media(max-width:560px){
    .viewswitch{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
    .vbtn{font-size:13.5px;padding:10px 7px;}
    .navmenu{min-width:100%;}
    .viewswitch>:last-child{grid-column:1/-1;}
  }

  .lnk{cursor:pointer;}
  .stbl tr[onclick]{cursor:pointer;}
  .stbl td.lnk{color:var(--accent);}
  .pcard{border-color:var(--accent);}

  /* ---- 配球分析 ---- */
  .bar-row{display:grid;grid-template-columns:80px 1fr auto;gap:10px;
    align-items:center;padding:5px 0;font-size:13px;}
  .bar-lb{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{background:var(--panel2);border-radius:20px;height:16px;overflow:hidden;
    border:1px solid var(--line);}
  .bar-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));
    height:100%;border-radius:20px;min-width:2px;}
  .bar-val{font-family:'Roboto Mono',monospace;font-size:12.5px;
    white-space:nowrap;color:var(--accent);font-weight:700;}
  .sub2{color:var(--muted);font-weight:400;font-size:11px;}

  .statrow{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1 1 80px;text-align:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 6px;}
  .stat .sv{font-family:'Roboto Mono',monospace;font-size:22px;
    font-weight:700;color:var(--accent);}
  .stat .sl{font-size:11px;color:var(--muted);margin-top:2px;}

  .heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
    max-width:280px;margin:0 auto;}
  .hcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;
    border:1px solid var(--line);border-radius:4px;color:var(--ink);}
  .hcell.zone{border-color:var(--accent);border-width:2px;}
  .heat-lg{display:flex;align-items:center;gap:6px;margin-top:10px;
    font-size:11px;color:var(--muted);}
  .hgrad{width:60px;height:10px;border-radius:5px;
    background:linear-gradient(90deg,rgba(232,89,12,.1),rgba(232,89,12,.85));}

  /* ---- 配球チャート（打席単位） ---- */
  .chartbox{margin:4px 14px 10px;padding:8px;background:var(--panel2);
    border:2px solid var(--line);border-radius:10px;
    display:flex;gap:12px;align-items:center;}
  .chartsvg{width:120px;height:120px;flex-shrink:0;}
  .charttxt{font-size:12px;color:var(--ink2);line-height:1.6;}
  .charttitle{font-weight:700;color:var(--accent);margin-bottom:4px;}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;}
  .lgd{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .msg{margin-top:16px;padding:30px 14px;text-align:center;
